<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Axyom AI — Quality Lab</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel2:#171b24; --line:#232936;
    --text:#e8ecf3; --muted:#8b95a7; --accent:#00B2A0; --accent-dim:#0a7a6f;
    --warn:#f5a623; --bad:#e35d5d; --good:#4bbf73;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#2a1f0a;
       color:var(--warn);border:1px solid #4a3a12}
  .wrap{display:grid;grid-template-columns:290px 1fr;gap:0;min-height:calc(100vh - 62px)}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
  aside{border-right:1px solid var(--line);padding:20px;background:var(--panel)}
  @media(max-width:880px){aside{border-right:0;border-bottom:1px solid var(--line)}}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
       color:var(--muted);margin:0 0 8px}
  .bot{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:8px;
       background:var(--panel2);border:1px solid var(--line);border-radius:10px;
       color:var(--text);cursor:pointer;font:inherit;transition:.12s}
  .bot:hover{border-color:#38414f}
  .bot.on{border-color:var(--accent);background:#0d1f1d}
  .bot b{display:block;font-size:14px;font-weight:600}
  .bot small{color:var(--muted);font-size:12px}
  .probes{margin-top:22px}
  .probe{display:block;width:100%;text-align:left;padding:8px 11px;margin-bottom:6px;
         background:transparent;border:1px solid var(--line);border-radius:8px;
         color:var(--muted);cursor:pointer;font:13px/1.35 inherit;transition:.12s}
  .probe:hover{color:var(--text);border-color:var(--accent-dim)}
  .probe em{color:var(--accent);font-style:normal;font-size:11px;display:block;margin-top:2px}
  main{display:flex;flex-direction:column;height:calc(100vh - 62px)}
  @media(max-width:880px){main{height:70vh}}
  #log{flex:1;overflow-y:auto;padding:24px}
  .msg{max-width:760px;margin:0 auto 18px;display:flex;gap:12px}
  .who{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:grid;
       place-items:center;font-size:12px;font-weight:700}
  .u .who{background:#232936;color:var(--muted)}
  .a .who{background:var(--accent);color:#04120f}
  .body{flex:1;min-width:0}
  .body p{margin:0 0 8px;white-space:pre-wrap}
  .body strong{color:#fff}
  .meta{font-size:11px;color:var(--muted);margin-top:6px}
  .meta b{color:var(--good);font-weight:600}
  .meta .slow{color:var(--warn)}
  .src{font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all}
  .empty{max-width:760px;margin:40px auto;color:var(--muted);text-align:center}
  form{border-top:1px solid var(--line);padding:16px 24px;display:flex;gap:10px;
       max-width:808px;margin:0 auto;width:100%}
  input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
        background:var(--panel2);color:var(--text);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button.send{padding:12px 20px;border-radius:10px;border:0;background:var(--accent);
              color:#04120f;font-weight:600;cursor:pointer;font:inherit}
  button.send:disabled{opacity:.5;cursor:default}
  .note{font-size:12px;color:var(--muted);margin-top:16px;padding-top:14px;
        border-top:1px solid var(--line);line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Axyom <span>AI</span> — Quality Lab</h1>
  <span class="tag">internal · not indexed</span>
</header>

<div class="wrap">
<aside>
  <p class="lbl">Test bot</p>
  <div id="bots"></div>

  <div class="probes">
    <p class="lbl">Probe questions</p>
    <div id="probes"></div>
  </div>

  <p class="note" id="note"></p>
</aside>

<main>
  <div id="log"><div class="empty">Pick a probe question, or ask your own.</div></div>
  <form id="f">
    <input id="q" placeholder="Ask the bot something…" autocomplete="off">
    <button class="send" id="send">Send</button>
  </form>
</main>
</div>

<script>
const API = "https://api.axyom.ch";

// Each bot is a trained site plus the probes that stress it. The probes are not
// decoration: each one targets a specific failure this stack has actually had,
// so a regression shows up as a wrong answer to a named question.
const BOTS = {
  shopify: {
    label: "Alpine Board Co",
    sub: "Synthetic Shopify shop — tests the Shopify ingest",
    key: "axyom_live_o2aUlGa5Zg0PXYkt18GaQReisggMSYTg",
    note: "Synthetic data on purpose. Pointing this page at a real customer's bot " +
          "would spend their paid conversation quota on our testing and let anyone " +
          "chat with their assistant.",
    probes: [
      ["What sizes does the Alpine Ridge T-Shirt come in and which are in stock?",
       "variants + per-variant stock"],
      ["How much is the Alpine Ridge tee?", "currency — must say CHF, never $ or €"],
      ["Was kostet das Glacier Snowboard und ist es verfügbar?",
       "German must still quote CHF, not €"],
      ["Is the 155cm Glacier available?", "backorder ≠ out of stock"],
      ["Which snowboard do you recommend for a beginner?", "reasoning over specs"],
      ["Anything on sale right now?", "compare-at pricing"],
      ["What's your return policy for a snowboard I've ridden?",
       "policy detail + Liquid must be resolved"],
      ["How much is shipping to Germany?", "policy retrieval"],
      ["How do I contact you?", "shop contact details"],
      ["Do you sell ski boots?", "must refuse, not invent"]
    ]
  },
  axyom: {
    label: "axyom.ch",
    sub: "Our own site — the live production bot",
    key: "axyom_live_RZFzo6L5Ke9jX2R_sYlC68KLpl5YmU53",
    note: "This is the same bot running on the public axyom.ch homepage.",
    probes: [
      ["What does Axyom AI do?", "core positioning"],
      ["How much does it cost?", "pricing — check it doesn't invent numbers"],
      ["Wie funktioniert das Training?", "German fluency"],
      ["Can it work on a Shopify store?", "capability claim accuracy"],
      ["Who runs this company?", "should decline if not on the site"]
    ]
  }
};

let current = "shopify";
let session = "lab-" + Math.random().toString(36).slice(2);
const log = document.getElementById("log");

function renderBots(){
  document.getElementById("bots").innerHTML = Object.entries(BOTS).map(([id,b]) =>
    `<button class="bot ${id===current?'on':''}" data-bot="${id}">
       <b>${b.label}</b><small>${b.sub}</small></button>`).join("");
  document.querySelectorAll("[data-bot]").forEach(el =>
    el.onclick = () => { current = el.dataset.bot;
      session = "lab-" + Math.random().toString(36).slice(2);
      log.innerHTML = '<div class="empty">Switched to <b>'+BOTS[current].label+
        '</b>. Fresh conversation.</div>';
      renderBots(); renderProbes(); });
}

function renderProbes(){
  document.getElementById("probes").innerHTML = BOTS[current].probes.map(([q,why]) =>
    `<button class="probe" data-q="${q.replace(/"/g,'&quot;')}">${q}<em>${why}</em></button>`
  ).join("");
  document.querySelectorAll("[data-q]").forEach(el =>
    el.onclick = () => { document.getElementById("q").value = el.dataset.q; ask(); });
  document.getElementById("note").textContent = BOTS[current].note;
}

function bubble(role, html, meta){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "u" : "a");
  d.innerHTML = `<div class="who">${role === "user" ? "You" : "AI"}</div>
                 <div class="body">${html}${meta || ""}</div>`;
  if (log.querySelector(".empty")) log.innerHTML = "";
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function fmt(t){
  return (t || "").split(/\n{2,}/).map(p =>
    "<p>" + p.replace(/&/g,"&amp;").replace(/</g,"&lt;")
             .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>") + "</p>").join("");
}

async function ask(){
  const input = document.getElementById("q");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.getElementById("send").disabled = true;

  bubble("user", fmt(text));
  const pending = bubble("ai", "<p style='color:#8b95a7'>thinking…</p>");
  const t0 = performance.now();

  try {
    const r = await fetch(API + "/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json", "x-api-key": BOTS[current].key},
      body: JSON.stringify({message: text, session_id: session})
    });
    const ms = Math.round(performance.now() - t0);
    const d = await r.json().catch(() => ({}));

    if (!r.ok) {
      pending.querySelector(".body").innerHTML =
        `<p style="color:var(--bad)">HTTP ${r.status} — ${d.detail || "request failed"}</p>`;
    } else {
      const srcs = (d.sources || []).length
        ? `<div class="src">sources: ${d.sources.slice(0,3).join(" · ")}</div>` : "";
      pending.querySelector(".body").innerHTML = fmt(d.reply || "(empty reply)") +
        `<div class="meta"><b>${(ms/1000).toFixed(1)}s</b>${ms>8000?' <span class="slow">— slow</span>':''}</div>` + srcs;
    }
  } catch (e) {
    pending.querySelector(".body").innerHTML =
      `<p style="color:var(--bad)">Network error: ${e.message}</p>`;
  } finally {
    document.getElementById("send").disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }
}

document.getElementById("f").onsubmit = e => { e.preventDefault(); ask(); };
renderBots(); renderProbes();
</script>
</body>
</html>
