    neu(); toast(x.stufe === 'bezahlt' ? 'Bezahlt. ✓' : 'Teilzahlung erfasst — Rest ' + chf(debSummen(x).offen) + '.', 1); return;
  }
  if (d.mahnen) {
    const x = D_(d.mahnen), k = kunde(x.kunde), stufe = (x.mahnstufe || 0) + 1;
    const text = DB.texte[(stufe === 1 ? 'erinnerung_' : 'mahnung_') + (k.anrede || 'sie')];
    modal(`<h3>${stufe === 1 ? 'Zahlungserinnerung' : stufe + '. Mahnung'} an ${esc(k.name)}</h3><p class="dim" style="font-size:12.5px">${esc(k.mail)}</p><label class="fld" style="margin-top:10px"><span>Text</span><textarea id="m-text" style="min-height:110px">${esc(text)}</textarea></label><p class="dim" style="font-size:12px;margin-top:6px">Die Rechnung mit QR-Zahlteil über den offenen Betrag ${chf(debSummen(x).offen)} wird angehängt.</p><div class="acts"><button class="btn" data-zu>Abbrechen</button><button class="btn dark" data-ok>Senden</button></div>`,
      () => { x.mahnstufe = stufe; prot(x, (stufe === 1 ? 'Zahlungserinnerung' : stufe + '. Mahnung') + ' versendet'); modalZu(); neu(); toast('Versendet. <span style="opacity:.7">(Demo: keine echte Mail.)</span>', 1); });
    return;
  }
  if (d.korrigieren) {
    const x = D_(d.korrigieren);
    modal(`<h3>Rechnung ${esc(x.id.slice(1))} korrigieren</h3><p class="dim" style="font-size:13px">Die Nummer bleibt. Die bisherige Fassung bleibt im Protokoll nachvollziehbar.</p>
      <div style="margin-top:10px">${x.pos.map((p, i) => `<div class="grid" style="grid-template-columns:1fr 70px 90px;gap:6px;margin-bottom:6px"><input class="in" value="${esc(p[0])}" data-ki="${i}" data-kf="0"><input class="in num" value="${p[1]}" data-ki="${i}" data-kf="1" inputmode="decimal"><input class="in num" value="${p[2].toFixed(2)}" data-ki="${i}" data-kf="2" inputmode="decimal"></div>`).join('')}</div>
      <label class="fld" style="margin-top:8px"><span>Was war falsch? (Pflicht)</span><input id="m-grund"></label>
      <div class="acts"><button class="btn" data-zu>Abbrechen</button><button class="btn dark" data-ok>Korrigieren & neu senden</button></div>`,
      () => { const g = $('#m-grund').value.trim(); if (!g) { $('#m-grund').closest('.fld').classList.add('err'); return; }
        const alt = debSummen(x).brutto;
        document.querySelectorAll('[data-ki]').forEach(inp => { const p = x.pos[+inp.dataset.ki], f = +inp.dataset.kf; p[f] = f ? zahl(inp.value, p[f]) : inp.value; });
        prot(x, `Korrigiert (${g}): ${chf(alt)} → ${chf(debSummen(x).brutto)}, neu versendet`); modalZu(); neu(); toast('Korrigiert und neu versendet.', 1); });
    return;
  }
  if (d.storno) {
    const x = D_(d.storno);
    modal(`<h3>Rechnung ${esc(x.id.slice(1))} stornieren?</h3><p class="dim" style="font-size:13px">Die Rechnung bleibt mit Stempel «storniert» erhalten, die Buchung wird zurückgenommen.</p><label class="fld" style="margin-top:10px"><span>Grund (Pflicht)</span><input id="m-grund"></label><div class="acts"><button class="btn" data-zu>Abbrechen</button><button class="btn bad" data-ok>Stornieren</button></div>`,
      () => { const g = $('#m-grund').value.trim(); if (!g) { $('#m-grund').closest('.fld').classList.add('err'); return; } x.storniert = g; x.stufe = 'bezahlt'; prot(x, 'Storniert: ' + g); modalZu(); neu(); toast('Storniert.', 1); });
    return;
  }
  if ('kundeneu' in d) { kundeNeu(() => neu()); return; }

  // ── Auswertung & Daten ──
  if (d.kmonat) { KMONAT = d.kmonat; render(); return; }
  if (d.kgruppe) { KOFFEN = KOFFEN === d.kgruppe ? '' : d.kgruppe; neu(); return; }
  if (d.mq) { MQ = +d.mq; render(); return; }
  if (d.eingereicht) { DB.abgerechnet.push(d.eingereicht); logge('MWST ' + d.eingereicht + ' als eingereicht markiert'); neu(); toast('Als eingereicht markiert.', 1); return; }
  if (d.exq) { EXPORT_Q = d.exq; render(); return; }
  if (d.export) { exportieren(d.export); return; }
  if ('beispielcamt' in d) { const r = camtLesen(BEISPIEL_CAMT); neu(); toast(r.neu ? `${r.neu} Buchungen eingelesen${r.doppelt ? ', ' + r.doppelt + ' doppelte übersprungen' : ''} — jetzt im Bankabgleich.` : 'Schon eingelesen — nichts Neues.', r.neu ? 1 : 2); return; }
  if ('firmaspeichern' in d) { document.querySelectorAll('[data-firma]').forEach(i => DB.firma[i.dataset.firma] = i.value.trim()); logge('Firmendaten geändert'); neu(); toast('Gespeichert.', 1); return; }
  if ('textespeichern' in d) { document.querySelectorAll('[data-text]').forEach(i => DB.texte[i.dataset.text] = i.value.trim()); logge('Textvorlagen geändert'); neu(); toast('Gespeichert.', 1); return; }
});

function kundeNeu(fertig) {
  modal(`<h3>Neuer Kunde</h3><div class="grid g2" style="gap:10px;margin-top:10px">
    <label class="fld" style="grid-column:1/-1"><span>Name / Firma</span><input id="n-name"></label>
    <label class="fld"><span>Kontakt</span><input id="n-kontakt"></label><label class="fld"><span>E-Mail</span><input id="n-mail" type="email"></label>
    <label class="fld"><span>Strasse</span><input id="n-strasse"></label><label class="fld"><span>PLZ Ort</span><input id="n-ort"></label>
    <label class="fld"><span>Anrede</span><select id="n-anrede"><option value="sie">Sie</option><option value="du">Du</option></select></label><label class="fld"><span>Zahlungsziel (Tage)</span><input id="n-ziel" value="30" inputmode="numeric"></label></div>
    <div class="acts"><button class="btn" data-zu>Abbrechen</button><button class="btn dark" data-ok>Anlegen</button></div>`,
    () => { const name = $('#n-name').value.trim(); if (!name) { $('#n-name').closest('.fld').classList.add('err'); return; }
      const id = 'C' + (Math.max(...DB.kunden.map(k => +k.id.slice(1))) + 1);
      DB.kunden.push({ id, name, kontakt: $('#n-kontakt').value.trim(), strasse: $('#n-strasse').value.trim(), ort: $('#n-ort').value.trim(), anrede: $('#n-anrede').value, mail: $('#n-mail').value.trim(), ziel: zahl($('#n-ziel').value, 30) });
      logge('Kunde angelegt: ' + name); modalZu(); fertig(id); toast('Kunde angelegt.', 1); });
}

// typing in the VAT lines recomputes them live
document.addEventListener('input', e => {
  if (e.target.matches('.kt-netto')) vatLive();
  if (e.target.id === 'suche') sucheZeigen();
  const f = e.target.closest('.fld.err'); if (f) f.classList.remove('err');
});
document.addEventListener('change', e => {
  if (e.target.matches('.kt-satz')) vatLive();
  if (e.target.id === 'kt-jepos') $('#kt-posk').classList.toggle('on', e.target.checked);
  // a new main account carries along every position that still had the old one
  if (e.target.id === 'kt-konto') {
    const alt = e.target.dataset.alt || e.target.defaultValue || [...e.target.options].find(o => o.defaultSelected)?.value;
    document.querySelectorAll('.kt-pk').forEach(x => { if (x.value === alt) x.value = e.target.value; });
    e.target.dataset.alt = e.target.value;
  }
  if (e.target.id === 'belegdatei' && e.target.files[0]) {
    const file = e.target.files[0], b = DB.bank.find(x => x.id === e.target.dataset.bank), h = BANK_HINWEIS[b.id] || {};
    const url = URL.createObjectURL(file);
    modal(`<h3>Beleg zuordnen</h3><p class="dim" style="font-size:13px">${esc(b.text)} · ${chf(b.betrag)}</p>
      <div class="box s1" style="margin-top:10px">📄 <a href="${url}" target="_blank" rel="noopener">${esc(file.name)}</a> — bleibt in diesem Browser.</div>
      <div class="grid g2" style="gap:10px;margin-top:12px"><label class="fld"><span>Konto</span><select id="m-konto">${KONTEN.filter(k => k.typ === 'K').map(k => `<option value="${k.nr}"${k.nr === h.konto ? ' selected' : ''}>${k.nr} ${esc(k.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>MWST laut Beleg</span><select id="m-satz">${SAETZE.map(s => `<option value="${s.satz}"${s.satz === 8.1 ? ' selected' : ''}>${s.name}</option>`).join('')}</select></label></div>
      <div class="acts"><button class="btn" data-zu>Abbrechen</button><button class="btn dark" data-ok>Zuordnen</button></div>`,
      () => { b.zu = { typ: 'beleg', konto: $('#m-konto').value, satz: zahl($('#m-satz').value), datei: file.name }; UPLOADS.push({ name: file.name, size: file.size, url }); logge('Beleg ' + file.name + ' zu ' + b.id); modalZu(); neu(); toast('Beleg zugeordnet — Vorsteuer wird abgezogen. ✓', 1); });
  }
  if (e.target.id === 'up-belege') belegeHoch(e.target.files);
  if (e.target.id === 'up-camt' && e.target.files[0]) camtHoch(e.target.files[0]);
});
function belegeHoch(files) {
  [...files].forEach(f => UPLOADS.push({ name: f.name, size: f.size, url: URL.createObjectURL(f) }));
  render(); toast(files.length + ' Datei' + (files.length > 1 ? 'en' : '') + ' hochgeladen.', 1);
}
function camtHoch(file) {
  file.text().then(t => { try { const r = camtLesen(t); neu(); toast(`${r.neu} Buchungen eingelesen${r.doppelt ? ', ' + r.doppelt + ' doppelte übersprungen' : ''}.`, r.neu ? 1 : 2); } catch (err) { toast(esc(err.message), 3); } });
}
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('.drop'); if (!z) return;
  e.preventDefault();
  z.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files.length) { if (z.id === 'drop-camt') camtHoch(e.dataTransfer.files[0]); else belegeHoch(e.dataTransfer.files); }
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.documentElement.classList.contains('nav-offen')) { menu(false); $('#rail .menu').focus(); } if ($('#modal').classList.contains('on')) modalZu(); const b = $('#treffer'); if (b) b.remove(); }
  if (e.key === 'Enter' && e.target.matches('[role="button"][data-go],[role="button"][data-kgruppe],[role="button"][data-export]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.closest('#modal') && e.target.tagName === 'INPUT' && MODAL_OK) { e.preventDefault(); MODAL_OK(); }
  // ← → leaf through invoices while reviewing, unless typing
  if (AKTIV === 'rechnungen' && !e.target.closest('input,select,textarea') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !$('#modal').classList.contains('on')) {
    const b = document.querySelector(`.panel [aria-label="${e.key === 'ArrowLeft' ? 'Vorherige' : 'Nächste'}"]`); if (b && !b.disabled) b.click();
  }
});
/* A bank line for a supplier invoice. Same amount → matched at once. Any
   other amount needs a reason, and the reason decides the booking. */
let RATEN_WEG = null;
function ratenLesen() {
  const D = [...document.querySelectorAll('#m-plan [data-ratefeld="d"]')], B = [...document.querySelectorAll('#m-plan [data-ratefeld="b"]')];
  return D.map((x, i) => ({ faellig: x.value, betrag: r2(zahl(B[i].value)) }));
}
function ratenCheck(total) {
  const sum = r2(ratenLesen().reduce((s, x) => s + x.betrag, 0)), diff = r2(sum - total);
  $('#m-plancheck').innerHTML = Math.abs(diff) < 0.01 ? `<div class="box s1">✓ Zusammen ${chf(total)}</div>` : `<div class="box s3">Zusammen ${chf(sum)} — ${diff > 0 ? fmt(diff) + ' zu viel' : fmt(-diff) + ' zu wenig'}</div>`;
}
function kreditorZuordnen(b, r) {
  const soll = unterwegs(r) || restOffen(r), ist = -b.betrag, diff = r2(soll - ist);
  const fertig = abw => {
    b.zu = { typ: 'kreditor', ref: r.id }; if (abw) b.zu.abw = abw;
    if (!r.bezahltAm) r.bezahltAm = b.datum;
    // an instalment paid straight from the bank counts as paid
    if (r.raten) { let rest = ist; r.raten.forEach(x => { if (rest > 0.004 && !x.bank) { if (!x.bezahltAm) x.bezahltAm = b.datum; x.bank = b.id; rest = r2(rest - x.betrag); } }); }
    zahlstandPruefen(r);
    prot(r, `Bankbuchung ${b.id} vom ${dt(b.datum)} zugeordnet (${chf(ist)})${abw ? ' — ' + ABWEICHUNG[abw.grund] + (abw.betrag ? ' ' + chf(Math.abs(abw.betrag)) : '') + ': ' + abw.notiz : ''}`);
    logge('Bankbuchung ' + b.id + ' zu ' + r.id); modalZu(); neu();
    toast(r.stufe === 'abgeglichen' ? 'Zugeordnet — Rechnung erledigt. ✓' : `Zugeordnet. Noch offen: ${chf(restOffen(r))}.`, 1);
  };
  if (Math.abs(diff) < 0.01) return fertig(null);
  const fremd = r.waehrung && r.waehrung !== 'CHF';
  const gruende = diff > 0 ? ['skonto', 'teil', ...(fremd ? ['kurs'] : [])] : ['gebuehr', ...(fremd ? ['kurs'] : [])];
  const l = lief(r.lief), sk = l.skonto && Math.abs(diff - r2(summen(r).chf * l.skonto[0] / 100)) < 0.06;
  const erkl = { skonto: 'Die Differenz mindert Aufwand und Vorsteuer.', teil: 'Die Rechnung bleibt mit dem Rest offen.', gebuehr: 'Die Differenz geht auf 6800 Bankspesen.', kurs: 'Die Differenz geht auf 6950 Kursdifferenzen.' };
  const vor = sk ? 'skonto' : gruende[0];
  modal(`<h3>Betrag weicht ab</h3>
    <div class="sum" style="margin-top:10px"><span>${unterwegs(r) ? 'Bezahlt laut Rechnung' : 'Offen laut Rechnung'}</span><span class="num">${chf(soll)}</span></div>
    <div class="sum"><span>Bankbuchung ${dt(b.datum)}</span><span class="num">${chf(ist)}</span></div>
    <div class="sum"><span><b>Differenz</b></span><span class="num"><b>${diff > 0 ? fmt(diff) + ' weniger' : fmt(-diff) + ' mehr'}</b></span></div>
    ${sk ? `<div class="box s1" style="margin-top:8px">Entspricht genau ${l.skonto[0]} % Skonto — laut Konditionen von ${esc(l.name)}.</div>` : ''}
    <div class="abw" role="radiogroup" aria-label="Grund">${gruende.map(g => `<label><input type="radio" name="m-abw" value="${g}"${g === vor ? ' checked' : ''}><span>${ABWEICHUNG[g]}<small>${erkl[g]}</small></span></label>`).join('')}</div>
    <label class="fld" style="margin-top:10px"><span>Begründung (Pflicht)</span><input id="m-abwnotiz" value="${sk ? esc(l.skonto[0] + ' % Skonto innert ' + l.skonto[1] + ' Tagen') : ''}" placeholder="z.B. telefonisch vereinbart mit …"></label>
    <div class="acts"><button class="btn" data-zu>Abbrechen</button><button class="btn dark" data-ok>Zuordnen</button></div>`,
    () => {
      const g = (document.querySelector('input[name="m-abw"]:checked') || {}).value, notiz = $('#m-abwnotiz').value.trim();
      if (!notiz) { $('#m-abwnotiz').closest('.fld').classList.add('err'); return; }
      fertig({ grund: g, notiz, betrag: g === 'teil' ? 0 : diff });
    });
}
window.addEventListener('hashchange', render);
// turning a tablet or resizing a window can cross into another Ansicht
[MQ_HANDY, MQ_TABLET].forEach(q => q.addEventListener('change', render));
laden();
render();
</script>
