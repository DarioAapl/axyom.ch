  const proj = DB.projekte.filter(p => p.kunde === k.id && projektErlaubt(p.id));
  return bau(`${esc(k.name)} · Kunde Nr. ${esc(k.nr)}`, [
    `${k.standorte.length} Standorte, ${k.kontakte.length} Kontakte, Zahlungsziel ` +
      `${k.zahlungsziel} Tage, ${esc(k.uid)}`,
    `Rechnungen gehen an <b>${esc((DB.kunden.find(x => x.id === k.id).standorte
      .find(s => s.adresse === k.rechnungsadresse) || { name:'die Standardadresse' }).name)}</b>, ` +
      `${esc(k.rechnungsmail)}`,
    of && rg ? `Der Adressfall: Offerte ${esc(of.nr)} an ${esc(of.adresseName)}, Rechnung ` +
      `${esc(rg.nr)} an ${esc(rg.adresseName)} — ein Debitor, zwei Adressen, beide als Snapshot.` : '',
    proj.length ? `Projekte: ${proj.map(p => `<b>${esc(p.nr)}</b> ${esc(p.status)}`).join(', ')}` : '',
    offen.length ? `<span class="hl">Offen: ${offen.map(d => `${esc(d.nr)} ${chf(offenBetrag(d))}` +
      (d.status === 'überfällig' ? ' (überfällig)' : '')).join(', ')}</span>`
      : `Nichts offen — ${dok.filter(d => d.typ === 'RG').length} Rechnungen, alle bezahlt.`,
    darf('notizen') ? `Notiz: ${esc(k.notiz)}` : sperre('Die interne Notiz', 'IAM-02'),
    imBlickHinweis(kundeMandanten(k.id)[0]),
  ], [{ t:'Kunden', go:'kunden', ref:k.id },
      proj.length ? { t:proj[0].nr, go:'projekte', ref:proj[0].id } : null,
      offen.length ? { t:'Zahlungen', go:'zahlungen' } : null].filter(Boolean));
}

function aProjekt(p) {
  if (!modulErlaubt('projekte')) return modulSperre('projekte');
  if (!projektErlaubt(p.id)) return bau('Dieses Projekt ist nicht freigegeben',
    [sperre(p.nr, 'PRJ-05, SEA-03'),
     `Freigegeben sind: ${mProjekte().map(x => esc(x.nr)).join(', ') || 'keines'}.`],
    [{ t:'Was darf meine Rolle sehen?' }]);
  const dok = DB.dokumente.filter(d => d.projekt === p.id);
  const z = DB.zeiten.filter(t => t.projekt === p.id);
  const m = marge(p.id);
  const faelle = DB.faelle.filter(f => f.projekt === p.id);
  const akt = DB.aktivitaeten.filter(a => a.projekt === p.id && a.status !== 'erledigt');
  return bau(`${esc(p.nr)} · ${esc(p.name)}`, [
    `${esc(K(p.kunde).name)}, ${esc(standort(p.kunde, p.standort).name)} · ${esc(p.status)} · ` +
      `${esc(p.verantwortlich)} · Termin ${esc(p.termin)}`,
    dok.length ? `Belege: ${dok.map(d => `${esc(d.nr)} (${esc(d.status)})`).join(', ')}` : 'Noch kein Beleg.',
    `Zeiten: ${z.reduce((s, t) => s + t.dauer, 0).toFixed(1)} h erfasst, davon ` +
      `${z.filter(t => t.verrechenbar && !t.dok).reduce((s, t) => s + t.dauer, 0).toFixed(1)} h ` +
      `verrechenbar und noch nicht fakturiert`,
    darf('ek')
      ? `Marge: Materialrohertrag <b>${chf(m.roh)}</b>, Deckungsbeitrag <b>${chf(m.db)}</b> ` +
        `(nach ${chf(m.intern)} internen Zeitkosten)`
      : sperre('Die Marge', 'IAM-02, MAR-04'),
    faelle.length ? `<span class="hl">Servicefall: ${faelle.map(f =>
      `${esc(f.nr)} ${esc(f.status)}, Frist ${esc(f.frist)}`).join(', ')}</span>` : '',
    akt.length ? `Wiedervorlage: ${akt.map(a => `${esc(a.was)} (${esc(a.faellig)})`).join(', ')}` : '',
    imBlickHinweis(p.mandant),
  ], [{ t:'Projekt öffnen', go:'projekte', ref:p.id },
      dok.length ? { t:'Belegkette', go:'verkauf', ref:dok[0].id } : null,
      faelle.length ? { t:'Service', go:'service', ref:faelle[0].id } : null].filter(Boolean));
}

function aBeleg(d) {
  if (!modulErlaubt('verkauf')) return modulSperre('verkauf');
  const nach = DB.dokumente.filter(x => x.vorgaenger === d.id);
  const vers = DB.versand.filter(v => v.dok === d.id && v.status !== 'nicht versendet');
  const zahl = DB.zahlungen.filter(z => z.dok === d.id);
  const snap = d.pos.filter(p => p.art && Math.abs(A(p.art).liste - p.preis) > 0.005);
  return bau(`${esc(TYP[d.typ])} ${esc(d.nr)} · ${esc(d.datum)}`, [
    `${esc(K(d.kunde).name)}, adressiert an <b>${esc(d.adresseName)}</b>` +
      (d.projekt ? ` · Projekt ${esc(P(d.projekt).nr)}` : ''),
    d.ohnePreise ? `${d.pos.length} Positionen, bewusst ohne Preise gedruckt (DOC-03).`
      : `Netto ${chf(netto(d))}, MWST ${chf(mwstAuf(d))}, <b>Total ${chf(brutto(d))}</b>` +
        (d.abzug ? ` — nach Abzug von ${chf(d.abzug.betrag)} (${esc(d.abzug.was)})` : ''),
    d.typ === 'RG' && d.status !== 'storniert'
      ? (offenBetrag(d) > 0.005
          ? `<span class="hl">Offen ${chf(offenBetrag(d))}, fällig ${esc(d.faellig)}` +
            (d.mahnstufe ? `, Mahnstufe ${d.mahnstufe} am ${esc(d.mahnungAm)}` : '') +
            (bezahlt(d) ? `, ${chf(bezahlt(d))} davon bereits bezahlt` : '') + '</span>'
          : `Bezahlt${zahl.length ? ` am ${esc(zahl[zahl.length - 1].datum)}` : ''}.`)
      : '',
    d.final
      ? `Finalisiert am ${esc(d.finalAm)} von ${esc(d.finalVon)}, Nummer aus dem Kreis ${d.typ} ` +
        `von ${esc(M(d.mandant).name)}. Prüfsumme ${esc((d.hash || '').slice(0, 16))}…`
      : 'Noch Entwurf: keine Nummer aus dem Kreis, keine Prüfsumme, kein Versand.',
    d.storniertAm ? `<span class="hl">Storniert am ${esc(d.storniertAm)} über ` +
      `${esc(d.storniertDurch)} — das PDF bleibt unverändert, die Nummer wird nicht ` +
      `wiederverwendet.</span>` : '',
    snap.length ? `${snap.length} Position${snap.length > 1 ? 'en' : ''} ${snap.length > 1 ? 'tragen' : 'trägt'} ` +
      `einen anderen Preis als die heutige Liste: ` +
      snap.map(p => `${esc(p.text.split(',')[0])} ${chf(p.preis)} statt ${chf(A(p.art).liste)}`).join(', ') +
      ` — der Beleg behält seinen Snapshot (IMP-07).` : '',
    nach.length ? `Daraus entstanden: ${nach.map(x => `${esc(x.nr)} (${esc(TYPKURZ[x.typ])})`).join(', ')}` : '',
    vers.length ? `Versendet ${esc(vers[0].datum)} an ${esc(vers[0].an.join(', '))}, ` +
      `${vers.length} Eintrag${vers.length > 1 ? 'e' : ''} in der Historie.` : '',
    imBlickHinweis(d.mandant),
  ], [{ t:'Beleg öffnen', go:'verkauf', ref:d.id },
      d.projekt ? { t:P(d.projekt).nr, go:'projekte', ref:d.projekt } : null,
      d.typ === 'RG' && offenBetrag(d) > 0.005 ? { t:'Zahlungen', go:'zahlungen', ref:d.id } : null,
      d.final && modulErlaubt('archiv') ? { t:'Archiv', go:'archiv' } : null].filter(Boolean));
}

function aArtikel(a) {
  if (!modulErlaubt('produkte')) return modulSperre('produkte');
  const benutzt = [];
  DB.dokumente.forEach(d => d.pos.forEach(p => { if (p.art === a.id) benutzt.push({ d, p }); }));
  const rab = DB.rabatte.find(r => (r.art === 'Hersteller' && r.ziel === a.hersteller)
    || (r.art === 'Lieferant' && r.ziel === a.lieferant));
  const imLager = DB.lager.find(l => cnorm(l.name).includes(cnorm(a.name.split(',')[0])));
  const neuerPreis = DB.importlauf.proben.geaendert.find(r => r.nr === a.nr);
  return bau(`${esc(a.nr)} · ${esc(a.name)}`, [
    `${esc(a.hersteller)}${a.lieferant !== a.hersteller ? `, geliefert von ${esc(a.lieferant)}` : ''} · ` +
      `${esc(a.einheit)} · MWST ${a.mwst} %`,
    darf('ek')
      ? `Liste <b>${chf(a.liste)}</b>, EK ${chf(a.ek)}, VK ${chf(a.vk)}` +
        (rab ? ` · ${rab.wert} % ${rab.art}rabatt (${esc(rab.ab)}–${esc(rab.bis)})` : '')
      : `Liste <b>${chf(a.liste)}</b> · ${sperre('EK und Rabattkonditionen', 'IAM-02')}`,
    `${a.versionen.length} Preisversion${a.versionen.length > 1 ? 'en' : ''}: ` +
      a.versionen.map(v => `ab ${esc(v.ab)} ${chf(v.liste)}`).join(', '),
    neuerPreis && !IMPORT_ANGEWENDET
      ? `<span class="hl">Der offene Importlauf würde ${chf(neuerPreis.neuListe)} bringen ` +
        `(${pct((neuerPreis.neuListe / a.liste - 1) * 100)}), Stichtag ${esc(DB.importlauf.stichtag)} — ` +
        `noch nicht bestätigt.</span>` : '',
    benutzt.length ? `In ${benutzt.length} Belegposition${benutzt.length > 1 ? 'en' : ''}: ` +
      benutzt.map(({ d, p }) => `${esc(d.nr)} ${p.menge} ${esc(p.einheit)} zu ${chf(p.preis)}`).join(', ') +
      ` — jede mit ihrem eigenen, eingefrorenen Preis.` : 'Noch in keinem Beleg.',
    imLager ? `Lager: ${imLager.bestand} ${esc(imLager.einheit)} als ${esc(imLager.kat)} in ${esc(imLager.ort)}.` : '',
    imBlickHinweis(a.mandant),
  ], [{ t:'Produkte', go:'produkte', ref:a.id },
      benutzt.length ? { t:benutzt[0].d.nr, go:'verkauf', ref:benutzt[0].d.id } : null,
      neuerPreis ? { t:'Preisimport', go:'import' } : null].filter(Boolean));
}

function aLieferant(name) {
  const arts = DB.artikel.filter(a => a.hersteller === name || a.lieferant === name);
  const faelle = DB.faelle.filter(f => f.lieferant === name);
  const imp = DB.importlauf.hersteller === name ? DB.importlauf : null;
  const rab = DB.rabatte.find(r => r.ziel === name);
  return bau(esc(name), [
    `${arts.length} Artikel im Stamm: ${arts.slice(0, 5).map(a => esc(a.name.split(',')[0])).join(', ')}`,
    darf('ek') && rab ? `${rab.wert} % ${rab.art}rabatt, ${esc(rab.ab)}–${esc(rab.bis)}, Vorrang ${rab.prio}`
      : rab ? sperre('Die Konditionen', 'IAM-02') : '',
    imp ? `<span class="hl">Preisliste ${esc(imp.datei)} liegt analysiert vor: ${imp.analyse.neu} neu, ` +
      `${imp.analyse.geaendert} geändert, ${imp.analyse.fehler} fehlerhaft — wartet auf Bestätigung.</span>` : '',
    faelle.length ? `Garantie: ${faelle.map(f => `${esc(f.nr)} ${esc(f.titel)} (${esc(f.status)}, ` +
      `Kosten ${esc(f.kosten)})`).join('; ')}` : 'Kein offener Garantiefall.',
  ], [{ t:'Produkte', go:'produkte' }, imp ? { t:'Preisimport', go:'import' } : null,
      faelle.length ? { t:'Service', go:'service', ref:faelle[0].id } : null].filter(Boolean));
}

function aFall(f) {
  if (!modulErlaubt('service')) return modulSperre('service');
  const d = f.bezugDok ? D(f.bezugDok) : null;
  const p = d ? d.pos.find(x => x.nr === f.bezugPos) : null;
  return bau(`${esc(f.nr)} · ${esc(f.titel)}`, [
    `${esc(K(f.kunde).name)}, Projekt ${esc(P(f.projekt).nr)} · gemeldet ${esc(f.gemeldet)} · ` +
      `<b>${esc(f.status)}</b> · Frist ${esc(f.frist)}`,
    esc(f.fehler),
    `Lieferant ${esc(f.lieferant)}, Kostenübernahme ${esc(f.kosten)}, verantwortlich ${esc(f.verantwortlich)}`,
    d && p ? `Kommt aus ${esc(d.nr)}, Position ${p.nr} (${esc(p.text.split(',')[0])}), geliefert ` +
      `${esc(f.geliefertAm)} — der Weg zurück auf Lieferung und Lieferdatum ist der Grund, warum das ` +
      `auch in drei Jahren noch beantwortbar ist.` : '',
    `Verlauf: ${f.verlauf.map(v => `${esc(v.datum)} ${esc(v.was)}`).join(' → ')}`,
    imBlickHinweis(f.mandant),
  ], [{ t:'Fall öffnen', go:'service', ref:f.id },
      d ? { t:d.nr, go:'verkauf', ref:d.id } : null].filter(Boolean));
}

function aLagerartikel(l) {
  if (!modulErlaubt('lager')) return modulSperre('lager');
  return bau(`${esc(l.name)} · ${esc(l.nr)}`, [
    `${esc(l.kat)} · Bestand <b>${l.bestand} ${esc(l.einheit)}</b>, Minimum ${l.min} ` +
      `${esc(l.einheit)} · ${esc(l.ort)}`,
    l.bestand < l.min ? `<span class="hl">Unter dem Mindestbestand.</span>` : 'Im Rahmen.',
    l.ausgeliehen ? `Ausgeliehen: ${esc(l.ausgeliehen)}` : '',
    l.bewegungen.length ? `Letzte Bewegungen: ${l.bewegungen.slice(0, 3).map(b =>
      `${esc(b.datum)} ${b.menge > 0 ? '+' : '−'}${Math.abs(b.menge)} (${esc(b.grund)})`).join(', ')}`
      : 'Noch keine Bewegung.',
    imBlickHinweis(l.mandant),
  ], [{ t:'Lager', go:'lager' }]);
}

function aMandant(m) {
  const z = kennzahlen(m.id);
  return bau(`${esc(m.lang)} · ${esc(m.ort)}`, [
    `${esc(m.uid)} · ${esc(m.iban)} · Absender ${esc(m.absender)}`,
    `Layout: ${esc(m.layout)} · Zahlungsziel ${m.zahlungsziel} Tage`,
    `Nummernkreise: ${Object.entries(m.kreise).map(([t, n]) =>
      `${t}-26-${String(n).padStart(4, '0')}`).join(', ')} — eigene Kreise, keine geteilten Nummern.`,
    `Umsatz ${DB.jahr}: <b>${chf(z.umsatz)}</b>, offen ${chf(z.offen)}, davon ${chf(z.ueber)} überfällig`,
    `${z.projekte} Projekte, ${z.faelle} offene Servicefälle, ${z.stunden.toFixed(1)} h erfasst`,
    mandantenSicht().includes(m.id) ? '' :
      `Für «${esc(R().name)}» ist dieser Mandant nicht freigegeben (MAN-04).`,
  ], [{ t:'Übersicht', go:'uebersicht' }, { t:'Verkauf', go:'verkauf' }]);
}

function aRolle(r) {
  return bau(`Rolle ${esc(r.name)} · ${esc(r.wer)}`, [
    esc(r.was),
    `Module: ${r.module === '*' ? 'alle zwölf' : r.module.length + ' von 12 — ' +
      r.module.map(id => esc(MODULES.find(m => m.id === id).name)).join(', ')}`,
    `Mandanten: ${r.mandanten === '*' ? 'alle' : r.mandanten.map(id => esc(M(id).name)).join(', ')}`,
    `Projekte: ${r.projekte === '*' ? 'alle freigegebenen' : r.projekte.map(id => esc(P(id).nr)).join(', ')}`,
    `EK, Marge, interne Kostensätze: <b>${r.ek ? 'sichtbar' : 'gesperrt'}</b> · ` +
      `Kontakte und interne Notizen: <b>${r.notizen ? 'sichtbar' : 'gesperrt'}</b>`,
    `Finalisieren ${r.finalisieren ? 'erlaubt' : 'nicht erlaubt'} · Versenden ` +
      `${r.versenden ? 'erlaubt' : 'nicht erlaubt'} · Exportieren ${r.exportieren ? 'erlaubt' : 'nicht erlaubt'}`,
    `Dieselbe Prüfung gilt in der Liste, in der Suche, im Export, im Download — und in dieser ` +
      `Antwort. Verbergen in der Oberfläche allein wäre kein Recht (IAM-01…03).`,
  ], [{ t:'Was darf meine Rolle sehen?' }, { t:'Übersicht', go:'uebersicht' }]);
}

function aPerson(name) {
  const z = DB.zeiten.filter(t => t.wer === name);
  const proj = [...new Set(z.map(t => t.projekt))].filter(projektErlaubt);
  const r = DB.rollen.find(x => x.wer.startsWith(name));
  return bau(esc(name), [
    r ? `Rolle ${esc(r.name)}: ${esc(r.was)}` : '',
    `${z.reduce((s, t) => s + t.dauer, 0).toFixed(1)} h auf ${proj.length} Projekten erfasst`,
    proj.map(p => `${esc(P(p).nr)}: ${z.filter(t => t.projekt === p)
      .reduce((s, t) => s + t.dauer, 0).toFixed(1)} h`).join(' · '),
    darf('ek') ? `Interne Zeitkosten: ${chf(z.reduce((s, t) => s + t.dauer * t.kosten, 0))}`
      : sperre('Der interne Kostensatz', 'IAM-02, TIM-03'),
    DB.projekte.filter(p => p.verantwortlich === name).length
      ? `Verantwortlich für ${DB.projekte.filter(p => p.verantwortlich === name)
          .map(p => esc(p.nr)).join(', ')}` : '',
  ], [{ t:'Zeiten', go:'zeiten' }]);
}

function aStandort({ k, s }) {
  if (!modulErlaubt('kunden')) return modulSperre('kunden');
  const a = adr(k.id, s.adresse);
  const proj = DB.projekte.filter(p => p.standort === s.id);
  const dok = DB.dokumente.filter(d => d.adresse === s.adresse);
  return bau(`${esc(s.name)} · ${esc(k.name)}`, [
    `${esc(a.typ)}: ${esc(a.zeile)}, ${esc(a.plz)} ${esc(a.ort)}`,
    darf('notizen') ? `Kontakte: ${s.kontakte.map(c => esc(kontakt(k.id, c).name) + ' (' +
      esc(kontakt(k.id, c).funktion) + ')').join(', ')}` : sperre('Die Kontakte', 'IAM-02'),
    proj.length ? `Projekte hier: ${proj.map(p => esc(p.nr)).join(', ')}` : 'Kein Projekt an diesem Standort.',
    dok.length ? `${dok.length} Beleg${dok.length > 1 ? 'e' : ''} sind an diese Adresse gegangen: ` +
      dok.map(d => esc(d.nr)).join(', ') : '',
    `Der Standort hängt am Kunden, nicht daneben: ${esc(k.name)} bleibt der Debitor (CRM-02).`,
  ], [{ t:'Kunde öffnen', go:'kunden', ref:k.id },
      proj.length ? { t:proj[0].nr, go:'projekte', ref:proj[0].id } : null].filter(Boolean));
}

function aKontakt({ k, c }) {
  if (!darf('notizen')) return bau('Kontaktdaten sind gesperrt',
    [sperre('Kontakte und interne Notizen', 'IAM-02'),
     'Auch die Suche gibt dazu keine Treffer und keine Vorschautexte aus (SEA-03).'],
    [{ t:'Was darf meine Rolle sehen?' }]);
  const kamp = DB.kampagnen.filter(x => c.verteiler.includes(x.verteiler));
  return bau(`${esc(c.anrede)} ${esc(c.name)} · ${esc(k.name)}`, [
    `${esc(c.funktion)} · ${esc(c.tel)}${c.mobil ? ' · ' + esc(c.mobil) : ''} · ${esc(c.mail)}`,
    c.verteiler.length ? `Verteiler: ${c.verteiler.map(esc).join(', ')} · Einwilligung ${esc(c.einwilligung)}`
      : 'In keinem Verteiler — kein Newsletter, keine Einwilligung nötig.',
    kamp.length ? `Erhalten: ${kamp.map(x => `${esc(x.name)} (${esc(x.status)})`).join(', ')}` : '',
    'Einwilligung, Quelle und Zeitpunkt hängen am Kontakt; eine Abmeldung wirkt dauerhaft (NWL-02).',
  ], [{ t:'Kunde öffnen', go:'kunden', ref:k.id }, { t:'Versand', go:'versand' }]);
}

/* ── Antworten zu einem Thema ────────────────────────────────────────────── */
const ANTWORT = {
  uebersicht() {
    const it = offeneSachen();
    if (!it.length) return bau('Nichts offen',
      ['Kein überfälliger Beleg, kein offener Fall, keine fällige Wiedervorlage in diesem Blick.'],
      [{ t:'Zahlen dieses Mandanten' }]);
    return bau(`${it.length} Sachen offen in ${MANDANT === 'alle' ? 'allen Mandanten' : esc(M().name)}`,
      it.slice(0, 6).map(i => `${i.ernst === 3 ? '<span class="hl">' : ''}<b>${esc(i.was)}</b>` +
        `${i.ernst === 3 ? '</span>' : ''} — ${esc(i.warum)} ${mod(i.wo)}`),
      [...new Set(it.slice(0, 4).map(i => i.wo))].map(w => ({ t:MODULES.find(m => m.id === w).name, go:w })));
  },
  umsatz() {
    const z = kennzahlen(MANDANT === 'alle' ? null : MANDANT);
    return bau(`${MANDANT === 'alle' ? 'Alle Mandanten' : esc(M().lang)} in Zahlen`, [
      `Umsatz ${DB.jahr}: <b>${chf(z.umsatz)}</b> — aus ${DB.dokumente.filter(d =>
        imBlick(d.mandant) && d.typ === 'RG').length} Rechnungen, Gutschriften abgezogen, ` +
        `stornierte nicht gezählt (DSH-05)`,
      `Offen ${chf(z.offen)} in ${z.offenAnz} Rechnungen, davon <b>${chf(z.ueber)}</b> überfällig`,
      `Offene Offerten ${chf(z.offerten)} in ${z.offertenAnz} Belegen · Erfolgsquote ` +
        `${z.quote.toFixed(0)} % (${z.quoteText})`,
      darf('ek') ? `Materialrohertrag ${chf(z.marge)} (${z.margeQuote.toFixed(1)} % vom Materialumsatz), ` +
        `Deckungsbeitrag über alle Projekte ${chf(z.db)}` : sperre('Marge und Rohertrag', 'MAR-04'),
      `${z.stunden.toFixed(1)} h erfasst, davon ${z.stundenOffen.toFixed(1)} h verrechenbar und offen`,
      'Jede Zahl ist aus den Belegen gerechnet, keine ist hinterlegt.',
    ], [{ t:'Übersicht', go:'uebersicht' }, { t:'Zahlungen', go:'zahlungen' },
        { t:'Wo liegt Geld?' }]);
  },
  marge() {
    if (!darf('ek')) return bau('Marge ist für diese Rolle gesperrt',
      [sperre('EK, Marge und interne Kostensätze', 'IAM-02, MAR-04'),
       'Das gilt in jedem Modul, in der Suche, im Export — und hier.'],
      [{ t:'Was darf meine Rolle sehen?' }]);
    const liste = mProjekte().map(p => ({ p, m:marge(p.id) }))
      .sort((a, b) => b.m.db - a.m.db);
    return bau('Marge je Projekt', liste.map(({ p, m }) =>

/* ── der Auflöser ────────────────────────────────────────────────────────── */
function frage(text) {
  const q = cnorm(text);
  if (!q) return ANTWORT.hilfe();
  if (/\b(wo|wieviel|wie viel)\b/.test(q) && /\bgeld\b/.test(q)) return ANTWORT.geld();
  const t = matchThema(q);
  const e = matchEnt(q, chatIndex(), t && KIND_VON[t.id]);
  if (e && e.ties.length && (!t || e.s >= t.s))
    return bau('Das gibt es mehrfach', ['Welches meinen Sie?'],
      e.ties.map(x => ({ t:entName(x.kind, x.ref) })));

  if (e && (!t || e.s >= t.s)) {
    if (e.kind === 'kunde')        return aKunde(e.ref);
    if (e.kind === 'standort')     return aStandort(e.ref);
    if (e.kind === 'kontakt')      return aKontakt(e.ref);
    if (e.kind === 'projekt')      return aProjekt(e.ref);
    if (e.kind === 'beleg')        return aBeleg(e.ref);
    if (e.kind === 'artikel')      return aArtikel(e.ref);
    if (e.kind === 'lieferant')    return aLieferant(e.ref);
    if (e.kind === 'fall')         return aFall(e.ref);
    if (e.kind === 'lagerartikel') return aLagerartikel(e.ref);
    if (e.kind === 'mandant')      return aMandant(e.ref);
    if (e.kind === 'rolle')        return aRolle(e.ref);
    if (e.kind === 'person')       return aPerson(e.ref);
    if (e.kind === 'modul')        return ANTWORT[e.ref.id] ? ANTWORT[e.ref.id]() : ANTWORT.uebersicht();
  }
  if (t && ANTWORT[t.id]) return ANTWORT[t.id]();

  const it = offeneSachen();
  return bau('Dazu finde ich keine eindeutige Antwort', [
    'Fragen Sie nach einem Kunden, einem Standort, einem Projekt, einer Belegnummer, einem ' +
      'Artikel, einem Hersteller, einem Servicefall, einem Mandanten oder einer Rolle — oder ' +
      'nach einem Modul.',
    it.length ? `Offen ist gerade: ${it.slice(0, 3).map(i => '<b>' + esc(i.was) + '</b>').join(', ')}.` : '',
  ], [{ t:'Was ist offen?' }, { t:'Ein Kunde, zwei Adressen' }, { t:'Was ist dieser Prototyp?' },
      { t:'Was darf meine Rolle sehen?' }]);
}

function chatRender() {
  const log = $('#chat-log');
  if (!log) return;
  log.innerHTML = CHAT.verlauf.map(m => m.r === 'u'
    ? `<div class="msg u">${esc(m.t)}</div>`
    : `<div class="msg b">${m.t}</div>`).join('') +
    (CHAT.denkt ? '<div class="msg b tipp"><i></i><i></i><i></i></div>' : '');
  log.scrollTop = log.scrollHeight;
}

function chatOeffnen(auf) {
  CHAT.offen = auf ?? !CHAT.offen;
  $('#chat').classList.toggle('on', CHAT.offen);
  $('#chatbtn').classList.toggle('weg', CHAT.offen);
  document.body.classList.toggle('chatOffen', CHAT.offen);
  if (CHAT.offen) {
    if (!CHAT.verlauf.length) CHAT.verlauf.push({ r:'b', t:ANTWORT.hilfe() });
    chatRender();
    if (!matchMedia('(hover:none)').matches) setTimeout(() => $('#chat-in').focus(), 60);
  }
}

let chatTimer;
function chatFragen(text) {
  const t = text.trim();
  if (!t) return;
  CHAT.verlauf.push({ r:'u', t });
  CHAT.denkt = true; chatRender();
  clearTimeout(chatTimer);
  chatTimer = setTimeout(() => {
    CHAT.denkt = false;
    CHAT.verlauf.push({ r:'b', t:frage(t) });
    chatRender();
  }, 260);
}

document.addEventListener('click', e => {
  if (e.target.closest('#chatbtn')) return chatOeffnen(true);
  if (e.target.closest('#chat-zu')) return chatOeffnen(false);
  const ask = e.target.closest('#chat [data-ask]');
  if (ask) { chatFragen(ask.dataset.ask); return; }
  const send = e.target.closest('#chat-send');
  if (send) { const i = $('#chat-in'); chatFragen(i.value); i.value = ''; i.focus(); return; }
  /* ein Sprung aus dem Chat soll den Schirm zeigen, auf den er springt */
  if (e.target.closest('#chat [data-go],#chat [data-dok],#chat [data-projekt],#chat [data-kunde]'))
    chatOeffnen(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'chat-in') {
    chatFragen(e.target.value); e.target.value = '';
  }
  if (e.key === 'Escape' && CHAT.offen) chatOeffnen(false);
});
/* ── Was auf einen Klick passiert ───────────────────────────────────────────
   Ein Zuhörer für alles, ein Ort, an dem der Datenstand geändert wird. Jede
   Aktion schreibt ins Protokoll, das das Modul Archiv zeigt — im Prototyp
   passiert nichts unsichtbar.
   ────────────────────────────────────────────────────────────────────────── */

/* ── Prüfsummen (ARC-01, ARC-02) ─────────────────────────────────────────
   Echtes SHA-256 im Browser, ohne Server: die eingefrorene Fassung des Belegs
   wird gehasht, und «Integrität prüfen» rechnet dieselbe Summe erneut. Ohne
   sicheren Kontext (kein HTTPS) gibt es das nicht — dann sagt der Prototyp
   das auch. */
async function sha256(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return null; }
}
DB.hashEcht = false;
async function archivStart() {
  const final = DB.dokumente.filter(d => d.final);
  for (const d of final) {
    d.archivText = dokText(d);
    const h = await sha256(d.archivText);
    if (h) { d.hash = h; DB.hashEcht = true; }
  }
  render();
}

/* ── Belege umwandeln (DOC-01…04) ───────────────────────────────────────── */
let lfd = 100;
const neueId = () => 'n' + (++lfd);
const jetztZeit = () => `${DB.heute} ${new Date().toLocaleTimeString('de-CH').slice(0, 5)}`;
const wer = () => R().wer.split(' ')[0];

/* wie viel von einem Auftrag bereits geliefert bzw. fakturiert ist */
const geliefert = (ab, nr) => DB.dokumente.filter(x => x.vorgaenger === ab.id && x.typ === 'LS')
  .reduce((s, x) => s + (x.pos.find(p => p.nr === nr)?.menge || 0), 0);
const fakturiert = ab => DB.dokumente.filter(x => x.vorgaenger === ab.id && x.typ === 'RG'
  && x.status !== 'storniert').reduce((s, x) => s + netto(x), 0);

function wandeln(d, ziel) {
  const basis = { id:neueId(), mandant:d.mandant, kunde:d.kunde, projekt:d.projekt,
    datum:DB.heute, status:'Entwurf', final:false, vorgaenger:d.id,
    adresse:d.adresse, adresseName:d.adresseName, kontakt:d.kontakt,
    zahlungsziel:d.zahlungsziel, titel:d.titel, nr:`Entwurf ${ziel}` };

  if (ziel === 'AB') {
    const neu = { ...basis, typ:'AB', pos:d.pos.map(p => ({ ...p })) };
    DB.dokumente.push(neu); DOK_OFFEN = neu.id;
    protokoll(neu.nr, 'aus Offerte erzeugt', `${d.nr} → Auftragsbestätigung, ${neu.pos.length} Positionen übernommen`);
    toast(`Auftragsbestätigung als Entwurf erzeugt: <b>${neu.pos.length} Positionen</b> aus
      ${esc(d.nr)} übernommen, nichts neu getippt. Nummer bekommt sie beim Finalisieren.`, 1);
    return;
  }
  if (ziel === 'LS') {
    const pos = d.pos.map(p => ({ ...p, menge:p.menge - geliefert(d, p.nr) })).filter(p => p.menge > 0);
    if (!pos.length) { toast(`Aus ${esc(d.nr)} ist alles geliefert — ein weiterer Lieferschein
      hätte keine Position.`, 2); return; }
    const neu = { ...basis, typ:'LS', ohnePreise:true, pos:pos.map((p, i) => ({ ...p, nr:i + 1 })) };
    DB.dokumente.push(neu); DOK_OFFEN = neu.id;
    protokoll(neu.nr, 'aus Auftrag erzeugt', `${d.nr} → Lieferschein über die offenen Mengen`);
    toast(`Lieferschein für die <b>offenen Mengen</b> erzeugt: ${pos.length} von ${d.pos.length}
      Positionen, ohne Preise. ${esc(d.nr)} bleibt unverändert.`, 1);
    return;
  }
  if (ziel === 'RG') {
    const summe = d.pos.reduce((s, p) => s + posNetto(p), 0);
    const schon = fakturiert(d);
    const offen = summe - schon;
    if (offen <= 0.005) {
      toast(`Nichts offen: von ${esc(d.nr)} sind <b>${chf(schon)}</b> von ${chf(summe)} bereits
        fakturiert. Eine weitere Rechnung würde überfakturieren — genau das ist die Regel aus
        DOC-04.`, 2);
      return;
    }
    const neu = { ...basis, typ:'RG', art:schon > 0 ? 'Schlussrechnung' : 'Rechnung',
      faellig:'—', pos:d.pos.map(p => ({ ...p })) };
    if (schon > 0) neu.abzug = { was:'bereits fakturiert', betrag:schon };
    DB.dokumente.push(neu); DOK_OFFEN = neu.id;
    protokoll(neu.nr, 'aus Auftrag erzeugt',
      `${d.nr} → Rechnung über ${offen.toFixed(2)}, bereits fakturiert ${schon.toFixed(2)} abgezogen`);
    toast(`Rechnungsentwurf über <b>${chf(offen)}</b> erzeugt${schon > 0
      ? `, ${chf(schon)} bereits fakturiert und abgezogen` : ''}.`, 1);
  }
}

async function finalisieren(d) {
  const m = M(d.mandant);
  m.kreise[d.typ] = (m.kreise[d.typ] || 0) + 1;
  d.nr = `${d.typ}-26-${String(m.kreise[d.typ]).padStart(4, '0')}`;
  d.final = true; d.finalAm = jetztZeit(); d.finalVon = wer();
  d.status = d.typ === 'RG' ? 'offen' : 'finalisiert';
  if (d.typ === 'RG') {
    const ziel = d.zahlungsziel || m.zahlungsziel;
    d.faellig = `${DB.heute.slice(0, 6)}${String(+DB.heute.slice(6) + (ziel > 30 ? 1 : 0))}`;
    d.faellig = ziel === 30 ? '23.10.2026' : ziel === 20 ? '13.10.2026' : '07.11.2026';
  }
  d.archivText = dokText(d);
  const h = await sha256(d.archivText);
  if (h) { d.hash = h; DB.hashEcht = true; }
  protokoll(d.nr, 'finalisiert',
    `PDF erzeugt, ${DB.hashEcht ? 'SHA-256 gespeichert' : 'Prüfsumme hinterlegt'}, ` +
    `Nummer aus Kreis ${d.typ} des Mandanten ${m.name}`);
  render();
  toast(`<b>${esc(d.nr)}</b> finalisiert: Nummer aus dem Kreis ${d.typ} von ${esc(m.name)},
    Zeitpunkt und Benutzer festgehalten${DB.hashEcht ? ', Prüfsumme gerechnet' : ''}.
    Geändert wird ab jetzt nur über Storno und Gutschrift.`, 1);
}

async function storno(d) {
  const m = M(d.mandant);
  m.kreise.GS = (m.kreise.GS || 0) + 1;
  const gs = { id:neueId(), typ:'GS', nr:`GS-26-${String(m.kreise.GS).padStart(4, '0')}`,
    mandant:d.mandant, kunde:d.kunde, projekt:d.projekt, datum:DB.heute, status:'verbucht',
    adresse:d.adresse, adresseName:d.adresseName, kontakt:d.kontakt, bezug:d.id,
    titel:`Gutschrift zu ${d.nr}`, grund:'Storno der Rechnung, Korrektur über neuen Beleg',
    final:true, finalAm:jetztZeit(), finalVon:wer(),
    pos:[{ nr:1, art:null, text:`Storno der Rechnung ${d.nr}`, menge:1, einheit:'Psch',
           preis:netto(d), ekSnap:0, rabatt:0, mwst:8.1 }] };
  gs.archivText = dokText(gs);
  const h = await sha256(gs.archivText); if (h) gs.hash = h;
  DB.dokumente.push(gs);
  d.status = 'storniert'; d.storniertAm = DB.heute; d.storniertDurch = gs.nr;
  const neu = { id:neueId(), typ:'RG', nr:'Entwurf RG', mandant:d.mandant, kunde:d.kunde,
    projekt:d.projekt, datum:DB.heute, status:'Entwurf', final:false, ersetzt:d.id,
    adresse:d.adresse, adresseName:d.adresseName, kontakt:d.kontakt,
    zahlungsziel:d.zahlungsziel, titel:d.titel + ', korrigiert', art:'Schlussrechnung',
    pos:d.pos.map(p => ({ ...p })) };
  DB.dokumente.push(neu);
  DOK_OFFEN = neu.id;
  protokoll(d.nr, 'storniert', `Storno über ${gs.nr}, PDF unverändert erhalten, Nummer nicht wiederverwendet`);
  render();
  toast(`${esc(d.nr)} storniert über <b>${esc(gs.nr)}</b> und ein korrigierter Entwurf angelegt.
    Das ursprüngliche PDF bleibt unverändert, die Nummer wird nicht wiederverwendet.`, 2);
}

/* ── Aktionen ────────────────────────────────────────────────────────────── */
const ACTIONS = {
  finalisieren(el) { finalisieren(D(el.dataset.id)); return true; },
  'of-angenommen'(el) { const d = D(el.dataset.id);
    d.status = 'angenommen'; d.angenommenAm = DB.heute;
    protokoll(d.nr, 'Status geändert', 'versendet → angenommen');
    toast(`${esc(d.nr)} als angenommen markiert. Jetzt lässt sie sich in eine
      Auftragsbestätigung umwandeln, ohne etwas neu zu tippen.`, 1); },
  wandeln(el) { wandeln(D(el.dataset.id), el.dataset.ziel); },
  storno(el) { storno(D(el.dataset.id)); return true; },
  'zum-versand'(el) { VERSAND_DOK = el.dataset.id; AKTIV = 'versand'; },
  'hash-pruefen'(el) {
    const d = D(el.dataset.id);
    if (!DB.hashEcht) { toast(`Ohne sicheren Kontext rechnet der Browser kein SHA-256.
      Auf <b>axyom.ch</b> läuft die Prüfung; hier ist die Summe hinterlegt.`, 2); return; }
    sha256(d.archivText).then(h => {
      d.pruefung = h === d.hash ? 'ok' : 'fehler';
      render();
      toast(d.pruefung === 'ok'
        ? `<b>${esc(d.nr)}</b>: Prüfsumme stimmt. Die archivierte Fassung ist unverändert.`
        : `<b>${esc(d.nr)}</b>: Prüfsumme weicht ab — die archivierte Fassung wurde verändert.
           Im System wäre das ein Ereignis für das Protokoll, nicht eine Fussnote.`,
        d.pruefung === 'ok' ? 1 : 3);
      protokoll(d.nr, 'Integrität geprüft', d.pruefung === 'ok' ? 'Prüfsumme stimmt' : 'Abweichung festgestellt');
    });
    return true;
  },
  'hash-manipulieren'(el) { const d = D(el.dataset.id);
    d.archivText += '\n(nachträglich verändert)'; d.manipuliert = true; d.pruefung = null;
    toast(`Die archivierte Fassung von ${esc(d.nr)} wurde für die Vorführung verändert.
      Prüfen Sie jetzt die Integrität.`, 2); },
  'hash-zuruecksetzen'(el) { const d = D(el.dataset.id);
    d.archivText = dokText(d); d.manipuliert = false; d.pruefung = null;
    toast('Archivierte Fassung zurückgesetzt.', 1); },
  'alle-pruefen'() {
    if (!DB.hashEcht) { toast('Ohne sicheren Kontext rechnet der Browser kein SHA-256.', 2); return; }
    const final = mDok().filter(d => d.final);
    Promise.all(final.map(d => sha256(d.archivText).then(h => {
      d.pruefung = h === d.hash ? 'ok' : 'fehler'; }))).then(() => {
      const schlecht = final.filter(d => d.pruefung !== 'ok');
      render();
      toast(schlecht.length
        ? `${schlecht.length} von ${final.length} Belegen weichen ab:
           <b>${schlecht.map(d => esc(d.nr)).join(', ')}</b>.`
        : `Alle ${final.length} Prüfsummen stimmen. Keine archivierte Fassung wurde verändert.`,
        schlecht.length ? 3 : 1);
      protokoll('Archiv', 'Integrität geprüft', `${final.length} Belege, ${schlecht.length} Abweichungen`);
    });
    return true;
  },
  'zip-export'(el) {
    const p = P(el.dataset.id);
    const dok = DB.dokumente.filter(d => d.projekt === p.id && d.final);
    protokoll(p.nr, 'exportiert', `Projektexport ZIP, ${dok.length} PDF, Chronik und Metadaten`);
    toast(`Projektexport <b>${esc(p.nr)}_${esc(K(p.kunde).kurz)}.zip</b> zusammengestellt:
      ${dok.length} Beleg-PDF, ${DB.dateien.filter(f => f.projekt === p.id).length} Dateien,
      Chronik, projekt.json und die Prüfsummen. Der Download braucht einen Server — im Prototyp
      steht die Liste.`, 1);
  },
  export(el) {
    protokoll('Export', 'erzeugt', el.dataset.was);
    toast(`Export «${esc(el.dataset.was)}» zusammengestellt. Rechte und sensible Felder gelten
      dabei genauso wie auf dem Schirm: als «${esc(R().name)}»
      ${darf('ek') ? 'sind EK und Marge enthalten' : 'sind EK und Marge nicht enthalten'}.`, 1);
  },
  'import-anwenden'() {
    const i = DB.importlauf;
    let n = 0;
    i.proben.geaendert.forEach(r => {
      const a = DB.artikel.find(x => x.nr === r.nr);
      if (!a) return;
      a.versionen.push({ ab:i.stichtag, liste:r.neuListe, ek:r.neuEk });
      a.liste = r.neuListe; a.ek = r.neuEk; a.vk = r.neuListe; n++;
    });
    IMPORT_ANGEWENDET = true;
    protokoll(`Importlauf ${i.id}`, 'angewendet',
      `${i.datei}, Stichtag ${i.stichtag}: ${i.analyse.neu} neu, ${i.analyse.geaendert} geändert, ` +
      `${i.analyse.fehler} fehlerhaft übersprungen`);
    toast(`Import angewendet: ${n} Artikel haben eine <b>neue Preisversion</b> ab
      ${esc(i.stichtag)}. Keine alte Version überschrieben, ${i.analyse.fehler} fehlerhafte Zeilen
      übersprungen — und kein bestehender Beleg verändert.`, 1);
  },
  'import-zurueck'() {
    const i = DB.importlauf;
    DB.artikel.forEach(a => {
      const weg = a.versionen.findIndex(v => v.ab === i.stichtag);
      if (weg < 0) return;
      a.versionen.splice(weg, 1);
      const letzte = a.versionen[a.versionen.length - 1];
      a.liste = letzte.liste; a.ek = letzte.ek; a.vk = letzte.liste;
    });
    IMPORT_ANGEWENDET = false;
    protokoll(`Importlauf ${i.id}`, 'zurückgenommen', 'Preisversionen mit Stichtag entfernt');
    toast('Lauf zurückgenommen: die Preisversionen mit diesem Stichtag sind entfernt, ' +
      'der Stand von vorher gilt wieder.', 2);
  },
  'import-bericht'() {
    const i = DB.importlauf;
    toast(`Validierungsbericht: ${i.zeilen} Zeilen gelesen, ${i.zeichensatz}.
      ${i.analyse.fehler} Zeilen mit Fehler — leerer Listenpreis, EK über Liste, fehlende
      Artikelnummer. Diese Zeilen werden übersprungen, nicht geraten.`, 2);
  },
  'zeit-buchen'() {
    const pid = $('[data-zprojekt]').value;
    const text = $('[data-ztext]').value || 'Arbeit';
    const dauer = Math.max(0.25, zahl($('[data-zdauer]').value, 1));
    const verr = $('[data-zverr]').value === 'ja';
    const satz = verr ? 145 : 0;
    DB.zeiten.push({ id:neueId(), projekt:pid, datum:DB.heute, wer:wer(), taetigkeit:text,
      dauer, verrechenbar:verr, satz, kosten:78, dok:null });
    protokoll(P(pid).nr, 'Zeit erfasst', `${dauer.toFixed(2)} h ${text}, ${verr ? 'verrechenbar' : 'nicht verrechenbar'}`);
    toast(`${dauer.toFixed(2)} h auf <b>${esc(P(pid).nr)}</b> gebucht${verr
      ? ` · ${chf(dauer * satz)} verrechenbar` : ' · nicht verrechenbar'}.`, 1);
  },
  'zeiten-fakturieren'() {
    const gewaehlt = ZEIT_WAHL.map(id => DB.zeiten.find(t => t.id === id)).filter(Boolean);
    if (!gewaehlt.length) return;
    const projekte = [...new Set(gewaehlt.map(t => t.projekt))];
    const erzeugt = [];
    projekte.forEach(pid => {
      const p = P(pid), k = K(p.kunde);
      const meine = gewaehlt.filter(t => t.projekt === pid);
      const nachText = {};
      meine.forEach(t => { nachText[t.taetigkeit] = nachText[t.taetigkeit] || { h:0, satz:t.satz };
        nachText[t.taetigkeit].h += t.dauer; });
      const neu = { id:neueId(), typ:'RG', nr:'Entwurf RG', mandant:p.mandant, kunde:p.kunde,
        projekt:pid, datum:DB.heute, status:'Entwurf', final:false,
        adresse:standort(k.id, p.rechnungsempfaenger).adresse || k.rechnungsadresse,
        adresseName:standort(k.id, p.rechnungsempfaenger).name, kontakt:k.kontakte[k.kontakte.length - 1].id,
        zahlungsziel:k.zahlungsziel, titel:`Arbeitsleistungen ${p.name}`, art:'Rechnung',
        pos:Object.entries(nachText).map(([text, x], i) => ({ nr:i + 1, art:'x6',
          text:`${text}, ${x.h.toFixed(2)} h`, menge:x.h, einheit:'h', preis:x.satz,
          ekSnap:0, rabatt:0, mwst:8.1 })) };
      DB.dokumente.push(neu);
      meine.forEach(t => { t.dok = neu.id; });
      erzeugt.push({ neu, h:meine.reduce((s, t) => s + t.dauer, 0) });
      protokoll(`Entwurf RG ${p.nr}`, 'aus Zeiten erzeugt',
        `${meine.length} Buchungen, ${meine.reduce((s, t) => s + t.dauer, 0).toFixed(2)} h`);
    });
    ZEIT_WAHL = [];
    DOK_OFFEN = erzeugt[0].neu.id;
    AKTIV = 'verkauf';
    toast(`${erzeugt.length} Rechnungsentwurf${erzeugt.length > 1 ? 'entwürfe' : ''} erzeugt:
      <b>${erzeugt.reduce((s, e) => s + e.h, 0).toFixed(2)} h</b> übernommen. Die Buchungen sind
      mit der Rechnung verknüpft und gegen doppelte Fakturierung gesperrt.`, 1);
  },
  'zeiten-abwaehlen'() { ZEIT_WAHL = []; },
  'zahlung-buchen'(el) {
    const d = D(el.dataset.id);
    const betrag = zahl($('[data-zbetrag]').value, 0);
    if (betrag <= 0) { toast('Kein Betrag erfasst.', 2); return; }
    DB.zahlungen.push({ id:neueId(), dok:d.id, datum:$('[data-zdatum]').value || DB.heute,
      betrag, referenz:$('[data-zref]').value || '—',
      art:betrag >= brutto(d) - bezahlt(d) - 0.005 ? 'Vollzahlung' : 'Teilzahlung' });
    const rest = offenBetrag(d);
    if (rest <= 0.005) { d.status = 'bezahlt'; d.mahnstufe = 0; }
    protokoll(d.nr, 'Zahlung erfasst', `${chf(betrag)}, Restbetrag ${chf(Math.max(0, rest))}`);
    toast(rest <= 0.005
      ? `${chf(betrag)} gebucht — <b>${esc(d.nr)}</b> ist bezahlt. Der Mahnprozess endet damit.`
      : `${chf(betrag)} gebucht. Offen bleiben <b>${chf(rest)}</b>; der Status folgt dem Restbetrag.`, 1);
  },
  'mahnung-vorbereiten'(el) {
    const d = D(el.dataset.id);
    const stufe = (d.mahnstufe || 0) + 1;
    const regel = DB.mahnstufen.find(s => s.stufe === stufe);
    d.mahnungVorbereitet = stufe;
    VERSAND_DOK = d.id;
    AKTIV = 'versand';        // die Freigabe passiert dort, also gehen wir dorthin
    protokoll(d.nr, 'Mahnung vorbereitet', `Stufe ${stufe}, Gebühr ${regel.gebuehr || 0}, wartet auf Freigabe`);
    toast(`Mahnung <b>Stufe ${stufe}</b> vorbereitet${regel.gebuehr ? ` mit ${chf(regel.gebuehr)} Gebühr` : ''}.
      Sie geht erst nach Freigabe im Versand hinaus — nicht automatisch.`, 2);
  },
  senden(el) {
    const d = D(el.dataset.id);
    const an = ($('[data-vempf]') || {}).value || '—';
    const betreff = ($('[data-mailbetreff]') || {}).value || '';
    const anhang = [`${d.nr}.pdf`];
    const mahnung = d.mahnungVorbereitet;
    DB.versand.unshift({ id:neueId(), dok:d.id, datum:jetztZeit(), wer:wer(), an:[an], cc:[],
      betreff, anhang, status:'zugestellt', mahnung });
    if (mahnung) { d.mahnstufe = mahnung; d.mahnungAm = DB.heute; d.mahnungVorbereitet = null; }
    if (d.typ === 'OF' && d.status === 'finalisiert') {
      d.status = 'versendet';
      d.nachfassAm = '05.10.2026';
      DB.aktivitaeten.unshift({ id:neueId(), was:`Offerte ${d.nr} nachfassen`, bezug:d.id,
        bezugArt:'Beleg', kunde:d.kunde, projekt:d.projekt, faellig:d.nachfassAm, wer:wer(),
        status:'offen', notiz:'Automatisch beim Versand gesetzt (Regel des Mandanten).' });
    }
    protokoll(d.nr, 'versendet', `an ${an}, ${anhang.length} Anhang${mahnung ? `, Mahnung Stufe ${mahnung}` : ''}`);
    toast(`<b>${esc(d.nr)}</b> an ${esc(an)} versendet, mit PDF im Anhang.
      ${mahnung ? `Mahnstufe ${mahnung} ist damit gesetzt.` : ''}
      ${d.nachfassAm ? `Follow-up automatisch auf ${esc(d.nachfassAm)} gelegt.` : ''}
      Der Eintrag steht in der Historie und überschreibt keinen früheren.`, 1);
  },
  erneut(el) {
    const d = D(el.dataset.id);
    const alt = DB.versand.find(v => v.dok === d.id);
    DB.versand.unshift({ ...alt, id:neueId(), datum:jetztZeit(), wer:wer(), status:'zugestellt' });
    protokoll(d.nr, 'erneut versendet', `Kopie des Versands vom ${alt.datum}`);
    toast(`${esc(d.nr)} erneut versendet. Der frühere Versand bleibt als eigener Eintrag stehen.`, 1);
  },
  'lager-buchen'(el) {
    const l = DB.lager.find(x => x.id === el.dataset.id);
    const menge = zahl($('[data-bmenge]').value, 0);
    const grund = $('[data-bgrund]').value || 'Korrektur';
    if (!menge) { toast('Keine Menge erfasst.', 2); return; }
    l.bewegungen.unshift({ datum:DB.heute, menge, grund, projekt:null, wer:wer() });
    l.bestand += menge;
    protokoll(l.nr, 'Bestandsbewegung', `${menge > 0 ? '+' : ''}${menge} ${l.einheit}, ${grund}`);
    toast(`${l.name}: ${menge > 0 ? '+' : '−'}${Math.abs(menge)} ${esc(l.einheit)} gebucht,
      neuer Bestand <b>${l.bestand} ${esc(l.einheit)}</b>${l.bestand < l.min
        ? ' — unter dem Mindestbestand' : ''}.`, l.bestand < l.min ? 2 : 1);
  },
};

/* ── Klicks ──────────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  /* die Suche schliesst sich, wenn daneben geklickt wird */
  if (!e.target.closest('.suche') && SUCHE_OFFEN) { SUCHE_OFFEN = false; renderTreffer(); }

  const a = e.target.closest('[data-act]');
  if (a) { const f = ACTIONS[a.dataset.act];
    if (f) { const eigen = f(a); if (!eigen) render(); }
    return; }

  const t = e.target.closest('[data-treffer]');
  if (t) {
    AKTIV = t.dataset.treffer;
    const ref = t.dataset.ref;
    if (AKTIV === 'kunden') { KUNDE_OFFEN = ref; KUNDE_TAB = 'stamm'; }
    if (AKTIV === 'projekte') PROJEKT_OFFEN = ref;
    if (AKTIV === 'verkauf') DOK_OFFEN = ref;
    if (AKTIV === 'produkte') ART_OFFEN = ref;
    if (AKTIV === 'service') FALL_OFFEN = ref;
    SUCHE = ''; SUCHE_OFFEN = false; $('#sfeld').value = '';
    render(); return;
  }

  const m = e.target.closest('[data-mandant]');
  if (m) { MANDANT = m.dataset.mandant; DOK_OFFEN = null; KUNDE_OFFEN = null;
    PROJEKT_OFFEN = null; FALL_OFFEN = null; ART_OFFEN = null;
    toast(MANDANT === 'alle'
      ? `Gesamtansicht über ${mandantenSicht().length} Mandanten — nur für berechtigte Rollen.`
      : `Mandant <b>${esc(M().lang)}</b>: eigene Stammdaten, Nummernkreise, Absender und Layouts.`, 1);
    render(); return; }

  if (e.target.closest('#idbtn')) { IDS = !IDS;
    toast(IDS ? 'Anforderungs-IDs eingeblendet: jede Funktion zeigt, welche Anforderung aus dem Grobkonzept sie erfüllt.'
              : 'IDs ausgeblendet.', 1);
    render(); return; }

  const ah = e.target.closest('[data-ampelhilfe]');
  if (ah) {
    if (document.querySelector('.flug:not(.weg):not(.schnell)')) { flugWeg(true); return; }
    flugHinweis(ah.closest('.ampel') || ah, `
      <div class="fz"><span class="fp" style="background:var(--bad)"></span>
        <div><b>Rot — jetzt.</b> Etwas kostet gerade Geld oder Frist: eine überfällige Rechnung,
        ein abgelaufener Garantieanspruch.</div></div>
      <div class="fz"><span class="fp" style="background:#cf7c1f"></span>
        <div><b>Gelb — heute.</b> Eine Entscheidung, die heute fallen sollte: ein Preisimport
        freigeben, eine Mahnstufe, eine fällige Wiedervorlage.</div></div>
      <div class="fz"><span class="fp" style="background:var(--acc)"></span>
        <div><b>Grün — kann warten.</b> Vorbereitet und ohne Eile: offene Offerten, nicht
        verrechnete Zeiten, Bestände unter Minimum.</div></div>
      <div style="color:rgba(255,255,255,.5);margin-top:6px">Die Zahl ist, wie viele Sachen auf
        dieser Stufe warten. Alles kommt aus den Modulen selbst — die Übersicht erfindet nichts.</div>`);
    return;
  }
  const hb = e.target.closest('#hilfe-btn');
  if (hb) { document.querySelector('.flug:not(.weg):not(.schnell)') ? flugWeg(true) : hilfeZeigen(hb); return; }

  /* Navigation */
  const go = e.target.closest('[data-go]');
  if (go) {
    AKTIV = go.dataset.go;
    const ref = go.dataset.ref;
    if (ref) {
      if (AKTIV === 'verkauf' || AKTIV === 'zahlungen') DOK_OFFEN = ref;
      if (AKTIV === 'projekte') PROJEKT_OFFEN = ref;
      if (AKTIV === 'service') FALL_OFFEN = ref;
    }
    render(); return;
  }

  /* Kunden */
  const k = e.target.closest('[data-kunde]');
  if (k) { KUNDE_OFFEN = KUNDE_OFFEN === k.dataset.kunde ? null : k.dataset.kunde;
    if (AKTIV !== 'kunden') { AKTIV = 'kunden'; KUNDE_OFFEN = k.dataset.kunde; }
    KUNDE_TAB = 'stamm'; render(); return; }
  if (e.target.closest('[data-kundezu]')) { KUNDE_OFFEN = null; render(); return; }
  const kt = e.target.closest('[data-ktab]');
  if (kt) { KUNDE_TAB = kt.dataset.ktab; render(); return; }

  /* Projekte */
  const p = e.target.closest('[data-projekt]');
  if (p) { PROJEKT_OFFEN = p.dataset.projekt;
    if (AKTIV !== 'projekte') AKTIV = 'projekte';
    render(); return; }
  const pt = e.target.closest('[data-ptab]');
  if (pt) { PROJ_TAB = pt.dataset.ptab; render(); return; }

  /* Belege */
  const d = e.target.closest('[data-dok]');
  if (d) { DOK_OFFEN = DOK_OFFEN === d.dataset.dok ? null : d.dataset.dok;
    if (AKTIV !== 'verkauf' && AKTIV !== 'zahlungen') { AKTIV = 'verkauf'; DOK_OFFEN = d.dataset.dok; }
    render(); return; }
  if (e.target.closest('[data-dokzu]')) { DOK_OFFEN = null; render(); return; }
  if (e.target.closest('[data-vreset]')) { VERKAUF_TYP = ''; VERKAUF_STATUS = ''; render(); return; }

  /* Artikel und Lager */
  const ar = e.target.closest('[data-artikel]');
  if (ar) { ART_OFFEN = ART_OFFEN === ar.dataset.artikel ? null : ar.dataset.artikel; render(); return; }
  if (e.target.closest('[data-artzu]')) { ART_OFFEN = null; render(); return; }
  const la = e.target.closest('[data-lartikel]');
  if (la) { ART_OFFEN = ART_OFFEN === la.dataset.lartikel ? null : la.dataset.lartikel; render(); return; }
  const lk = e.target.closest('[data-lkat]');
  if (lk) { LAGER_KAT = lk.dataset.lkat; render(); return; }

  /* Import */
  const ik = e.target.closest('[data-ikat]');
  if (ik) { IMPORT_KAT = ik.dataset.ikat; render(); return; }

  /* Zeiten */
  const zw = e.target.closest('[data-zwahl]');
  if (zw) { const id = zw.dataset.zwahl;
    ZEIT_WAHL = ZEIT_WAHL.includes(id) ? ZEIT_WAHL.filter(x => x !== id) : [...ZEIT_WAHL, id];
    render(); return; }

  /* Service */
  const fl = e.target.closest('[data-fall]');
  if (fl) { FALL_OFFEN = fl.dataset.fall; render(); return; }
  const fs = e.target.closest('[data-fstatus]');
  if (fs) { const f = DB.faelle.find(x => x.id === (FALL_OFFEN || mFaelle()[0].id));
    f.status = fs.dataset.fstatus;
    f.verlauf.push({ datum:DB.heute, was:f.status, wer:wer(), notiz:'Status im Prototyp gesetzt' });
    protokoll(f.nr, 'Status geändert', `→ ${f.status}`);
    toast(`${esc(f.nr)} steht auf <b>${esc(f.status)}</b>. Der Schritt ist mit Datum und Person
      im Verlauf festgehalten.`, 1);
    render(); return; }
});

/* ── Tippen und Auswählen ───────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const f = e.target.closest?.('[data-zahl]');
  if (f && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const s = (+f.dataset.schritt || 1) * (e.shiftKey ? 10 : 1);
    const neuWert = zahl(f.value) + (e.key === 'ArrowUp' ? s : -s);
    const min = f.dataset.min === '' ? -Infinity : +f.dataset.min;
    const stellen = Math.max((String(f.value).split('.')[1] || '').length,
                             (String(f.dataset.schritt).split('.')[1] || '').length);
    f.value = Math.max(min, neuWert).toFixed(stellen);
    e.preventDefault();
    return;
  }
  if (e.key === 'Escape') { flugWeg(true); if (SUCHE_OFFEN) { SUCHE_OFFEN = false; renderTreffer(); } }
});

document.addEventListener('input', e => {
  if (e.target.id === 'sfeld') { SUCHE = e.target.value; SUCHE_OFFEN = SUCHE.trim().length >= 2;
    renderTreffer(); return; }
  const st = e.target.closest('[data-stichtag]');
  if (st) { DB.importlauf.stichtag = st.value; renderTippend(st); return; }
});

document.addEventListener('change', e => {
  if (e.target.id === 'rfeld') {
    ROLLE = e.target.value;
    const r = R();
    if (!mandantenSicht().includes(MANDANT) && MANDANT !== 'alle') MANDANT = mandantenSicht()[0];
    if (MANDANT === 'alle' && !gesamtsicht()) MANDANT = mandantenSicht()[0];
    if (!modulErlaubt(AKTIV)) AKTIV = MODULES.find(m => modulErlaubt(m.id)).id;
    DOK_OFFEN = null; KUNDE_OFFEN = null; ART_OFFEN = null;
    toast(`Rolle <b>${esc(r.name)}</b> (${esc(r.wer)}): ${esc(r.was)}.
      Sichtbar sind ${r.module === '*' ? 'alle Module' : r.module.length + ' Module'} und
      ${r.mandanten === '*' ? 'alle Mandanten' : r.mandanten.length + ' Mandant(en)'};
      ${darf('ek') ? 'EK und Marge sind sichtbar' : 'EK, Marge und interne Kostensätze sind gesperrt'}.`, 1);
    render(); return;
  }
  const vf = e.target.closest('[data-vf]');
  if (vf) { if (vf.dataset.vf === 'typ') VERKAUF_TYP = vf.value; else VERKAUF_STATUS = vf.value;
    DOK_OFFEN = null; render(); return; }
  const vd = e.target.closest('[data-vdok]');
  if (vd) { VERSAND_DOK = vd.value; render(); return; }
  const mp = e.target.closest('[data-map]');
  if (mp) { DB.importlauf.mapping[+mp.dataset.map].ziel = mp.value;
    toast('Spaltenzuordnung geändert. Sie lässt sich als Importprofil speichern und beim nächsten ' +
      'Lauf wiederverwenden.', 1);
    render(); return; }
});

document.addEventListener('focusin', e => {
  if (e.target.id === 'sfeld' && SUCHE.trim().length >= 2) { SUCHE_OFFEN = true; renderTreffer(); }
});

/* ── Start ───────────────────────────────────────────────────────────────── */
render();
archivStart();
</script>
</body>
</html>
