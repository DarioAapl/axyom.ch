/* ── Globale Suche (SEA-01…03) ───────────────────────────────────────────
   Ein Index über alles, und er hält sich an dieselben Rechte wie die Listen.
   Was eine Rolle nicht sehen darf, erscheint auch nicht als Treffer — und der
   Prototyp sagt offen, dass etwas zurückgehalten wurde. */
function suchen(q) {
  const s = q.trim().toLowerCase();
  if (s.length < 2) return null;
  const treffer = [], hat = t => t.toLowerCase().includes(s);
  let gesperrt = 0;
  DB.kunden.forEach(k => {
    const sichtbar = kundeMandanten(k.id).some(imBlick) && modulErlaubt('kunden');
    if (!(hat(k.name) || hat(k.nr) || hat(k.kurz) || (darf('notizen') && hat(k.notiz)))) return;
    if (!sichtbar) { gesperrt++; return; }
    treffer.push({ art:'Kunde', z1:k.name, z2:`Nr. ${k.nr} · ${k.standorte.length} Standorte · ` +
      `${kundeMandanten(k.id).map(m => M(m).name).join(', ')}`, go:'kunden', ref:k.id });
  });
  DB.kunden.forEach(k => k.standorte.forEach(st => {
    if (!hat(st.name)) return;
    if (!(kundeMandanten(k.id).some(imBlick) && modulErlaubt('kunden'))) { gesperrt++; return; }
    const a = adr(k.id, st.adresse);
    treffer.push({ art:'Standort', z1:st.name, z2:`${k.name} · ${a.zeile}, ${a.plz} ${a.ort}`,
      go:'kunden', ref:k.id });
  }));
  DB.kunden.forEach(k => k.kontakte.forEach(c => {
    if (!(hat(c.name) || hat(c.mail) || hat(c.funktion))) return;
    if (!darf('notizen') || !modulErlaubt('kunden')) { gesperrt++; return; }
    treffer.push({ art:'Kontakt', z1:c.name, z2:`${c.funktion} · ${k.name} · ${c.mail}`,
      go:'kunden', ref:k.id });
  }));
  DB.projekte.forEach(p => {
    if (!(hat(p.name) || hat(p.nr) || hat(p.kategorie))) return;
    if (!(imBlick(p.mandant) && projektErlaubt(p.id) && modulErlaubt('projekte'))) { gesperrt++; return; }
    treffer.push({ art:'Projekt', z1:`${p.nr} · ${p.name}`,
      z2:`${K(p.kunde).name} · ${p.status} · ${M(p.mandant).name}`, go:'projekte', ref:p.id });
  });
  DB.dokumente.forEach(d => {
    if (!(hat(d.nr) || hat(d.titel) || hat(K(d.kunde).name))) return;
    if (!(imBlick(d.mandant) && modulErlaubt('verkauf'))) { gesperrt++; return; }
    treffer.push({ art:TYP[d.typ], z1:`${d.nr} · ${d.titel}`,
      z2:`${K(d.kunde).name} · ${d.datum} · ${d.status} · ${chf(brutto(d))}`,
      go:'verkauf', ref:d.id });
  });
  DB.artikel.forEach(a => {
    if (!(hat(a.name) || hat(a.nr) || hat(a.hersteller))) return;
    if (!(imBlick(a.mandant) && modulErlaubt('produkte'))) { gesperrt++; return; }
    treffer.push({ art:'Artikel', z1:`${a.nr} · ${a.name}`,
      z2:`${a.hersteller} · Liste ${chf(a.liste)}${darf('ek') ? ` · EK ${chf(a.ek)}` : ''}`,
      go:'produkte', ref:a.id });
  });
  DB.faelle.forEach(f => {
    if (!(hat(f.nr) || hat(f.titel))) return;
    if (!(imBlick(f.mandant) && modulErlaubt('service'))) { gesperrt++; return; }
    treffer.push({ art:'Servicefall', z1:`${f.nr} · ${f.titel}`,
      z2:`${K(f.kunde).name} · ${f.status} · Frist ${f.frist}`, go:'service', ref:f.id });
  });
  return { treffer, gesperrt };
}

function renderTreffer() {
  const box = $('#streffer');
  if (!SUCHE_OFFEN) { box.innerHTML = ''; box.className = ''; return; }
  const e = suchen(SUCHE);
  if (!e) { box.innerHTML = ''; box.className = ''; return; }
  box.className = 'treffer';
  const gruppen = {};
  e.treffer.forEach(t => (gruppen[t.art] = gruppen[t.art] || []).push(t));
  box.innerHTML = (e.treffer.length
    ? Object.entries(gruppen).map(([art, liste]) =>
        `<div class="tgruppe">${esc(art)} · ${liste.length}</div>` +
        liste.slice(0, 6).map(t => `<button data-treffer="${t.go}" data-ref="${t.ref}">
          <div class="tz1">${esc(t.z1)}</div><div class="tz2">${esc(t.z2)}</div></button>`).join('')).join('')
    : '<div class="leer">Nichts gefunden.</div>')
    + (e.gesperrt ? `<div class="gesperrt">${e.gesperrt} weitere Treffer sind für die Rolle
        «${esc(R().name)}» gesperrt und werden nicht angezeigt — auch nicht als Vorschautext.
        <span class="aid">SEA-03</span></div>` : '');
}

/* ── Rendern ─────────────────────────────────────────────────────────────── */
const VIEWS = {};

function render() {
  if (!modulErlaubt(AKTIV)) AKTIV = MODULES.find(m => modulErlaubt(m.id)).id;
  const m = MODULES.find(x => x.id === AKTIV);
  $('#h-title').textContent = m.titel;
  $('#h-sub').textContent = m.sub;
  const y = window.scrollY;
  const seitlich = [...$('#view').querySelectorAll('.scrollx')].map(e => e.scrollLeft);
  $('#view').innerHTML = VIEWS[AKTIV]();
  tabellenEinpacken();
  renderRail();
  renderTreffer();
  if (ZULETZT !== AKTIV) { ZULETZT = AKTIV; window.scrollTo(0, 0); }
  else {
    window.scrollTo(0, y);
    [...$('#view').querySelectorAll('.scrollx')].forEach((e, i) => {
      if (seitlich[i]) e.scrollLeft = seitlich[i];
    });
  }
  handyNachziehen();
}

/* Tabellen bekommen zwei Hüllen: die innere rollt, die äussere steht still —
   der Kantenhinweis gehört an die stehende. */
function tabellenEinpacken() {
  $('#view').querySelectorAll('table').forEach(t => {
    if (t.parentElement.classList.contains('scrollx')) return;
    const box = document.createElement('div');
    box.className = 'scrollx';
    t.replaceWith(box);
    box.appendChild(t);
  });
  $('#view').querySelectorAll('.scrollx').forEach(box => {
    if (box.parentElement.classList.contains('scrollbox')) return;
    const rahmen = document.createElement('div');
    rahmen.className = 'scrollbox';
    box.replaceWith(rahmen);
    rahmen.appendChild(box);
  });
}

/* ── was nach jedem Rendern fürs Handy nachgezogen wird ──────────────────── */
function handyNachziehen() {
  document.querySelectorAll('#view input[type=number]').forEach(i => {
    i.dataset.schritt = i.getAttribute('step') || '1';
    i.dataset.min = i.getAttribute('min') ?? '';
    i.type = 'text';
    i.setAttribute('inputmode', 'decimal');
    i.setAttribute('enterkeyhint', 'done');
    i.setAttribute('autocomplete', 'off');
    i.dataset.zahl = '1';
  });
  document.querySelectorAll('#view textarea').forEach(t => {
    const passen = () => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; };
    passen();
    if (!t.dataset.waechst) { t.dataset.waechst = '1'; t.addEventListener('input', passen); }
  });
  document.querySelectorAll('.scrollx').forEach(el => {
    const rahmen = el.parentElement;
    const laeuft = el.scrollWidth - el.clientWidth > 4;
    rahmen.classList.toggle('kanns', laeuft);
    if (!laeuft) { rahmen.classList.remove('amEnde'); return; }
    const kante = () => rahmen.classList.toggle('amEnde',
      el.scrollLeft + el.clientWidth >= el.scrollWidth - 4);
    kante();
    if (!rahmen.querySelector('.weiter')) {
      const k = document.createElement('button');
      k.className = 'weiter'; k.type = 'button';
      k.setAttribute('aria-label', 'Tabelle weiter blättern');
      k.innerHTML = '&rsaquo;';
      k.addEventListener('click', ev => { ev.stopPropagation();
        el.scrollBy({ left: el.clientWidth * 0.8, behavior:'smooth' }); });
      rahmen.appendChild(k);
    }
    if (!el.dataset.kante) { el.dataset.kante = '1'; el.addEventListener('scroll', kante, { passive:true }); }
  });
  const an = document.querySelector('#rail a.on');
  if (an && document.querySelector('#rail').clientWidth > document.querySelector('#rail').clientHeight)
    an.scrollIntoView({ block:'nearest', inline:'center' });
}
addEventListener('resize', () => handyNachziehen());

/* ── der Fragen-Knopf tritt zur Seite ─────────────────────────────────────
   Er liegt fix über der unteren rechten Ecke — dort, wo in einer Tabelle die
   Zahlen stehen. Solange gerollt wird oder ein Feld den Fokus hat, ist er weg;
   kurz nach dem Loslassen ist er wieder da. */
let knopfTimer;
function knopfSchlafen(ja) {
  const k = document.getElementById('chatbtn');
  if (k) k.classList.toggle('schlaeft', ja);
}
addEventListener('scroll', () => {
  knopfSchlafen(true);
  clearTimeout(knopfTimer);
  knopfTimer = setTimeout(() => knopfSchlafen(false), 700);
}, { passive: true });
document.addEventListener('focusin', e => {
  if (e.target.closest('#view input, #view textarea, #view select')) knopfSchlafen(true);
});
document.addEventListener('focusout', e => {
  if (e.target.closest('#view input, #view textarea, #view select')) knopfSchlafen(false);
});

/* ── Rückmeldung ─────────────────────────────────────────────────────────── */
let toastTimer;
function toast(html, st) {
  const t = $('#toast'); t.innerHTML = html;
  t.classList.remove('s3', 's2', 's1');
  if (st) t.classList.add('s' + st);
  t.classList.add('show');
  const dauer = Math.min(11000, 2800 + t.textContent.length * 55);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), dauer);
}
document.addEventListener('click', e => {
  if (e.target.closest('#toast')) { $('#toast').classList.remove('show'); clearTimeout(toastTimer); }
});

/* Ein Protokolleintrag ist im Prototyp echt: er landet im Audit-Log, das das
   Modul Archiv zeigt. Nichts passiert hier unsichtbar. */
function protokoll(objekt, aktion, detail) {
  DB.audit.unshift({ datum:`${DB.heute} ${new Date().toLocaleTimeString('de-CH').slice(0, 5)}`,
    wer:R().wer.split(' ')[0], mandant:MANDANT === 'alle' ? '—' : MANDANT, objekt, aktion, detail });
}

/* ── Tippen, ohne dass das Feld unter dem Finger weggerechnet wird ───────── */
const TIPPFELDER = ['data-preis', 'data-menge', 'data-rabatt', 'data-bestand', 'data-mailtext',
                    'data-mailbetreff', 'data-notiz', 'data-sfeld'];
function renderTippend(el) {
  const attr = TIPPFELDER.find(a => el.hasAttribute(a));
  const sel = attr ? `[${attr}="${el.getAttribute(attr)}"]` : null;
  const pos = el.selectionStart, ende = el.selectionEnd;
  render();
  const neu = sel && $(sel);
  if (neu && neu !== el) {
    neu.replaceWith(el);
    el.focus();
    if (pos !== null) { try { el.setSelectionRange(pos, ende); } catch { /* egal */ } }
  }
}

/* ── ein Hinweis, der hereinfliegt und wieder geht ─────────────────────────
   Er hängt am <body>, nicht an der Ansicht: ein Neuzeichnen kann ihn nicht
   mitten im Lesen wegwischen. Am Telefon scrollt er und hat ein Kreuz.
   ────────────────────────────────────────────────────────────────────────── */
let flugTimer;
function flugWeg(sofort = false) {
  clearTimeout(flugTimer);
  document.querySelectorAll('.flug').forEach(f => {
    f.classList.add(sofort ? 'schnell' : 'weg');
    f.addEventListener('transitionend', () => f.remove(), { once: true });
  });
}
const tippgeraet = () => matchMedia('(hover:none)').matches;

function flugHinweis(anker, html, dauer = 6000, cls = '') {
  document.querySelectorAll('.flug').forEach(f => f.remove());
  clearTimeout(flugTimer);
  const f = document.createElement('div');
  f.className = 'flug ' + cls;
  f.innerHTML = '<button class="flugzu" aria-label="Hinweis schliessen">&times;</button>' + html;
  document.body.appendChild(f);
  const a = anker.getBoundingClientRect();
  const breite = Math.min(cls.includes('weit') ? 460 : 320, window.innerWidth - 24);
  f.style.width = breite + 'px';
  f.style.left = Math.max(12, Math.min(a.left - 12, window.innerWidth - breite - 12)) + 'px';
  const platz = window.innerHeight - 24;
  if (f.offsetHeight > platz) { f.style.maxHeight = platz + 'px'; f.style.top = '12px'; }
  else if (window.innerHeight - a.bottom > f.offsetHeight + 20) f.style.top = (a.bottom + 10) + 'px';
  else f.style.top = Math.max(12, Math.min(a.top - f.offsetHeight - 10,
    window.innerHeight - f.offsetHeight - 12)) + 'px';
  requestAnimationFrame(() => f.classList.add('da'));
  const starten = () => { clearTimeout(flugTimer); flugTimer = setTimeout(flugWeg, dauer); };
  const halten = () => clearTimeout(flugTimer);
  f.addEventListener('mouseenter', halten);
  f.addEventListener('mouseleave', starten);
  f.addEventListener('touchstart', halten, { passive:true });
  f.addEventListener('scroll', halten, { passive:true });
  f.querySelector('.flugzu').addEventListener('click', ev => { ev.stopPropagation(); flugWeg(true); });
  starten();
  return f;
}

function hilfeZeigen(anker) {
  const punkte = HILFE[AKTIV];
  if (!punkte) return;
  const m = MODULES.find(x => x.id === AKTIV);
  flugHinweis(anker,
    `<div class="fk">${esc(m.name)} — was dieser Bereich macht</div>
     <ol class="hilfeliste">${punkte.map(t => `<li>${t}</li>`).join('')}</ol>
     <div class="fu">Erklärt die Funktion, nicht die Beispieldaten · die IDs in Klammern sind die
       Anforderungen aus dem Grobkonzept ·
       ${tippgeraet() ? 'schliesst mit dem Kreuz oder von selbst, Antippen hält ihn'
                      : 'verschwindet von selbst, Maus darauf hält ihn'}</div>`,
    8000 + punkte.length * 2800, 'weit');
}

/* ── Kennzahlen eines Mandanten (DSH-01) ─────────────────────────────────── */
function kennzahlen(mid) {
  const dok = DB.dokumente.filter(d => !mid || d.mandant === mid);
  const rg = dok.filter(d => d.typ === 'RG' && d.status !== 'storniert');
  const gs = dok.filter(d => d.typ === 'GS');
  const umsatz = rg.reduce((s, d) => s + netto(d), 0) - gs.reduce((s, d) => s + netto(d), 0);
  const offeneRg = rg.filter(d => d.status === 'offen' || d.status === 'überfällig');
  const of = dok.filter(d => d.typ === 'OF');
  const versendet = of.filter(d => d.status === 'versendet' || d.status === 'angenommen'
    || d.status === 'abgelehnt');
  const angenommen = of.filter(d => d.status === 'angenommen');
  const projekte = DB.projekte.filter(p => (!mid || p.mandant === mid) && projektErlaubt(p.id));
  const zeiten = DB.zeiten.filter(t => projekte.some(p => p.id === t.projekt));
  const m = projekte.reduce((s, p) => { const x = marge(p.id); return {
    roh: s.roh + x.roh, umsatz: s.umsatz + x.umsatz, db: s.db + x.db }; }, { roh:0, umsatz:0, db:0 });
  return {
    umsatz, offen: offeneRg.reduce((s, d) => s + offenBetrag(d), 0),
    offenAnz: offeneRg.length,
    ueber: offeneRg.filter(d => d.status === 'überfällig').reduce((s, d) => s + offenBetrag(d), 0),
    ueberAnz: offeneRg.filter(d => d.status === 'überfällig').length,
    offerten: of.filter(d => d.status === 'versendet' || d.status === 'Entwurf')
      .reduce((s, d) => s + brutto(d), 0),
    offertenAnz: of.filter(d => d.status === 'versendet' || d.status === 'Entwurf').length,
    quote: versendet.length ? angenommen.length / versendet.length * 100 : 0,
    quoteText: `${angenommen.length} von ${versendet.length} entschiedenen Offerten`,
    marge: m.roh, margeQuote: m.umsatz ? m.roh / m.umsatz * 100 : 0, db: m.db,
    stunden: zeiten.reduce((s, t) => s + t.dauer, 0),
    stundenOffen: zeiten.filter(t => t.verrechenbar && !t.dok).reduce((s, t) => s + t.dauer, 0),
    faelle: DB.faelle.filter(f => (!mid || f.mandant === mid) && f.status !== 'erledigt').length,
    projekte: projekte.length,
  };
}

  if (PROJ_TAB === 'marge') {
    inhalt = darf('ek') ? `<div class="wf">
        ${zeile('Materialumsatz, fakturiert', chf(m.umsatz), 'aus den Rechnungspositionen mit Artikelbezug ' + aid('MAR-01'))}
        ${zeile('./. Einkauf, eingefroren zum Belegdatum', '− ' + chf(m.ek),
          'EK-Snapshot der Position, nicht heutiger EK ' + aid('ART-06','IMP-07'), 'ab')}
        ${zeile('Materialrohertrag', chf(m.roh), m.umsatz ? `${m.quote.toFixed(1)} % vom Materialumsatz` : '', 'summe')}
        ${zeile('+ Freie Positionen und Pauschalen', '+ ' + chf(m.frei), 'ohne Artikelbezug, ohne EK')}
        ${zeile('+ Verrechnete Planung und Arbeit', '+ ' + chf(m.verrechnet),
          `${zeiten.filter(t => t.verrechenbar).reduce((s, t) => s + t.dauer, 0).toFixed(1)} h zum Stundensatz ` + aid('MAR-02'))}
        ${zeile('./. Interne Zeitkosten', '− ' + chf(m.intern),
          `${m.stunden.toFixed(1)} h zum Kostensatz ` + aid('MAR-02'), 'ab')}
        ${zeile('Projektdeckungsbeitrag', chf(m.db), 'aus Einzelpositionen und Zeiten abgeleitet ' + aid('MAR-03'), 'summe')}
      </div>
      <div class="small muted" style="margin-top:12px;line-height:1.6;max-width:92ch">
        Jede Zeile ist nachrechenbar: die Positionen stehen im Beleg, die Stunden in der
        Zeiterfassung. Nichts hier ist geschätzt, und nichts ändert sich, wenn morgen eine neue
        Preisliste kommt — die Positionen tragen ihren eigenen EK. ${aid('MAR-01','MAR-03')}</div>`
      : `<div class="rsperre"><b>Marge ist für diese Rolle gesperrt</b>
        <div>EK, Rabattkonditionen, Margen und interne Kostensätze sind sensible Feldgruppen.
          Verbergen in der Oberfläche genügt nicht: dieselbe Prüfung gilt für Suche, Export,
          Download und Schnittstelle. ${aid('IAM-02','MAR-04')}</div></div>`;
  }
  if (PROJ_TAB === 'export') {
    const pdfs = dok.filter(d => d.final);
    inhalt = `<div class="card">
      <div class="wl"><span>Projektexport als ZIP ${aid('PRJ-04','EXP-03')}</span>
        <span class="r2">${esc(p.nr)}_${esc(K(p.kunde).kurz)}.zip</span></div>
      <div class="small muted" style="line-height:1.6;margin-bottom:12px;max-width:92ch">
        Das Archiv ist ohne diese Anwendung lesbar: Ordnerstruktur, Originaldateien, Beleg-PDFs,
        die Chronik als PDF und dieselben Daten maschinenlesbar als JSON und CSV.</div>
      <div class="wf">
        ${zeile('01_Belege/', `${pdfs.length} PDF`, pdfs.map(d => esc(d.nr)).join(', '))}
        ${zeile('02_Dateien/', `${dateien.length} Dateien`, 'Originale, jeweils neueste Version')}
        ${zeile('03_Dateien_Versionen/', `${dateien.filter(f => f.version > 1).length} älter`, 'frühere Fassungen')}
        ${zeile('04_Zeiten/', `${zeiten.length} Buchungen`, 'zeiten.csv')}
        ${zeile('05_Service/', `${faelle.length} Fälle`, 'mit Statushistorie')}
        ${zeile('Chronik.pdf', `${dok.length + zeiten.length + dateien.length} Einträge`, 'lesbar für Menschen')}
        ${zeile('projekt.json', 'Metadaten', 'Kunde, Adressen, Beträge, Beziehungen')}
        ${zeile('pruefsummen.txt', `${pdfs.length} SHA-256`, 'je finale Datei ' + aid('ARC-02'), 'summe')}
      </div>
      <div class="row" style="margin-top:14px">
        ${darf('exportieren')
          ? `<button class="btn acc" data-act="zip-export" data-id="${p.id}">ZIP erzeugen</button>`
          : gesperrt('Export ist für «' + R().name + '» gesperrt', 'IAM-01')}
        <span class="small muted">Im Prototyp wird die Liste erzeugt, keine Datei — hier läuft
          kein Server.</span></div></div>`;
  }

  return `${wahl}${kopf}
    <div class="tabs">${tabs.map(([id, t]) =>
      `<button class="tab ${PROJ_TAB === id ? 'on' : ''}" data-ptab="${id}">${t}</button>`).join('')}</div>
    ${inhalt}`;
};
/* ── Verkauf, Produkte, Preisimport ─────────────────────────────────────────
   Hier steckt der Kern des Konzepts: die Belegkette ohne Neueingabe, die
   eingefrorenen Snapshots und der Import, der Preise fortschreibt, ohne
   Geschichte zu überschreiben.
   ────────────────────────────────────────────────────────────────────────── */

const STATUSFARBE = s => ['überfällig','storniert','abgelehnt'].includes(s) ? 't-bad'
  : ['bezahlt','angenommen','verbucht','geliefert'].includes(s) ? 't-ok'
  : s === 'Entwurf' ? 't-mute' : 't-warn';

/* Der Text, aus dem die Prüfsumme gerechnet wird — die eingefrorene Fassung
   des Belegs. ARC-01/ARC-05: Nummer, Datum, Adresssnapshot, Positionen,
   Summen. Ändert sich daran ein Zeichen, stimmt die Prüfsumme nicht mehr. */
function dokText(d) {
  return [
    `${TYP[d.typ]} ${d.nr}`, `Mandant: ${M(d.mandant).lang}, ${M(d.mandant).uid}`,
    `Datum: ${d.datum}`, `Kunde: ${K(d.kunde).name} (Nr. ${K(d.kunde).nr})`,
    `Adressiert an: ${d.adresseName}`,
    (a => `${a.zeile}, ${a.plz} ${a.ort}`)(adr(d.kunde, d.adresse)),
    ...d.pos.map(p => `${p.nr}|${p.text}|${p.menge} ${p.einheit}|${p.preis.toFixed(2)}|` +
      `${(p.rabatt || 0)}%|MWST ${p.mwst}|EK ${(p.ekSnap || 0).toFixed(2)}`),
    d.abzug ? `Abzug: ${d.abzug.was} ${d.abzug.betrag.toFixed(2)}` : '',
    `Netto: ${netto(d).toFixed(2)}`, `MWST: ${mwstAuf(d).toFixed(2)}`,
    `Total: ${brutto(d).toFixed(2)}`,
  ].filter(Boolean).join('\n');
}

/* ── Verkaufsdokumente ───────────────────────────────────────────────────── */
VIEWS.verkauf = () => {
  let liste = mDok();
  if (VERKAUF_TYP) liste = liste.filter(d => d.typ === VERKAUF_TYP);
  if (VERKAUF_STATUS) liste = liste.filter(d => d.status === VERKAUF_STATUS);
  liste = [...liste].sort((a, b) => dz(b.datum) - dz(a.datum));
  const statusliste = [...new Set(mDok().map(d => d.status))];

  const filter = `<div class="rfilterbar">
    <label class="rfilter ${VERKAUF_TYP ? 'an' : ''}"><span>Belegtyp</span>
      <select data-vf="typ"><option value="">Alle Typen</option>
        ${Object.entries(TYP).map(([k, v]) =>
          `<option value="${k}" ${VERKAUF_TYP === k ? 'selected' : ''}>${v}</option>`).join('')}
      </select></label>
    <label class="rfilter ${VERKAUF_STATUS ? 'an' : ''}"><span>Status</span>
      <select data-vf="status"><option value="">Alle Status</option>
        ${statusliste.map(s => `<option value="${s}" ${VERKAUF_STATUS === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select></label>
    ${(VERKAUF_TYP || VERKAUF_STATUS)
      ? '<button class="btn" data-vreset="1" style="align-self:flex-end">Filter zurücksetzen</button>' : ''}
    <div style="margin-left:auto;align-self:flex-end" class="small muted">
      ${liste.length} Belege · ${chf(liste.filter(d => d.typ === 'RG' && d.status !== 'storniert')
        .reduce((s, d) => s + brutto(d), 0))} fakturiert ${aid('DOC-08')}</div></div>`;

  const zeilen = liste.map(d => `
    <tr class="click ${DOK_OFFEN === d.id ? 'gewaehlt' : ''}" data-dok="${d.id}">
      <td><b>${esc(d.nr)}</b><div class="small muted">${esc(TYPKURZ[d.typ])}${d.art ? ' · ' + esc(d.art) : ''}</div></td>
      <td class="num">${esc(d.datum)}</td>
      <td>${esc(K(d.kunde).name)}<div class="small muted">${esc(d.adresseName)}</div></td>
      <td>${d.projekt ? esc(P(d.projekt).nr) : '<span class="muted">—</span>'}</td>
      <td><span class="tag ${STATUSFARBE(d.status)}">${esc(d.status)}</span>
        ${d.final ? '' : ' <span class="tag t-mute">nicht final</span>'}</td>
      <td class="r num">${d.ohnePreise ? '<span class="muted">ohne Preise</span>' : chf(netto(d))}</td>
      <td class="r num" style="font-weight:650">${d.ohnePreise ? '—' : chf(brutto(d))}</td>
      <td class="r num">${d.typ === 'RG' && d.status !== 'storniert' && offenBetrag(d) > 0.005
        ? `<span style="color:var(--warn);font-weight:650">${chf(offenBetrag(d))}</span>` : '—'}</td>
    </tr>` + (DOK_OFFEN === d.id ? dokDetail(d) : '')).join('');

  const kreise = `<div class="card tint" style="margin-top:18px">
    <div class="wl"><span>Nummernkreise ${aid('DOC-05','MAN-03')}</span>
      <span class="r2">${esc(M().lang)}</span></div>
    <div class="row" style="gap:18px">
      ${Object.entries(M().kreise).map(([t, n]) => `<div>
        <div class="small muted">${esc(TYP[t])}</div>
        <div style="font-weight:650;font-variant-numeric:tabular-nums">
          ${t}-26-${String(n).padStart(4, '0')}</div>
        <div class="small muted">nächste: ${String(n + 1).padStart(4, '0')}</div></div>`).join('')}
    </div>
    <div class="small muted" style="margin-top:11px;line-height:1.6;max-width:92ch">
      Je Mandant und Belegtyp ein eigener, fortlaufender Kreis. Eine stornierte Nummer wird nicht
      wiederverwendet: die Lücke ist das Beweisstück, nicht der Fehler.</div></div>`;

  return `${filter}
    <div class="sec">Belegkette und Status ${aid('DOC-01','DOC-08')}
      <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">
        · eine Zeile öffnet den Beleg, wie er hinausgegangen ist</span></div>
    <div class="scrollx"><table><thead><tr><th>Beleg</th><th>Datum</th><th>Kunde</th><th>Projekt</th>
      <th>Status</th><th class="r">Netto</th><th class="r">Total</th><th class="r">Offen</th>
      </tr></thead><tbody>${zeilen}</tbody></table></div>
    ${kreise}`;
};

/* die Belegkette eines Projekts (DOC-01…04) */
function kette(d) {
  if (!d.projekt) return '';
  const im = DB.dokumente.filter(x => x.projekt === d.projekt);
  const glied = (typ, titel) => {
    const treffer = im.filter(x => x.typ === typ);
    if (!treffer.length) return `<div class="kglied offen"><div class="kt">${titel}</div>
      <div class="knr2 muted">—</div><div class="ks">noch nicht erstellt</div></div>`;
    return treffer.map(x => `<div class="kglied ${x.id === d.id ? 'fertig' : ''}"
      data-dok="${x.id}" style="cursor:pointer">
      <div class="kt">${titel}</div><div class="knr2">${esc(x.nr)}</div>
      <div class="ks">${esc(x.datum)} · ${esc(x.status)}${x.art ? ' · ' + esc(x.art) : ''}</div></div>`).join('');
  };
  const pf = '<div class="kpfeil">→</div>';
  return `<div class="kette">${glied('OF','Offerte')}${pf}${glied('AB','Auftrag')}${pf}
    ${glied('LS','Lieferschein')}${pf}${glied('RG','Rechnung')}
    ${im.some(x => x.typ === 'GS') ? pf + glied('GS','Gutschrift') : ''}</div>`;
}

function dokDetail(d) {
  const m = M(d.mandant), k = K(d.kunde), a = adr(d.kunde, d.adresse), c = kontakt(d.kunde, d.kontakt);
  const stellen = { OF:'Gültig 30 Tage', AB:'Verbindliche Bestätigung', LS:'Lieferschein',
                    RG:`Zahlbar bis ${d.faellig || '—'}`, GS:'Gutschrift' }[d.typ];

  /* Positionen mit Snapshot — und dem Hinweis, wenn der Artikel heute anders kostet */
  const zeilen = d.pos.map(p => {
    const art = p.art ? A(p.art) : null;
    const anders = art && Math.abs(art.liste - p.preis) > 0.005;
    return `<tr class="${anders ? 'rdwarn' : ''}">
      <td>${p.nr}</td>
      <td>${esc(p.text)}${art ? `<div style="color:var(--dim);font-size:10.5px">
          ${esc(art.nr)} · ${esc(art.hersteller)}</div>` : ''}
        ${anders ? `<div class="rdklein">Artikel heute ${chf(art.liste)} (gültig ab
          ${esc(art.versionen[art.versionen.length - 1].ab)}) — der Beleg behält
          ${chf(p.preis)}</div>` : ''}
        ${p.notiz ? `<div style="color:var(--dim);font-size:10.5px">${esc(p.notiz)}</div>` : ''}</td>
      <td class="r">${p.menge} ${esc(p.einheit)}</td>
      ${d.ohnePreise ? '' : `<td class="r">${chf(p.preis)}</td>
      <td class="r">${p.rabatt ? p.rabatt + ' %' : '—'}</td>
      <td class="r">${chf(posNetto(p))}</td>`}</tr>`;
  }).join('');

  const summen = d.ohnePreise ? '' : `<div class="rdsumme">
    ${d.abzug ? `<div><span>Zwischentotal</span><span>${chf(d.pos.reduce((s, p) => s + posNetto(p), 0))}</span></div>
      <div><span>./. ${esc(d.abzug.was)}</span><span>− ${chf(d.abzug.betrag)}</span></div>` : ''}
    <div><span>Netto</span><span>${chf(netto(d))}</span></div>
    <div><span>MWST 8.1 %</span><span>${chf(mwstAuf(d))}</span></div>
    <div class="tot"><b>Total CHF</b><b>${chf(brutto(d)).replace('CHF ', '')}</b></div>
    ${bezahlt(d) ? `<div><span>bezahlt</span><span>− ${chf(bezahlt(d))}</span></div>
      <div class="tot"><b>Offen</b><b>${chf(offenBetrag(d)).replace('CHF ', '')}</b></div>` : ''}</div>`;

  const dokument = `<div class="rdoc">
    <div class="rdkopf">
      <div><b>${esc(m.lang)}</b><br>${esc(m.ort)}<br>
        <span style="color:var(--dim)">${esc(m.uid)}</span></div>
      <div class="rdmeta">
        <div><span>${esc(TYP[d.typ])}</span><b>${esc(d.nr)}</b></div>
        <div><span>Datum</span>${esc(d.datum)}</div>
        ${d.projekt ? `<div><span>Projekt</span>${esc(P(d.projekt).nr)}</div>` : ''}
        <div><span>Kunde</span>${esc(k.nr)}</div>
        ${d.zahlungsziel ? `<div><span>Zahlungsziel</span>${d.zahlungsziel} Tage</div>` : ''}</div></div>
    <div class="rdan"><b>${esc(d.adresseName)}</b><br>${esc(c.anrede)} ${esc(c.name)}<br>
      ${esc(a.zeile)}<br>${esc(a.plz)} ${esc(a.ort)}</div>
    <div style="font-weight:650;margin-bottom:10px">${esc(d.titel)}</div>
    <table class="rdtab"><thead><tr><th style="width:26px">Pos</th><th>Bezeichnung</th>
      <th class="r">Menge</th>${d.ohnePreise ? '' :
      '<th class="r">Preis</th><th class="r">Rabatt</th><th class="r">Betrag</th>'}</tr></thead>
      <tbody>${zeilen}</tbody></table>
    ${summen}
    <div class="rdfuss">${esc(stellen)} · ${esc(m.iban)} · ${esc(m.absender)}<br>
      Layout: ${esc(m.layout)} ${aid('DOC-09','MAN-02')}
      ${d.typ === 'RG' ? '<br>QR-Zahlteil: im Detailkonzept festzulegen (DOC-10)' : ''}</div></div>`;

  /* die rechte Spalte: was das System dazu weiss und was jetzt möglich ist */
  const naechste = [];
  if (!d.final && darf('finalisieren'))
    naechste.push(`<button class="btn acc" data-act="finalisieren" data-id="${d.id}">
      Finalisieren ${aid('ARC-01')}</button>`);
  if (d.typ === 'OF' && d.final && d.status === 'versendet' && darf('finalisieren'))
    naechste.push(`<button class="btn" data-act="of-angenommen" data-id="${d.id}">Als angenommen markieren</button>`);
  if (d.typ === 'OF' && d.status === 'angenommen' && darf('finalisieren')
      && !DB.dokumente.some(x => x.vorgaenger === d.id && x.typ === 'AB'))
    naechste.push(`<button class="btn acc" data-act="wandeln" data-id="${d.id}" data-ziel="AB">
      In Auftragsbestätigung ${aid('DOC-01')}</button>`);
  if (d.typ === 'AB' && darf('finalisieren')) {
    naechste.push(`<button class="btn" data-act="wandeln" data-id="${d.id}" data-ziel="LS">
      Lieferschein für offene Mengen ${aid('DOC-03')}</button>`);
    naechste.push(`<button class="btn" data-act="wandeln" data-id="${d.id}" data-ziel="RG">
      Rechnung, Akonto verrechnet ${aid('DOC-04')}</button>`);
  }
  if (d.typ === 'RG' && d.final && d.status !== 'storniert' && offenBetrag(d) > 0.005)
    naechste.push(`<button class="btn" data-go="zahlungen" data-ref="${d.id}">Zahlung erfassen ${aid('PAY-01')}</button>`);
  if (d.typ === 'RG' && d.final && d.status !== 'storniert' && darf('finalisieren'))
    naechste.push(`<button class="btn" data-act="storno" data-id="${d.id}">
      Stornieren über Gutschrift ${aid('ARC-04','DOC-06')}</button>`);
  if (darf('versenden'))
    naechste.push(`<button class="btn" data-act="zum-versand" data-id="${d.id}">Versenden ${aid('SND-01')}</button>`);

  const pruef = `<div class="rdpruef">
    <div class="card" style="margin-bottom:12px">
      <div class="wl"><span>Was das System dazu weiss</span></div>
      <div class="pz"><span class="pj">✓</span><div>Adresse und Kontakt sind als Snapshot
        gespeichert. Ein Umzug des Kunden ändert diesen Beleg nicht. ${aid('CRM-06','ARC-05')}</div></div>
      <div class="pz"><span class="pj">✓</span><div>Jede Position trägt Preis, Rabatt, MWST-Satz
        ${darf('ek') ? 'und Einkaufspreis ' : ''}von damals. ${aid('ART-06')}</div></div>
      ${d.final ? `<div class="pz"><span class="pj">✓</span><div>Finalisiert am ${esc(d.finalAm)}
        von ${esc(d.finalVon)} · Nummer aus dem Kreis ${d.typ} des Mandanten
        ${esc(M(d.mandant).name)}. ${aid('DOC-05')}</div></div>` :
        `<div class="pz"><span class="pj" style="color:var(--warn)">•</span><div>Noch Entwurf:
          keine Nummer aus dem Kreis, keine Prüfsumme, kein Versand.</div></div>`}
      ${d.storniertAm ? `<div class="pz"><span class="pj" style="color:var(--bad)">✕</span>
        <div>Storniert am ${esc(d.storniertAm)} über ${esc(d.storniertDurch)}. Das PDF bleibt
          unverändert erhalten. ${aid('ARC-04')}</div></div>` : ''}
      ${d.ersetzt ? `<div class="pz"><span class="pj">✓</span><div>Ersetzt
        ${esc(D(d.ersetzt).nr)}, das storniert wurde.</div></div>` : ''}
      ${d.nachfassAm ? `<div class="pz"><span class="pj">◔</span><div>Follow-up automatisch auf
        ${esc(d.nachfassAm)} gesetzt, beim Versand. ${aid('ACT-03')}</div></div>` : ''}
      ${d.vorgaenger ? `<div class="pz"><span class="pj">↳</span><div>Übernommen aus
        <span class="link" data-dok="${d.vorgaenger}">${esc(D(d.vorgaenger).nr)}</span> —
        ohne Neueingabe. ${aid('DOC-01')}</div></div>` : ''}
    </div>
    ${d.final ? `<div class="card" style="margin-bottom:12px">
      <div class="wl"><span>Archiv und Prüfsumme ${aid('ARC-01','ARC-02')}</span></div>
      <div class="small muted" style="margin-bottom:6px">SHA-256 über die eingefrorene Fassung,
        im Browser gerechnet:</div>
      <div class="hash">${esc(d.hash || '… wird berechnet')}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn" data-act="hash-pruefen" data-id="${d.id}">Integrität prüfen</button>
        <button class="btn demo" data-act="hash-manipulieren" data-id="${d.id}">
          Demo: Datei verändern</button></div>
      ${d.manipuliert ? `<div class="small" style="color:var(--bad);margin-top:8px">
        Die archivierte Fassung wurde für die Vorführung verändert. Prüfen Sie jetzt die
        Integrität. <span class="link" data-act="hash-zuruecksetzen" data-id="${d.id}">zurücksetzen</span></div>` : ''}
    </div>` : ''}
    <div class="card">
      <div class="wl"><span>Was jetzt möglich ist</span></div>
      ${naechste.length ? `<div class="row" style="gap:7px">${naechste.join('')}</div>`
        : `<div>${gesperrt('Für «' + R().name + '» gibt es hier keine Aktion', 'IAM-01')}</div>`}
    </div></div>`;

  return `<tr class="detailzeile"><td colspan="8">
    <div class="detailkopf"><span class="dpfeil">↳</span><b>${esc(d.nr)}</b>
      <span class="muted">${esc(TYP[d.typ])} · ${esc(d.titel)}</span>
      <button class="btn" data-dokzu="1" style="margin-left:auto">Schliessen</button></div>
    ${d.projekt ? `<div style="padding:0 16px">${kette(d)}</div>` : ''}
    <div class="dokzeile">${dokument}${pruef}</div></td></tr>`;
}

/* ── Produkte (ART-01…06, IMP-06) ────────────────────────────────────────── */
VIEWS.produkte = () => {
  const liste = mArtikel();
  const zeilen = liste.map(x => {
    const rab = DB.rabatte.find(r => (r.art === 'Hersteller' && r.ziel === x.hersteller)
      || (r.art === 'Lieferant' && r.ziel === x.lieferant));
    return `<tr class="click ${ART_OFFEN === x.id ? 'gewaehlt' : ''}" data-artikel="${x.id}">
      <td><b>${esc(x.nr)}</b><div class="small muted">${esc(x.kategorie)}</div></td>
      <td>${esc(x.name)}${x.anhang.length ? `<div class="small muted">${x.anhang.length} Anhänge
        ${aid('ART-01')}</div>` : ''}</td>
      <td>${esc(x.hersteller)}<div class="small muted">${esc(x.lieferant)}</div></td>
      <td class="num">${esc(x.einheit)}</td>
      <td class="r num">${chf(x.liste)}</td>
      <td class="r num">${darf('ek') ? chf(x.ek) : gesperrt('EK', 'IAM-02')}</td>
      <td class="r num">${darf('ek') ? (rab ? rab.wert + ' %' : '—') : ''}</td>
      <td class="r num">${x.mwst} %</td>
      <td class="r num">${x.versionen.length}</td>
      </tr>` + (ART_OFFEN === x.id ? artikelDetail(x) : '');
  }).join('');

  return `<div class="sec">Artikel und Leistungen ${aid('ART-01','ART-02')}
      <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">
        · ${liste.length} im Mandanten ${esc(MANDANT === 'alle' ? 'aller Mandanten' : M().name)}</span></div>
    <div class="scrollx"><table><thead><tr><th>Nummer</th><th>Bezeichnung</th><th>Hersteller</th>
      <th>Einheit</th><th class="r">Liste</th><th class="r">EK</th><th class="r">Rabatt</th>
      <th class="r">MWST</th><th class="r">Preisversionen</th></tr></thead><tbody>${zeilen}</tbody></table></div>
    <div class="sec" style="margin-top:22px">Rabattregeln ${aid('ART-03')}</div>
    ${darf('ek') ? `<div class="scrollx"><table><thead><tr><th>Art</th><th>Ziel</th>
      <th class="r">Rabatt</th><th>Gültig</th><th class="r">Vorrang</th><th>Notiz</th>
      </tr></thead><tbody>
      ${DB.rabatte.map(r => `<tr><td><span class="tag t-mute">${esc(r.art)}</span></td>
        <td>${esc(r.art === 'Kunde' ? K(r.ziel).name : r.ziel)}</td>
        <td class="r num">${r.wert} %</td><td class="num">${esc(r.ab)} – ${esc(r.bis)}</td>
        <td class="r num">${r.prio}</td><td class="small muted">${esc(r.notiz)}</td></tr>`).join('')}
      </tbody></table></div>`
    : `<div class="rsperre"><b>Rabattkonditionen sind gesperrt</b>
        <div>Für «${esc(R().name)}» sind EK und Rabattkonditionen nicht sichtbar — auch nicht
          über Suche oder Export. ${aid('IAM-02')}</div></div>`}`;
};

function artikelDetail(x) {
  /* wo der Artikel verwendet wird, und mit welchem eingefrorenen Preis */
  const verwendet = [];
  DB.dokumente.forEach(d => d.pos.forEach(p => {
    if (p.art === x.id) verwendet.push({ d, p });
  }));
  return `<tr class="detailzeile"><td colspan="9">
    <div class="detailkopf"><span class="dpfeil">↳</span><b>${esc(x.nr)}</b>
      <span class="muted">${esc(x.name)}</span>
      <button class="btn" data-artzu="1" style="margin-left:auto">Schliessen</button></div>
    <div class="grid g2" style="gap:14px;padding:0 16px">
      <div class="card tint">
        <div class="wl"><span>Preishistorie ${aid('IMP-06')}</span>
          <span class="r2">${x.versionen.length} Versionen</span></div>
        <div class="wf" style="border:none">
          ${[...x.versionen].reverse().map((v, i) => zeile(
            `Gültig ab ${esc(v.ab)}${i === 0 ? ' <span class="tag t-ok">aktuell</span>' : ''}`,
            chf(v.liste),
            darf('ek') ? `EK ${chf(v.ek)}` : '', i === 0 ? 'summe' : '')).join('')}
        </div>
        <div class="small muted" style="margin-top:10px;line-height:1.6">Jede Version hat ihr
          Gültig-ab-Datum. Ein Import legt eine neue Version an und überschreibt keine alte.</div></div>
      <div class="card tint">
        <div class="wl"><span>Verwendet in Belegen ${aid('IMP-07')}</span>
          <span class="r2">${verwendet.length} Positionen</span></div>
        ${verwendet.length ? `<div class="wf" style="border:none">
          ${verwendet.map(({ d, p }) => zeile(
            `<span class="link" data-dok="${d.id}">${esc(d.nr)}</span> · ${esc(d.datum)} ·
             Pos. ${p.nr} · ${p.menge} ${esc(p.einheit)}`,
            chf(p.preis),
            Math.abs(p.preis - x.liste) > 0.005 ? `heute ${chf(x.liste)}` : 'wie heute')).join('')}
          </div>
          <div class="small muted" style="margin-top:10px;line-height:1.6">Diese Positionen bleiben
            unverändert, was auch immer die nächste Preisliste bringt. Das ist der Grund, warum
            eine Rechnung von damals heute noch nachrechenbar ist.</div>`
          : '<div class="small muted">Noch in keinem Beleg verwendet.</div>'}</div>
    </div>
    ${x.anhang.length ? `<div style="padding:12px 16px 0">
      <div class="small muted">Anhänge ${aid('ART-01')}</div>
      <div class="row" style="gap:6px;margin-top:5px">${x.anhang.map(a =>
        `<span class="chip">${esc(a)}</span>`).join('')}</div></div>` : ''}
    </td></tr>`;
}

/* ── Preislistenimport (IMP-01…08) ───────────────────────────────────────── */
VIEWS.import = () => {
  const i = DB.importlauf;
  const kat = [
    { id:'neu', l:'neu', n:i.analyse.neu, cls:'neu' },
    { id:'geaendert', l:'geändert', n:i.analyse.geaendert, cls:'geaendert' },
    { id:'unveraendert', l:'unverändert', n:i.analyse.unveraendert, cls:'' },
    { id:'entfallen', l:'nicht mehr enthalten', n:i.analyse.entfallen, cls:'' },
    { id:'fehler', l:'fehlerhaft', n:i.analyse.fehler, cls:'fehler' },
  ];

  const probe = () => {
    const p = i.proben;
    if (IMPORT_KAT === 'neu') return tab(['Artikelnummer','Bezeichnung','Liste neu','EK neu'],
      p.neu.map(r => [r.nr, r.text, chf(r.neuListe), darf('ek') ? chf(r.neuEk) : '—']));
    if (IMPORT_KAT === 'geaendert') return tab(
      ['Artikelnummer','Bezeichnung','Liste alt','Liste neu','Differenz','EK alt','EK neu'],
      p.geaendert.map(r => [r.nr, r.text, chf(r.altListe), chf(r.neuListe),
        pct((r.neuListe / r.altListe - 1) * 100),
        darf('ek') ? chf(r.altEk) : '—', darf('ek') ? chf(r.neuEk) : '—']));
    if (IMPORT_KAT === 'entfallen') return tab(['Artikelnummer','Bezeichnung','Liste bisher'],
      p.entfallen.map(r => [r.nr, r.text, chf(r.altListe)]));
    if (IMPORT_KAT === 'fehler') return tab(['Zeile','Artikelnummer','Bezeichnung','Problem'],
      p.fehler.map(r => [r.zeile, r.nr, r.text, r.problem]));
    return `<div class="small muted" style="padding:14px 2px">${i.analyse.unveraendert} Zeilen
      stimmen mit dem bestehenden Stand überein. Sie werden nicht angefasst und erzeugen keine
      neue Preisversion.</div>`;
  };
  const tab = (kopf, rows) => `<div class="scrollx"><table><thead><tr>
    ${kopf.map((h, n) => `<th class="${n > 1 ? 'r' : ''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr>${r.map((c, n) => `<td class="${n > 1 ? 'r num' : ''}">${
      n === 0 ? `<b>${esc(c)}</b>` : esc(c)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;

  /* Was bleibt, wenn der Import läuft: die Belege mit ihren Snapshots */
  const betroffen = [];
  i.proben.geaendert.forEach(r => {
    const art = DB.artikel.find(a => a.nr === r.nr);
    if (!art) return;
    DB.dokumente.forEach(d => d.pos.forEach(p => {
      if (p.art === art.id) betroffen.push({ d, p, art, neu:r.neuListe });
    }));
  });

  return `<div class="grid g2" style="gap:14px;margin-bottom:18px">
    <div class="card">
      <div class="wl"><span>Importlauf ${aid('IMP-01','IMP-05')}</span>
        <span class="r2">${esc(i.status)}</span></div>
      <div class="wf" style="border:none">
        ${zeile('Quelldatei', esc(i.datei), esc(i.zeichensatz))}
        ${zeile('Hersteller', esc(i.hersteller))}
        ${zeile('Hochgeladen', esc(i.hochgeladen), 'von ' + esc(i.wer))}
        ${zeile('Importprofil', esc(i.profil), 'wiederverwendbar ' + aid('IMP-03'))}
        ${zeile('Zeilen in der Datei', String(i.zeilen))}
        ${zeile('Stichtag', `<input type="text" data-stichtag="1" value="${esc(i.stichtag)}"
          style="width:110px;text-align:right">`, 'Gültig-ab der neuen Versionen ' + aid('IMP-06'))}
      </div></div>
    <div class="card">
      <div class="wl"><span>Spaltenzuordnung ${aid('IMP-02')}</span>
        <span class="r2">${esc(i.profil)}</span></div>
      <div class="mapping">
        ${i.mapping.map((m, n) => `<div class="mq">${esc(m.quelle)}</div>
          <div class="mp">→</div>
          <select data-map="${n}">
            ${['Artikelnummer','Text','Listenpreis','Einkaufspreis','Verkaufspreis','Rabattbasis',
               'Einheit','Gültig-ab-Datum','— nicht übernehmen'].map(z =>
              `<option ${m.ziel === z ? 'selected' : ''}>${z}</option>`).join('')}
          </select>`).join('')}
      </div></div></div>

    <div class="sec">Änderungsanalyse ${aid('IMP-04')}</div>
    <div class="ianalyse">${kat.map(c => `<div class="ik ${c.cls} ${IMPORT_KAT === c.id ? 'on' : ''}"
      data-ikat="${c.id}"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join('')}</div>
    ${probe()}

    ${IMPORT_ANGEWENDET ? `
      <div class="card good" style="margin-top:18px">
        <div class="wl"><span>Import angewendet ${aid('IMP-05','IMP-06')}</span>
          <span class="r2">Stichtag ${esc(i.stichtag)}</span></div>
        <div class="small" style="line-height:1.6;max-width:92ch">
          ${i.analyse.neu} Artikel neu angelegt, ${i.analyse.geaendert} Artikel haben eine neue
          Preisversion mit Gültig-ab ${esc(i.stichtag)}. Keine alte Version wurde überschrieben,
          kein Beleg verändert. Der Lauf steht im Protokoll.</div>
        <div class="row" style="margin-top:12px">
          <button class="btn" data-act="import-zurueck">Lauf zurücknehmen ${aid('IMP-08')}</button>
          <span class="small muted">möglich, solange keine neue Offerte damit gerechnet hat</span></div></div>`
      : `<div class="card" style="margin-top:18px">
        <div class="wl"><span>Bestätigen ${aid('IMP-05')}</span></div>
        <div class="small muted" style="line-height:1.6;max-width:92ch;margin-bottom:12px">
          Erst mit der Bestätigung werden Preisversionen geschrieben. Die ${i.analyse.fehler}
          fehlerhaften Zeilen werden dabei übersprungen und bleiben im Bericht stehen.</div>
        <div class="row">
          ${darf('admin') || ROLLE === 'mitarbeiter'
            ? `<button class="btn acc" data-act="import-anwenden">
                Import mit Stichtag ${esc(i.stichtag)} anwenden</button>`
            : gesperrt('Import ist für «' + R().name + '» gesperrt', 'IAM-01')}
          <button class="btn" data-act="import-bericht">Validierungsbericht ansehen</button></div></div>`}

    <div class="sec" style="margin-top:22px">Was mit bestehenden Belegen passiert ${aid('IMP-07')}</div>
    <div class="scrollx"><table><thead><tr><th>Beleg</th><th>Position</th><th class="r">Preis im Beleg</th>
      <th class="r">Neue Preisliste</th><th>Wirkung auf den Beleg</th></tr></thead><tbody>
      ${betroffen.map(b => `<tr><td><b><span class="link" data-dok="${b.d.id}">${esc(b.d.nr)}</span></b>
        <div class="small muted">${esc(b.d.datum)} · ${esc(b.d.status)}</div></td>
        <td>${esc(b.p.text)}<div class="small muted">${esc(b.art.nr)}</div></td>
        <td class="r num" style="font-weight:650">${chf(b.p.preis)}</td>
        <td class="r num muted">${chf(b.neu)}</td>
        <td><span class="tag t-ok">keine</span> <span class="small muted">Snapshot bleibt</span></td>
        </tr>`).join('')}
      </tbody></table></div>
    <div class="small muted" style="margin-top:10px;line-height:1.6;max-width:92ch">
      Das ist das Abnahmekriterium aus Abschnitt 15: der Preisimport verändert keine gespeicherte
      Dokumentposition, und die Historie zeigt alten und neuen Wert samt Stichtag.</div>

    <div class="sec" style="margin-top:22px">Frühere Läufe ${aid('IMP-05')}</div>
    <div class="scrollx"><table><thead><tr><th>Datum</th><th>Datei</th><th>Von</th><th>Ergebnis</th>
      <th>Stichtag</th></tr></thead><tbody>
      ${i.frueher.map(f => `<tr><td class="num">${esc(f.datum)}</td><td>${esc(f.datei)}</td>
        <td>${esc(f.wer)}</td><td class="small">${esc(f.ergebnis)}</td>
        <td class="num">${esc(f.stichtag)}</td></tr>`).join('')}
      </tbody></table></div>`;
};
/* ── Zeiten, Zahlungen, Versand, Service, Lager, Archiv ─────────────────────
   Die operativen Module. Jedes zeigt nicht nur Daten, sondern den Schritt,
   der daraus folgt: Zeit → Rechnungsposition, Rechnung → Zahlung → Mahnung,
   Beleg → Versand mit Historie, Lieferung → Garantiefall, alles → Archiv.
   ────────────────────────────────────────────────────────────────────────── */

/* ── Zeiterfassung (TIM-01…06) ───────────────────────────────────────────── */
VIEWS.zeiten = () => {
  const zeiten = mZeiten();
  const offen = zeiten.filter(t => t.verrechenbar && !t.dok);
  const proProjekt = mProjekte().map(p => {
    const z = zeiten.filter(t => t.projekt === p.id);
    return { p, h:z.reduce((s, t) => s + t.dauer, 0),
      verr:z.filter(t => t.verrechenbar).reduce((s, t) => s + t.dauer * t.satz, 0),
      kosten:z.reduce((s, t) => s + t.dauer * t.kosten, 0) };
  }).filter(x => x.h > 0);
  const proPerson = [...new Set(zeiten.map(t => t.wer))].map(w => {
    const z = zeiten.filter(t => t.wer === w);
    return { w, h:z.reduce((s, t) => s + t.dauer, 0),
      anteil:z.reduce((s, t) => s + t.dauer, 0) / Math.max(1, zeiten.reduce((s, t) => s + t.dauer, 0)) };
  });

  const kpis = `<div class="grid g4" style="margin-bottom:18px">
    <div class="card kpi"><div class="l">Erfasst</div>
      <div class="n">${zeiten.reduce((s, t) => s + t.dauer, 0).toFixed(1)} h</div>
      <div class="d">${zeiten.length} Buchungen ${aid('TIM-01')}</div></div>
    <div class="card kpi"><div class="l">Verrechenbar, offen</div>
      <div class="n" style="color:var(--warn)">${offen.reduce((s, t) => s + t.dauer, 0).toFixed(1)} h</div>
      <div class="d">${chf(offen.reduce((s, t) => s + t.dauer * t.satz, 0))} ${aid('TIM-04')}</div></div>
    <div class="card kpi"><div class="l">Nicht verrechenbar</div>
      <div class="n">${zeiten.filter(t => !t.verrechenbar).reduce((s, t) => s + t.dauer, 0).toFixed(1)} h</div>
      <div class="d">Akquisition, Garantie, Nacharbeit</div></div>
    <div class="card kpi"><div class="l">Interne Zeitkosten</div>
      <div class="n">${darf('ek') ? chf0(zeiten.reduce((s, t) => s + t.dauer * t.kosten, 0))
        : '<span class="verdeckt">gesperrt</span>'}</div>
      <div class="d">${darf('ek') ? 'Kostensatz je Mitarbeiter ' + aid('TIM-03')
        : 'sensibles Feld ' + aid('IAM-02')}</div></div></div>`;

  const timer = `<div class="card tint" style="margin-bottom:18px">
    <div class="wl"><span>Zeit erfassen ${aid('TIM-01','TIM-02')}</span>
      <span class="r2">geht am Handy genauso — dieselbe Oberfläche ${aid('SYS-03')}</span></div>
    <div class="row" style="gap:10px;align-items:flex-end">
      <label class="rfilter" style="flex:1 1 220px"><span>Projekt</span>
        <select data-zprojekt="1">${mProjekte().map(p =>
          `<option value="${p.id}">${esc(p.nr)} · ${esc(p.name.split(',')[0])}</option>`).join('')}</select></label>
      <label class="rfilter" style="flex:1 1 220px"><span>Tätigkeit</span>
        <input type="text" data-ztext="1" value="Einregulierung" placeholder="woran gearbeitet wird"></label>
      <label class="rfilter"><span>Dauer</span>
        <input type="number" step="0.25" min="0" data-zdauer="1" value="1.5" style="width:96px;text-align:right"></label>
      <label class="rfilter"><span>Verrechenbar</span>
        <select data-zverr="1"><option value="ja">ja</option><option value="nein">nein</option></select></label>
      ${R().nurlesen ? gesperrt('Nur Lesen', 'IAM-01')
        : '<button class="btn acc" data-act="zeit-buchen">Buchung anlegen</button>'}
    </div>
    <div class="small muted" style="margin-top:9px">Im Prototyp legt der Knopf die Buchung sofort an;
      im System gibt es zusätzlich Start/Stopp mit mitlaufender Uhr.</div></div>`;

  const zeilen = [...zeiten].sort((a, b) => dz(b.datum) - dz(a.datum)).map(t => `
    <tr class="${ZEIT_WAHL.includes(t.id) ? 'gewaehlt' : ''}">
      <td style="width:52px">${t.verrechenbar && !t.dok
        ? `<div class="check ${ZEIT_WAHL.includes(t.id) ? 'on' : ''}" data-zwahl="${t.id}">
            <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="#fff"
              stroke-width="2.6" stroke-linecap="round"><path d="M4 10.5l4 4 8-9"/></svg></div>`
        : ''}</td>
      <td class="num">${esc(t.datum)}</td>
      <td>${esc(P(t.projekt).nr)}<div class="small muted">${esc(K(P(t.projekt).kunde).kurz)}</div></td>
      <td>${esc(t.wer)}</td>
      <td>${esc(t.taetigkeit)}${t.notiz ? `<div class="small muted">${esc(t.notiz)}</div>` : ''}</td>
      <td class="r num">${t.dauer.toFixed(2)} h</td>
      <td class="r num">${t.verrechenbar ? chf(t.satz) : '—'}</td>
      <td class="r num">${t.verrechenbar ? chf(t.dauer * t.satz) : '—'}</td>
      ${darf('ek') ? `<td class="r num muted">${chf(t.dauer * t.kosten)}</td>` : ''}
      <td>${t.dok ? `<span class="tag t-ok">${esc(D(t.dok).nr)}</span>`
        : t.verrechenbar ? '<span class="tag t-warn">offen</span>'
        : '<span class="tag t-mute">nicht verrechenbar</span>'}</td></tr>`).join('');

  const wahlSumme = ZEIT_WAHL.reduce((s, id) => {
    const t = DB.zeiten.find(x => x.id === id); return s + (t ? t.dauer * t.satz : 0); }, 0);
  const wahlProjekte = [...new Set(ZEIT_WAHL.map(id => DB.zeiten.find(x => x.id === id).projekt))];

  return `${kpis}${timer}
    <div class="sec">Buchungen ${aid('TIM-03')}</div>
    <div class="scrollx"><table><thead><tr><th></th><th>Datum</th><th>Projekt</th><th>Wer</th>
      <th>Tätigkeit</th><th class="r">Dauer</th><th class="r">Satz</th><th class="r">Verrechenbar</th>
      ${darf('ek') ? '<th class="r">Interne Kosten</th>' : ''}<th>Status</th>
      </tr></thead><tbody>${zeilen}</tbody></table></div>

    <div class="card ${ZEIT_WAHL.length ? 'good' : 'tint'}" style="margin-top:16px">
      <div class="wl"><span>In eine Rechnung übernehmen ${aid('TIM-04','TIM-05')}</span>
        <span class="r2">${ZEIT_WAHL.length} ausgewählt</span></div>
      ${ZEIT_WAHL.length ? `
        <div class="wf" style="border:none">
          ${zeile('Ausgewählte Stunden',
            ZEIT_WAHL.reduce((s, id) => s + DB.zeiten.find(x => x.id === id).dauer, 0).toFixed(2) + ' h')}
          ${zeile('Betrag netto', chf(wahlSumme), 'zum jeweiligen Stundensatz')}
          ${zeile('Projekte', wahlProjekte.map(p => esc(P(p).nr)).join(', '),
            wahlProjekte.length > 1 ? 'je Projekt eine eigene Rechnung' : 'eine Rechnung')}
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn acc" data-act="zeiten-fakturieren">
            Rechnungsentwurf erzeugen</button>
          <button class="btn" data-act="zeiten-abwaehlen">Auswahl aufheben</button>
          <span class="small muted">Nach dem Finalisieren sind die Buchungen mit der Rechnung
            verknüpft und gegen doppelte Fakturierung gesperrt.</span></div>`
        : `<div class="small muted">Häkchen bei den offenen, verrechenbaren Buchungen setzen —
            dann entsteht daraus ein Rechnungsentwurf mit einer Position je Tätigkeit.</div>`}</div>

    <div class="sec" style="margin-top:22px">Auswertung ${aid('TIM-06')}</div>
    <div class="grid g2" style="gap:14px">
      <div class="card"><div class="wl"><span>Nach Projekt</span></div>
        ${proProjekt.map(x => `<div class="mini2">
          <div class="top"><span class="nm2">${esc(x.p.nr)} · ${esc(x.p.name.split(',')[0])}</span>
            <span class="vl2">${x.h.toFixed(1)} h</span></div>
          <div class="bar"><i style="width:${(x.h / Math.max(...proProjekt.map(y => y.h)) * 100).toFixed(0)}%"></i></div>
          <div class="small muted" style="margin-top:3px">${chf(x.verr)} verrechenbar${
            darf('ek') ? ` · ${chf(x.kosten)} interne Kosten` : ''}</div></div>`).join('')}</div>
      <div class="card"><div class="wl"><span>Nach Mitarbeiter</span></div>
        ${proPerson.map(x => `<div class="mini2">
          <div class="top"><span class="nm2">${esc(x.w)}</span>
            <span class="vl2">${x.h.toFixed(1)} h</span></div>
          <div class="bar"><i style="width:${(x.anteil * 100).toFixed(0)}%"></i></div></div>`).join('')}</div>
    </div>`;
};

/* ── Zahlungen und Mahnwesen (PAY-01…05, DOC-07) ─────────────────────────── */
VIEWS.zahlungen = () => {
  const rg = mDok().filter(d => d.typ === 'RG' && d.status !== 'storniert');
  const offeneRg = rg.filter(d => offenBetrag(d) > 0.005);
  const alter = d => Math.max(0, Math.round((dz(DB.heute) - dz(d.faellig)) % 100));

  const kpis = `<div class="grid g4" style="margin-bottom:18px">
    <div class="card kpi"><div class="l">Fakturiert ${DB.jahr}</div>
      <div class="n">${chf0(rg.reduce((s, d) => s + brutto(d), 0))}</div>
      <div class="d">${rg.length} Rechnungen</div></div>
    <div class="card kpi"><div class="l">Offen</div>
      <div class="n">${chf0(offeneRg.reduce((s, d) => s + offenBetrag(d), 0))}</div>
      <div class="d">${offeneRg.length} Rechnungen ${aid('PAY-02')}</div></div>
    <div class="card kpi"><div class="l">Überfällig</div>
      <div class="n" style="color:var(--warn)">${chf0(offeneRg.filter(d => d.status === 'überfällig')
        .reduce((s, d) => s + offenBetrag(d), 0))}</div>
      <div class="d">${offeneRg.filter(d => d.status === 'überfällig').length} Rechnungen</div></div>
    <div class="card kpi"><div class="l">Eingegangen</div>
      <div class="n">${chf0(DB.zahlungen.filter(z => mDok().some(d => d.id === z.dok))
        .reduce((s, z) => s + z.betrag, 0))}</div>
      <div class="d">${DB.zahlungen.length} Zahlungen ${aid('PAY-01')}</div></div></div>`;

  const zeilen = offeneRg.map(d => `<tr class="${DOK_OFFEN === d.id ? 'gewaehlt' : ''}">
    <td><b>${esc(d.nr)}</b><div class="small muted">${esc(M(d.mandant).name)}</div></td>
    <td>${esc(K(d.kunde).name)}<div class="small muted">${esc(d.adresseName)}</div></td>
    <td class="num">${esc(d.datum)}</td>
    <td class="num">${esc(d.faellig)}</td>
    <td class="r num">${chf(brutto(d))}</td>
    <td class="r num">${bezahlt(d) ? chf(bezahlt(d)) : '—'}</td>
    <td class="r num" style="font-weight:650;color:${d.status === 'überfällig' ? 'var(--warn)' : 'inherit'}">
      ${chf(offenBetrag(d))}</td>
    <td>${d.status === 'überfällig'
      ? `<span class="tag t-bad">${alter(d)} Tage überfällig</span>`
      : '<span class="tag t-ok">im Ziel</span>'}</td>
    <td>${d.mahnstufe ? `<div class="stufen" title="Mahnstufe ${d.mahnstufe}">
      ${[1,2,3].map(s => `<i class="${s <= d.mahnstufe ? 'an' + (s > 2 ? ' hart' : '') : ''}"></i>`).join('')}
      </div><div class="small muted">Stufe ${d.mahnstufe} am ${esc(d.mahnungAm)}</div>` :
      '<span class="muted small">keine</span>'}</td>
    <td class="r"><button class="btn" data-dok="${d.id}">${DOK_OFFEN === d.id ? 'schliessen' : 'öffnen'}</button></td>
    </tr>` + (DOK_OFFEN === d.id ? zahlungDetail(d) : '')).join('');

  const guthaben = DB.guthaben.map(g => `<div class="card tint">
    <div class="wl"><span>Kundenguthaben ${aid('DOC-07')}</span>
      <span class="r2">${esc(K(g.kunde).name)}</span></div>
    <div class="wf" style="border:none">
      ${g.bewegungen.map(b => zeile(`${esc(b.datum)} · ${esc(b.grund)}`,
        b.plus ? '+ ' + chf(b.plus) : '− ' + chf(b.minus), '', b.minus ? 'ab' : '')).join('')}
      ${zeile('Stand heute', chf(g.stand), 'vollständig verwendet', 'summe')}
    </div>
    <div class="small muted" style="margin-top:10px;line-height:1.6">Ein Guthaben ist ein eigenes
      Konto mit Entstehungsgrund, Verwendung und unveränderlichen Bewegungen — keine Korrektur
      an einer bestehenden Rechnung.</div></div>`).join('');

  return `${kpis}
    <div class="sec">Offene Debitoren ${aid('PAY-02')}</div>
    <div class="scrollx"><table><thead><tr><th>Rechnung</th><th>Kunde</th><th>Datum</th><th>Fällig</th>
      <th class="r">Total</th><th class="r">Bezahlt</th><th class="r">Offen</th><th>Alterung</th>
      <th>Mahnung</th><th></th></tr></thead><tbody>${zeilen}</tbody></table></div>

    <div class="grid g2" style="gap:14px;margin-top:18px">
      <div class="card"><div class="wl"><span>Mahnstufen ${aid('PAY-03')}</span>
          <span class="r2">${esc(M().lang)}</span></div>
        <div class="scrollx"><table><thead><tr><th>Stufe</th><th class="r">Tage nach Fälligkeit</th>
          <th class="r">Gebühr</th><th>Text</th></tr></thead><tbody>
          ${DB.mahnstufen.map(s => `<tr><td><b>${s.stufe}</b></td>
            <td class="r num">${s.nach}</td><td class="r num">${s.gebuehr ? chf(s.gebuehr) : '—'}</td>
            <td class="small">${esc(s.text)}</td></tr>`).join('')}
          </tbody></table></div>
        <div class="small muted" style="margin-top:10px;line-height:1.6">Je Mandant und bei Bedarf
          je Kunde konfigurierbar. Eine Mahnung wird vorbereitet und freigegeben — automatischer
          Versand ist später möglich und abschaltbar. ${aid('PAY-04')}</div></div>
      ${guthaben}</div>

    <div class="sec" style="margin-top:22px">Zahlungseingänge ${aid('PAY-01')}</div>
    <div class="scrollx"><table><thead><tr><th>Datum</th><th>Rechnung</th><th>Kunde</th><th>Art</th>
      <th>Referenz</th><th class="r">Betrag</th></tr></thead><tbody>
      ${DB.zahlungen.filter(z => mDok().some(d => d.id === z.dok)).map(z => `<tr>
        <td class="num">${esc(z.datum)}</td>
        <td><span class="link" data-dok="${z.dok}">${esc(D(z.dok).nr)}</span></td>
        <td>${esc(K(D(z.dok).kunde).kurz)}</td><td>${esc(z.art)}</td>
        <td class="small muted">${esc(z.referenz)}</td>
        <td class="r num">${chf(z.betrag)}</td></tr>`).join('')}
      </tbody></table></div>`;
};

function zahlungDetail(d) {
  const stufe = (d.mahnstufe || 0) + 1;
  const regel = DB.mahnstufen.find(s => s.stufe === stufe);
  return `<tr class="detailzeile"><td colspan="10">
    <div class="detailkopf"><span class="dpfeil">↳</span><b>${esc(d.nr)}</b>
      <span class="muted">${esc(K(d.kunde).name)} · offen ${chf(offenBetrag(d))}</span>
      <button class="btn" data-dokzu="1" style="margin-left:auto">Schliessen</button></div>
    <div class="grid g2" style="gap:14px;padding:0 16px">
      <div class="card"><div class="wl"><span>Zahlung erfassen ${aid('PAY-01')}</span></div>
        <div class="row" style="gap:10px;align-items:flex-end">
          <label class="rfilter"><span>Datum</span>
            <input type="text" data-zdatum="1" value="${esc(DB.heute)}" style="width:110px"></label>
          <label class="rfilter"><span>Betrag</span>
            <input type="number" step="0.05" min="0" data-zbetrag="1"
              value="${offenBetrag(d).toFixed(2)}" style="width:120px;text-align:right"></label>
          <label class="rfilter" style="flex:1 1 180px"><span>Referenz</span>
            <input type="text" data-zref="1" value="QR 21 00000 00000 ${esc(d.nr.slice(-5))}"></label>
          ${darf('exportieren')
            ? `<button class="btn acc" data-act="zahlung-buchen" data-id="${d.id}">Buchen</button>`
            : gesperrt('kein Recht', 'IAM-01')}</div>
        <div class="small muted" style="margin-top:9px">Teilzahlung möglich: der Restbetrag wird
          gerechnet, der Status folgt daraus. Verbucht wird in der Buchhaltung, nicht hier
          (Abgrenzung 1.1).</div></div>
      <div class="card"><div class="wl"><span>Mahnwesen ${aid('PAY-03','PAY-04','PAY-05')}</span></div>
        <div class="wf" style="border:none">
          ${zeile('Fällig seit', esc(d.faellig))}
          ${zeile('Bisherige Stufe', d.mahnstufe ? `Stufe ${d.mahnstufe} am ${esc(d.mahnungAm)}` : 'keine')}
          ${regel ? zeile(`Nächste Stufe ${regel.stufe}`,
            regel.gebuehr ? chf(regel.gebuehr) + ' Gebühr' : 'ohne Gebühr', esc(regel.text)) : ''}
          ${zeile('Zu berücksichtigen', chf(bezahlt(d)) + ' bezahlt', 'Teilzahlung vom ' +
            (DB.zahlungen.find(z => z.dok === d.id) || {}).datum)}
        </div>
        <div class="row" style="margin-top:12px">
          ${regel && darf('versenden')
            ? `<button class="btn" data-act="mahnung-vorbereiten" data-id="${d.id}">
                Stufe ${regel.stufe} vorbereiten</button>` : ''}
          <button class="btn" data-act="zum-versand" data-id="${d.id}">Versandhistorie ${aid('PAY-05')}</button>
        </div></div></div></td></tr>`;
}

/* ── Versandzentrale (SND-01…06, NWL-03/04) ─────────────────────────────── */
VIEWS.versand = () => {
  const wahl = VERSAND_DOK ? D(VERSAND_DOK) : mDok().find(d => d.final) || mDok()[0];
  const k = K(wahl.kunde);
  const vorlage = DB.vorlagen.find(v => v.typ === wahl.typ && v.mandant === wahl.mandant)
    || DB.vorlagen[0];
  const empfaenger = [
    { mail:kontakt(k.id, wahl.kontakt).mail, was:'Kontakt des Belegs' },
    { mail:k.rechnungsmail, was:'Rechnungs-E-Mail des Kunden' },
    { mail:k.mail, was:'Hauptadresse' },
  ].filter((e, i, a) => e.mail && a.findIndex(x => x.mail === e.mail) === i);
  const anhaenge = [`${wahl.nr}.pdf`, ...DB.dateien.filter(f => f.projekt === wahl.projekt
    && !f.sensibel).map(f => f.name)];
  const text = vorlage.text
    .replace('{{belegnr}}', wahl.nr).replace('{{projekt}}', wahl.projekt ? P(wahl.projekt).name : wahl.titel)
    .replace('{{anrede}}', kontakt(k.id, wahl.kontakt).anrede || '')
    .replace('{{kontakt}}', kontakt(k.id, wahl.kontakt).name || '')
    .replace('{{betrag}}', chf(brutto(wahl))).replace('{{faellig}}', wahl.faellig || '—')
    .replace('{{offen}}', chf(offenBetrag(wahl)))
    .replace('{{absender}}', M(wahl.mandant).lang);

  const maske = `<div class="card" style="margin-bottom:18px">
    <div class="wl"><span>Versandmaske ${aid('SND-01','SND-02','SND-03')}</span>
      <span class="r2">${esc(M(wahl.mandant).absender)}</span></div>
    <div class="row" style="gap:10px;align-items:flex-end;margin-bottom:12px">
      <label class="rfilter" style="flex:1 1 240px"><span>Beleg</span>
        <select data-vdok="1">${mDok().map(d =>
          `<option value="${d.id}" ${d.id === wahl.id ? 'selected' : ''}>
            ${esc(d.nr)} · ${esc(TYPKURZ[d.typ])} · ${esc(K(d.kunde).kurz)}</option>`).join('')}</select></label>
      <label class="rfilter" style="flex:1 1 200px"><span>Vorlage</span>
        <select data-vvorlage="1">${DB.vorlagen.map(v =>
          `<option ${v.id === vorlage.id ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
      <label class="rfilter"><span>Absender</span>
        <input type="text" value="${esc(M(wahl.mandant).absender)}" readonly style="width:230px"></label>
    </div>
    <div class="pfeld"><label>An · vorgeschlagen aus Kunde, Standort und Rechnungsstelle</label>
      <input type="text" data-vempf="1" value="${esc(empfaenger[0] ? empfaenger[0].mail : '')}"></div>
    <div class="row" style="gap:6px;margin:-4px 0 12px">${empfaenger.map(e =>
      `<span class="chip s1" title="${esc(e.was)}">${esc(e.mail)}</span>`).join('')}</div>
    <div class="pfeld"><label>Betreff</label>
      <input type="text" data-mailbetreff="1" value="${esc(vorlage.betreff.replace('{{belegnr}}', wahl.nr)
        .replace('{{projekt}}', wahl.projekt ? P(wahl.projekt).name : wahl.titel))}"></div>
    <div class="pfeld"><label>Nachricht · Platzhalter sind eingesetzt</label>
      <textarea data-mailtext="1" rows="5">${esc(text)}</textarea></div>
    <div class="pfeld"><label>Anhänge ${aid('SND-04')}</label>
      <div class="row" style="gap:6px">${anhaenge.map((a, i) =>
        `<span class="chip ${i === 0 ? 's1' : ''}">${esc(a)}</span>`).join('')}</div></div>
    <div class="row" style="margin-top:12px">
      ${darf('versenden')
        ? `<button class="btn acc" data-act="senden" data-id="${wahl.id}">Senden</button>`
        : gesperrt('Versand ist für «' + R().name + '» gesperrt', 'IAM-01')}
      <span class="small muted">Das erzeugte PDF hängt automatisch an; jeder Versand erzeugt
        einen Eintrag in der Historie und lässt den alten unverändert.</span></div></div>`;

  const historie = `<div class="sec">Versandhistorie ${aid('SND-05','SND-06')}</div>
    <div class="scrollx"><table><thead><tr><th>Zeitpunkt</th><th>Beleg</th><th>An</th><th>Betreff</th>
      <th>Anhänge</th><th>Von</th><th>Status</th><th></th></tr></thead><tbody>
      ${DB.versand.filter(v => v.status !== 'nicht versendet' && mDok().some(d => d.id === v.dok))
        .map(v => `<tr><td class="num">${esc(v.datum)}</td>
        <td><span class="link" data-dok="${v.dok}">${esc(D(v.dok).nr)}</span>
          ${v.mahnung ? `<div class="small muted">Mahnung Stufe ${v.mahnung}</div>` : ''}</td>
        <td class="small">${esc(v.an.join(', '))}${v.cc.length
          ? `<div class="muted">CC ${esc(v.cc.join(', '))}</div>` : ''}</td>
        <td class="small">${esc(v.betreff)}</td>
        <td class="small muted">${v.anhang.map(esc).join('<br>')}</td>
        <td>${esc(v.wer)}</td>
        <td><span class="tag t-ok">${esc(v.status)}</span></td>
        <td class="r">${darf('versenden')
          ? `<button class="btn" data-act="erneut" data-id="${v.dok}">erneut senden</button>` : ''}</td>
        </tr>`).join('')}
      </tbody></table></div>`;

  const nl = `<div class="sec" style="margin-top:22px">Newsletter ${aid('NWL-03','NWL-04')}</div>
    <div class="scrollx"><table><thead><tr><th>Ausgabe</th><th>Thema</th><th>Verteiler</th>
      <th>Versendet</th><th class="r">Empfänger</th><th class="r">Zugestellt</th>
      <th class="r">Fehlgeschlagen</th><th class="r">Abgemeldet</th><th>Status</th>
      </tr></thead><tbody>
      ${DB.kampagnen.filter(c => imBlick(c.mandant)).map(c => `<tr>
        <td><b>${esc(c.name)}</b></td><td>${esc(c.thema)}</td>
        <td><span class="chip s1">${esc(c.verteiler)}</span></td>
        <td class="num">${esc(c.versendet)}${c.geplant
          ? `<div class="small muted">geplant ${esc(c.geplant)}</div>` : ''}</td>
        <td class="r num">${c.empfaenger}</td><td class="r num">${c.zugestellt || '—'}</td>
        <td class="r num">${c.fehlgeschlagen || '—'}</td><td class="r num">${c.abgemeldet || '—'}</td>
        <td><span class="tag ${c.status === 'versendet' ? 't-ok' : 't-warn'}">${esc(c.status)}</span></td>
        </tr>`).join('')}
      </tbody></table></div>
    <div class="small muted" style="margin-top:10px;line-height:1.6;max-width:92ch">
      Einwilligung, Quelle und Zeitpunkt hängen am Kontakt; eine Abmeldung wirkt dauerhaft über
      alle Kampagnen. Zustellraten kommen vom Versanddienst — was er nicht liefert, wird auch
      nicht behauptet. ${aid('NWL-02','NWL-04')}</div>`;

  return maske + historie + nl;
};

/* ── Garantie- und Servicefälle (SRV-01…05) ─────────────────────────────── */
VIEWS.service = () => {
  const liste = mFaelle();
  if (!liste.length) return '<div class="card">Keine Fälle in diesem Mandanten.</div>';
  const f = liste.find(x => x.id === FALL_OFFEN) || liste[0];
  const schritte = ['gemeldet','geprüft','Ersatz bestellt','erledigt'];
  const dok = f.bezugDok ? D(f.bezugDok) : null;
  const pos = dok ? dok.pos.find(p => p.nr === f.bezugPos) : null;
  const dateien = DB.dateien.filter(x => x.projekt === f.projekt && x.kat === 'Service'
    || x.projekt === f.projekt && x.kat === 'Foto');

  return `<div class="tabs">${liste.map(x =>
      `<button class="tab ${x.id === f.id ? 'on' : ''}" data-fall="${x.id}">${esc(x.nr)}</button>`).join('')}</div>
    <div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:14px">
        <div style="min-width:0">
          <div class="small muted">${esc(M(f.mandant).name)} · gemeldet ${esc(f.gemeldet)}
            ${aid('SRV-01')}</div>
          <h2 style="font-size:19px;font-weight:700;margin:3px 0 4px">${esc(f.nr)} · ${esc(f.titel)}</h2>
          <div class="small" style="line-height:1.6;max-width:80ch">${esc(f.fehler)}</div></div>
        <div style="flex:none;text-align:right">
          <span class="tag ${f.status === 'erledigt' ? 't-ok' : 't-warn'}">${esc(f.status)}</span>
          <div class="small muted" style="margin-top:7px">Frist ${esc(f.frist)}<br>
            ${esc(f.verantwortlich)}</div></div></div>
      <div class="grid g4" style="margin-top:16px;gap:12px">
        <div><div class="small muted">Kunde</div>
          <div style="font-weight:600"><span class="link" data-kunde="${f.kunde}">${esc(K(f.kunde).name)}</span></div></div>
        <div><div class="small muted">Projekt</div>
          <div style="font-weight:600"><span class="link" data-projekt="${f.projekt}">${esc(P(f.projekt).nr)}</span></div></div>
        <div><div class="small muted">Lieferant</div>
          <div style="font-weight:600">${esc(f.lieferant)}</div></div>
        <div><div class="small muted">Kostenübernahme</div>
          <div style="font-weight:600">${esc(f.kosten)}</div></div></div></div>

    <div class="grid g2" style="gap:14px">
      <div class="card"><div class="wl"><span>Woher das Teil kam ${aid('SRV-02')}</span></div>
        ${dok && pos ? `<div class="wf" style="border:none">
          ${zeile('Artikel', esc(A(f.artikel).name), esc(A(f.artikel).nr))}
          ${zeile('Menge im Fall', `${f.menge} ${esc(A(f.artikel).einheit)}`)}
          ${zeile('Beleg', `<span class="link" data-dok="${dok.id}">${esc(dok.nr)}</span>`,
            `Position ${pos.nr} · ${esc(dok.datum)}`)}
          ${zeile('Geliefert am', esc(f.geliefertAm), 'Garantiefrist läuft ab Lieferung')}
          ${zeile('Preis im Beleg', chf(pos.preis), darf('ek') ? `EK ${chf(pos.ekSnap)}` : '')}
        </div>
        <div class="small muted" style="margin-top:10px;line-height:1.6">Der Weg zurück auf
          Lieferung, Position und Lieferdatum ist der Grund, warum ein Fall auch in drei Jahren
          noch beantwortbar ist. ${aid('SRV-05')}</div>` : '<div class="small muted">Kein Belegbezug.</div>'}</div>
      <div class="card"><div class="wl"><span>Status und Verlauf ${aid('SRV-03','SRV-04')}</span></div>
        <div class="row" style="gap:6px;margin-bottom:12px">${schritte.map(s =>
          `<button class="tab ${f.status === s ? 'on' : ''}" data-fstatus="${s}"
            ${R().nurlesen ? 'disabled' : ''}>${s}</button>`).join('')}</div>
        <div class="chronik">${f.verlauf.map(v => `<div class="cz">
          <div class="cd">${esc(v.datum)}</div><div class="ci">·</div>
          <div class="cb"><div class="ct">${esc(v.was)}</div>
            <div class="cs">${esc(v.wer)} · ${esc(v.notiz)}</div></div></div>`).join('')}</div>
        ${dateien.length ? `<div style="margin-top:12px">
          <div class="small muted">Angehängt</div>
          <div class="row" style="gap:6px;margin-top:5px">${dateien.map(x =>
            `<span class="chip">${esc(x.name)}</span>`).join('')}</div></div>` : ''}</div></div>

    <div class="sec" style="margin-top:22px">Alle Fälle</div>
    <div class="scrollx"><table><thead><tr><th>Nummer</th><th>Kunde</th><th>Produkt</th><th>Gemeldet</th>
      <th>Status</th><th>Kosten</th><th>Frist</th></tr></thead><tbody>
      ${liste.map(x => `<tr class="click ${x.id === f.id ? 'gewaehlt' : ''}" data-fall="${x.id}">
        <td><b>${esc(x.nr)}</b></td><td>${esc(K(x.kunde).kurz)}</td>
        <td>${esc(A(x.artikel).name)}</td><td class="num">${esc(x.gemeldet)}</td>
        <td><span class="tag ${x.status === 'erledigt' ? 't-ok' : 't-warn'}">${esc(x.status)}</span></td>
        <td>${esc(x.kosten)}</td><td class="num">${esc(x.frist)}</td></tr>`).join('')}
      </tbody></table></div>`;
};

/* ── Lager und Inventar (INV-01…05) ──────────────────────────────────────── */
VIEWS.lager = () => {
  let liste = mLager();
  if (LAGER_KAT) liste = liste.filter(l => l.kat === LAGER_KAT);
  const kats = [...new Set(mLager().map(l => l.kat))];
  const unter = mLager().filter(l => l.bestand < l.min);

  return `<div class="grid g3" style="margin-bottom:18px">
      <div class="card kpi"><div class="l">Positionen</div>
        <div class="n">${mLager().length}</div>

     * die HAUPTWÖRTER kommen aus den Daten selbst — jeder Kunde, Standort,
       Kontakt, jedes Projekt, jeder Beleg, Artikel, Hersteller, Servicefall,
       Lagerartikel, Mandant und jede Rolle wird zur Fragezeit aus DB indexiert.
       Ein neuer Beleg ist fragbar, sobald er existiert.
     * die MODULNAMEN tragen den grössten Teil des Themenwortschatzes; BEGRIFFE
       ergänzt nur die Feldsemantik, nach der kein Modul heisst — Marge, offen,
       Prüfsumme, Stichtag. Das ist ein geschriebenes Lexikon und die ehrliche
       Grenze eines Prototyps ohne Modell dahinter.
     * DIE RECHTE GELTEN AUCH HIER. Was eine Rolle auf dem Schirm nicht sehen
       darf, bekommt sie auch nicht als Antwort — sonst wäre der Assistent das
       Loch im Berechtigungsmodell (IAM-02, SEA-03).
     * es wird nie «nichts» geantwortet: eine unklare Frage fällt auf das
       zurück, was gerade offen ist, mit Wegen dorthin.

const CHAT = { offen: false, verlauf: [], denkt: false };

const cnorm = s => String(s).toLowerCase()
  .replace(/[äáà]/g, 'a').replace(/[öó]/g, 'o').replace(/[üú]/g, 'u')
  .replace(/[éèê]/g, 'e').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();

/* jedes Hauptwort der Anwendung, aus DB gelesen — keine gepflegte Liste */
function chatIndex() {
  const ix = [], add = (kind, ref, ...l) =>
    ix.push({ kind, ref, keys: [...new Set(l.filter(Boolean).map(cnorm))] });

  DB.kunden.forEach(k => k.standorte.forEach(s => add('standort', { k, s }, s.name,

  DB.kunden.forEach(k => k.kontakte.forEach(c => add('kontakt', { k, c }, c.name,

  DB.projekte.forEach(p => add('projekt', p, p.nr, p.name, p.name.split(',')[0], p.kategorie));
  DB.dokumente.forEach(d => add('beleg', d, d.nr, d.titel));
  DB.artikel.forEach(a => add('artikel', a, a.nr, a.name, a.name.split(',')[0]));
  [...new Set(DB.artikel.flatMap(a => [a.hersteller, a.lieferant]).filter(x => x && x !== '—'))]
    .forEach(l => add('lieferant', l, l, l.split(' ')[0]));
  DB.faelle.forEach(f => add('fall', f, f.nr, f.titel));
  DB.lager.forEach(l => add('lagerartikel', l, l.name, l.nr, l.kat));
  DB.mandanten.forEach(m => add('mandant', m, m.name, m.lang, m.name.split(' ')[0]));
  DB.rollen.forEach(r => add('rolle', r, r.name, r.wer.split(' ')[0]));
  [...new Set(DB.zeiten.map(t => t.wer))].forEach(w => add('person', w, w));
  MODULES.forEach(m => add('modul', m, m.name, m.titel));
  return ix;
}

/* Welche Art Ding ein Themenwort meint: «Preis Downlight» will den Artikel,
   «Marge P-26-041» das Projekt. */
const KIND_VON = { produkte:'artikel', import:'artikel', marge:'projekt', zeiten:'projekt',
                   kette:'beleg', zahlungen:'beleg', archiv:'beleg', adressfall:'kunde',
                   rechte:'rolle', mandanten:'mandant', service:'fall', lager:'lagerartikel' };

function entName(kind, ref) {
  if (kind === 'standort') return ref.s.name;
  if (kind === 'kontakt')  return ref.c.name;
  if (kind === 'projekt')  return ref.nr;
  if (kind === 'beleg')    return ref.nr;
  if (kind === 'artikel')  return ref.nr;
  if (kind === 'fall')     return ref.nr;
  if (kind === 'modul')    return ref.name;
  return ref.name || String(ref);
}

function matchEnt(q, ix, bias) {
  const qt = q.split(' ').filter(Boolean);
  const hits = new Map();
  const take = (e, s) => {
    if (!s) return;
    s += (bias && e.kind === bias) ? 6 : 0;
    const key = e.kind + '|' + entName(e.kind, e.ref);
    if (!hits.has(key) || hits.get(key).s < s) hits.set(key, { kind:e.kind, ref:e.ref, s });
  };
  ix.forEach(e => e.keys.forEach(k => {
    const kw = k.split(' ');
    if (k.length >= 4 && q.includes(k)) return take(e, k.length + 3);
    if ((' ' + q + ' ').includes(' ' + k + ' ')) return take(e, k.length + 1);
    qt.forEach(t => { if (t.length >= 5) kw.forEach(w => {
      if (w.length >= 5 && (w.startsWith(t) || t.startsWith(w))) take(e, Math.min(t.length, w.length));
    }); });
  }));
  const all = [...hits.values()].sort((a, b) => b.s - a.s);
  if (!all.length) return null;
  const gleich = all.filter(x => x.s === all[0].s && x.kind === all[0].kind);
  return { ...all[0], ties: gleich.length > 1 ? gleich : [] };
}

function matchThema(q) {
  let best = null;
  BEGRIFFE.forEach(([id, words]) => words.split(' ').forEach(w => {
    const s = (' ' + q + ' ').includes(' ' + w + ' ') ? w.length + 2
            : (w.length >= 5 && q.includes(w)) ? w.length : 0;
    if (s && (!best || s > best.s)) best = { id, s };
  }));
  return best;
}
