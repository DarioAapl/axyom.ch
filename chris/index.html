<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Klickbarer UX-Prototyp zum «Funktionalen Grobkonzept / Pflichtenheft:
     Mandantenfähige Geschäftsanwendung», Version 1.0 vom 24. August 2026,
     Schritt 3 der empfohlenen nächsten Schritte (Abschnitt 18).
     Kunde → Projekt → Offerte → Rechnung, inklusive Adressfall, Preisimport,
     Rollenwirkung und revisionsorientiertem Archiv. Alle Kunden, Kontakte,
     Projekte, Artikel und Beträge sind erfunden; die drei Mandanten und die
     Anforderungs-IDs stammen aus dem Konzept.
     Unlisted: noindex hält den Prototyp aus den Suchergebnissen. Bewusst NICHT
     über robots.txt gesperrt — ein gesperrter Crawler liest dieses Tag nie. -->
<meta name="robots" content="noindex, nofollow">
<title>Geschäftsanwendung — Prototyp</title>
<style>
:root{
  --ink:#1d1d1f; --dim:#6e6e73; --soft:rgba(0,0,0,.08); --line:rgba(0,0,0,.13);
  --acc:#00b2a0; --acci:#007a6e; --wash:rgba(0,178,160,.10);
  --dark:#0b0d12; --surf:#f5f5f7; --warn:#b25e00; --warnbg:rgba(178,94,0,.10);
  --ok:#007a6e; --okbg:rgba(0,178,160,.12);
  /* Three levels, the ones the data already carries: ernst 3 = jetzt (rot),
     2 = heute (gelb), 1 = kann warten (grün). Amber alone had to mean both
     «a fridge is running warm» and «a post is waiting for approval». */
  --bad:#c02a17; --badbg:rgba(192,42,23,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--surf);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}

/* ── rail ── */
#rail{width:210px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;
      padding:18px 12px;position:sticky;top:0;height:100vh}
/* the real mark, inlined: the demo makes no network call, so it cannot fetch
   a logo file — and an SVG stays sharp on a projector */
#rail .brand{display:flex;align-items:flex-end;gap:8px;padding:2px 8px 16px}
#rail .brand .logo{width:106px;height:auto;flex:none;display:block}
/* the X reaches below the wordmark's baseline, so «ops» is lifted to sit on
   the letters rather than on the spike */
#rail .brand span{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.04em;
  position:relative;bottom:11px}
#rail nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
#rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
        color:rgba(255,255,255,.58);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer}
#rail a .ic{width:16px;height:16px;flex:none;opacity:.62}
#rail a:hover{color:#fff;background:rgba(255,255,255,.05)}
#rail a.on{background:rgba(0,178,160,.16);color:#fff;font-weight:650}
#rail a.on .ic{opacity:1;color:var(--acc)}
#rail a:hover .ic{opacity:.9}
#rail a .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--warn);color:#fff;
        border-radius:99px;padding:1px 6px}
#rail a .badge.s3{background:var(--bad)}
#rail a .badge.s2{background:var(--warn)}
#rail a .badge.s1{background:var(--acc);color:#04211e}
#rail .outlets{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);
        font-size:11px;line-height:1.7;color:rgba(255,255,255,.4)}
#rail .outlets b{display:block;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:3px}

/* ── main ── */
main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
header{padding:20px 28px 16px;border-bottom:1px solid var(--soft);display:flex;
       align-items:flex-end;justify-content:space-between;gap:20px;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
header .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
#hilfe-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;flex:none;
  line-height:1;padding:0;position:relative;top:1px}
#hilfe-btn:hover{border-color:var(--acc);color:var(--acci);background:var(--wash)}
.hilfeliste{margin:0;padding-left:19px}
.hilfeliste li{font-size:11.5px;line-height:1.55;padding:4px 0 4px 2px;color:rgba(255,255,255,.88)}
.hilfeliste li::marker{font-weight:700;color:var(--acc)}
header .demo{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
       color:var(--acci);background:var(--wash);padding:5px 9px;border-radius:6px;white-space:nowrap}
.body{padding:22px 28px 40px;flex:1}

/* ── bits ── */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
   text-align:left;padding:0 10px 9px;white-space:nowrap}
td{font-size:13px;padding:11px 10px;border-top:1px solid var(--soft);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:active td{background:rgba(0,0,0,.035)}
th.r,td.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
     padding:3px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.t-ok{color:var(--ok);background:var(--okbg)}
.t-warn{color:var(--warn);background:var(--warnbg)}
.t-mute{color:var(--dim);background:rgba(0,0,0,.05)}
.t-bad{color:var(--bad);background:var(--badbg)}
.card{background:#fff;border:1px solid var(--soft);border-radius:12px;padding:16px 18px}
.card.tint{background:var(--surf)}
.card.warn{background:rgba(178,94,0,.04);border-color:rgba(178,94,0,.22)}
.card.good{background:rgba(0,178,160,.05);border-color:rgba(0,178,160,.28)}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi .n{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.kpi .d{font-size:11.5px;color:var(--dim);margin-top:4px}
.btn{font-size:12.5px;font-weight:650;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
     background:#fff;cursor:pointer;font-family:inherit}
.btn:hover,.btn:active{background:var(--surf)}
.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.solid:hover{background:#000}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.acc:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
/* a trigger for the presentation, not a function of the product — it must not
   look like the buttons that actually do something */
.btn.demo{border-style:dashed;color:var(--dim);font-weight:600}
.btn.demo:hover{color:var(--ink)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
     margin:26px 0 11px}
.sec:first-child{margin-top:0}
/* a heading that carries tabs and a sentence has to be allowed to wrap, or it
   pushes a phone sideways */
.sec > span{min-width:0}
.muted{color:var(--dim)}
.small{font-size:12px}
.bar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(0,0,0,.22);cursor:pointer;
       display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.check.on{background:var(--acc);border-color:var(--acc)}
.check svg{display:none}.check.on svg{display:block}
.link{color:var(--acci);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link:active{background:var(--wash)}

/* ── the filter bar (Rechnungen) ───────────────────────────────────────────
   Six dropdowns and a free-text field, all combinable, with the result line
   adding up whatever is selected.
   ────────────────────────────────────────────────────────────────────────── */
.rfilterbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;
  padding:14px 16px;background:var(--surf);border:1px solid var(--soft);border-radius:12px;
  margin-bottom:14px}
.rfilter{display:flex;flex-direction:column;gap:5px;min-width:0}
.rfilter > span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim)}
.rfilter select,.rfilter input{font-size:12.5px;padding:7px 9px;max-width:100%}
/* a filter that is doing something says so */
.rfilter.an > span{color:var(--acci)}
.rfilter.an select,.rfilter.an input{border-color:var(--acc);background:var(--okbg);
  color:var(--acci);font-weight:650;box-shadow:0 0 0 2px rgba(0,178,160,.10)}
.rerg{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;font-size:12.5px;
  padding:0 2px 14px}
.rerg b{font-size:15px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card.kontext{margin-bottom:14px;background:var(--wash);border-color:rgba(0,178,160,.28)}
.kzahlen{display:flex;flex-wrap:wrap;gap:10px 34px}
.kschritte{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(0,178,160,.22)}
.ks{display:flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--soft);
  border-radius:8px;padding:6px 10px}
.ksd{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.ksp{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ksv{font-size:10.5px;font-weight:650;color:var(--dim)}
.ksv.hoch{color:var(--warn)}
.ksv.tief{color:var(--acci)}
@media (max-width:820px){ .rfilter{flex:1 1 140px} }

/* ── an invoice as the document it is ──────────────────────────────────────
   A customer asks «und wie sieht das aus, wenn es reinkommt?» — this is the
   answer: the supplier's paper, beside what Axyom read out of it.
   ────────────────────────────────────────────────────────────────────────── */
/* the opened row and its document read as one thing */
tr.gewaehlt td{background:var(--wash);border-bottom-color:transparent}
tr.gewaehlt td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
tr.detailzeile > td{padding:0 0 18px;background:var(--wash);
  box-shadow:inset 3px 0 0 var(--acc)}
.detailkopf{display:flex;align-items:baseline;gap:10px;padding:2px 16px 12px;font-size:12.5px}
/* die Rechnung hinter «Erwartet» */
.lrechnung{padding:0 16px}
.lz{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-top:1px solid rgba(0,0,0,.06)}
.lz:first-child{border-top:none}
.lz .ln{flex:0 0 250px;font-size:12.5px}
.lz .lv{flex:0 0 110px;text-align:right;font-size:13px;font-weight:650;
  font-variant-numeric:tabular-nums}
.lz .lh{flex:1;min-width:0;font-size:11px;color:var(--dim)}
.lz.summe{border-top:1px solid rgba(0,0,0,.18)}
.lz.summe .ln,.lz.summe .lv{font-weight:800}
@media (max-width:820px){ .lz{flex-wrap:wrap} .lz .ln{flex:1 1 60%} .lz .lh{flex:1 1 100%} }
.detailkopf .dpfeil{color:var(--acc);font-weight:700}
.detailkopf .muted{font-size:11.5px}
.dokzeile{display:flex;gap:16px;align-items:flex-start;padding:0 16px;min-width:0}
.rdoc{flex:1 1 560px;min-width:0;background:#fffefb;border:1px solid var(--line);border-radius:6px;
  padding:26px 28px;font-size:12px;line-height:1.55;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.rdpruef{flex:0 1 300px;min-width:0}
.rdkopf{display:flex;justify-content:space-between;gap:24px;padding-bottom:18px;
  border-bottom:1px solid rgba(0,0,0,.1)}
.rdkopf b{font-size:13px}
.rdmeta{text-align:right;flex:none}
.rdmeta div{display:flex;gap:12px;justify-content:flex-end;font-size:11.5px}
.rdmeta span{color:var(--dim)}
.rdan{margin:18px 0 22px;font-size:12px}
.rdtab{width:100%;border-collapse:collapse}
.rdtab th{font-size:10px;letter-spacing:.04em;padding:0 8px 7px;border-bottom:1px solid rgba(0,0,0,.12)}
.rdtab td{font-size:12px;padding:8px;border-bottom:1px solid rgba(0,0,0,.06)}
.rdtab tr.rdwarn td{background:rgba(178,94,0,.06)}
.rdklein{font-size:10px;color:var(--warn);font-weight:600;margin-top:2px}
tr.gewaehlt td{background:var(--wash)}
.rdsumme{margin-top:16px;margin-left:auto;width:250px}
.rdsumme div{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.rdsumme .tot{border-top:1px solid rgba(0,0,0,.2);margin-top:5px;padding-top:7px;font-size:13.5px}
.rdsumme .tot b{font-weight:800}
.rdfuss{margin-top:22px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);font-size:10.5px;
  color:var(--dim)}
.rdpruef .pz{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.5;padding:4px 0}
.rdpruef .pj{color:var(--acci);font-weight:700;flex:none}
@media (max-width:1100px){ .dokzeile{flex-direction:column} .rdpruef{flex:1 1 auto;width:100%} }

/* ── the weekly report ─────────────────────────────────────────────────────
   Four stacked blocks of numbers answered «what happened» and nothing else.
   The page now runs in the order the questions come: what is left, where the
   franc went, how it was earned, how that compares, what comes next, what to
   do. Every figure appears once.
   ────────────────────────────────────────────────────────────────────────── */
.wkopf{display:flex;gap:12px;align-items:stretch;margin-bottom:22px}
.wkopf .bleibt{flex:0 0 340px}
.wkopf .hin{flex:1;min-width:0}
.gross{font-size:34px;font-weight:700;letter-spacing:-.028em;line-height:1.05;margin-top:6px}
.rappen{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.5}
.wbar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:4px 0 12px}
.wbar i{display:block}
.wleg{display:flex;flex-wrap:wrap;gap:8px 20px}
.wleg > div{display:flex;align-items:baseline;gap:7px;font-size:12px}
.wleg .pt{width:9px;height:9px;border-radius:3px;flex:none;align-self:center}
.wleg b{font-variant-numeric:tabular-nums}
.bm{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:5px;white-space:nowrap}
.bm.gut{color:var(--acci);background:var(--okbg)}
.bm.ok{color:var(--dim);background:rgba(0,0,0,.05)}
.bm.hoch{color:var(--warn);background:var(--warnbg)}
.wf{border:1px solid var(--soft);border-radius:12px;overflow:hidden}
.wf .z{display:flex;align-items:baseline;gap:14px;padding:10px 16px;border-top:1px solid var(--soft)}
.wf .z:first-child{border-top:none}
.wf .z .nm{flex:1;min-width:0;font-size:13px}
.wf .z .wert{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right;
  flex:0 0 132px}
.wf .z .hint{font-size:11.5px;color:var(--dim);flex:0 0 240px;text-align:right;
  display:flex;gap:7px;justify-content:flex-end;align-items:center}
.wf .z.sub{background:var(--surf)}
.wf .z.sub .nm{padding-left:20px;font-size:12px;color:var(--dim)}
.wf .z.sub .wert{font-weight:500;color:var(--dim)}
.wf .z.summe{background:var(--wash)}
.wf .z.summe .nm{font-weight:700}
.wf .z.summe .wert{font-weight:800}
.wf .z.ab .wert{color:var(--warn)}
@media (max-width:900px){ .wkopf{flex-direction:column} .wkopf .bleibt{flex:1 1 auto}
  .wf .z{flex-wrap:wrap} .wf .z .hint{flex:1 1 100%;justify-content:flex-start;text-align:left} }

/* ── tabs, and the month calendar (Social Media) ───────────────────────────
   Two views over the same posts. A post is edited where it was clicked, so
   the calendar never becomes a second list that has to be kept in step.
   ────────────────────────────────────────────────────────────────────────── */
/* one line, cut with an ellipsis — nowrap text in a table cell otherwise sets
   the cell's min-content to the whole sentence and pushes the page sideways */
.zeile1{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a seven-column report table cannot fit a phone: it scrolls inside its own
   box rather than pushing the page sideways */
/* the trend belongs beside the numbers, not stretched across the page: a
   six-point line over 1174px reads as a flat ribbon */
.verlaufkopf{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
.verlaufkopf .vstats{flex:1;min-width:0}
.verlaufkopf .vchart{flex:0 1 340px;min-width:250px;display:flex;flex-direction:column;
  justify-content:center}
.vstatrow{display:flex;gap:34px;flex-wrap:wrap}
.vstat .vk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.vstat .vl2{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  margin-top:4px}
.vstat .vn{font-size:11.5px;font-weight:650;margin-top:2px}
/* the two cards stop fitting side by side well before the phone breakpoint:
   at 900px the row overflowed by 38px */
@media (max-width:1040px){ .verlaufkopf{flex-direction:column} .verlaufkopf .vchart{flex:1 1 auto} }
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* min-content, not a fixed width: a two-column table then still fills the box
   while a seven-column one scrolls instead of squeezing into unreadable columns */
.scrollx table{min-width:min-content}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{font-size:12.5px;font-weight:650;padding:7px 14px;border-radius:9px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-family:inherit;color:var(--dim)}
.tab:hover,.tab:active{background:var(--surf)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kkopf,.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kkopf{margin-bottom:6px}
.kkopf div{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);padding-left:2px}
/* grid tracks size to min-content by default, and a nowrap chip like
   «11:00 Instagram» made every day column 109px wide — seven of those do not
   fit a 900px window. min-width:0 lets the chip ellipsise instead. */
.kgrid > *{min-width:0}
.ktag{border:1px solid var(--soft);border-radius:9px;background:#fff;padding:6px;min-height:78px;
  overflow:hidden}
.ktag.leer{background:transparent;border-color:transparent}
.ktag.heute{border-color:var(--acc);background:rgba(0,178,160,.04)}
.knr{font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:5px;display:flex;
  align-items:baseline;gap:5px}
.kheute{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acci)}
.kpost{display:block;width:100%;text-align:left;font-family:inherit;font-size:10px;font-weight:600;
  line-height:1.3;padding:4px 6px;border-radius:6px;margin-bottom:3px;cursor:pointer;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpost .kzeit{font-variant-numeric:tabular-nums;opacity:.75}
.kpost .ktitel{display:none}
.kpost.entwurf{background:var(--warnbg);color:var(--warn)}
.kpost.freigegeben{background:var(--okbg);color:var(--acci)}
.kpost.publiziert{background:rgba(0,0,0,.045);color:var(--dim)}
.kpost:hover,.kpost:active{filter:brightness(.94)}
.kpost.gewaehlt{border-color:currentColor}
/* eine Zählung im Kalender */
.ktag.gezaehlt{border-color:var(--line)}
.zahnrad{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.zahnrad:hover,.zahnrad:active{border-color:var(--acc);color:var(--acci);background:var(--wash)}
.zahnrad.an{background:var(--acc);border-color:var(--acc);color:#fff}
.zutatform{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:0 16px}
.zpost{display:block;width:100%;text-align:left;font-family:inherit;font-size:10.5px;font-weight:650;
  line-height:1.3;padding:5px 7px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.zpost.ok{background:var(--okbg);color:var(--acci)}
.zpost.auff{background:var(--warnbg);color:var(--warn)}
.zpost.gewaehlt{border-color:currentColor}
.zpost:hover{filter:brightness(.97)}
.klegende{display:flex;gap:16px;align-items:center;margin-top:11px;font-size:10.5px;color:var(--dim);
  flex-wrap:wrap}
.klegende i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;
  vertical-align:-1px}
.klegende i.entwurf{background:var(--warn)}
.klegende i.freigegeben{background:var(--acc)}
.klegende i.publiziert{background:rgba(0,0,0,.18)}
@media (max-width:820px){ .kkopf{display:none}
  .kgrid{grid-template-columns:1fr} .ktag.leer{display:none} .ktag{min-height:0} }

/* ── the traffic light (Übersicht) ─────────────────────────────────────────
   Three lamps over the same severity the rest of the app uses: a lamp is lit
   and carries a count only when something is actually waiting at that level,
   so a dark lamp means nothing to do rather than «no data».
   ────────────────────────────────────────────────────────────────────────── */
/* the master indicator: one band across the top of the Übersicht */
.ampel{display:flex;align-items:center;gap:6px;background:var(--dark);border-radius:12px;
  padding:10px 14px;color:#fff}
/* a translucent 19px circle on a dark band is invisible in a demo: this one
   has to be findable by someone who has never seen the screen */
.ampel .frage{height:23px;border-radius:99px;border:1px solid rgba(255,255,255,.34);
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.82);font-family:inherit;font-size:11px;
  font-weight:650;line-height:1;padding:0 10px;cursor:pointer;flex:none;align-self:center;
  margin-left:4px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ampel .frage b{font-size:12px;font-weight:700;color:var(--acc)}
.ampel .frage:hover{border-color:var(--acc);color:#fff;background:rgba(0,178,160,.18)}
@media (max-width:700px){ .ampel .frage span{display:none} .ampel .frage{padding:0 7px} }
.ampel .trenn{width:1px;align-self:stretch;background:rgba(255,255,255,.12);margin:0 12px}
/* the flying hint */
.flug{position:fixed;z-index:70;background:var(--dark);color:#fff;border-radius:12px;
  padding:12px 14px;box-shadow:0 14px 38px rgba(0,0,0,.32);font-size:11.5px;line-height:1.55;
  opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s}
.flug.weit{padding:14px 16px}
.flug{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* das Kreuz: am Schreibtisch dezent, am Telefon der Weg hinaus */
.flugzu{position:absolute;top:6px;right:6px;width:32px;height:32px;border:none;background:none;
  color:rgba(255,255,255,.45);font-family:inherit;font-size:20px;line-height:1;cursor:pointer;
  border-radius:8px;padding:0}
.flugzu:hover{color:#fff;background:rgba(255,255,255,.1)}
.flug{position:fixed}
.flug .fk{padding-right:34px}
.flug .fk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--acc);margin-bottom:9px}
.flug .fu{font-size:10px;color:rgba(255,255,255,.38);margin-top:10px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.1)}
.flug.da{opacity:1;transform:translateY(0)}
.flug.weg{opacity:0;transition:opacity 1.4s ease-in}
.flug.schnell{opacity:0;transform:translateY(-4px);transition:opacity .13s,transform .13s}
.flug b{color:#fff;font-weight:650}
.flug .fz{display:flex;gap:9px;align-items:flex-start;padding:3px 0}
.flug .fp{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
.ampel .jetzt{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.ampel .jetzt .was{min-width:0}
.ampel .jetzt b{font-size:13px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ampel .jetzt .why{font-size:10.5px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ampel .hin{margin-left:auto;flex:none;font-size:11.5px;font-weight:650;color:var(--acc);cursor:pointer;
  white-space:nowrap}
.ampel .hin:hover{filter:brightness(1.15)}
/* the band must be able to shrink: flex-basis:100% with shrink:0 made it wider
   than the phone it was sitting on, which pushed the whole page sideways */
.dash > *{min-width:0}
.dash .card,.dash .col > *{min-width:0}
.ampel{min-width:0}
@media (max-width:900px){ .ampel{flex-wrap:wrap} .ampel .trenn{display:none}
  .ampel .jetzt{flex:1 1 100%;min-width:0;margin-top:8px} }
@media (max-width:340px){ .lampe .txt{display:none} }
@media (max-width:560px){ .ampel .hin{font-size:11px} }
/* lamp label beside the glass, not under it: three rows of text would make
   this tile taller than the column it has to fit into */
.lampe{display:flex;align-items:center;gap:7px;border:none;background:none;
  font-family:inherit;padding:0;margin-right:14px}
.lampe.an{cursor:pointer}
.lampe .glas{width:30px;height:30px;flex:none;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);color:transparent}
.lampe .txt{font-size:8.5px;text-align:left;line-height:1.2;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.3);white-space:nowrap}
.lampe.an .txt{color:rgba(255,255,255,.78)}
.lampe.an .glas{border-color:transparent;color:#fff}
.lampe.an.r .glas{background:var(--bad);box-shadow:0 0 0 3px rgba(192,42,23,.24)}
.lampe.an.y .glas{background:#cf7c1f;box-shadow:0 0 0 3px rgba(207,124,31,.22)}
.lampe.an.g .glas{background:var(--acc);color:#04211e;box-shadow:0 0 0 3px rgba(0,178,160,.22)}
.lampe.an:hover .glas{filter:brightness(1.1)}

/* ── post previews (Social Media) ──────────────────────────────────────────
   A draft is judged by how it will look, so each one is drawn in the shape of
   its channel — square for a feed post, 9:16 for a story, 16:9 for Facebook —
   with the caption, the hashtags and the alt text that go with it.
   ────────────────────────────────────────────────────────────────────────── */
.posts{display:flex;flex-direction:column;gap:14px}
.post{display:grid;grid-template-columns:226px 1fr;gap:20px;align-items:start}
.pv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pv .pvkopf{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surf);
  border-bottom:1px solid var(--soft);font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim)}
.pv .pvbild{background:linear-gradient(135deg,#cfe9e3,#8ed2c5 55%,#d8e9ae)}
.pv.ig .pvbild{aspect-ratio:1/1}
/* a story canvas is 9:16 — centred in the card rather than hugging one edge */
.pv.story .pvbild{aspect-ratio:9/16;max-height:260px;margin:9px auto;border-radius:10px}
.pv.fb .pvbild{aspect-ratio:16/9}
.pv .pvtext{padding:9px 11px;font-size:11.5px;line-height:1.5}
.pv .pvtags{color:var(--acci);font-size:11px;margin-top:6px;word-break:break-word}
.pv .pvalt{padding:0 11px 9px;font-size:9.5px;color:var(--dim);line-height:1.4}
.pv.story .pvbild{position:relative;display:flex;align-items:flex-end}
.pvoverlay{padding:10px 11px;color:#fff;font-size:11.5px;font-weight:650;line-height:1.4;
  text-shadow:0 1px 8px rgba(0,0,0,.45)}
.pvoverlay b{font-weight:800}
.pfeld{margin-bottom:10px}
.pfeld > label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pfeld textarea{width:100%;resize:vertical;line-height:1.55;min-height:62px}
.pfeld input[type=text]{width:100%}
/* the picture field: a real file picker and a real drop target. The file is
   read in the browser and never leaves it — the demo makes no network call. */
.bildzeile{display:flex;gap:10px;align-items:stretch}
.dropzone{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;
  border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;
  color:var(--dim);cursor:pointer;background:#fff}
.dropzone:hover{border-color:var(--acc);color:var(--acci)}
.dropzone.drauf{border-color:var(--acc);background:var(--wash);color:var(--acci)}
.dropzone b{color:var(--ink);font-weight:650}
.dropzone .klein{font-size:10px}
.pvbild.hat{background-size:cover;background-position:center}
.anlass{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--acci);
  background:var(--wash);border-radius:6px;padding:4px 8px}
.woche7{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:20px}
.woche7 .t7{border:1px solid var(--soft);border-radius:9px;padding:8px 9px;min-height:72px;background:#fff}
.woche7 .t7 .d7{font-size:10px;font-weight:700;color:var(--dim);margin-bottom:5px}
.woche7 .t7 .p7{font-size:10.5px;line-height:1.35;padding:4px 6px;border-radius:6px;
  background:var(--warnbg);color:var(--warn);font-weight:600;margin-bottom:4px}
.woche7 .t7 .p7.frei{background:var(--okbg);color:var(--acci)}
@media (max-width:900px){ .post{grid-template-columns:1fr} .woche7{grid-template-columns:repeat(3,1fr)} }

/* ── channel previews (Inhalte) ────────────────────────────────────────────
   A status table can only claim that the channels disagree. These render what
   each channel currently shows, so one that has not been released proves it
   with the old price on screen.
   ────────────────────────────────────────────────────────────────────────── */
.kanaele{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kanal{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.kanal.alt{border-color:rgba(178,94,0,.35)}
.kanal .kopf{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--surf);
  border-bottom:1px solid var(--soft);font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim)}
.kanal .kopf .tag{margin-left:auto}
.kanal .inhalt{padding:11px 12px;display:flex;flex-direction:column;flex:1}
.kanal .stale{color:var(--warn);font-size:10.5px;font-weight:600;margin-top:auto;
  padding-top:9px;border-top:1px solid var(--soft)}
.mock-url{display:flex;align-items:center;gap:5px;background:var(--surf);border-radius:6px;
  padding:4px 7px;font-size:9.5px;color:var(--dim);margin-bottom:10px}
.mock-url i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.16);flex:none}
.mock-h{font-size:13px;font-weight:700;letter-spacing:-.01em}
.mock-p{font-size:11px;color:var(--dim);line-height:1.5;margin-top:3px}
.mock-preis{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mock-zeile{display:flex;align-items:baseline;gap:6px;margin-top:7px}
.mock-fuell{flex:1;border-bottom:1px dotted rgba(0,0,0,.28);transform:translateY(-3px)}
.mock-paper{background:#fffdf6;border:1px solid rgba(0,0,0,.08);border-radius:4px;padding:11px 12px;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mock-paper .kl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.mock-bild{height:56px;border-radius:8px;margin-bottom:9px;
  background:linear-gradient(135deg,#cfe9e3,#8ed2c5 55%,#d8e9ae)}
.mock-mail{border-left:3px solid var(--acc);padding-left:10px}
.mock-res{border:1px solid var(--soft);border-radius:8px;padding:9px 10px}
.mock-res .dat{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--acci);margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
       border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--wash);border-color:var(--acc)}

/* ── dashboard: a packing grid, not equal-height rows ─────────────────────
   align-items:start is the whole trick — without it every card stretches to
   the tallest sibling in its row and the short ones end up half empty.
   ────────────────────────────────────────────────────────────────────────── */
/* minmax(0,1fr), nicht 1fr: sonst zieht eine Kachel mit breitem Inhalt ihre
   Spalte auf und drückt die Nachbarspalten auf 80 px zusammen. Auf 1024 px
   sah die Übersicht genau so aus. */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px;align-items:start}
.dash .card{padding:12px 14px}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}
.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}
.w8{grid-column:span 8}.w12{grid-column:span 12}
/* ── Struktur auf der Übersicht ───────────────────────────────────────────
   Neun gleich aussehende Kacheln sind eine Wand. Drei benannte Spalten und
   eine benannte Zahlenreihe machen daraus eine Leserichtung: was muss ich
   entscheiden, läuft der Betrieb, was verdient das Haus. Der Kopf steht IN
   der Spalte, also wandert er beim Umbruch mit seiner Gruppe mit.
   ───────────────────────────────────────────────────────────────────────── */
.bandkopf,.spkopf{display:flex;align-items:flex-end;gap:10px;padding:0 2px 5px;
  border-bottom:1px solid var(--line)}
.bandkopf{margin-top:4px}
/* Die Übersicht ist auf einen Schirm gebaut. Die Kacheln enden bei 892 px auf
   einem 1440x900-Laptop; die 40 px Fusspolster, die jede andere Ansicht zum
   Scrollen braucht, würden genau sie über die Kante schieben. */
@media (min-width:821px){ #view:has(> .dash){padding-bottom:8px} }
.spkopf{margin-bottom:-1px}
.bt{font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.bu{font-size:10.5px;color:var(--dim);line-height:1.3}
.bandkopf .bu{padding-bottom:1px}
.bs{margin-left:auto;flex:none;font-size:10.5px;font-weight:650;color:var(--dim);
  white-space:nowrap;padding-bottom:1px}
.bs.warn{color:var(--warn)}
.bs.ok{color:var(--acci)}
@media (max-width:520px){ .bandkopf,.spkopf{flex-wrap:wrap;gap:2px 10px}
  .bs{margin-left:0;width:100%} }
.wl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;
    align-items:baseline;gap:8px}
.wl .r2{letter-spacing:0;text-transform:none;font-weight:600;font-size:10.5px}
.big{font-size:21px;font-weight:700;letter-spacing:-.022em;line-height:1.05}
.sm2{font-size:10.5px;color:var(--dim);margin-top:2px}
/* one row = label, chart, value. Five of these fit where one old card did. */
.mini{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.mini .nm{font-size:11.5px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
.mini .ch{flex:0 0 96px}
.mini .vl{font-size:11.5px;font-weight:650;flex:0 0 76px;text-align:right;white-space:nowrap;
          font-variant-numeric:tabular-nums}
/* long labels do not fit beside a bar in a third of the width, so the bar
   widgets put the name and the value on their own line and the bar beneath */
.mini2{padding:3px 0}
.mini2 .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.mini2 .nm2{font-size:11.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini2 .vl2{font-size:11.5px;font-weight:650;white-space:nowrap;flex:none;
            font-variant-numeric:tabular-nums}
/* grid does not pack, so each dashboard column is its own stack and the
   short widgets sit directly under one another instead of leaving a hole */
.col{display:flex;flex-direction:column;gap:10px;align-self:start}
.dec{padding:6px 9px;border-radius:7px;background:rgba(178,94,0,.05);
     border:1px solid rgba(178,94,0,.20);margin-bottom:4px;cursor:pointer}
.dec:last-child{margin-bottom:0}
.dec b{font-size:11.5px}
.dec .why{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.dec.calm{background:rgba(0,178,160,.05);border-color:rgba(0,178,160,.24)}
.dec.jetzt{background:var(--badbg);border-color:rgba(192,42,23,.30)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;
      background:rgba(0,0,0,.045);color:var(--dim);cursor:pointer;white-space:nowrap}
.chip:hover,.chip:active{background:var(--wash);color:var(--acci)}
.chip.s1{background:var(--okbg);color:var(--acci)}
.chip.s2{background:var(--warnbg);color:var(--warn)}
.chip.s3{background:var(--badbg);color:var(--bad)}
/* Unter 1180 px wird aus dem 12er- ein 6er-Raster. Das «span 12» der Ampel und
   der Bandköpfe muss mitwandern, sonst legt der Browser sechs implizite
   Spalten dazu, sortiert sie nach Inhalt und die Kacheln stehen auf 80 px. */
@media (max-width:1180px){ .dash{grid-template-columns:repeat(6,minmax(0,1fr))}
  .w3,.w4,.w5{grid-column:span 3}.w6,.w7,.w8,.w12{grid-column:span 6} }
@media (max-width:820px){ .dash{grid-template-columns:1fr}
  .w2,.w3,.w4,.w5,.w6,.w7,.w8,.w12{grid-column:span 1} }

/* ── Axyom fragen: the corner box ──────────────────────────────────────────
   A question is faster than knowing which module holds the answer, so the
   box sits over every screen and reads the same DB the screens read.
   ────────────────────────────────────────────────────────────────────────── */
#chatbtn{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:9px;
  background:var(--dark);color:#fff;border:none;border-radius:99px;padding:11px 17px 11px 14px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .16s,opacity .16s}
#chatbtn:hover{transform:translateY(-1px)}
#chatbtn .logo{width:62px;height:28px;flex:none}
#chatbtn .pip{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
#chatbtn.weg{opacity:0;pointer-events:none;transform:translateY(8px)}
/* Er klebt unten rechts, wo bei einer Tabelle Zahlen stehen. Also tritt er
   zur Seite, solange gerollt oder in ein Feld getippt wird. */
#chatbtn.schlaeft{opacity:0;pointer-events:none;transform:translateY(10px) scale(.96)}

#chat{position:fixed;right:22px;bottom:22px;z-index:61;width:396px;max-height:min(660px,calc(100vh - 44px));
  background:#fff;border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;
  overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
#chat.on{display:flex}
#chat .top{display:flex;align-items:center;gap:9px;padding:13px 14px;background:var(--dark);color:#fff;flex:none}
#chat .top .logo{width:66px;height:30px;flex:none}
#chat .top b{font-size:14px;font-weight:700;color:var(--acc);margin-left:-2px}
#chat .top .s{font-size:11px;color:rgba(255,255,255,.5);margin-left:auto}
#chat-zu{background:none;border:none;color:rgba(255,255,255,.55);font-size:19px;line-height:1;
  cursor:pointer;padding:0 2px;font-family:inherit}
#chat-zu:hover{color:#fff}
#chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#chat .msg{max-width:100%;font-size:12.5px;line-height:1.5}
#chat .msg.u{align-self:flex-end;background:var(--ink);color:#fff;padding:8px 12px;border-radius:13px 13px 3px 13px;
  max-width:82%;font-weight:500}
#chat .msg.b{align-self:stretch;background:var(--surf);border:1px solid var(--soft);
  border-radius:13px 13px 13px 3px;padding:11px 13px}
#chat .qk{font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:6px}
#chat .qz{font-size:12px;line-height:1.55;color:var(--dim);padding:3.5px 0;border-top:1px solid var(--soft)}
#chat .qz:first-of-type{border-top:none;padding-top:0}
#chat .qz b{color:var(--ink);font-weight:650}
#chat .hl{color:var(--warn);font-weight:600}
#chat .bad{color:var(--bad);font-weight:650}
#chat .mod{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--acci);background:var(--wash);padding:1px 5px;border-radius:4px;white-space:nowrap}
#chat .tipp{display:flex;gap:4px;align-self:flex-start;padding:12px 13px}
#chat .tipp i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:tp 1s infinite}
#chat .tipp i:nth-child(2){animation-delay:.14s}
#chat .tipp i:nth-child(3){animation-delay:.28s}
@keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:.9}}
#chat .foot{flex:none;display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--soft);background:#fff}
#chat-in{flex:1;min-width:0;border-radius:9px}
#chat-send{flex:none}
@media (max-width:820px){
  #chat{right:12px;left:12px;bottom:12px;width:auto;max-height:calc(100vh - 24px)}
  #chatbtn{right:12px;bottom:12px}
}

/* ── toast ── */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);cursor:pointer;
  background:var(--dark);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;z-index:70;max-width:520px;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast b{color:var(--acc)}
/* the colour says how bad it is before the sentence is read */
#toast{border-left:4px solid transparent}
#toast.s3{border-left-color:var(--bad)}
#toast.s3 b{color:#ff8a75}
#toast.s2{border-left-color:#e08a2e}
#toast.s2 b{color:#ffc079}
#toast.s1{border-left-color:var(--acc)}
/* four KPI cards stop fitting long before the phone breakpoint: at 900px
   «CHF 18'294.80» pushed the row past the viewport */
@media (max-width:1040px){ .g4{grid-template-columns:repeat(2,1fr)} }
@media (max-width:820px){
  #app{flex-direction:column}
  #rail{width:100%;height:auto;position:static;flex-direction:row;align-items:center;
        overflow-x:auto;padding:10px}
  #rail nav{flex-direction:row}#rail .outlets{display:none}#rail .brand{padding:0 12px 0 4px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  header,.body{padding-left:16px;padding-right:16px}
}

/* ── Am Handy ──────────────────────────────────────────────────────────────
   Gezählt, abgehakt und quittiert wird am Handy, nicht am Schreibtisch. Alles
   hier ist eine Daumenregel:
     * 44 px Trefferfläche für alles, was angetippt wird;
     * 16 px Schrift in jedem Eingabefeld — darunter zoomt iOS beim Antippen
       hinein und die Seite steht danach schief;
     * Platz unter dem letzten Inhalt, weil der Chat-Knopf unten rechts klebt;
     * die Leiste bleibt oben stehen, der Kopf scrollt weg: Navigation ist am
       Handy wichtiger als ein Titel, der ohnehin daneben steht.
   ────────────────────────────────────────────────────────────────────────── */
@media (max-width:820px){
  .body{padding:16px 16px 108px}
  header{position:static;padding:14px 16px 12px;align-items:flex-start}
  header h1{font-size:19px;min-width:0}
  /* das Fragezeichen bleibt neben dem Titel: umgebrochen stand es allein auf
     einer Zeile und sah aus wie ein Knopf ohne Zusammenhang */
  header .row{flex-wrap:nowrap;align-items:flex-start}
  header #hilfe-btn{margin-top:-2px}
  /* Die Leiste wird am Telefon zu zwei waagrechten Streifen: oben Marke und
     Mandant, darunter die Module. Beide rollen seitlich, beide bleiben oben
     stehen — Navigation ist am Telefon wichtiger als ein Titel. */
  #rail{position:sticky;top:0;z-index:30;padding:8px 10px;gap:8px;flex-wrap:wrap;
        align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
  #rail .brand{flex:0 0 auto}
  #rail .mandant{flex:1 1 auto;flex-direction:row;align-items:center;gap:8px;
    padding:0;margin:0;border:none;overflow-x:auto;scrollbar-width:none}
  #rail .mandant::-webkit-scrollbar{display:none}
  #rail .mandant > span{display:none}
  #rail .mwahl{flex-direction:row;gap:6px}
  #rail .mwahl button{width:auto;white-space:nowrap;padding:8px 11px}
  #rail .mwahl button .kn{margin-left:5px}
  #rail nav{flex:1 1 100%}
  /* Der Kopf stapelt: Titel, Untertitel, dann die Werkzeuge in einer Zeile. */
  header{flex-direction:column;align-items:stretch;gap:9px}
  header .werkzeug{justify-content:flex-start;gap:8px}
  header .werkzeug .suche{flex:1 1 100%}
  header .werkzeug .rolle{flex:1 1 auto}
  header .werkzeug .rolle select{flex:1 1 auto;min-width:0}
  header .demo{order:-1;align-self:flex-start}
  #rail nav{gap:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #rail nav::-webkit-scrollbar{display:none}
  #rail a{min-height:44px;padding:8px 12px;font-size:13.5px;white-space:nowrap}
  #rail a .badge{margin-left:4px}
  /* die Leiste läuft seitlich weiter: das sagt die verlaufende Kante */
  #rail::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
    background:linear-gradient(to left,var(--dark),rgba(11,13,18,0))}
  #hilfe-btn{width:40px;height:40px;font-size:16px;top:0}
  /* auch die Felder, die am Schreibtisch kleiner geschrieben sind: sonst
     zoomt iOS beim Antippen in die Filterzeile hinein */
  .rfilter select,.rfilter input{font-size:16px;padding:10px 12px;min-height:44px}
  [data-shift]{font-size:16px !important;padding:10px 12px !important;min-height:44px}
  .ampel .frage{height:44px;min-width:44px;justify-content:center;padding:0 13px}
  .ampel .hin{min-height:44px;display:flex;align-items:center;font-size:12.5px}
  .ampel .lampe{min-height:44px}
  .btn{min-height:44px;padding:11px 16px;font-size:13.5px}
  input,select,textarea{font-size:16px;min-height:44px;padding:10px 12px}
  textarea{min-height:96px}
  .chip{font-size:12px;font-weight:650;padding:0 13px;min-height:42px;border-radius:9px;
    display:inline-flex;align-items:center}
  .chips{gap:6px}
  .tab{min-height:42px;padding:0 15px;font-size:13px;display:inline-flex;align-items:center}
  .tabs{gap:7px;flex-wrap:wrap}
  td{padding:14px 10px}
  .dec{padding:13px 14px}
  .lampe .glas{width:42px;height:42px;font-size:15px}
  .lampe{margin-right:12px}
  .ampel .frage{height:38px;padding:0 12px}
  .ampel{padding:10px 12px}
  .zahnrad{width:42px;height:42px}
  .frage{min-height:42px}
  .zpost{min-height:44px;display:flex;align-items:center;justify-content:space-between}
  .kpost{min-height:42px;display:flex;align-items:center;gap:7px;font-size:12px;padding:0 10px}
  /* Links im Satz bleiben Links im Satz: eine 44-px-Fläche würde den Satz
     auseinanderreissen. Sie bekommen etwas Luft und eine Tippfarbe. */
  .link,[data-go]:not(.card):not(.chip):not(.tab){-webkit-tap-highlight-color:rgba(0,178,160,.16)}
  span.link{padding:3px 0}
  .ktag{min-height:44px}
  .flug{font-size:12.5px}
  .flug .hilfeliste li{font-size:12.5px;line-height:1.6}
  /* der Chat nimmt das Telefon ganz, und die dynamische Höhe rechnet mit der
     Tastatur: 100vh ist auf iOS die Höhe OHNE sie */
  #chat{right:10px;left:10px;bottom:10px;width:auto;max-height:calc(100dvh - 20px)}
  body.chatOffen{overflow:hidden}
  /* ein Vorhang, damit klar ist, was jetzt gilt */
  body.chatOffen::after{content:'';position:fixed;inset:0;background:rgba(11,13,18,.42);z-index:60}
  #chat-in{min-height:44px;font-size:16px}
  #chatbtn{right:12px;bottom:12px;min-height:48px}
  /* Am Handy liest man von oben nach unten und hört irgendwann auf. Also
     kommt zuerst, was eine Entscheidung braucht, und erst danach die Woche
     in Zahlen — am Schreibtisch stehen sie nebeneinander, da ist es einerlei. */
  .dash .ampel{order:0}
  .dash .sp1{order:1}
  .dash .bandkopf{order:2}
  .dash .wkpi{order:3}
  .dash .sp2{order:4}
  .dash .sp3{order:5}
  /* drei farbige Kreise ohne Wort sind ein Rätsel: die Beschriftung bleibt,
     das Band darf dafür umbrechen */
  .lampe .txt{display:block;font-size:8.5px;letter-spacing:.04em}
  .lampe{margin-right:7px;flex:0 0 auto}
  /* das Fragezeichen in die Ecke des Bandes, sonst schiebt es die dritte
     Lampe in eine eigene Zeile und lässt ein Loch stehen */
  .ampel{position:relative;padding:10px 58px 10px 12px}
  .ampel .frage{position:absolute;top:9px;right:10px;margin:0}
  .ampel .jetzt{margin-top:6px}
  /* die Ergebniszeile der Rechnungen: eine Zeile pro Aussage, statt sieben
     Bruchstücke, die sich über vier Zeilen verteilen */
  .rerg{flex-direction:column;gap:3px;font-size:13px;padding-bottom:12px}
  header .demo{font-size:9px;padding:4px 7px}
  #rail .brand .logo{width:78px}
  #rail .brand{padding:0 8px 0 2px}
  #rail .brand span{display:none}
  /* Beim seitlichen Wischen muss sichtbar bleiben, zu welcher Zeile eine Zahl
     gehört: die erste Spalte bleibt stehen. */
  /* Ein Detailblock lebt in einer Tabellenzeile, und die Tabelle ist breiter als
     das Glas. Damit der Beleg nicht mitwandert und nicht 800 px breit wird,
     klebt sein Inhalt links und misst sich am Fenster, nicht an der Tabelle. */
  tr.detailzeile > td > *{position:sticky;left:0;width:calc(100vw - 34px);
    max-width:calc(100vw - 34px);box-sizing:border-box}
  .rdoc{padding:18px 16px;flex:1 1 auto;max-width:calc(100vw - 34px);overflow:hidden}
  /* der Briefkopf bricht um, statt den Beleg breiter zu machen als das Telefon */
  .rdkopf{flex-wrap:wrap;gap:10px}
  .rdmeta{text-align:left}
  .rdmeta div{gap:10px;justify-content:flex-start}
  .rdsumme{width:100%;margin-top:14px}
  /* der Mandantenumschalter ist der wichtigste Knopf der Leiste */
  #mwahl button{min-height:44px}
  #rail .mandant{padding:0 4px 10px;margin-bottom:8px}
  .scrollx td:first-child,.scrollx th:first-child{position:sticky;left:0;z-index:2;
    background:#fff;box-shadow:1px 0 0 var(--soft);
    /* die haftende Spalte darf nie breiter sein als ein gutes Drittel, sonst
       liegt sie über allem anderen und fängt die Tipps ab, die dahinter
       gemeint waren */
    max-width:40vw;white-space:normal}
  .scrollx tr.gewaehlt td:first-child{background:var(--okbg)}
  /* in der haftenden Spalte wird umgebrochen statt abgeschnitten: «eingekauft
     zu CHF 10.…» sagt nichts, die ganze Zeile sagt alles */
  .scrollx td:first-child .zeile1,.mitzahnrad td:nth-child(2) .zeile1{white-space:normal;
    overflow:visible;text-overflow:clip}
  /* drei Kennzahlenkarten à 200 px sind 600 px Vorspann, bevor die Tabelle
     kommt. Am Handy stehen Etikett, Zahl und Zusatz gedrängter. */
  .card.kpi{padding:12px 14px}
  .card.kpi .n{font-size:21px;margin-top:2px}
  .card.kpi .d{margin-top:2px}
  .scrollx .detailzeile td{position:static;box-shadow:none;max-width:none}
  /* im Lager ist die erste Zelle das Zahnrad: dort haftet die zweite dazu,
     genau um die Breite der ersten versetzt (--haft, gesetzt beim Rendern) */
  .mitzahnrad td:nth-child(2),.mitzahnrad th:nth-child(2){position:sticky;
    left:var(--haft,52px);z-index:2;background:#fff;box-shadow:1px 0 0 var(--soft);
    max-width:36vw;white-space:normal}
  .mitzahnrad tr.gewaehlt td:nth-child(2){background:var(--okbg)}
  /* Schriftboden: unter 11 px liest niemand etwas am Küchentisch */
  .wl,.kpi .l,th,.tag,.knr,#rail a .badge,.r2,.sm2,.bu,.bs,.why,.klein,
  .kl,.mock-url,.dat,.pfeld > label,.d{font-size:11.5px}
  .kheute{font-size:11px}
  .tag{padding:4px 8px}
  .check{width:44px;height:44px;border-radius:10px}
  .check svg{width:18px;height:18px}
  .flugzu{width:40px;height:40px;font-size:24px}
  #chat-zu{width:44px;height:44px;font-size:22px}
  #hilfe-btn{width:44px;height:44px}
  .zahnrad{width:44px;height:44px}
  .tab{min-height:44px}
  .chip{min-height:44px}
  .frage,.ampel .frage{height:44px}
  .ktag{min-height:44px}
  .kpost{min-height:44px}
  #view .link,span.link{min-height:32px}
  /* der Verlauf war ein 62-px-Streifen: auf dem Handy hat er Platz in der Höhe,
     und ohne Verzerrung stimmt die Kurve auch */
  .verlaufkopf .vchart svg{height:130px !important}
  /* die dringendste Sache darf zwei Zeilen brauchen, statt abgeschnitten zu werden */
  .ampel .jetzt b,.ampel .jetzt .why{white-space:normal;overflow:visible;text-overflow:clip}
  .ampel .jetzt{flex-wrap:wrap}
  .ampel .hin{margin-left:0}
  span.link{display:inline-block;padding:5px 0}
  [data-karte],[data-kartepreis]{width:112px !important}
  /* der Toast gehört über den Chat-Knopf, nicht dahinter */
  #toast{left:12px;right:12px;bottom:78px;transform:translateY(20px);max-width:none;z-index:70;
    font-size:13.5px}
  #toast.show{transform:translateY(0)}
  /* im Kalender bleiben am Handy nur die Tage, an denen etwas war: 31 leere
     Zeilen sind 900 px Nichts, durch die niemand wischt */
  .kgrid .ktag:not(.gezaehlt):not(.hatwas):not(.heute){display:none}
  /* und im Chip steht, um welchen Beitrag es geht — der Titel hing vorher nur
     im title-Attribut, also an einem Zeiger, den ein Telefon nicht hat */
  .kpost .ktitel{display:inline;font-weight:600;opacity:.95}
  .kpost .kkanal{opacity:.7}
  .kpost{white-space:normal;line-height:1.35;padding:8px 10px;gap:5px;flex-wrap:wrap}
  .kgrid{gap:7px}
  .ktag{min-height:0;padding:9px 10px}
  .woche7 .t7{min-height:0}
}
/* ── eine Tabelle, die seitlich läuft, sagt es ────────────────────────────
   Auf einem Telefon ist eine siebenspaltige Tabelle immer breiter als das
   Glas. Der Schatten an der Kante steht nur dann da, wenn wirklich noch
   etwas kommt, und verschwindet am Ende des Weges. */
.scrollbox{position:relative}
.scrollbox.kanns::after{content:'';position:absolute;top:0;right:0;bottom:0;width:34px;
  pointer-events:none;background:linear-gradient(to left,rgba(255,255,255,.97),rgba(255,255,255,0));
  transition:opacity .15s}
.scrollbox .weiter{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-family:inherit;font-size:17px;font-weight:700;line-height:1;padding:0 0 2px;
  cursor:pointer;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.16);transition:opacity .15s;display:none}
.scrollbox.kanns .weiter{display:block}
.scrollbox.kanns.amEnde::after,.scrollbox.kanns.amEnde .weiter{opacity:0;pointer-events:none}
.scrollbox .weiter:hover,.scrollbox .weiter:active{border-color:var(--acc);color:var(--acci)}
@media (max-width:820px){ .scrollbox .weiter{width:44px;height:44px;font-size:21px;right:5px} }
/* Tippen soll sich wie Tippen anfühlen: kein blaues Aufblitzen, keine 300 ms
   Wartezeit auf einen möglichen Doppeltipp. */
html{-webkit-text-size-adjust:100%}
button,a,.chip,.tab,.lampe,tr.click,.ktag,.zahnrad,[data-go]{touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(0,178,160,.16)}

/* ── Prototyp-Eigenes ─────────────────────────────────────────────────────
   Alles, was diese Anwendung braucht und die Restaurant-Demo nicht hatte:
   der Mandanten- und Rollenumschalter, die globale Suche, die Chronik einer
   Projektakte, die Belegkette, die Importanalyse und die Anforderungs-IDs.
   ───────────────────────────────────────────────────────────────────────── */

/* der Mandant steht oben in der Leiste und färbt, was zu ihm gehört */
#rail .mandant{display:flex;flex-direction:column;gap:5px;padding:0 4px 14px;margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.1)}
#rail .mandant > span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.38)}
#rail .mwahl{display:flex;flex-direction:column;gap:3px}
#rail .mwahl button{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;
  border:1px solid transparent;background:none;font-family:inherit;font-size:12.5px;font-weight:600;
  color:rgba(255,255,255,.62);cursor:pointer;text-align:left;width:100%}
#rail .mwahl button i{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
#rail .mwahl button:hover{background:rgba(255,255,255,.06);color:#fff}
#rail .mwahl button.on{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.16)}
#rail .mwahl button.alle{font-style:italic}
#rail .mwahl button .kn{margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.4);font-weight:600}

/* Rolle und Suche wohnen im Kopf */
header .werkzeug{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.rolle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
.rolle select{font-size:12.5px;padding:7px 9px}
.suche{position:relative;flex:0 1 260px;min-width:0}
.suche input{width:100%;padding-left:30px}
.suche .lupe{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.treffer{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.18);
  max-height:min(70vh,560px);overflow:auto;padding:6px}
.treffer .tgruppe{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);padding:9px 10px 5px}
.treffer button{display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;
  padding:9px 10px;border-radius:9px;cursor:pointer}
.treffer button:hover{background:var(--wash)}
.treffer .tz1{font-size:13px;font-weight:600;color:var(--ink)}
.treffer .tz2{font-size:11px;color:var(--dim);margin-top:2px}
.treffer .leer{padding:14px 10px;font-size:12.5px;color:var(--dim)}
.treffer .gesperrt{padding:10px;font-size:11.5px;color:var(--warn);background:var(--warnbg);
  border-radius:9px;margin:4px}

/* die Anforderungs-ID neben der Funktion, die sie erfüllt */
.aid{display:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;
  font-weight:600;letter-spacing:.02em;color:var(--acci);background:var(--okbg);
  border:1px solid rgba(0,178,160,.28);border-radius:5px;padding:1px 5px;vertical-align:2px;
  white-space:nowrap}
body.ids .aid{display:inline-block}
body.ids .aid + .aid{margin-left:3px}

/* die Chronik einer Projektakte */
.chronik{display:flex;flex-direction:column;gap:0}
.chronik .cz{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--soft)}
.chronik .cz:first-child{border-top:none}
.chronik .cd{flex:0 0 74px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  padding-top:2px}
.chronik .ci{flex:0 0 26px;display:flex;justify-content:center;padding-top:1px;color:var(--dim)}
.chronik .cb{min-width:0;flex:1}
.chronik .ct{font-size:13px;font-weight:600}
.chronik .cs{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.chronik .cz.dok .ci{color:var(--acci)}
.chronik .cz.geld .ci{color:var(--warn)}

/* die Belegkette: Offerte → Auftrag → Lieferschein → Rechnung */
.kette{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:2px 0 16px}
.kette .kglied{flex:1 1 150px;min-width:0;border:1px solid var(--soft);background:#fff;
  border-radius:10px;padding:10px 12px;position:relative}
.kette .kpfeil{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.kette .kglied .kt{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim)}
.kette .kglied .knr2{font-size:13px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.kette .kglied .ks{font-size:11px;color:var(--dim);margin-top:3px}
.kette .kglied.offen{border-style:dashed;background:var(--surf)}
.kette .kglied.fertig{border-color:rgba(0,178,160,.4);background:var(--okbg)}
.kette .kglied button{margin-top:7px}

/* die Importanalyse */
.ianalyse{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}
.ianalyse .ik{border:1px solid var(--soft);border-radius:11px;padding:11px 12px;background:#fff;
  cursor:pointer}
.ianalyse .ik.on{border-color:var(--acc);background:var(--okbg)}
.ianalyse .ik .n{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ianalyse .ik .l{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);margin-top:2px}
.ianalyse .ik.fehler .n{color:var(--bad)}
.ianalyse .ik.geaendert .n{color:var(--warn)}
.ianalyse .ik.neu .n{color:var(--acci)}
@media (max-width:820px){ .ianalyse{grid-template-columns:repeat(2,1fr)} }

/* die Spaltenzuordnung des Imports */
.mapping{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px 10px;align-items:center;
  padding:12px 0}
.mapping .mq{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--surf);
  border:1px solid var(--soft);border-radius:8px;padding:8px 10px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mapping .mp{text-align:center;color:var(--dim)}
@media (max-width:560px){ .mapping{grid-template-columns:1fr;gap:4px}
  .mapping .mp{display:none} }

/* Rechtehinweis, wenn eine Rolle etwas nicht sehen darf */
.verdeckt{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);
  background:rgba(0,0,0,.045);border:1px dashed var(--line);border-radius:7px;padding:2px 8px}
.rsperre{display:flex;gap:11px;align-items:flex-start;background:var(--warnbg);
  border:1px solid rgba(178,94,0,.25);border-radius:12px;padding:13px 15px;margin-bottom:16px}
.rsperre b{display:block;font-size:12.5px;margin-bottom:2px}
.rsperre div{font-size:11.5px;color:var(--warn);line-height:1.5}

/* der Prüfstempel des Archivs */
.hash{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--dim);
  word-break:break-all;line-height:1.45}
.siegel{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--acci);background:var(--okbg);
  border:1px solid rgba(0,178,160,.3);border-radius:6px;padding:3px 8px}
.siegel.storniert{color:var(--bad);background:var(--badbg);border-color:rgba(192,42,23,.3)}

/* Stufenbalken für Alterung und Mahnstufen */
.stufen{display:flex;gap:4px;align-items:center}
.stufen i{width:22px;height:6px;border-radius:3px;background:rgba(0,0,0,.09)}
.stufen i.an{background:var(--warn)}
.stufen i.an.hart{background:var(--bad)}

/* In den schmalen Spalten der Übersicht hat die Hinweisspalte keine 240 px:
   dort bricht die Zeile um, statt den Text abzuschneiden. */
.col .wf .z,.card.w3 .wf .z{flex-wrap:wrap}
.col .wf .z .hint,.card.w3 .wf .z .hint{flex:1 1 100%;justify-content:flex-start;text-align:left}
.col .wf .z .wert{flex:0 0 auto;margin-left:auto}

/* ── Am Handy, Teil zwei ───────────────────────────────────────────────────
   Diese Regeln stehen absichtlich zuletzt: die Grundregeln des Prototyps
   (Leiste, Mandantenumschalter, Beleg) kommen im Stylesheet nach dem ersten
   Handy-Block, und bei gleicher Spezifität gewinnt die spätere Regel.
   ───────────────────────────────────────────────────────────────────────── */
@media (max-width:820px){
  #rail{flex-wrap:wrap;align-items:center}
  #rail .brand{flex:0 0 auto}
  #rail .mandant{flex:1 1 auto;flex-direction:row;align-items:center;gap:8px;
    padding:0;margin:0;border:none;overflow-x:auto;scrollbar-width:none}
  #rail .mandant::-webkit-scrollbar{display:none}
  #rail .mandant > span{display:none}
  #rail .mwahl{flex-direction:row;gap:6px;flex-wrap:nowrap}
  #rail .mwahl button{width:auto;flex:0 0 auto;white-space:nowrap;padding:8px 11px;min-height:44px}
  #rail .mwahl button .kn{margin-left:5px}
  #rail nav{flex:1 1 100%}
  header{flex-direction:column;align-items:stretch;gap:9px}
  header .werkzeug{justify-content:flex-start;gap:8px}
  header .werkzeug .suche{flex:1 1 100%}
  header .werkzeug .rolle{flex:1 1 auto}
  header .werkzeug .rolle select{flex:1 1 auto;min-width:0}
  header .demo{order:-1;align-self:flex-start}
  .treffer{max-height:60vh}
  /* der Beleg misst sich am Fenster, nicht an der Tabelle darunter */
  .rdoc{max-width:calc(100vw - 34px);overflow:hidden;padding:18px 16px}
  .rdkopf{flex-wrap:wrap;gap:10px}
  .rdmeta{text-align:left}
  .rdmeta div{gap:10px;justify-content:flex-start}
  .rdsumme{width:100%;margin-top:14px}
  .rdpruef{flex:1 1 auto;width:100%}
  /* die Belegkette wird eine Liste, keine Reihe */
  .kette{flex-direction:column;gap:6px}
  .kette .kpfeil{transform:rotate(90deg);align-self:center;flex:0 0 auto}
  .kette .kglied{flex:1 1 auto}
  /* die Importanalyse in zwei Spalten, die Zuordnung untereinander */
  .ianalyse{grid-template-columns:repeat(2,1fr)}
  .chronik .cz{flex-wrap:wrap}
  .chronik .cd{flex:0 0 68px}
  .detailkopf b{white-space:nowrap}
  .detailkopf{flex-wrap:wrap}
}

   Ein einziger Datenstand, zwölf Ansichten, ein Rendering. Jede Ansicht ist
   eine Funktion, die aus DB eine Zeichenkette macht; ein Klick ändert den
   Datenstand und lässt neu rechnen. Genau darum stimmen Kennzahl, Liste und
   Beleg immer überein: sie kommen aus derselben Quelle.

   Was hier steht und nicht in den Ansichten: Rechte, Mandantensicht, Geld,
   Suche, Leiste, Kopf — alles, was auf jedem Schirm gleich gelten muss.
   ────────────────────────────────────────────────────────────────────────── */

/* ── Geld, Text, Zahlen ──────────────────────────────────────────────────── */
const chf = n => 'CHF ' + (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('de-CH',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/’/g, "'");
const chf0 = n => 'CHF ' + Math.round(n).toLocaleString('de-CH').replace(/’/g, "'");
const pct = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
/* «38,5» ist auf einer Schweizer Tastatur das Naheliegende, «38.5» auf einer
   anderen. Beides heisst dasselbe; alles andere behält den alten Wert. */
function zahl(v, alt = 0) {
  const n = parseFloat(String(v).replace(',', '.').replace(/[^0-9.\-]/g, ''));
  return Number.isFinite(n) ? n : alt;
}
/* Datum als Zahl, damit sich Fristen vergleichen lassen: 23.09.2026 → 20260923 */
const dz = s => { const m = /(\d{2})\.(\d{2})\.(\d{4})/.exec(s || '');
  return m ? +(m[3] + m[2] + m[1]) : 0; };
const tageBis = s => Math.round((dz(s) ? new Date(s.split('.').reverse().join('-'))
  : new Date()) - new Date('2026-09-23')) / 86400000;

/* ── Geld auf Belegen (DOC-04, ARC-05) ───────────────────────────────────
   Gerechnet wird ausschliesslich mit den Snapshots der Position. Ein Preis,
   der heute in der Artikelliste steht, hat auf einem alten Beleg nichts zu
   suchen — das ist der ganze Punkt von IMP-07. */
const posNetto = p => p.menge * p.preis * (1 - (p.rabatt || 0) / 100);
const posEk = p => p.menge * (p.ekSnap || 0);
const netto = d => d.pos.reduce((s, p) => s + posNetto(p), 0) - (d.abzug ? d.abzug.betrag : 0);
const mwstAuf = d => d.pos.reduce((s, p) => s + posNetto(p) * p.mwst / 100, 0)
  - (d.abzug ? d.abzug.betrag * 0.081 : 0);
const brutto = d => netto(d) + mwstAuf(d);
const bezahlt = d => DB.zahlungen.filter(z => z.dok === d.id).reduce((s, z) => s + z.betrag, 0);
const offenBetrag = d => brutto(d) - bezahlt(d);
const TYP = { OF:'Offerte', AB:'Auftragsbestätigung', LS:'Lieferschein', RG:'Rechnung', GS:'Gutschrift' };
const TYPKURZ = { OF:'Offerte', AB:'Auftrag', LS:'Lieferschein', RG:'Rechnung', GS:'Gutschrift' };

/* ── Projektmarge (MAR-01…04) ────────────────────────────────────────────
   Material aus den eingefrorenen EK der fakturierten Positionen, Arbeit aus
   den Zeiten. Nur Rollen mit ausdrücklichem Recht sehen das Ergebnis. */
function marge(pid) {
  const rechnungen = DB.dokumente.filter(d => d.projekt === pid && d.typ === 'RG'
    && d.status !== 'storniert' && !d.abzug || (d.projekt === pid && d.typ === 'RG'
    && d.status !== 'storniert' && d.abzug && d.art === 'Schlussrechnung'));
  let umsatz = 0, ek = 0;
  rechnungen.forEach(d => d.pos.forEach(p => {
    if (!p.art) return;                       // freie Positionen zählen als Leistung
    umsatz += posNetto(p); ek += posEk(p);
  }));
  const gutschriften = DB.dokumente.filter(d => d.projekt === pid && d.typ === 'GS');
  gutschriften.forEach(d => d.pos.forEach(p => { umsatz -= posNetto(p); }));
  const zeitenP = DB.zeiten.filter(t => t.projekt === pid);
  const verrechnet = zeitenP.filter(t => t.verrechenbar).reduce((s, t) => s + t.dauer * t.satz, 0);
  const intern = zeitenP.reduce((s, t) => s + t.dauer * t.kosten, 0);
  const frei = rechnungen.reduce((s, d) => s + d.pos.filter(p => !p.art)
    .reduce((x, p) => x + posNetto(p), 0), 0);
  const roh = umsatz - ek;
  return { umsatz, ek, roh, frei, verrechnet, intern, db: roh + frei + verrechnet - intern,
           quote: umsatz ? roh / umsatz * 100 : 0, stunden: zeitenP.reduce((s, t) => s + t.dauer, 0) };
}

function offeneSachen() {
  const items = [];
  mDok().filter(d => d.typ === 'RG' && d.status === 'überfällig').forEach(d => {
    const tage = Math.round((dz(DB.heute) - dz(d.faellig)) / 1 % 100) || 0;
    items.push({ ernst:3, wo:'zahlungen', modul:'Zahlungen', ref:d.id,
      was:`${d.nr}: ${chf(offenBetrag(d))} überfällig`,
      warum:`${K(d.kunde).name} · fällig war ${d.faellig}${d.mahnstufe
        ? ` · Mahnstufe ${d.mahnstufe} versendet` : ''} · Teilzahlung berücksichtigt` });
  });
  mFaelle().filter(f => f.status !== 'erledigt').forEach(f => {
    items.push({ ernst:2, wo:'service', modul:'Service', ref:f.id,
      was:`${f.nr}: ${f.titel}`,
      warum:`${K(f.kunde).name} · ${f.status} · Frist ${f.frist} · Kosten ${f.kosten}` });
  });
  DB.aktivitaeten.filter(a => a.status === 'überfällig').forEach(a => {
    items.push({ ernst:2, wo:'projekte', modul:'Projekte', ref:a.projekt,
      was:a.was, warum:`fällig war ${a.faellig} · ${a.wer} · ${a.notiz}` });
  });
  if (!IMPORT_ANGEWENDET && imBlick('lp')) {
    const i = DB.importlauf;
    items.push({ ernst:2, wo:'import', modul:'Preisimport', ref:'imp1',
      was:`Preisliste ${i.hersteller}: ${i.analyse.geaendert} geändert, ${i.analyse.fehler} fehlerhaft`,
      warum:`analysiert am ${i.hochgeladen} · wartet auf Bestätigung · Stichtag ${i.stichtag}` });
  }
  DB.aktivitaeten.filter(a => a.status === 'offen' && a.faellig === DB.heute).forEach(a => {
    items.push({ ernst:2, wo:'verkauf', modul:'Verkauf', ref:a.bezug,
      was:a.was, warum:`heute fällig · ${a.wer} · ${a.notiz}` });
  });
  mDok().filter(d => d.typ === 'OF' && d.status === 'versendet').forEach(d => {
    items.push({ ernst:1, wo:'verkauf', modul:'Verkauf', ref:d.id,
      was:`${d.nr} offen: ${chf(brutto(d))}`,
      warum:`${K(d.kunde).name} · versendet ${d.datum}${d.nachfassAm
        ? ` · nachfassen ${d.nachfassAm}` : ''}` });
  });
  mDok().filter(d => d.typ === 'OF' && d.status === 'Entwurf').forEach(d => {
    items.push({ ernst:1, wo:'verkauf', modul:'Verkauf', ref:d.id,
      was:`${d.nr} ist Entwurf`, warum:`${K(d.kunde).name} · ${d.titel} · noch nicht finalisiert` });
  });
  const unverrechnet = mZeiten().filter(t => t.verrechenbar && !t.dok);
  if (unverrechnet.length) items.push({ ernst:1, wo:'zeiten', modul:'Zeiten', ref:null,
    was:`${unverrechnet.length} Zeitbuchungen nicht verrechnet`,
    warum:`${unverrechnet.reduce((s, t) => s + t.dauer, 0).toFixed(1)} h · ` +
          `${chf(unverrechnet.reduce((s, t) => s + t.dauer * t.satz, 0))} verrechenbar` });
  mLager().filter(l => l.bestand < l.min).forEach(l => {
    items.push({ ernst:1, wo:'lager', modul:'Lager', ref:l.id,
      was:`${l.name}: ${l.bestand} ${l.einheit} unter Mindestbestand`,
      warum:`Mindestbestand ${l.min} ${l.einheit} · ${l.ort}` });
  });
  return items.filter(i => modulErlaubt(i.wo)).sort((a, b) => b.ernst - a.ernst);
}
