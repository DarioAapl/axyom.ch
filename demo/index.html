    <button class="btn ${rechAktiv() ? 'acc' : ''}" data-rreset="1" ${rechAktiv() ? '' : 'disabled'}
      style="align-self:flex-end">Filter zurücksetzen${rechAktiv() ? ` (${rechAnzahl()})` : ''}</button>
  </div>`;
}
// sorting is not a filter, but «Zurücksetzen» has to be reachable after it too
const rechAnzahl = () => [RECH_F.lief, RECH_F.art, RECH_F.jahr, RECH_F.monat, RECH_F.zeit,
                          RECH_F.status, RECH_F.betrag, RECH_F.q.trim(),
                          RECH_F.sort !== 'datum' ? 'sort' : ''].filter(Boolean).length;
const rechAktiv = () => rechAnzahl() > 0;

/* free text still searches everything, including the articles on the lines */
function rechText(r, q) {
  const worte = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!worte.length) return true;
  const label = (RSTATUS[r.status] || RSTATUS.ok)[1];
  const monat = (DB.monate.find(m => m.nr === +r.datum.slice(3, 5)) || {}).name || '';
  const heu = cnorm([r.lief, r.id, r.notiz || '', label, monat, r.wochentag || '', r.datum,
                     ...r.zeilen.map(z => z.name)].join(' '));
  return worte.every(w => {
    const zahl = w.match(/^([<>])?(\d+(?:[.,]\d+)?)$/);
    if (zahl) {
      const n = +zahl[2].replace(',', '.');
      if (zahl[1] === '>') return r.total > n;
      if (zahl[1] === '<') return r.total < n;
      return String(Math.round(r.total)).includes(zahl[2]) || heu.includes(cnorm(w))
             || r.zeilen.some(z => String(z.preis).includes(zahl[2]));
    }
    return heu.includes(cnorm(w));
  });
}

function rechFiltern(alle) {
  const heute = TAGNR(DB.today);
  let l = alle.filter(r => {
    if (RECH_F.lief && r.lief !== RECH_F.lief) return false;
    if (RECH_F.art && !r.zeilen.some(z => z.art === RECH_F.art)) return false;
    if (RECH_F.status === 'offen' && r.status !== 'preis' && r.status !== 'menge') return false;
    if (RECH_F.status && RECH_F.status !== 'offen' && r.status !== RECH_F.status) return false;
    if (RECH_F.jahr && String(r.jahr) !== RECH_F.jahr) return false;
    if (RECH_F.monat && +r.datum.slice(3, 5) !== +RECH_F.monat) return false;
    if (RECH_F.zeit === 'woche' && heute - TAGNR(r.datum) > 3) return false;      // ab Montag
    if (RECH_F.zeit === '30' && heute - TAGNR(r.datum) > 30) return false;
    if (RECH_F.betrag) { const [von, bis] = RECH_F.betrag.split('-').map(Number);
      if (r.total < von) return false;
      if (bis && r.total > bis) return false; }
    return rechText(r, RECH_F.q);
  });
  const neu = (a, b) => (TAGNR(b.datum) - TAGNR(a.datum)) || a.lief.localeCompare(b.lief);
  if (RECH_F.sort === 'datum') l.sort(neu);
  else if (RECH_F.sort === 'alt') l.sort((a, b) => -neu(a, b));
  else if (RECH_F.sort === 'betrag') l.sort((a, b) => b.total - a.total);
  else if (RECH_F.sort === 'lief') l.sort((a, b) => a.lief.localeCompare(b.lief) || neu(a, b));
  return l;
}

/* ── the panel a filter earns: what this article, or this supplier, did ── */
function rechKontext(alle, liste) {
  if (RECH_F.art) {
    const a = DB.artikel[RECH_F.art];
    const zeilen = alle.filter(r => r.zeilen.some(z => z.art === RECH_F.art))
      .map(r => ({ datum: r.datum, z: r.zeilen.find(z => z.art === RECH_F.art) }))
      .sort((x, y) => TAGNR(x.datum) - TAGNR(y.datum));
    if (!zeilen.length) return '';
    const menge = zeilen.reduce((s, x) => s + x.z.menge, 0);
    const summe = zeilen.reduce((s, x) => s + x.z.summe, 0);
    // die Preisschritte, wie sie in den Rechnungen stehen
    const schritte = [];
    zeilen.forEach(x => { const letzte = schritte[schritte.length - 1];
      if (!letzte || letzte.preis !== x.z.preis) schritte.push({ ab: x.datum, preis: x.z.preis }); });
    const erst = schritte[0], letzt = schritte[schritte.length - 1];
    return `<div class="card kontext">
      <div class="wl"><span>${esc(a.name)} · ${esc(a.lief)}</span>
        <span class="r2">${zeilen.length} Lieferungen seit der Eröffnung</span></div>
      <div class="kzahlen">
        <div><div class="vk">Gekauft</div><div class="vl2">${menge} ${esc(
          { 'Fl.':'Flaschen', 'Port.':'Portionen', 'Stk':'Packungen' }[a.einheit] || 'Packungen')}</div>
          <div class="vn muted">${esc(a.name.split(', ')[1] || a.einheit)} pro Packung</div></div>
        <div><div class="vk">Ausgegeben</div><div class="vl2">${chf(summe)}</div>
          <div class="vn muted">über ${zeilen.length} Lieferungen</div></div>
        <div><div class="vk">Zuletzt verrechnet</div><div class="vl2">${chf(letzt.preis)}</div>
          <div class="vn" style="color:${letzt.preis > erst.preis ? 'var(--warn)' : 'var(--acci)'}"
            >${pct((letzt.preis / erst.preis - 1) * 100)} seit der ersten Lieferung</div></div>
        <div><div class="vk">Kalkuliert mit</div><div class="vl2">${chf(a.preis)}</div>
          ${a.preis !== letzt.preis
            ? `<div class="vn" style="color:var(--warn)">Differenz noch nicht entschieden</div>`
            : '<div class="vn muted">stimmt mit der letzten Rechnung</div>'}</div>
      </div>
      ${a.preis !== letzt.preis ? `<div class="small" style="margin-top:10px;color:var(--warn)">
        Die letzte Rechnung verlangt ${chf(letzt.preis)}, kalkuliert wird noch mit ${chf(a.preis)} —
        die Entscheidung steht in der Liste unten (Status «Preis geändert»).</div>` : ''}
      <div class="kschritte">${schritte.map((x, i) => `<div class="ks">
        <span class="ksd">${esc(x.ab)}</span>
        <span class="ksp">${chf(x.preis)}</span>
        ${i ? `<span class="ksv ${x.preis > schritte[i-1].preis ? 'hoch' : 'tief'}"
          >${pct((x.preis / schritte[i-1].preis - 1) * 100)}</span>` : '<span class="ksv">erste Lieferung</span>'}
        </div>`).join('')}</div>
      <div class="small muted" style="margin-top:10px">Jeder Schritt steht in einer Rechnung, die hier
        in der Liste liegt — die Preisgeschichte ist nicht separat gepflegt, sie ist gelesen.</div></div>`;
  }
  if (RECH_F.lief) {
    const rs = alle.filter(r => r.lief === RECH_F.lief);
    const arts = [...new Set(rs.flatMap(r => r.zeilen.map(z => z.name.split(',')[0])))];
    const letzte = rs.slice().sort((a, b) => TAGNR(b.datum) - TAGNR(a.datum))[0];
    const summe = rs.reduce((s, r) => s + r.total, 0);
    return `<div class="card kontext">
      <div class="wl"><span>${esc(RECH_F.lief)}</span>
        <span class="r2">${rs.length} Rechnungen seit der Eröffnung</span></div>
      <div class="kzahlen">
        <div><div class="vk">Zusammen</div><div class="vl2">${chf(summe)}</div></div>
        <div><div class="vk">Im Schnitt</div><div class="vl2">${chf(summe / rs.length)}</div></div>
        <div><div class="vk">Letzte Lieferung</div><div class="vl2">${esc(letzte.datum)}</div>
          <div class="vn muted">${esc(letzte.wochentag || '')}</div></div>
        <div><div class="vk">Entscheidungen</div><div class="vl2">${rs.filter(r => r.notiz
          || r.status === 'preis' || r.status === 'menge').length}</div></div>
      </div>
      <div class="small muted" style="margin-top:10px">Geführte Artikel: ${arts.map(esc).join(', ')}.</div></div>`;
  }
  return '';
}


/* ── one invoice, as the document it arrived as ── */
function rechDokument(r) {
  const adr = ADRESSEN[r.lief] || [r.lief, '', ''];
  const netto = r.netto, total = r.total;
  const mwstBetrag = +(netto * r.mwst / 100).toFixed(2);
  const dokZeilen = r.zeilen.map(z => {
    const a = DB.artikel[z.art];
    const hoch = a && z.preis > a.vorher;
    const fehlt = z.geliefert !== undefined && z.geliefert < z.menge;
    return `<tr${hoch || fehlt ? ' class="rdwarn"' : ''}>
      <td class="num">${z.menge}</td><td>${esc(z.name)}</td>
      <td class="r num">${chf(z.preis)}${hoch ? `<div class="rdklein">vorher ${chf(a.vorher)}</div>` : ''}</td>
      <td class="r num">${chf(z.summe)}${fehlt ? `<div class="rdklein">${z.geliefert} geliefert</div>` : ''}</td></tr>`;
  }).join('');

  let entscheid = '';
  if (r.status === 'preis') {
    const z = r.zeilen.find(x => DB.artikel[x.art] && x.preis > DB.artikel[x.art].vorher);
    const a = DB.artikel[z.art];
    const betroffen = DB.gerichte.filter(g => g.rezept.some(x => x.art === z.art));
    entscheid = `<div class="pz"><span class="pj" style="color:var(--warn)">!</span>
        <div><b>${esc(a.name.split(',')[0])}: ${chf(a.vorher)} → ${chf(z.preis)}</b>
        (${pct((z.preis / a.vorher - 1) * 100)}) seit der letzten Lieferung. Steckt in
        ${betroffen.length} Gericht${betroffen.length > 1 ? 'en' : ''} auf der Karte.</div></div>
      <div class="pz"><span class="pj">i</span><div>Die Rechnung ist fällig, so oder so — bezahlt wird,
        was geliefert wurde, und dieser Einkauf steckt schon in den Zahlen. Hier entscheiden Sie nur,
        ob ab jetzt <b>mit ${chf(z.preis)} kalkuliert</b> wird.</div></div>
      <div class="row" style="margin-top:12px">
        <button class="btn acc" data-act="preis-uebernehmen" data-art="${z.art}"
                data-neu="${z.preis}">Preis übernehmen</button>
        <button class="btn" data-act="preis-nachfragen">Beim Lieferanten nachfragen</button></div>`;
  } else if (r.status === 'menge') {
    const z = r.zeilen.find(x => x.geliefert !== undefined && x.geliefert < x.menge);
    const diff = +((z.menge - z.geliefert) * z.preis).toFixed(2);
    entscheid = `<div class="pz"><span class="pj" style="color:var(--warn)">!</span>
        <div><b>${esc(z.name.split(',')[0])}: ${z.menge} verrechnet, ${z.geliefert} geliefert.</b>
        Die Rechnung verlangt ${chf(diff)} zu viel.</div></div>
      <div class="row" style="margin-top:12px">
        <button class="btn acc" data-act="menge-kuerzen" data-inv="${r.id}"
                data-diff="${diff}">Rechnung kürzen und freigeben</button></div>`;
  } else if (r.notiz) {
    entscheid = `<div class="pz"><span class="pj" style="color:var(--warn)">!</span>
      <div><b>Damals entschieden:</b> ${esc(r.notiz)}</div></div>`;
  } else {
    entscheid = `<div class="pz"><span class="pj">✓</span><div>Alles stimmt mit der Bestellung
      überein. Nichts zu tun.</div></div>`;
  }

  return `<div class="dokzeile">
    <div class="rdoc">
      <div class="rdkopf">
        <div><b>${esc(adr[0])}</b><br>${esc(adr[1])}<br>${esc(adr[2])}<br>
          <span class="muted">MWST-Nr. CHE-${112 + r.id.length}.${400 + r.zeilen.length}.${r.id.slice(-3)}</span></div>
        <div class="rdmeta">
          <div><span>Rechnung</span><b>${esc(r.id)}</b></div>
          <div><span>Datum</span><b>${esc(r.datum)}${DB.jahr}</b></div>
          <div><span>Lieferung</span><b>${esc(r.datum)}${DB.jahr}</b></div>
          <div><span>Kunde</span><b>4021</b></div></div></div>
      <div class="rdan">Gaststube Musterthal<br>Musterstrasse 12<br>9000 Musterstadt</div>
      <table class="rdtab"><thead><tr><th>Menge</th><th>Artikel</th>
        <th class="r">Einzelpreis</th><th class="r">Betrag</th></tr></thead>
        <tbody>${dokZeilen}</tbody></table>
      <div class="rdsumme">
        <div><span>Netto</span><b>${chf(netto)}</b></div>
        <div><span>MWST ${r.mwst.toFixed(1).replace('.', ',')}%</span><b>${chf(mwstBetrag)}</b></div>
        <div class="tot"><span>Total CHF</span><b>${chf(total)}</b></div></div>
      <div class="rdfuss">Zahlbar innert 30 Tagen · QR-Rechnung im Anhang ·
        ${r.mwst === 2.6 ? 'Lebensmittel, reduzierter Satz 2,6%' : 'Getränke mit Alkohol, Normalsatz 8,1%'}</div>
    </div>
    <div class="card rdpruef">
      <div class="wl"><span>Was Axyom gelesen hat</span><span class="r2">${esc(r.datum)}${DB.jahr}</span></div>
      <div class="pz"><span class="pj">✓</span><div>${r.zeilen.length === 1
        ? 'Die Position einem Artikel zugeordnet' : `Alle ${r.zeilen.length} Positionen einem Artikel zugeordnet`}
        — Preise gegen die letzte Lieferung, Mengen gegen die Bestellung.</div></div>
      <div class="pz"><span class="pj">✓</span><div>MWST-Satz plausibel:
        ${r.mwst.toFixed(1).replace('.', ',')}% für
        ${r.mwst === 2.6 ? 'Lebensmittel' : 'alkoholische Getränke'}.</div></div>
      ${entscheid}
      <div class="small muted" style="margin-top:12px;padding-top:9px;border-top:1px solid var(--soft)">
        Gelesen beim Eingang. Abgetippt wurde nichts.</div>
      </div></div>`;
}

VIEWS.rechnungen = () => {
  const alle = alleRechnungen();
  const liste = rechFiltern(alle);
  const offen = alle.filter(r => r.status === 'preis' || r.status === 'menge');

  const zeilen = liste.map(r => {
    const [cls, label] = RSTATUS[r.status] || RSTATUS.ok;
    const z = RECH_F.art && r.zeilen.find(x => x.art === RECH_F.art);
    const auf = r.id === RECH_DOK;
    /* The document belongs UNDER the row it was opened from. It used to render
       at the bottom of the page and scroll you there, which left you looking at
       an invoice with no idea which line you had clicked. */
    return `<tr class="click ${auf ? 'gewaehlt' : ''}" data-dok="${r.id}">
      <td class="muted num" style="width:92px">${esc(r.datum)}</td>
      <td><b>${esc(r.lief)}</b>
        ${z ? `<span class="tag t-ok" style="margin-left:7px">${z.menge} × ${chf(z.preis)}</span>` : ''}
        ${r.notiz ? `<div class="small muted zeile1">${esc(r.notiz)}</div>` : ''}</td>
      <td class="muted" style="width:96px">${esc(r.id)}</td>
      <td class="r num" style="width:116px">${chf(r.total)}</td>
      <td class="r" style="width:150px"><span class="tag ${cls}">${label}</span></td>
      <td class="r" style="width:110px"><span class="link">${auf ? 'schliessen' : 'ansehen'}</span></td></tr>
      ${auf ? `<tr class="detailzeile"><td colspan="6">
        <div class="detailkopf">
          <span class="dpfeil">↳</span>
          <b>Rechnung ${esc(r.id)}</b>
          <span class="muted">${esc(r.lief)} · ${esc(r.datum)}${DB.jahr} · ${chf(r.total)}</span>
          <button class="btn" data-dokzu="1" style="margin-left:auto">Schliessen</button></div>
        ${rechDokument(r)}</td></tr>` : ''}`;
  }).join('') || `<tr><td colspan="6" class="muted small" style="padding:18px 10px">
      Keine Rechnung passt auf diese Filter. <span class="link" data-rreset="1">Alle zurücksetzen</span></td></tr>`;

  const summe = liste.reduce((s, r) => s + r.total, 0);
  const kopf = `<div class="rerg">
    <div><b>${liste.length}</b> ${liste.length === 1 ? 'Rechnung' : 'Rechnungen'}</div>
    <div><b>${chf(summe)}</b> zusammen</div>
    ${liste.length ? `<div><b>${chf(summe / liste.length)}</b> im Schnitt</div>` : ''}
    <div class="muted">${(() => {
      const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                      'September','Oktober','November','Dezember'];
      const teile = [];
      if (RECH_F.monat) teile.push(MONATE[+RECH_F.monat - 1]);
      if (RECH_F.jahr) teile.push(RECH_F.jahr);
      if (RECH_F.zeit === 'woche') teile.push('diese Woche');
      if (RECH_F.zeit === '30') teile.push('letzte 30 Tage');
      return teile.length ? teile.join(' ') : 'seit der Eröffnung';
    })()}</div>
    <div class="muted">${offen.length} von ${alle.length} brauchen eine Entscheidung</div>
    <div class="muted" style="margin-left:auto">${DB.gelesenSeit} Rechnungen gelesen seit
      ${esc(DB.eroeffnet)}</div></div>`;

  return `${rechFilterbar(alle)}
    ${kopf}
    ${rechKontext(alle, liste)}
    <div class="scrollx"><table><thead><tr><th>Datum</th><th>Lieferant</th><th>Nummer</th>
      <th class="r">Total</th><th class="r">Status</th><th class="r"></th></tr></thead>
      <tbody>${zeilen}</tbody></table></div>
    <div class="small muted" style="margin-top:12px">${RECH_DOK
      ? 'Die Rechnung steht unter ihrer Zeile — noch einmal anklicken schliesst sie.'
      : 'Eine Zeile anklicken, um die Rechnung zu sehen, wie sie gekommen ist.'}</div>`;
};

/* ── Lager ──────────────────────────────────────────────────────────────────
   Counting once tells you something is missing. The calendar tells you WHEN —
   which is the only version of this that leads anywhere: a week, a shift, a
   delivery you can go and ask about. Every Monday count since the opening is in
   it, per article, expected against counted.
   ────────────────────────────────────────────────────────────────────────── */
const MONATSNAMEN = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                     'September','Oktober','November','Dezember'];

VIEWS.lager = () => {
  const heute = DB.zaehlungHeute();

  /* ── what this morning's count says ── */
  const zeilen = DB.lager.map(l => {
    const a = DB.artikel[l.art], w = heute.werte[l.art];
    const d = DB.zDiff(heute, l.art), auff = DB.zAuff(heute, l.art);
    return `<tr>
      <td><b>${esc(a.name.split(',')[0])}</b></td>
      <td class="r num muted">${w.erwartet.toFixed(1)} ${esc(l.einheit)}</td>
      <td class="r num"><input style="width:74px;text-align:right" type="number" step="0.1"
            value="${w.gezaehlt}" data-count="${l.art}"></td>
      <td class="r num" style="${auff ? 'color:var(--warn);font-weight:650' : ''}"
        >${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(1)}</td>
      <td class="r num muted">${chf(DB.zWert(heute, l.art))}</td>
      <td class="r">${auff ? '<span class="tag t-warn">nachschauen</span>'
                           : '<span class="tag t-ok">im Rahmen</span>'}</td></tr>`;
  }).join('');

  /* ── the calendar of counts ── */
  const imMonat = nr => DB.zaehlungen.filter(z => +z.datum.slice(3, 5) === nr);
  const monatTabs = DB.monate.map(m =>
    `<button class="tab ${LAGER_MONAT === m.nr ? 'on' : ''}" data-lmonat="${m.nr}"
      >${esc(m.name)} <span class="muted">${imMonat(m.nr).length}×</span></button>`).join('');
  const artSelect = `<label class="rfilter ${LAGER_ART ? 'an' : ''}"><span>Artikel</span>
    <select data-lart="1"><option value="" ${LAGER_ART ? '' : 'selected'}>Alle Artikel</option>
      ${DB.lager.map(l => `<option value="${l.art}" ${LAGER_ART === l.art ? 'selected' : ''}
        >${esc(DB.artikel[l.art].name.split(',')[0])}</option>`).join('')}</select></label>`;

  const tage = new Date(DB.jahr, LAGER_MONAT, 0).getDate();
  const ersterWochentag = (new Date(DB.jahr, LAGER_MONAT - 1, 1).getDay() + 6) % 7;  // Mo = 0
  const zellen = [];
  for (let i = 0; i < ersterWochentag; i++) zellen.push('<div class="ktag leer"></div>');
  for (let d = 1; d <= tage; d++) {
    const datum = String(d).padStart(2, '0') + '.' + String(LAGER_MONAT).padStart(2, '0') + '.';
    const z = DB.zaehlungen.find(x => x.datum === datum);
    const istHeute = datum === DB.today;
    let inhalt = '';
    if (z) {
      if (LAGER_ART) {
        const diff = DB.zDiff(z, LAGER_ART), auff = DB.zAuff(z, LAGER_ART);
        inhalt = `<button class="zpost ${auff ? 'auff' : 'ok'} ${LAGER_TAG === datum ? 'gewaehlt' : ''}"
          data-ltag="${datum}">${diff > 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)}
          ${esc(DB.lager.find(l => l.art === LAGER_ART).einheit)}</button>`;
      } else {
        const auff = DB.lager.filter(l => DB.zAuff(z, l.art)).length;
        inhalt = `<button class="zpost ${auff ? 'auff' : 'ok'} ${LAGER_TAG === datum ? 'gewaehlt' : ''}"
          data-ltag="${datum}">${chf(DB.zTagWert(z))}${auff ? `<br>${auff} auffällig` : ''}</button>`;
      }
    }
    zellen.push(`<div class="ktag ${istHeute ? 'heute' : ''} ${z ? 'gezaehlt' : ''}">
      <div class="knr">${d}${istHeute ? '<span class="kheute">heute</span>' : ''}</div>${inhalt}</div>`);
  }

  /* ── one count day, in full ── */
  let tagPanel = '';
  const zt = LAGER_TAG && DB.zaehlungen.find(z => z.datum === LAGER_TAG);
  if (zt) {
    const vorher = DB.zaehlungen[DB.zaehlungen.indexOf(zt) - 1];
    const auffaellige = DB.lager.filter(l => DB.zAuff(zt, l.art));
    tagPanel = `<div class="card kontext" style="margin-top:14px">
      <div class="wl"><span>Zählung ${esc(zt.datum)}${DB.jahr} · ${esc(zt.zeit)}</span>
        <span class="r2">${vorher ? `verglichen mit der Zählung vom ${esc(vorher.datum)}` : 'erste Zählung'}</span></div>
      <div class="scrollx"><table><thead><tr><th>Artikel</th><th class="r">Erwartet</th>
        <th class="r">Gezählt</th><th class="r">Differenz</th><th class="r">Wert</th>
        <th class="r">Status</th></tr></thead><tbody>
        ${DB.lager.map(l => { const w = zt.werte[l.art], d = DB.zDiff(zt, l.art),
            auff = DB.zAuff(zt, l.art);
          return `<tr><td><b>${esc(DB.artikel[l.art].name.split(',')[0])}</b></td>
            <td class="r num muted">${w.erwartet.toFixed(1)} ${esc(l.einheit)}</td>
            <td class="r num">${w.gezaehlt.toFixed(1)} ${esc(l.einheit)}</td>
            <td class="r num" style="${auff ? 'color:var(--warn);font-weight:650' : ''}"
              >${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(1)}</td>
            <td class="r num muted">${chf(DB.zWert(zt, l.art))}</td>
            <td class="r">${auff ? '<span class="tag t-warn">nachschauen</span>'
                                 : '<span class="tag t-ok">im Rahmen</span>'}</td></tr>`;
        }).join('')}</tbody></table></div>
      <div class="small" style="margin-top:11px;line-height:1.6">${auffaellige.length
        ? `<b style="color:var(--warn)">${auffaellige.map(l =>
            `${esc(DB.artikel[l.art].name.split(',')[0])} ${Math.abs(DB.zDiff(zt, l.art)).toFixed(1)}
             ${esc(l.einheit)} zu wenig`).join(', ')}.</b>
           ${vorher ? `Bei der Zählung vom ${esc(vorher.datum)} war das noch nicht so — dazwischen liegt
             eine Woche, in der jemand nachschauen kann.` : ''}`
        : 'Alles im Rahmen der Waage. Kein Posten fehlt.'}</div>
      <div class="row" style="margin-top:11px"><button class="btn" data-ltagzu="1">Schliessen</button></div>
    </div>`;
  }

  /* «Grün» heisst klein, nicht null. Über dreizehn Zählungen summiert sich auch
     die Waagentoleranz, und diese Summe ist der Grund, warum ein Betrieb das
     überhaupt zählt — sie steht deshalb unter dem Kalender. */
  const bilanzZeilen = DB.lager.map(l => {
    const reihe = DB.zaehlungen.map(z => ({ z, d: DB.zDiff(z, l.art), w: DB.zWert(z, l.art) }));
    const summe = reihe.reduce((s, x) => s + x.d, 0);
    const wert = reihe.reduce((s, x) => s + x.w, 0);
    const vorfaelle = reihe.filter(x => DB.zAuff(x.z, l.art));
    const klein = reihe.filter(x => !DB.zAuff(x.z, l.art) && x.d < 0);
    return { l, summe, wert, vorfaelle, klein,
             kleinWert: klein.reduce((s, x) => s + x.w, 0) };
  }).sort((a, b) => a.wert - b.wert);
  const bilanz = `<div class="card" style="margin-top:16px">
    <div class="wl"><span>Über alle ${DB.zaehlungen.length} Zählungen</span>
      <span class="r2">seit dem ${esc(DB.eroeffnet)}</span></div>
    <div class="scrollx"><table><thead><tr><th>Artikel</th><th class="r">Toleranz</th>
      <th class="r">Fehlt zusammen</th>
      <th class="r">Wert</th><th class="r">davon aus Fehlmengen</th>
      <th class="r">davon im Rahmen</th></tr></thead><tbody>
      ${bilanzZeilen.map(b => `<tr class="click ${LAGER_ART === b.l.art ? 'gewaehlt' : ''}"
          data-lartrow="${b.l.art}">
        <td><b>${esc(DB.artikel[b.l.art].name.split(',')[0])}</b></td>
        <td class="r num"><input type="number" step="0.5" min="0" max="50"
            style="width:64px;text-align:right" data-tolart="${b.l.art}"
            value="${DB.tol(b.l.art).prozent}"
            ${DB.tol(b.l.art).eigen ? 'style="width:64px;text-align:right;border-color:var(--acc);background:var(--okbg);color:var(--acci);font-weight:650"' : ''}>
          <span class="muted small">%</span></td>
        <td class="r num">${b.summe > 0 ? '+' : '−'}${Math.abs(b.summe).toFixed(1)} ${esc(b.l.einheit)}</td>
        <td class="r num" style="font-weight:650">${chf(b.wert)}</td>
        <td class="r num muted">${b.vorfaelle.length
          ? `${chf(b.vorfaelle.reduce((s, x) => s + x.w, 0))} · ${b.vorfaelle.length}×`
          : 'keine'}</td>
        <td class="r num muted">${chf(b.kleinWert)} · ${b.klein.length}×</td></tr>`).join('')}
      </tbody></table></div>
    <div class="small muted" style="margin-top:11px;line-height:1.6">Die Toleranz ist Ihre Entscheidung:
      oben für alle Artikel, in der Spalte je Artikel — beim Eglifilet stehen ${DB.tol('egli').prozent} %,
      weil Filetieren Abschnitt kostet. Alles darunter ist grün.
      Eine Differenz von −0.4 l ist grün,
      weil sie in der Waage liegt — nicht, weil sie nichts kostet. Dreizehn Mal −0.4 sind
      ${chf(Math.abs(bilanzZeilen.reduce((s, b) => s + b.kleinWert, 0)))} in drei Monaten, ohne dass je
      ein Alarm nötig war. Die Fehlmengen daneben sind die Fälle, bei denen es sich lohnt,
      dem Tag nachzugehen.</div></div>`;

  const verlust = DB.zTagWert(heute);
  const auffHeute = DB.lager.filter(l => DB.zAuff(heute, l.art)).length;
  const vorfaelle = DB.zaehlungen.filter(z => DB.lager.some(l => DB.zAuff(z, l.art))).length;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Zuletzt gezählt</div>
        <div class="n">${esc(heute.datum)} ${esc(heute.zeit)}</div>
        <div class="d">${DB.zaehlungen.length} Zählungen seit der Eröffnung</div></div>
      <div class="card kpi"><div class="l">Differenz heute</div>
        <div class="n" style="color:${verlust < -20 ? 'var(--warn)' : 'var(--ink)'}">${chf(verlust)}</div>
        <div class="d">${auffHeute} von ${DB.lager.length} auffällig</div></div>
      <div class="card kpi"><div class="l">Zählungen mit Fehlmenge</div>
        <div class="n">${vorfaelle} von ${DB.zaehlungen.length}</div>
        <div class="d">mehr als ${DB.toleranz.prozent} % und ${DB.toleranz.menge} Einheiten${
          DB.lager.some(l => DB.tol(l.art).eigen) ? ', wo nichts anderes gesetzt ist' : ''}</div></div></div>
    <div class="sec">Die Zählung von heute früh</div>
    <div class="scrollx"><table><thead><tr><th>Artikel</th><th class="r">Erwartet</th>
      <th class="r">Gezählt</th><th class="r">Differenz</th><th class="r">Wert</th>
      <th class="r">Status</th></tr></thead><tbody>${zeilen}</tbody></table></div>
    <div class="small muted" style="margin-top:10px">Eine Zahl ändern — Differenz, Wert und die
      Kennzahlen oben rechnen sofort mit.</div>
    <div class="sec" style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">Kalender
      <span class="tabs" style="margin-bottom:0">${monatTabs}</span>
      ${artSelect}
      <label class="rfilter ${DB.toleranz.prozent !== 4 ? 'an' : ''}"><span>Toleranz %</span>
        <input type="number" step="0.5" min="0" max="50" style="width:78px;text-align:right"
          data-tolp="1" value="${DB.toleranz.prozent}"></label>
      <label class="rfilter ${DB.toleranz.menge !== 0.5 ? 'an' : ''}"><span>Mindestmenge</span>
        <input type="number" step="0.1" min="0" style="width:78px;text-align:right"
          data-tolm="1" value="${DB.toleranz.menge}"></label>
      ${(DB.toleranz.prozent !== 4 || DB.toleranz.menge !== 0.5
         || DB.lager.some(l => DB.tol(l.art).eigen && l.art !== 'egli'))
        ? '<button class="btn" data-tolreset="1" style="align-self:flex-end">Toleranz zurücksetzen</button>'
        : ''}</div>
    <div class="kkopf">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(t => `<div>${t}</div>`).join('')}</div>
    <div class="kgrid">${zellen.join('')}</div>
    <div class="klegende">
      <span><i class="freigegeben"></i>im Rahmen — unter ${DB.toleranz.prozent} % und unter
        ${DB.toleranz.menge} ${LAGER_ART ? esc(DB.lager.find(l => l.art === LAGER_ART).einheit) : 'Einheiten'}</span>
      <span><i class="entwurf"></i>Fehlmenge — darüber</span>
      <span class="muted">${LAGER_ART
        ? `Zahl = Differenz bei ${esc(DB.artikel[LAGER_ART].name.split(',')[0])}`
        : 'Zahl = Fehlmenge des Tages in Franken'} · einen Tag anklicken für die ganze Zählung</span></div>
    ${bilanz}
    ${tagPanel}`;
};

/* ── Aktionen ───────────────────────────────────────────────────────────── */
VIEWS.aktionen = () => {
  const rows = DB.aktionen.map(a => {
    const art = DB.artikel[a.art];
    const rabatt = (1 - a.neu / art.preis) * 100;
    const spart = (art.preis - a.neu) / art.menge * a.monat;
    const gerichte = DB.gerichte.filter(g => g.rezept.some(z => z.art === a.art)).length;
    return `<tr>
      <td><b>${esc(a.lief)}</b></td><td class="muted">${esc(art.name)}</td>
      <td class="r num muted" style="text-decoration:line-through">${chf(art.preis)}</td>
      <td class="r num"><b>${chf(a.neu)}</b></td>
      <td class="r"><span class="tag t-ok">−${rabatt.toFixed(0)}%</span></td>
      <td class="r ${dringend(a) ? '' : 'muted'}" style="${dringend(a) ? 'color:var(--warn);font-weight:650' : ''}">bis ${a.bis}
        <span style="font-weight:400;font-size:11.5px">· ${tageBis(a.bis)} Tag${tageBis(a.bis) === 1 ? '' : 'e'}</span></td>
      <td class="r num">${chf(spart)}</td>
      <td class="r">${a.genommen
        ? '<span class="tag t-ok">auf der Bestellliste</span>'
        : `<button class="btn acc" data-act="aktion-nehmen" data-id="${a.id}">Übernehmen</button>`}</td>
      </tr>`;
  }).join('');
  const total = DB.aktionen.reduce((s, a) => {
    const art = DB.artikel[a.art];
    return s + (art.preis - a.neu) / art.menge * a.monat;
  }, 0);
  const genommen = DB.aktionen.filter(a => a.genommen);
  const gespart = genommen.reduce((s, a) => {
    const art = DB.artikel[a.art];
    return s + (art.preis - a.neu) / art.menge * a.monat;
  }, 0);
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Gefunden</div><div class="n">${DB.aktionen.length + DB.irrelevant}</div>
        <div class="d">${DB.irrelevant} als irrelevant ausgeblendet</div></div>
      <div class="card kpi"><div class="l">Betreffen Ihren Einkauf</div><div class="n">${DB.aktionen.length}</div>
        <div class="d">Gegen Ihre Bestellhistorie geprüft</div></div>
      <div class="card kpi"><div class="l">Möglich diesen Monat</div><div class="n">${chf(total)}</div>
        <div class="d">Bei Ihren üblichen Mengen</div></div></div>
    <table><thead><tr><th>Lieferant</th><th>Artikel</th><th class="r">Liste</th><th class="r">Aktion</th>
      <th class="r">Rabatt</th><th class="r">Bis</th><th class="r">Spart</th><th class="r"></th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${genommen.length ? `<div class="card good" style="margin-top:16px">
      <div class="small"><b>${genommen.length} auf der Bestellliste</b> —
      ${esc(genommen.map(a => DB.artikel[a.art].name.split(',')[0]).join(', '))}.
      Das sind <b>${chf(gespart)}</b> bei den Mengen des letzten Monats.</div></div>` : ''}`;
};

/* ── Gerichte ───────────────────────────────────────────────────────────── */
VIEWS.gerichte = () => {
  const rows = DB.gerichte.map(g => {
    const w = wareneinsatz(g), m = marge(g), auf = aufschlag(g);
    const offen = offenePreise(g);
    const mB = margeBezahlt(g), wB = wareneinsatzBezahlt(g);
    const bewegt = g.rezept.some(z => DB.artikel[z.art].preis !== DB.artikel[z.art].vorher);
    return `<tr>
      <td><b>${esc(g.name)}</b>${bewegt ? ' <span class="tag t-warn">Preis bewegt</span>' : ''}
        ${offen.length ? `<div class="small zeile1" style="color:var(--warn)">eingekauft zu
          ${chf(wB)} — ${offen.map(a => esc(DB.artikel[a].name.split(',')[0])).join(', ')}
          ${offen.length > 1 ? 'sind' : 'ist'} teurer als kalkuliert</div>` : ''}</td>
      <td class="r num muted">${chf(w)}</td>
      <td class="r num"><input style="width:82px;text-align:right" type="number" step="0.5"
          value="${g.karte.toFixed(2)}" data-karte="${g.id}"></td>
      <td class="r num"><b style="color:${m < 65 ? 'var(--warn)' : 'var(--ink)'}">${m.toFixed(1)}%</b>
        ${offen.length ? `<div class="small" style="color:var(--warn);font-weight:600"
          >${mB.toFixed(1)}% bezahlt</div>` : ''}</td>
      <td class="r num muted">${isNaN(auf) ? '—' : auf.toFixed(0) + '%'}</td>
      <td class="r num muted">${g.verkauft}</td>
      <td class="r num">${chf((g.karte - w) * g.verkauft)}</td></tr>`;
  }).join('');
  const roh = DB.gerichte.reduce((s, g) => s + (g.karte - wareneinsatz(g)) * g.verkauft, 0);
  const schnitt = DB.gerichte.reduce((s, g) => s + marge(g), 0) / DB.gerichte.length;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Marge im Schnitt</div><div class="n">${schnitt.toFixed(1)}%</div>
        <div class="d">Über die vier Gerichte</div></div>
      <div class="card kpi"><div class="l">Rohertrag, Woche</div><div class="n">${chf(roh)}</div>
        <div class="d">Verkäufe × Marge</div></div>
      <div class="card kpi"><div class="l">Kalkuliert mit</div><div class="n">${DB.gelesen} Rechnungen</div>
        <div class="d">Den Preisen, die Sie zuletzt bezahlt haben</div></div></div>
    <table><thead><tr><th>Gericht</th><th class="r">Wareneinsatz</th><th class="r">Kartenpreis</th>
      <th class="r">Marge vom Preis</th><th class="r">Aufschlag</th>
      <th class="r">Verkauft</th><th class="r">Rohertrag</th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${(() => { const offen = DB.gerichte.filter(g => offenePreise(g).length);
      if (!offen.length) return '';
      const d = offen.reduce((s, g) => s + (wareneinsatzBezahlt(g) - wareneinsatz(g)) * g.verkauft, 0);
      return `<div class="card warn" style="margin-top:14px"><div class="small" style="line-height:1.65">
        <b>${offen.length} Gerichte sind teurer eingekauft, als kalkuliert wird.</b>
        Bezahlt ist das längst — die Rechnungen sind fällig, sobald sie gelesen sind, und die
        ${chf(d)} dieser Woche stecken in den Zahlen. Offen ist nur, ob ab jetzt mit den neuen Preisen
        kalkuliert wird: das entscheiden Sie in
        <span class="link" data-go="rechnungen">Rechnungen</span>, nicht die Rechnung.</div></div>`;
    })()}
    <div class="small muted" style="margin-top:12px">Dieselbe Kalkulation, zweimal gesagt: die Marge ist
      der Anteil am Kartenpreis und bleibt unter 100 %, der Aufschlag ist der Zuschlag auf den Wareneinsatz
      — 200 % Aufschlag ist Faktor 3. Der Wareneinsatz kommt aus den Artikelpreisen.
      Übernehmen Sie in <span class="link" data-go="rechnungen">Rechnungen</span> eine Preisänderung,
      ändern sich diese Zahlen hier mit.</div>`;
};
/* ── Hygiene ────────────────────────────────────────────────────────────── */
VIEWS.hygiene = () => {
  const rows = DB.hygiene.map(h => `<tr>
    <td style="width:34px"><div class="check ${h.done ? 'on' : ''}" data-check="${h.id}">${TICK}</div></td>
    <td><b>${esc(h.station)}</b></td><td class="muted">${esc(h.was)}</td>
    <td class="muted">${esc(h.wer) || '—'}</td>
    <td class="r muted">${h.zeit || (h.done ? '' : 'heute fällig')}</td>
    <td class="r">${h.done ? '<span class="tag t-ok">erledigt</span>' : '<span class="tag t-warn">offen</span>'}</td>
    </tr>`).join('');
  const offen = DB.hygiene.filter(h => !h.done);
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Heute</div>
        <div class="n">${DB.hygiene.length - offen.length} von ${DB.hygiene.length}</div>
        <div class="d">Abgehakt an der Station</div></div>
      <div class="card kpi"><div class="l">Diesen Monat</div><div class="n">${DB.hygieneMonat}</div>
        <div class="d">${DB.hygieneSpaet} verspätet</div></div>
      <div class="card kpi"><div class="l">Nachweis</div><div class="n">vollständig</div>
        <div class="d">Jeder Eintrag mit Name und Uhrzeit</div></div></div>
    <table><thead><tr><th></th><th>Station</th><th>Kontrolle</th><th>Von</th>
      <th class="r">Zeit</th><th class="r">Status</th></tr></thead><tbody>${rows}</tbody></table>
    ${offen.length ? `<div class="card warn" style="margin-top:16px">
        <div class="row" style="margin-bottom:7px"><span class="tag t-warn">noch offen</span>
          <b class="small">${esc(offen.map(o => o.station + ' · ' + o.was).join(' | '))}</b></div>
        <div class="small muted">Für die Schichtleitung jetzt sichtbar, nicht erst morgen früh.
          Ein Häkchen setzen — der Eintrag bekommt Ihren Namen und die Uhrzeit.</div></div>`
      : `<div class="card good" style="margin-top:16px"><div class="small">
          Alle Kontrollen von heute sind erledigt. Der Monat lässt sich als eine Datei ausgeben.</div>
          <div class="row" style="margin-top:11px">
          <button class="btn" data-act="haccp-export">Nachweis ${esc(DB.monat)} exportieren</button></div></div>`}
    <div class="sec">Im Protokoll</div>
    <table><tbody>${DB.hygiene.filter(h => h.done).map(h => `<tr>
        <td><b>${esc(h.station)}</b> <span class="muted">· ${esc(h.was)}</span></td>
        <td class="r muted">${esc(h.wer)} · ${h.zeit}</td></tr>`).join('')}</tbody></table>`;
};

/* ── Temperatur ─────────────────────────────────────────────────────────── */
VIEWS.temperatur = () => {
  const rows = DB.geraete.map(g => {
    const bad = g.temp > g.max || g.temp < g.min;
    return `<tr>
      <td><b>${esc(g.name)}</b></td><td class="muted">${esc(g.wo)}</td>
      <td class="r num"><b style="color:${bad ? 'var(--bad)' : 'var(--ink)'}">${g.temp.toFixed(1)} °C</b></td>
      <td class="r num muted">${g.min} – ${g.max} °C</td>
      <td class="r">${bad ? '<span class="tag t-bad">Alarm</span>' : '<span class="tag t-ok">im Bereich</span>'}</td>
      <td class="r">${bad
        ? `<button class="btn" data-act="alarm-quittieren" data-id="${g.id}">Quittieren</button>`
        : `<button class="btn demo" data-act="tuer-offen" data-id="${g.id}">Demo: Störung auslösen</button>`}</td>
      </tr>`;
  }).join('');
  const alarme = DB.alarme.map(a => `<tr>
    <td><b>${esc(a.geraet)}</b></td><td class="muted">${a.wann}</td>
    <td class="r num" style="color:var(--bad)">${a.wert.toFixed(1)} °C</td>
    <td class="muted">an ${esc(a.an)}</td>
    <td class="r muted">${a.quittiert ? 'quittiert ' + a.quittiert : '<span class="tag t-bad">offen</span>'}</td>
    <td class="muted">${esc(a.grund || '')}</td></tr>`).join('');
  const jetztBad = DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).length;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Geräte</div><div class="n">${DB.geraete.length}</div>
        <div class="d">Ein Fühler pro Gerät, nur messend</div></div>
      <div class="card kpi"><div class="l">Jetzt im Alarm</div>
        <div class="n" style="color:${jetztBad ? 'var(--bad)' : 'var(--ink)'}">${jetztBad}</div>
        <div class="d">Gemessen, ob jemand im Haus ist oder nicht</div></div>
      <div class="card kpi"><div class="l">Seit der Eröffnung</div>
        <div class="n">${DB.alarme.length} Alarme</div>
        <div class="d">${DB.alarme.filter(a => a.quittiert).length} quittiert, im Schnitt in 6 Minuten</div></div></div>
    <table><thead><tr><th>Gerät</th><th>Wo</th><th class="r">Jetzt</th><th class="r">Bereich</th>
      <th class="r">Status</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:12px">Axyom misst — geöffnet oder geschaltet wird nichts.
      «Demo: Störung auslösen» spielt nach, was nachts passiert, wenn eine Tür offen bleibt: das Gerät läuft
      aus dem Bereich, die Meldung geht an die diensthabende Person und landet im Protokoll.</div>
    <div class="sec">Alarmprotokoll</div>
    <table><thead><tr><th>Gerät</th><th>Wann</th><th class="r">Wert</th><th>Meldung</th>
      <th class="r">Quittiert</th><th>Grund</th></tr></thead><tbody>${alarme}</tbody></table>`;
};

/* ── Dienstplan ─────────────────────────────────────────────────────────── */
VIEWS.dienstplan = () => {
  const max = Math.max(...DB.woche.map(d => Math.max(d.gedecke, d.vj)));
  const cols = DB.woche.map(d => {
    const pro = d.gedecke / d.besetzt;
    const knapp = pro > DB.knappAb, viel = pro < DB.knappAb * 0.5;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:7px;flex:1">
      <div style="height:110px;display:flex;align-items:flex-end;gap:3px">
        <div style="width:22px;border-radius:5px 5px 0 0;height:${Math.round(d.gedecke / max * 110)}px;
             background:${knapp ? 'var(--warn)' : 'var(--acc)'}"></div>
        <div style="width:8px;border-radius:5px 5px 0 0;height:${Math.round(d.vj / max * 110)}px;
             background:rgba(0,0,0,.12)"></div></div>
      <div class="small" style="font-weight:650">${d.tag}</div>
      <div class="small muted num">${d.gedecke}</div>
      <select data-shift="${d.tag}" style="padding:4px 6px;font-size:11.5px">
        ${[2,3,4,5,6,7].map(n => `<option value="${n}" ${n === d.besetzt ? 'selected' : ''}>${n} auf Schicht</option>`).join('')}
      </select>
      <div class="small" style="color:${knapp ? 'var(--warn)' : viel ? 'var(--acci)' : 'var(--dim)'};font-weight:650">
        ${knapp ? 'knapp' : viel ? 'reichlich' : 'passt'}</div></div>`;
  }).join('');
  const std = DB.woche.reduce((s, d) => s + d.besetzt * 8, 0);
  const kosten = std * DB.lohn;
  const gedecke = DB.woche.reduce((s, d) => s + d.gedecke, 0);
  const vj = DB.woche.reduce((s, d) => s + d.vj, 0);
  return `<div class="grid g4" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Gedecke, gebucht</div><div class="n">${gedecke}</div>
        <div class="d">Vorjahreswoche ${vj} · ${pct((gedecke / vj - 1) * 100)}</div></div>
      <div class="card kpi"><div class="l">Stunden geplant</div><div class="n">${std}</div>
        <div class="d">Bei 8 Stunden pro Schicht</div></div>
      <div class="card kpi"><div class="l">Personalkosten</div><div class="n">${chf(kosten)}</div>
        <div class="d">Zu ${chf(DB.lohn)} pro Stunde</div></div>
      <div class="card kpi"><div class="l">Pro Gedeck</div><div class="n">${chf(kosten / gedecke)}</div>
        <div class="d">Personal je gebuchtem Gedeck</div></div></div>
    <div class="card"><div class="row" style="align-items:flex-end;gap:10px">${cols}</div>
      <div class="row" style="margin-top:14px;gap:16px" class="small">
        <span class="small muted"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;
          background:var(--acc);margin-right:5px"></span>diese Woche</span>
        <span class="small muted"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;
          background:rgba(0,0,0,.12);margin-right:5px"></span>Vorjahr</span></div></div>
    <div class="small muted" style="margin-top:12px">Besetzung ändern — Stunden, Kosten und die Kosten
      pro Gedeck rechnen mit. Mehr als ${DB.knappAb} Gedecke auf eine Person wird als knapp markiert.</div>`;
};

/* ── Schulung ───────────────────────────────────────────────────────────── */
VIEWS.schulung = () => {
  const rows = DB.leute.map(p => {
    const q = p.durch / p.total;
    return `<tr>
      <td><b>${esc(p.name)}</b> <span class="muted">· ${esc(p.rolle)}</span></td>
      <td style="width:170px"><div class="bar"><i style="width:${Math.round(q * 100)}%;
        background:${q === 1 ? 'var(--acc)' : 'var(--warn)'}"></i></div></td>
      <td class="r num" style="color:${q === 1 ? 'var(--acci)' : 'var(--warn)'};font-weight:650">${p.durch} / ${p.total}</td>
      <td class="r">${q === 1 ? '<span class="tag t-ok">durch</span>' : '<span class="tag t-warn">offen</span>'}</td>
      </tr>`;
  }).join('');
  const briefs = DB.briefings.map(b => `<div class="card" style="margin-bottom:10px">
    <div class="row" style="justify-content:space-between">
      <div><b class="small">${esc(b.titel)}</b>
        <div class="small muted" style="margin-top:3px">${b.min} Minuten ·
          fällig für ${b.faellig.length ? esc(b.faellig.map(id => DB.leute.find(p => p.id === id).name).join(', ')) : '—'}</div></div>
      ${b.faellig.length
        ? `<button class="btn acc" data-act="brief-senden" data-id="${b.id}">Briefing senden</button>`
        : '<span class="tag t-ok">alle durch</span>'}</div></div>`).join('');
  const offen = DB.leute.filter(p => p.durch < p.total).length;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Durch</div>
        <div class="n">${DB.leute.length - offen} von ${DB.leute.length}</div>
        <div class="d">Grundlagen in der ersten Schicht</div></div>
      <div class="card kpi"><div class="l">Diese Woche fällig</div>
        <div class="n">${DB.briefings.reduce((s, b) => s + b.faellig.length, 0)}</div>
        <div class="d">Briefings, nicht Kurse</div></div>
      <div class="card kpi"><div class="l">Aus Ihrem Haus</div><div class="n">11 Module</div>
        <div class="d">Aus Ihren Rezepten und Hausregeln</div></div></div>
    <table><thead><tr><th>Person</th><th>Fortschritt</th><th class="r">Module</th>
      <th class="r">Status</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sec">Offene Briefings</div>${briefs}
    <div class="small muted">Ein Briefing senden — die Betroffenen rücken im Fortschritt auf,
      und wer es gesehen hat, steht oben in der Liste.</div>`;
};
/* ── Inhalte ────────────────────────────────────────────────────────────── */
VIEWS.inhalte = () => {
  const K = DB.karte;
  const alle = K.eintraege.map(eintrag);
  const wartet = K.ziele.filter(z => z.status === 'wartet');
  const geaendert = karteGeaendert().map(e => e.id);
  // what a given channel currently shows for an entry
  const zeigt = (z, e) => z.status === 'wartet' ? (K.stand[e.id] || null) : e;

  /* the editor: the whole card, one row per line */
  const zeilen = alle.map(e => {
    const st = K.stand[e.id], neuDrauf = !st;
    const anders = geaendert.includes(e.id);
    return `<tr>
      <td><b>${esc(e.name)}</b>${e.neu ? ' <span class="tag t-ok">neu</span>' : ''}
        ${e.gericht ? `<span class="muted small"> · kalkuliert in <span class="link"
           data-go="gerichte">Gerichte</span></span>` : ''}</td>
      <td class="r num"><input style="width:82px;text-align:right" type="number" step="0.5"
          value="${e.preis.toFixed(2)}" data-kartepreis="${e.id}"></td>
      <td class="muted small">${esc(e.allergene)}</td>
      <td class="r">${neuDrauf ? '<span class="tag t-warn">noch nicht publiziert</span>'
        : anders ? `<span class="tag t-warn">Kanäle zeigen ${chf(st.preis)}</span>`
        : '<span class="tag t-ok">überall gleich</span>'}</td></tr>`;
  }).join('');

  /* the channels: each one rendered as the guest sees it */
  const zeile = (e, c, gross) => `<div class="mock-zeile">
    <span style="font-size:${gross ? 12 : 11}px;${c.preis !== e.preis ? 'color:var(--warn)' : ''}">${esc(e.name)}</span>
    <span class="mock-fuell"></span>
    <span style="font-size:${gross ? 12 : 11}px;font-weight:650;${c.preis !== e.preis ? 'color:var(--warn)' : ''}"
      >${chf(c.preis).replace('CHF ', '')}</span></div>`;

  const mock = z => {
    const sichtbar = alle.filter(e => zeigt(z, e));           // a new line is simply absent
    const zeilenHtml = sichtbar.map(e => zeile(e, zeigt(z, e), z.typ === 'pdf')).join('');
    const neuste = alle.find(e => e.neu), c = neuste && zeigt(z, neuste);
    if (z.typ === 'web') return `<div class="mock-url"><i></i><i></i><i></i>&nbsp;gaststube.example/karte</div>
      <div class="mock-h" style="font-size:12px">Unsere Karte</div>${zeilenHtml}`;
    if (z.typ === 'res') return `<div class="mock-res"><div class="dat">Tischreservation · heute</div>
      ${zeilenHtml}</div>`;
    if (z.typ === 'pdf') return `<div class="mock-paper"><div class="kl">Karte · ${esc(DB.monat)}</div>${zeilenHtml}</div>`;
    if (z.typ === 'ig') return `<div class="mock-bild"></div>
      <div class="mock-p" style="color:var(--ink);font-size:11.5px">${c
        ? `<b>gaststube</b> Neu auf der Karte: ${esc(neuste.name)}, ${chf(c.preis)}. 🌿`
        : `<b>gaststube</b> Frühling in der Gaststube. 🌿`}</div>`;
    return `<div class="mock-mail"><div class="mock-h" style="font-size:12px">Neu diese Woche</div>
      ${zeilenHtml}</div>`;
  };

  const kanaele = K.ziele.map(z => {
    const alt = z.status === 'wartet';
    const veraltet = alt ? alle.filter(e => { const c = zeigt(z, e); return !c || c.preis !== e.preis; }).length : 0;
    // a post shows one dish, not the card — «2 von 5 Zeilen» would be a lie there
    const neuste = alle.find(e => e.neu), c = neuste && zeigt(z, neuste);
    const hinweis = !veraltet ? ''
      : z.typ === 'ig' ? (c && c.preis !== neuste.preis ? `Beitrag zeigt noch ${chf(c.preis)}`
                          : c ? '' : 'Beitrag kennt den neuen Eintrag nicht')
      : `${veraltet} von ${alle.length} Zeilen veraltet`;
    return `<div class="kanal ${alt ? 'alt' : ''}">
      <div class="kopf">${esc(z.was)}
        <span class="tag ${alt ? 't-warn' : 't-ok'}">${alt ? 'wartet' : 'aktuell'}</span></div>
      <div class="inhalt">${mock(z)}
        ${hinweis ? `<div class="stale">${esc(hinweis)}</div>` : ''}</div></div>`;
  }).join('');

  return `<div class="card" style="margin-bottom:18px">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:16px">
        <div style="min-width:0">
          <div class="l small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;
               color:var(--dim)">Die Karte</div>
          <div style="font-size:17px;font-weight:700;margin-top:6px">${alle.length} Einträge ·
            ${esc(K.betriebe.join(' und '))}</div>
          <div class="small muted" style="margin-top:6px;line-height:1.6">
            ${geaendert.length
              ? `${geaendert.length} ${geaendert.length === 1 ? 'Zeile' : 'Zeilen'} geändert,
                 seit die Gästekanäle das letzte Mal bedient wurden.`
              : 'Jede Zeile steht auf jedem Kanal gleich.'}</div></div>
        <div style="text-align:right;flex:none">
          ${wartet.length
            ? `<button class="btn acc" data-act="karte-freigeben">${wartet.length} Kanäle freigeben</button>
               <div class="small muted" style="margin-top:7px;max-width:215px">Nichts erreicht einen Gast,
                 bevor Sie es sagen.</div>`
            : `<span class="tag t-ok">alle Kanäle zeigen dasselbe</span>
               <div class="small muted" style="margin-top:7px;max-width:215px">Einen Preis unten ändern —
                 die Kanäle fallen zurück und warten wieder auf Sie.</div>`}</div></div></div>
    <table><thead><tr><th>Eintrag</th><th class="r">Kartenpreis</th><th>Allergene</th>
      <th class="r">Stand</th></tr></thead><tbody>${zeilen}</tbody></table>
    <div class="small muted" style="margin-top:11px">Die vier kalkulierten Gerichte führen denselben Preis wie
      <span class="link" data-go="gerichte">Gerichte</span> — hier geändert heisst dort neu kalkuliert,
      und umgekehrt.</div>
    <div class="sec">Was der Gast gerade sieht</div>
    <div class="kanaele">${kanaele}</div>
    <div class="small muted" style="margin-top:12px">Kein Kanal wird nachgepflegt: jeder liest dieselbe Karte.
      Bis Sie freigeben, zeigt ein Gästekanal weiter den alten Stand — und sagt, wie viele Zeilen das betrifft.</div>`;
};

/* ── Social Media ───────────────────────────────────────────────────────── */
/* ── Social Media ───────────────────────────────────────────────────────────
   Two ways into the same posts — the month, and the channels — and one editor
   they both open. A post is edited where it was clicked, so the calendar is not
   a second place that has to be kept in step.
   ────────────────────────────────────────────────────────────────────────── */
const KANAL = id => DB.kanaele.find(k => k.id === id) || { name: id, kurz: id };
const FELDER = { ig:    { tags:true,  alt:true,  textLabel:'Text' },
                 fb:    { tags:true,  alt:true,  textLabel:'Text' },
                 story: { tags:false, alt:false, textLabel:'Text im Bild' },
                 gbp:   { tags:false, alt:false, textLabel:'Text' } };
const STATUS_TXT = { entwurf:'Entwurf', freigegeben:'freigegeben', publiziert:'publiziert' };
// a post that names a dish reads name and price off the card
const postPreis = ref => { const e = ref && DB.karte.eintraege.find(x => x.id === ref);
  return e ? eintrag(e) : null; };
const postText = p => { const e = postPreis(p.ref);
  return esc(p.text) + (e ? ` <b>${esc(e.name)}, ${chf(e.preis)}.</b>` : ''); };

function postVorschau(p) {
  const k = KANAL(p.format), f = FELDER[p.format] || FELDER.ig;
  // a story carries its text inside the picture, so that is where it is drawn
  const bildStil = p.bild ? ` hat" style="background-image:url(${p.bild})` : '"';
  if (p.format === 'story') return `<div class="pv story">
    <div class="pvkopf">${esc(k.name)}<span style="margin-left:auto">${esc(p.datum)} ${esc(p.zeit)}</span></div>
    <div class="pvbild${bildStil}"><span class="pvoverlay">${postText(p)}</span></div>
    <div class="pvalt">Keine Bildunterschrift, keine Hashtags — Instagram nimmt bei Stories
      nur Bild oder Video.</div></div>`;
  return `<div class="pv ${p.format}">
    <div class="pvkopf">${esc(k.name)}<span style="margin-left:auto">${esc(p.datum)} ${esc(p.zeit)}</span></div>
    ${p.format === 'gbp' && !p.bild ? '' : `<div class="pvbild${bildStil}"></div>`}
    <div class="pvtext"><b>gaststube</b> ${postText(p)}
      ${f.tags && p.tags.length ? `<div class="pvtags">${p.tags.map(t => '#' + esc(t)).join(' ')}</div>` : ''}</div>
    ${f.alt && p.alt ? `<div class="pvalt">Alt-Text: ${esc(p.alt)}</div>` : ''}</div>`;
}

function postEditor(p) {
  const offen = p.status === 'entwurf';
  return `<div class="card" style="margin-bottom:18px;border-color:var(--line)">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="l small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;
           color:var(--dim)">Beitrag bearbeiten</div>
      <button class="btn" data-postzu="1">Schliessen</button></div>
    <div class="post">${postVorschau(p)}
      <div>
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:11px">
          <div style="min-width:0">
            <b style="font-size:14.5px">${esc(p.titel)}</b>
            <div style="margin-top:6px">${p.anlass
              ? `<span class="anlass">Anlass: ${esc(p.anlass)}${p.anlassWo
                  ? ` · <span class="link" data-go="${p.anlassWo}">nachsehen</span>` : ''}</span>` : ''}</div></div>
          <span class="tag ${p.status === 'entwurf' ? 't-warn' : 't-ok'}">${STATUS_TXT[p.status]}</span></div>
        <div class="pfeld"><label>Bild${p.format === 'story' ? ' · 9:16'
            : p.format === 'fb' ? ' · 16:9' : p.format === 'ig' ? ' · 1:1' : ''}</label>
          <div class="bildzeile">
            <label class="dropzone" data-drop="${p.id}">
              <input type="file" accept="image/*" data-postbild="${p.id}" hidden>
              ${p.bild
                ? `<b>${esc(p.bildname || 'Bild gewählt')}</b>
                   <span class="klein">Anderes Bild wählen oder hierher ziehen</span>`
                : `<b>Bild wählen</b>
                   <span class="klein">oder hierher ziehen · JPG oder PNG</span>`}</label>
            ${p.bild ? `<button class="btn" data-bildweg="${p.id}">Entfernen</button>` : ''}</div>
          ${p.bild ? '' : `<div class="small muted" style="margin-top:5px">Ohne Bild geht bei
            ${esc(KANAL(p.format).kurz)} nichts raus.</div>`}</div>
        <div class="pfeld"><label>${esc(FELDER[p.format].textLabel)}</label>
          <textarea data-posttext="${p.id}">${esc(p.text)}</textarea>
          ${p.format === 'story' ? `<div class="small muted" style="margin-top:5px">Stories nehmen über die
            Schnittstelle keine Bildunterschrift an — dieser Text wird ins Bild gesetzt.</div>` : ''}</div>
        <div class="grid g2" style="gap:12px">
          ${FELDER[p.format].tags ? `<div class="pfeld"><label>Hashtags</label>
            <input type="text" data-posttags="${p.id}" value="${esc(p.tags.map(t => '#' + t).join(' '))}"></div>`
            : '<div></div>'}
          <div class="pfeld"><label>Datum und Zeitfenster</label>
            <div class="row" style="gap:7px">
              <input type="text" style="width:84px" data-postdatum="${p.id}" value="${esc(p.datum)}">
              <select data-postwann="${p.id}">${DB.slots.map(sl =>
                `<option ${sl === p.zeit ? 'selected' : ''}>${esc(sl)}</option>`).join('')}</select></div></div></div>
        ${FELDER[p.format].alt ? `<div class="pfeld"><label>Alt-Text · für Gäste mit Screenreader</label>
          <input type="text" data-postalt="${p.id}" value="${esc(p.alt)}"></div>` : ''}
        ${p.ref ? `<div class="small muted" style="margin-bottom:11px">Preis und Name kommen aus
            <span class="link" data-go="inhalte">der Karte</span> — ändert sich dort etwas, ändert sich dieser Text.</div>` : ''}
        <div class="row">${offen
          ? `<button class="btn acc" data-act="post-freigeben" data-id="${p.id}">Freigeben</button>
             <button class="btn" data-act="post-verwerfen" data-id="${p.id}">Verwerfen</button>`
          : p.status === 'freigegeben'
            ? `<span class="small muted">Geht ${esc(p.datum)} ${esc(p.zeit)} raus. Änderung hier setzt ihn
                 zurück auf Entwurf.</span>`
            : `<span class="small muted">Am ${esc(p.datum)} publiziert. Änderung hier macht daraus einen
                 neuen Entwurf.</span>`}</div></div></div></div>`;
}

VIEWS.social = () => {
  const offen = POST_OFFEN && DB.posts.find(p => p.id === POST_OFFEN);
  const entwuerfe = DB.posts.filter(p => p.status === 'entwurf');
  const tag = d => +d.slice(0, 2);           // '17.03.' -> 17

  /* ── the month ── */
  const kalender = () => {
    const heute = tag(DB.today);
    const erster = 1, tage = 30, startWochentag = 2;   // 1. September 2026 ist ein Dienstag
    const zellen = [];
    for (let i = 1; i < startWochentag; i++) zellen.push('<div class="ktag leer"></div>');
    for (let d = erster; d <= tage; d++) {
      const drin = DB.posts.filter(p => tag(p.datum) === d);
      zellen.push(`<div class="ktag ${d === heute ? 'heute' : ''}">
        <div class="knr">${d}${d === heute ? '<span class="kheute">heute</span>' : ''}</div>
        ${drin.map(p => `<button class="kpost ${p.status} ${p.id === POST_OFFEN ? 'gewaehlt' : ''}"
            data-post="${p.id}" title="${esc(p.titel)}">
            <span class="kzeit">${esc(p.zeit)}</span> ${esc(KANAL(p.format).kurz)}</button>`).join('')}</div>`);
    }
    return `<div class="kkopf">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(t => `<div>${t}</div>`).join('')}</div>
      <div class="kgrid">${zellen.join('')}</div>
      <div class="klegende">
        <span><i class="entwurf"></i>Entwurf</span>
        <span><i class="freigegeben"></i>freigegeben</span>
        <span><i class="publiziert"></i>publiziert</span>
        <span class="muted">Beitrag anklicken, um ihn zu bearbeiten</span></div>`;
  };

  /* ── per channel ── */
  const kanalView = () => DB.kanaele.map(k => {
    const posts = DB.posts.filter(p => p.format === k.id)
      .sort((a, b) => tag(a.datum) - tag(b.datum));
    const dr = posts.filter(p => p.status === 'entwurf').length;
    const naechster = posts.find(p => tag(p.datum) >= tag(DB.today));
    return `<div class="card" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:11px">
        <div><b style="font-size:14px">${esc(k.name)}</b>
          <span class="small muted"> · ${posts.length} im ${esc(DB.monat)}${dr ? `, ${dr} im Entwurf` : ''}</span></div>
        <span class="small muted">${naechster ? `nächster: ${esc(naechster.datum)} ${esc(naechster.zeit)}` : 'nichts geplant'}</span></div>
      ${posts.length ? `<table style="table-layout:fixed;width:100%"><colgroup>
          <col style="width:98px"><col><col style="width:104px"><col style="width:86px"></colgroup>
        <tbody>${posts.map(p => `<tr class="click" data-post="${p.id}">
          <td class="muted num">${esc(p.datum)} ${esc(p.zeit)}</td>
          <td style="min-width:0"><b>${esc(p.titel)}</b>
            <div class="small muted zeile1">${postText(p)}</div></td>
          <td class="r"><span class="tag ${p.status === 'entwurf' ? 't-warn'
            : p.status === 'freigegeben' ? 't-ok' : 't-mute'}">${STATUS_TXT[p.status]}</span></td>
          <td class="r"><span class="link">bearbeiten</span></td></tr>`).join('')}</tbody></table>`
        : '<div class="small muted">Für diesen Kanal ist nichts geplant.</div>'}</div>`;
  }).join('');

  const tabs = [['kalender', 'Kalender'], ['kanal', 'Nach Kanal']].map(([id, n]) =>
    `<button class="tab ${SOCIAL_TAB === id ? 'on' : ''}" data-socialtab="${id}">${n}</button>`).join('');

  return `<div class="grid g3" style="margin-bottom:18px">
      <div class="card kpi"><div class="l">${esc(DB.monat)}</div><div class="n">${DB.posts.length} Beiträge</div>
        <div class="d">Auf ${DB.kanaele.length} Kanälen</div></div>
      <div class="card kpi"><div class="l">Warten auf Freigabe</div>
        <div class="n" style="color:${entwuerfe.length ? 'var(--warn)' : 'var(--ink)'}">${entwuerfe.length}</div>
        <div class="d">Nichts wird ohne Freigabe publiziert</div></div>
      <div class="card kpi"><div class="l">Nächstes Fenster</div>
        <div class="n">${(n => n ? esc(n.datum + ' ' + n.zeit) : '—')(
          [...DB.posts].filter(p => p.status !== 'publiziert' && tag(p.datum) >= tag(DB.today))
            .sort((a, b) => tag(a.datum) - tag(b.datum))[0])}</div>
        <div class="d">Datum und Zeit pro Beitrag änderbar</div></div></div>
    ${offen ? postEditor(offen) : ''}
    <div class="tabs">${tabs}</div>
    ${SOCIAL_TAB === 'kalender' ? kalender() : kanalView()}
    <div class="small muted" style="margin-top:14px">Entworfen wird aus dem, was sich im Haus geändert hat —
      jeder Beitrag sagt, aus welchem Anlass. Text, Hashtags, Alt-Text, Datum und Zeitfenster gehören Ihnen;
      ohne Freigabe geht nichts raus.</div>`;
};

/* ── Bewertungen ────────────────────────────────────────────────────────── */
VIEWS.bewertungen = () => {
  const maxN = Math.max(...DB.themen.map(t => t.n));
  const themen = DB.themen.map(t => `<tr>
    <td><b>${esc(t.thema)}</b></td>
    <td style="width:190px"><div class="bar"><i style="width:${Math.round(t.n / maxN * 100)}%;
      background:${t.trend === 'down' ? 'var(--warn)' : 'var(--acc)'}"></i></div></td>
    <td class="r num">${t.n}</td></tr>`).join('');
  // Google nimmt bis 4096 Zeichen in einer Antwort
  const LIMIT = 4096;
  const bew = DB.bewertungen.map(b => {
    const offen = b.status === 'entwurf';
    const naechsterTon = b.varianten && b.varianten.length
      ? b.varianten[(b.varianten.findIndex(v => v.ton === b.ton) + 1) % b.varianten.length] : null;
    return `<div class="card" style="margin-bottom:12px">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:14px">
        <div style="min-width:0;max-width:72ch">
          <div class="row" style="gap:8px">
            <span class="tag t-mute">${esc(b.quelle)} · ${b.sterne}★</span>
            <span class="small muted">${esc(b.wann)} · ${esc(b.thema)}</span></div>
          <div class="small" style="margin-top:8px;line-height:1.6">«${esc(b.text)}»</div></div>
        ${offen ? '' : `<span class="tag ${b.status === 'gesendet' ? 't-ok' : 't-mute'}">${esc(b.status)}</span>`}</div>
      ${offen ? `<div class="pfeld" style="margin-top:12px;margin-bottom:0">
          <label>Ihre Antwort · Entwurf von Axyom${b.angepasst ? ' · von Ihnen angepasst' : ''}</label>
          <textarea data-antwort="${b.id}" style="min-height:76px">${esc(b.antwort)}</textarea>
          <div class="row" style="justify-content:space-between;margin-top:9px">
            <div class="row">
              <button class="btn acc" data-act="antwort-senden" data-id="${b.id}">Antwort senden</button>
              ${naechsterTon ? `<button class="btn" data-act="antwort-ton" data-id="${b.id}"
                >Anders formulieren · ${esc(naechsterTon.ton)}</button>` : ''}
              <button class="btn" data-act="antwort-ignorieren" data-id="${b.id}">Ignorieren</button></div>
            <span class="small ${b.antwort.length > LIMIT ? '' : 'muted'}"
              style="${b.antwort.length > LIMIT ? 'color:var(--warn);font-weight:650' : ''}"
              >${b.antwort.length} von ${LIMIT} Zeichen</span></div></div>`
        : `<div class="small muted" style="margin-top:10px;line-height:1.6;padding-left:11px;
             border-left:2px solid var(--wash)">${esc(b.antwort)}</div>`}</div>`;
  }).join('');
  const quote = DB.bewBeantwortet / DB.bewMonat * 100;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Schnitt, 30 Tage</div><div class="n">${DB.schnitt.toFixed(1)}</div>
        <div class="d">Vorher ${DB.schnittVorher.toFixed(1)}</div></div>
      <div class="card kpi"><div class="l">Beantwortet</div>
        <div class="n">${DB.bewBeantwortet} von ${DB.bewMonat}</div>
        <div class="d">${quote.toFixed(0)}% · innert 24 h</div></div>
      <div class="card kpi"><div class="l">Häufigstes Thema</div>
        <div class="n" style="font-size:19px;line-height:1.3">${esc(DB.themen[0].thema)}</div>
        <div class="d">${DB.themen[0].n}× erwähnt</div></div></div>
    <div class="sec">Seit der Eröffnung</div>
    <div class="card" style="margin-bottom:16px"><div class="row" style="gap:28px;flex-wrap:wrap">
      ${DB.bewVerlauf.map(m => `<div><div class="vk">${esc(m.monat)}</div>
        <div class="vl2">${m.schnitt.toFixed(1)}</div>
        <div class="vn muted">${m.n} Bewertungen</div></div>`).join('')}
      <div style="flex:1;min-width:220px;align-self:center">
        <div class="small muted" style="line-height:1.6">${DB.bewSeit} Bewertungen in drei Monaten.
        Die ersten Wochen kosten — die Note steigt, seit die Antworten am selben Tag rausgehen.</div></div>
    </div></div>
    <div class="sec">Worum es ging</div>
    <table><tbody>${themen}</tbody></table>
    <div class="small muted" style="margin-top:10px">Sie lesen nicht «Note ${DB.schnitt.toFixed(1)}»,
      sondern «${DB.themen[0].n}× ${esc(DB.themen[0].thema)}».</div>
    <div class="sec">Offene Antworten</div>${bew}`;
};

/* ── Auswertungen ───────────────────────────────────────────────────────── */
VIEWS.auswertungen = () => {
  const Z = zahlen();
  const { gedecke, std, personal, kalk, umsatz, einsatz, roh } = Z;
  const db = roh - personal;
  const vorwoche = DB.wochen[DB.wochen.length - 1];
  const dbVor = vorwoche.umsatz - vorwoche.einsatz - vorwoche.personal;

  /* Benchmarks, so a percentage means something. GastroSuisse Branchenspiegel:
     Wareneinsatz rund 29.9%; für den Personalaufwand gilt rund die Hälfte des
     Umsatzes als Obergrenze. */
  const bench = (wert, gut, grenze, txt) => `<span class="bm ${wert <= gut ? 'gut'
    : wert <= grenze ? 'ok' : 'hoch'}">${txt}</span>`;
  const wareQ = einsatz / umsatz * 100, persQ = personal / umsatz * 100, dbQ = db / umsatz * 100;

  /* ── 1. Was bleibt, und wohin der Franken geht ── */
  const kopf = `<div class="wkopf">
      <div class="card bleibt">
        <div class="wl"><span>Was bleibt</span>
          <span class="r2" style="color:${db >= dbVor ? 'var(--acci)' : 'var(--warn)'}"
            >${pct((db / dbVor - 1) * 100)} ggü. ${esc(vorwoche.kw)}</span></div>
        <div class="gross">${chf(db)}</div>
        <div class="rappen">${(dbQ / 100 * 100).toFixed(0)} Rappen von jedem Franken Umsatz —
          nach Ware und Personal.<br>
          <span style="color:var(--dim)">Davon gehen noch Miete, Energie und Versicherungen ab;
          die sind in dieser Demo nicht erfasst.</span></div></div>
      <div class="card hin">
        <div class="wl"><span>Wohin der Franken geht</span>
          <span class="r2">${chf(umsatz)} Umsatz · ${gedecke} Gedecke</span></div>
        <div class="wbar">
          <i style="width:${wareQ}%;background:var(--warn)"></i>
          <i style="width:${persQ}%;background:var(--acci)"></i>
          <i style="width:${dbQ}%;background:var(--acc)"></i></div>
        <div class="wleg">
          <div><span class="pt" style="background:var(--warn)"></span>Ware <b>${wareQ.toFixed(1)}%</b>
            ${bench(wareQ, 29.9, 33, 'Branche 29.9%')}</div>
          <div><span class="pt" style="background:var(--acci)"></span>Personal <b>${persQ.toFixed(1)}%</b>
            ${bench(persQ, 45, 51, 'Branche bis ~51%')}</div>
          <div><span class="pt" style="background:var(--acc)"></span>Bleibt <b>${dbQ.toFixed(1)}%</b></div></div>
        <div class="small muted" style="margin-top:11px">Beide Anteile liegen unter dem Branchenwert —
          die Ware, weil ${DB.gerichte.length} Gerichte Zeile für Zeile kalkuliert sind und Preisänderungen
          sofort ankommen; das Personal, weil der Dienstplan an den Gedecken hängt und nicht am Gefühl.</div></div>
    </div>`;

  /* ── 2. Wie sie zustande kommt ── */
  const z = (nm, wert, hint, cls = '') => `<div class="z ${cls}">
    <div class="nm">${nm}</div><div class="wert">${wert}</div>
    <div class="hint">${hint || ''}</div></div>`;
  const rechnung = `<div class="wf">
      ${z('Umsatz', chf(umsatz), `${gedecke} Gedecke · ${chf(umsatz / gedecke)} pro Gedeck`, 'summe')}
      ${z('Speisen, kalkulierte Gerichte', chf(kalk),
          `${DB.gerichte.reduce((s, g) => s + g.verkauft, 0)} Portionen`, 'sub')}
      ${z('Speisen, übrige Karte', chf(DB.uebrigeSpeisen), 'noch nicht kalkuliert', 'sub')}
      ${z('Getränke', chf(DB.getraenke), (DB.getraenke / umsatz * 100).toFixed(0) + '% vom Umsatz', 'sub')}
      ${z('− Wareneinsatz', '−' + chf(einsatz),
          `${wareQ.toFixed(1)}% ${bench(wareQ, 29.9, 33, 'Branche 29.9%')}`, 'ab')}
      ${Z.kalkWE !== Z.kalkWEplan ? z('davon aus Preisen, die noch nicht übernommen sind',
          '−' + chf(Z.kalkWE - Z.kalkWEplan),
          'bezahlt und gerechnet · kalkuliert wird noch mit den alten', 'sub') : ''}
      ${z('= Rohertrag', chf(roh), `${(roh / umsatz * 100).toFixed(1)}% vom Umsatz`, 'summe')}
      ${z('− Personal, geplant', '−' + chf(personal),
          `${std} Std · ${persQ.toFixed(1)}% ${bench(persQ, 45, 51, 'Branche bis ~51%')}`, 'ab')}
      ${z('= Deckungsbeitrag', chf(db), `${dbQ.toFixed(1)}% · ${chf(db / gedecke)} pro Gedeck`, 'summe')}
    </div>
    <div class="small muted" style="margin-top:10px">Die Ware ist zu den Preisen gerechnet, die auf den
      Rechnungen stehen — bezahlt ist bezahlt, dafür braucht es keine Freigabe. Ob ab jetzt auch mit
      diesen Preisen <span class="link" data-go="gerichte">kalkuliert</span> wird, entscheiden Sie in
      <span class="link" data-go="rechnungen">Rechnungen</span>.
      Personal ist die geplante Schicht aus dem
      <span class="link" data-go="dienstplan">Dienstplan</span>, nicht gestempelte Zeit. Die kalkulierten
      Gerichte kommen aus <span class="link" data-go="gerichte">Gerichte</span> und rechnen mit den Preisen,
      die zuletzt bezahlt wurden.</div>`;

  const alleWochen = [...DB.wochen, { kw:'KW 39', ab:'21.09.', umsatz, gedecke, einsatz, personal, jetzt:true }];
  const reihe = alleWochen.slice(-Math.min(VERLAUF_W, alleWochen.length));
  // 13 is every week the house has existed, so it is labelled as that
  const filter = [4, 8, 13].filter(n => n <= alleWochen.length).map(n =>
    `<button class="tab ${VERLAUF_W === n ? 'on' : ''}" data-verlauf="${n}"
      >${n === alleWochen.length ? 'seit Eröffnung' : n + ' Wochen'}</button>`).join('');
  const wochenZeilen = reihe.map(w => {
    const db = w.umsatz - w.einsatz - w.personal;
    return `<tr${w.jetzt ? ' style="background:var(--wash)"' : ''}>
      <td><b>${esc(w.kw)}</b> <span class="muted small">ab ${esc(w.ab)}</span>
        ${w.jetzt ? '<span class="tag t-ok">diese Woche</span>' : ''}
        ${w.note ? `<span class="muted small"> · ${esc(w.note)}</span>` : ''}</td>
      <td class="r num">${chf(w.umsatz)}</td>
      <td class="r num muted">${w.gedecke}</td>
      <td class="r num muted">${chf(w.umsatz / w.gedecke)}</td>
      <td class="r num muted">${(w.einsatz / w.umsatz * 100).toFixed(1)}%</td>
      <td class="r num muted">${(w.personal / w.umsatz * 100).toFixed(1)}%</td>
      <td class="r num">${chf(db)}</td></tr>`;
  }).join('');
  /* One sentence instead of three numbers that are already in the header: what
     moved, and — when the bottom line moved differently from the top line — why. */
  const persVor = vorwoche.personal / vorwoche.umsatz * 100;
  const dUmsatz = (umsatz / vorwoche.umsatz - 1) * 100;
  const dDb = (db / dbVor - 1) * 100;
  const satz = `Diese Woche liegt ${chf(umsatz - vorwoche.umsatz)} über ${esc(vorwoche.kw)} `
    + `(${pct(dUmsatz)}), bei ${gedecke - vorwoche.gedecke} Gedecken mehr.`
    + (dDb < dUmsatz - 1
        ? ` Der Deckungsbeitrag wächst langsamer (${pct(dDb)}): der Personalanteil ist von `
          + `${persVor.toFixed(1)}% auf ${persQ.toFixed(1)}% gestiegen.`
        : dDb > dUmsatz + 1
          ? ` Der Deckungsbeitrag wächst schneller (${pct(dDb)}): der Personalanteil ist von `
            + `${persVor.toFixed(1)}% auf ${persQ.toFixed(1)}% gesunken.`
          : ` Der Deckungsbeitrag zieht im gleichen Mass mit (${pct(dDb)}).`);

  const verlauf = `<div class="verlaufkopf">
      <div class="card vstats">
        <div class="wl"><span>Gegenüber ${esc(vorwoche.kw)}</span>
          <span class="r2">die laufende Woche rechnet live mit</span></div>
        <div style="font-size:13px;line-height:1.65">${satz}</div>
        <div class="small muted" style="margin-top:9px">Abgeschlossene Wochen stehen fest;
          ${reihe[reihe.length - 1].kw} ändert sich, sobald in einem Modul etwas entschieden wird.</div></div>
      <div class="card vchart">
        <div class="wl"><span>Umsatz pro Woche</span>
          <span class="r2">${reihe.length} Wochen</span></div>
        ${(u => chartLine(u, Math.min(...u), Math.max(...u), 62))(reihe.map(w => w.umsatz))}
        <div class="row" style="justify-content:space-between;margin-top:6px">
          <span class="sm2">${chf(Math.min(...reihe.map(w => w.umsatz)))}</span>
          <span class="sm2">${chf(Math.max(...reihe.map(w => w.umsatz)))}</span></div></div></div>
    <div class="scrollx"><table><thead><tr><th>Woche</th><th class="r">Umsatz</th><th class="r">Gedecke</th>
      <th class="r">pro Gedeck</th><th class="r">Ware</th><th class="r">Personal</th>
      <th class="r">Deckungsbeitrag</th></tr></thead><tbody>${wochenZeilen}</tbody></table></div>`;

  /* ── next week, out of the bookings that exist ── */
  const N = DB.naechste;
  const gebucht = N.tage.reduce((s, t) => s + t.gebucht, 0);
  const erwartet = Math.round(gebucht / N.anteil);
  const proGedeck = umsatz / gedecke;
  const eUmsatz = erwartet * proGedeck;
  const eStd = N.tage.reduce((s, t) => s + t.besetzt * 8, 0);
  const ePersonal = eStd * DB.lohn;
  const eWare = eUmsatz * (einsatz / umsatz);
  const knappN = N.tage.filter(t => t.gebucht / N.anteil / t.besetzt > DB.knappAb);
  const vorschau = `<div class="grid g4" style="margin-bottom:12px">
      <div class="card kpi"><div class="l">Gebucht</div><div class="n">${gebucht}</div>
        <div class="d">Gedecke, Stand heute</div></div>
      <div class="card kpi"><div class="l">Erwartet</div><div class="n">${erwartet}</div>
        <div class="d">wenn es wie üblich weiterläuft</div></div>
      <div class="card kpi"><div class="l">Umsatz, erwartet</div><div class="n">${chf(eUmsatz)}</div>
        <div class="d">${chf(proGedeck)} pro Gedeck, wie diese Woche</div></div>
      <div class="card kpi"><div class="l">Deckungsbeitrag, erwartet</div>
        <div class="n">${chf(eUmsatz - eWare - ePersonal)}</div>
        <div class="d">${eStd} Stunden geplant</div></div></div>
    <div class="scrollx"><table><thead><tr><th>Tag</th><th class="r">Gebucht</th><th class="r">Erwartet</th>
      <th class="r">Besetzt</th><th class="r">Gedecke pro Person</th></tr></thead><tbody>
      ${N.tage.map(t => { const e = Math.round(t.gebucht / N.anteil), pro = e / t.besetzt;
        return `<tr><td><b>${t.tag}</b></td><td class="r num muted">${t.gebucht}</td>
          <td class="r num">${e}</td><td class="r num muted">${t.besetzt}</td>
          <td class="r num" style="${pro > DB.knappAb ? 'color:var(--warn);font-weight:650' : ''}"
            >${pro.toFixed(0)}${pro > DB.knappAb ? ' · knapp' : ''}</td></tr>`; }).join('')}
      </tbody></table></div>
    <div class="small muted" style="margin-top:10px">«Erwartet» ist der Buchungsstand hochgerechnet:
      bis zum Mittwoch davor sind erfahrungsgemäss ${(N.anteil * 100).toFixed(0)}% der Woche gebucht.
      Keine Prognose aus dem Nichts — und keine Zusage.
      ${knappN.length ? `<span style="color:var(--warn);font-weight:600">${knappN.map(t => t.tag).join(', ')}
        ${knappN.length > 1 ? 'werden' : 'wird'} mit der geplanten Besetzung knapp.</span>` : ''}</div>`;

  const bewegt = Object.entries(DB.artikel).filter(([, a]) => a.preis !== a.vorher);
  const hinweise = [];
  if (bewegt.length) hinweise.push(`${bewegt.length} Artikelpreis${bewegt.length > 1 ? 'e' : ''} bewegt: ` +
    bewegt.map(([, a]) => esc(a.name.split(',')[0])).join(', ') + ' — die Margen oben rechnen damit.');
  const knapp = DB.woche.filter(d => d.gedecke / d.besetzt > DB.knappAb);
  if (knapp.length) hinweise.push(`Knapp besetzt: ${knapp.map(d => d.tag).join(', ')} — mehr als ${DB.knappAb} Gedecke pro Person.`);
  const offenH = DB.hygiene.filter(h => !h.done).length;
  if (offenH) hinweise.push(`${offenH} Hygienekontrolle${offenH > 1 ? 'n' : ''} noch offen.`);
  const alarmOffen = DB.alarme.filter(a => !a.quittiert).length;
  if (alarmOffen) hinweise.push(`${alarmOffen} Temperaturalarm nicht quittiert.`);
  if (knappN.length) hinweise.push(`Nächste Woche: ${knappN.map(t => t.tag).join(', ')} ` +
    `${knappN.length > 1 ? 'sind' : 'ist'} mit der geplanten Besetzung knapp — ` +
    `<span class="link" data-go="dienstplan">Dienstplan</span> ansehen.`);
  if (!hinweise.length) hinweise.push('Keine offenen Punkte. Die Woche ist sauber.');

  return `${kopf}
    <div class="sec">Wie sie zustande kommt</div>
    ${rechnung}
    <div class="sec">Was zu tun ist</div>
    <div class="card ${DB.hygiene.some(h => !h.done) || DB.alarme.some(a => !a.quittiert) ? 'warn' : 'tint'}">
      ${hinweise.map(h => `<div class="small" style="line-height:1.8">· ${h}</div>`).join('')}</div>
    <div class="sec" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">Verlauf
      <span class="tabs" style="margin-bottom:0">${filter}</span>
      <span class="muted" style="font-weight:600;letter-spacing:0;text-transform:none">${
        esc(reihe[0].kw)} bis ${esc(reihe[reihe.length - 1].kw)}</span></div>
    ${verlauf}
    <div class="sec">Nächste Woche · erwartet</div>
    ${vorschau}
    ${DB.log.length ? `<div class="sec">Was in dieser Demo passiert ist</div>
      <div class="card tint">${DB.log.slice(0, 10).map(l =>
        `<div class="small muted" style="line-height:1.8"><span class="num">${l.zeit}</span> · ${l.text}</div>`).join('')}
      </div>` : `<div class="sec">Was in dieser Demo passiert ist</div>
      <div class="card tint"><div class="small muted">Noch nichts. Übernehmen Sie in
        <span class="link" data-go="rechnungen">Rechnungen</span> eine Preisänderung oder haken Sie in
        <span class="link" data-go="hygiene">Hygiene</span> eine Kontrolle ab — die Folgen erscheinen hier.</div></div>`}`;
};
/* ── Übersicht ──────────────────────────────────────────────────────────────
   The dashboard is not a twelfth screen with its own data. It asks every
   module what it is waiting for and lists the answers, which is the only
   honest way to build an overview: if a module goes quiet, the dashboard goes
   quiet with it. Every row jumps to the module that owns it.
   ────────────────────────────────────────────────────────────────────────── */
