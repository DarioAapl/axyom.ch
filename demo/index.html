function offeneSachen() {
  const items = [];

  DB.rechnungen.filter(r => r.status === 'preis').forEach(r => {
    const z = r.zeilen.find(x => x.preis > DB.artikel[x.art].vorher);
    const a = DB.artikel[z.art];
    const auf = (z.preis / a.vorher - 1) * 100;
    items.push({ ernst: 2, wo: 'rechnungen', modul: 'Rechnungen',
      was: `${a.name.split(',')[0]} +${auf.toFixed(1)}% bei ${r.lief}`,
      warum: (n => `Steckt in ${n} Gericht${n > 1 ? 'en' : ''} — Preis übernehmen oder nachfragen`)(
        DB.gerichte.filter(g => g.rezept.some(x => x.art === z.art)).length) });
  });
  DB.rechnungen.filter(r => r.status === 'menge').forEach(r => {
    const z = r.zeilen.find(x => x.gel < x.best);
    items.push({ ernst: 2, wo: 'rechnungen', modul: 'Rechnungen',
      was: `${r.lief}: ${r.id} verlangt zu viel`,
      warum: `${z.best - z.gel} Position${z.best - z.gel > 1 ? 'en' : ''} nicht geliefert — ${chf((z.best - z.gel) * z.preis)}` });
  });

  DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).forEach(g => {
    items.push({ ernst: 3, wo: 'temperatur', modul: 'Temperatur',
      was: `${g.name} bei ${g.temp.toFixed(1)} °C`,
      warum: `Bereich ${g.min} – ${g.max} °C — Meldung ist raus, wartet auf Quittierung` });
  });

  const hOffen = DB.hygiene.filter(h => !h.done);
  if (hOffen.length) items.push({ ernst: 2, wo: 'hygiene', modul: 'Hygiene',
    was: `${hOffen.length} Kontrolle${hOffen.length > 1 ? 'n' : ''} noch offen`,
    warum: hOffen.map(h => h.station).join(', ') + ' — vor Serviceschluss sichtbar' });

  DB.aktionen.filter(a => dringend(a) && !a.genommen).forEach(a => {
    const art = DB.artikel[a.art];
    items.push({ ernst: 1, wo: 'aktionen', modul: 'Aktionen',
      was: `${art.name.split(',')[0]} −${((1 - a.neu / art.preis) * 100).toFixed(0)}% bis ${a.bis}`,
      warum: `Spart ${chf((art.preis - a.neu) / art.menge * a.monat)} bei Ihrer üblichen Menge` });
  });

  const wartet = DB.karte.ziele.filter(z => z.status === 'wartet');
  if (wartet.length) { const n = karteGeaendert().length;
    items.push({ ernst: 1, wo: 'inhalte', modul: 'Inhalte',
      was: `Karte: ${n} ${n === 1 ? 'Zeile wartet' : 'Zeilen warten'} auf Freigabe`,
      warum: `${wartet.map(z => z.was).join(', ')} — nichts erreicht einen Gast vorher` }); }

  const drafts = DB.posts.filter(p => p.status === 'entwurf');
  if (drafts.length) items.push({ ernst: 1, wo: 'social', modul: 'Social Media',
    was: `${drafts.length} Beitr${drafts.length > 1 ? 'äge' : 'ag'} im Entwurf`,
    warum: drafts.map(p => p.datum + ' ' + p.zeit).join(', ') + ' — geschrieben, wartet auf Sie' });

  const rOffen = DB.bewertungen.filter(b => b.status === 'entwurf');
  if (rOffen.length) items.push({ ernst: 1, wo: 'bewertungen', modul: 'Bewertungen',
    was: `${rOffen.length} Antwort${rOffen.length > 1 ? 'en' : ''} entworfen`,
    warum: rOffen.map(b => b.quelle + ' ' + b.sterne + '★').join(', ') + ' — durchlesen und senden' });

  const bOffen = DB.briefings.filter(b => b.faellig.length);
  if (bOffen.length) items.push({ ernst: 1, wo: 'schulung', modul: 'Schulung',
    was: `${bOffen.length} Briefing${bOffen.length > 1 ? 's' : ''} fällig`,
    warum: bOffen.map(b => b.titel).join(', ') + ' — ' + bOffen.reduce((s, b) => s + b.faellig.length, 0) + ' Personen' });

  const knapp = DB.woche.filter(d => d.gedecke / d.besetzt > DB.knappAb);
  if (knapp.length) items.push({ ernst: 2, wo: 'dienstplan', modul: 'Dienstplan',
    was: `${knapp.map(d => d.tag).join(', ')} knapp besetzt`,
    warum: `Über ${DB.knappAb} Gedecke pro Person — ${knapp.map(d => d.tag + ': ' + d.gedecke + ' auf ' + d.besetzt).join(' · ')}` });

  const zH = DB.zaehlungHeute();
  const lAuff = DB.lager.filter(l => DB.zAuff(zH, l.art));
  if (lAuff.length) items.push({ ernst: 1, wo: 'lager', modul: 'Lager',
    was: `${lAuff.length} Artikel weich${lAuff.length > 1 ? 'en' : 't'} ab`,
    warum: lAuff.map(l => DB.artikel[l.art].name.split(',')[0]).join(', ') +
           ` — zusammen ${chf(lAuff.reduce((s, l) => s + DB.zWert(zH, l.art), 0))}` });

  return items.sort((a, b) => b.ernst - a.ernst);
}

/* ── Axyom fragen ───────────────────────────────────────────────────────────
   A question box in the corner, so nobody has to know which module holds the
   answer. It reads the same DB every screen reads, so the answer moves when
   the data moves: take the veal price over in Rechnungen and ask for the
   Kalbsbraten margin here, and the new number comes back.

   How it resolves a question, and what that costs:
     * the NOUNS are built out of the data itself — every article, dish,
       supplier, device, person, weekday, review theme and invoice number is
       indexed from DB at question time, so a new article is askable the
       moment it exists, in any phrasing.
     * the MODULE names carry most of the topic vocabulary (they are the words
       the house already uses), and BEGRIFFE below adds only the field
       semantics no module is named after — marge, umsatz, preis. That much is
       a written lexicon, and it is the honest limit of a demo with no model
       behind it: the live product sends the question to the model.
     * it therefore never answers "nothing". An unrecognised question falls
       back to what is open right now, with links — narrow the answer, never
       empty it.
   ────────────────────────────────────────────────────────────────────────── */
const CHAT = { offen: false, verlauf: [], denkt: false };

const cnorm = s => String(s).toLowerCase()
  .replace(/[äáà]/g, 'a').replace(/[öó]/g, 'o').replace(/[üú]/g, 'u')
  .replace(/[éèê]/g, 'e').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();

const TAGE = { Mo:'Montag', Di:'Dienstag', Mi:'Mittwoch', Do:'Donnerstag',
               Fr:'Freitag', Sa:'Samstag', So:'Sonntag' };

/* every noun in the house, read out of DB — not a list anybody maintains */
function chatIndex() {
  const ix = [], add = (kind, ref, ...l) =>
    ix.push({ kind, ref, keys: [...new Set(l.filter(Boolean).map(cnorm))] });
  Object.entries(DB.artikel).forEach(([k, a]) => add('artikel', k, k, a.name.split(',')[0], a.name));
  DB.gerichte.forEach(g => add('gericht', g, g.name, g.name.split(' ')[0]));
  DB.geraete.forEach(g => add('geraet', g, g.name, g.name.replace(/\s*\d+$/, '')));
  DB.rechnungen.forEach(r => add('rechnung', r, r.id));
  [...new Set([...Object.values(DB.artikel).map(a => a.lief), ...DB.rechnungen.map(r => r.lief)])]
    .forEach(l => add('lieferant', l, l, l.split(' ')[0]));
  DB.leute.forEach(p => add('person', p, p.name, p.name.split(' ').pop()));
  DB.woche.forEach(d => add('tag', d, d.tag, TAGE[d.tag]));
  DB.themen.forEach(t => add('thema', t, t.thema));
  MODULES.forEach(m => add('modul', m, m.name, m.titel));
  DB.outlets.forEach(o => add('betrieb', o, o));
  return ix;
}

/* the words the data uses that no module is named after */
const BEGRIFFE = [
  ['auswertungen', 'umsatz ertrag rohertrag deckungsbeitrag zahlen gedeck gedecke wareneinsatz personal personalkosten lohn woche monat rendite ergebnis'],
  ['gerichte',     'marge margen kalkuliert kalkulation teller speise speisen karte verdient'],
  ['preise',       'preis preise kostet kosten teurer teuerer preisanderung preiserhohung aufschlag gestiegen erhoht'],
  ['aktionen',     'sparen spare angebot angebote rabatt guenstiger billiger'],
  ['uebersicht',   'offen offene heute anstehen ansteht entscheiden entscheidung dringend wichtig tun'],
  ['verlust',      'verliere verlieren verlust geld leck'],
  ['log',          'geandert passiert protokoll gemacht'],
  ['hilfe',        'kannst koennen hilfe helfen fragen wer bist du hallo hoi guten'],
];

/* Which kind of thing a topic word is asking about. «Marge Kalbsbraten» and
   «Preis Kalbsbraten» name the same stem and want different answers — the dish
   and the article — so the topic decides which noun wins the tie. */
const KIND_VON = { gerichte:'gericht', preise:'artikel', aktionen:'artikel', lager:'artikel',
                   temperatur:'geraet', rechnungen:'rechnung', dienstplan:'tag',
                   schulung:'person', bewertungen:'thema' };

function entName(kind, ref) {
  if (kind === 'artikel')  return DB.artikel[ref].name;
  if (kind === 'tag')      return TAGE[ref.tag];
  if (kind === 'thema')    return ref.thema;
  if (kind === 'rechnung') return ref.id;
  if (kind === 'modul')    return ref.name;
  return ref.name || String(ref);
}

function matchEnt(q, ix, bias) {
  const qt = q.split(' ').filter(Boolean);
  const hits = new Map();   // one score per thing, its best key wins
  const take = (e, s) => {
    if (!s) return;
    s += (bias && e.kind === bias) ? 6 : 0;
    const key = e.kind + '|' + entName(e.kind, e.ref);
    if (!hits.has(key) || hits.get(key).s < s) hits.set(key, { kind: e.kind, ref: e.ref, s });
  };
  ix.forEach(e => e.keys.forEach(k => {
    const kw = k.split(' ');
    if (k.length >= 4 && q.includes(k)) return take(e, k.length + 3);
    if ((' ' + q + ' ').includes(' ' + k + ' ')) return take(e, k.length + 1);
    // «kalbsbrate», «kuhlraume» — a stem long enough to be unambiguous
    qt.forEach(t => { if (t.length >= 5) kw.forEach(w => {
      if (w.length >= 5 && (w.startsWith(t) || t.startsWith(w))) take(e, Math.min(t.length, w.length));
    }); });
  }));
  const all = [...hits.values()].sort((a, b) => b.s - a.s);
  if (!all.length) return null;
  // «Rösti» is in two dishes. Ask which one instead of quietly picking one.
  const gleich = all.filter(x => x.s === all[0].s && x.kind === all[0].kind);
  return { ...all[0], ties: gleich.length > 1 ? gleich : [] };
}

function matchThema(q) {
  let best = null;
  BEGRIFFE.forEach(([id, words]) => words.split(' ').forEach(w => {
    const s = (' ' + q + ' ').includes(' ' + w + ' ') ? w.length + 2
            : (w.length >= 5 && q.includes(w)) ? w.length : 0;
    if (s && (!best || s > best.s)) best = { id, s };
  }));
  return best;
}

/* ── answer formatting ─────────────────────────────────────────────────── */
const cK = t => `<div class="qk">${t}</div>`;
const cZ = t => `<div class="qz">${t}</div>`;
const cC = arr => arr.length ? `<div class="chips" style="margin-top:9px">${arr.map(c => c.go
    ? `<span class="chip" data-go="${c.go}">${esc(c.t)} &rsaquo;</span>`
    : `<span class="chip" data-ask="${esc(c.t)}">${esc(c.t)}</span>`).join('')}</div>` : '';
const bau = (kopf, zeilen, chips = []) => cK(kopf) + zeilen.filter(Boolean).map(cZ).join('') + cC(chips);
const kurz = n => DB.artikel[n] ? DB.artikel[n].name.split(',')[0] : n;

/* ── answers about one thing ───────────────────────────────────────────── */
function aArtikel(k) {
  const a = DB.artikel[k], ep = einzel(k);
  const inG = DB.gerichte.filter(g => g.rezept.some(z => z.art === k));
  const off = DB.rechnungen.find(r => r.status === 'preis' && r.zeilen.some(z => z.art === k && z.preis > a.preis));
  const ak = DB.aktionen.find(x => x.art === k && !x.genommen);
  const l = DB.lager.find(x => x.art === k);
  const z = [`${chf(a.preis)} pro ${a.menge} ${a.einheit} — <b>${chf(ep)} pro ${esc(a.einheit)}</b>`];
  if (a.preis !== a.vorher)
    z.push(`${pct((a.preis / a.vorher - 1) * 100)} gegenüber ${chf(a.vorher)}, von Ihnen übernommen`);
  if (off) { const zl = off.zeilen.find(x => x.art === k);
    z.push(`<span class="hl">${esc(off.lief)} verlangt in ${esc(off.id)} ${chf(zl.preis)} — ${pct((zl.preis / a.preis - 1) * 100)}, noch nicht entschieden</span>`); }
  if (inG.length) z.push(`Steckt in ${inG.length} Gericht${inG.length > 1 ? 'en' : ''}: ` +
    inG.map(g => `${esc(g.name)} (${marge(g).toFixed(1)}%)`).join(', '));
  if (ak) z.push(`Aktion bis ${esc(ak.bis)}: ${chf(ak.neu)} — spart ${chf((a.preis - ak.neu) / a.menge * ak.monat)} bei Ihrer üblichen Menge`);
  if (l) { const zH = DB.zaehlungHeute(), w = zH.werte[k];
    // und wann es das letzte Mal auffällig war
    const frueher = [...DB.zaehlungen].reverse().find(z => z !== zH && DB.zAuff(z, k));
    z.push(`Lager heute: ${w.gezaehlt} ${esc(l.einheit)} gezählt, ${w.erwartet} erwartet — ` +
           `${chf(DB.zWert(zH, k))}` +
           (frueher ? `. Auffällig war es zuletzt bei der Zählung vom ${esc(frueher.datum)} ` +
                      `(${DB.zDiff(frueher, k).toFixed(1)} ${esc(l.einheit)})` : '')); }
  return bau(`${esc(a.name)} · ${esc(a.lief)}`, z,
    [off ? { t:'Rechnungen', go:'rechnungen' } : null, inG.length ? { t:'Gerichte', go:'gerichte' } : null,
     ak ? { t:'Aktionen', go:'aktionen' } : null].filter(Boolean));
}

function aGericht(g) {
  const we = wareneinsatz(g), m = marge(g);
  const lines = g.rezept.map(z => ({ n: kurz(z.art), v: einzel(z.art) * z.m }))
    .sort((a, b) => b.v - a.v);
  const teuer = DB.artikel[g.rezept.map(z => ({ z, v: einzel(z.art) * z.m }))
    .sort((a, b) => b.v - a.v)[0].z.art];
  return bau(`${esc(g.name)} · ${chf(g.karte)} auf der Karte`, [
    `Wareneinsatz <b>${chf(we)}</b>, Marge <b>${m.toFixed(1)}%</b> vom Preis` +

}

function aGeraet(g) {
  const bad = g.temp > g.max || g.temp < g.min;
  const hi = Math.max(...g.verlauf), lo = Math.min(...g.verlauf);
  const al = DB.alarme.filter(a => a.geraet === g.name);
  return bau(`${esc(g.name)} · ${esc(g.wo)}`, [
    `Jetzt <b${bad ? ' class="bad"' : ''}>${g.temp.toFixed(1)} °C</b>, erlaubt sind ${g.min} bis ${g.max} °C`,
    `Letzte Stunden: ${lo.toFixed(1)} bis ${hi.toFixed(1)} °C`,
    al.length ? al.map(a => `${esc(a.wann)}: ${a.wert.toFixed(1)} °C an ${esc(a.an)}` +
        (a.quittiert ? `, quittiert ${esc(a.quittiert)}` : ', <span class="bad">nicht quittiert</span>') +
        (a.grund ? ` (${esc(a.grund)})` : '')).join('<br>')

  ], [{ t:'Kühlkette', go:'temperatur' }]);
}

function aLieferant(name) {
  const rs = DB.rechnungen.filter(r => r.lief === name);

  const offen = rs.filter(r => r.status !== 'ok' && r.status !== 'erledigt');
  const ak = DB.aktionen.filter(a => a.lief === name && !a.genommen);
  return bau(esc(name), [
    `${rs.length} Rechnung${rs.length > 1 ? 'en' : ''} im ${esc(DB.monat)}, zusammen <b>${chf(rs.reduce((s, r) => s + r.total, 0))}</b>`,

    ak.length ? `Aktion: ${ak.map(a => kurz(a.art) + ' auf ' + chf(a.neu) + ' bis ' + a.bis).join(', ')}` : '',
  ], [{ t:'Rechnungen', go:'rechnungen' }, ak.length ? { t:'Aktionen', go:'aktionen' } : null].filter(Boolean));
}

function aRechnung(r) {
  const z = r.zeilen.map(l => {
    const a = DB.artikel[l.art];
    const hoch = l.preis > a.vorher, fehlt = l.gel < l.best;
    return `${esc(a.name.split(',')[0])}: ${l.gel} × ${chf(l.preis)}` +

      (fehlt ? ` <span class="hl">(${l.best} bestellt, ${l.gel} gekommen)</span>` : '');

  const st = { ok:'geprüft, nichts zu tun', preis:'Preis abweichend', menge:'Menge abweichend',
               erledigt:'von Ihnen erledigt' }[r.status];
  return bau(`${esc(r.id)} · ${esc(r.lief)} · ${esc(r.datum)}`,
    [`Total <b>${chf(r.total)}</b> — ${st}`, ...z],

}

function aPerson(p) {

/* ── the resolver ──────────────────────────────────────────────────────── */
function frage(text) {
  const q = cnorm(text);
  if (!q) return ANTWORT.hilfe();
  const t = matchThema(q);
  const e = matchEnt(q, chatIndex(), t && KIND_VON[t.id]);
  if (e && e.ties.length && (!t || e.s >= t.s))
    return bau('Das gibt es zweimal', ['Welches meinen Sie?'],
      e.ties.map(x => ({ t: entName(x.kind, x.ref) })));

  // a noun beats a topic word unless the topic word is the more specific hit
  if (e && (!t || e.s >= t.s)) {
    if (e.kind === 'artikel')   return aArtikel(e.ref);
    if (e.kind === 'gericht')   return aGericht(e.ref);
    if (e.kind === 'geraet')    return aGeraet(e.ref);
    if (e.kind === 'lieferant') return aLieferant(e.ref);
    if (e.kind === 'rechnung')  return aRechnung(e.ref);
    if (e.kind === 'person')    return aPerson(e.ref);
    if (e.kind === 'tag')       return aTag(e.ref);
    if (e.kind === 'thema')     return aThema(e.ref);
    if (e.kind === 'betrieb')   return bau(esc(e.ref), [
      'Der Ausschnitt in dieser Demo ist über alle drei Betriebe gerechnet.',
      'Karte: ' + (DB.karte.betriebe.includes(e.ref)
        ? `${DB.karte.eintraege.length} Einträge laufen dort.` : 'nichts Eigenes dort.'),
    ], [{ t:'Übersicht', go:'uebersicht' }]);
    if (e.kind === 'modul' && ANTWORT[e.ref.id]) return ANTWORT[e.ref.id]();
    if (e.kind === 'modul') return ANTWORT.uebersicht();
  }
  if (t && ANTWORT[t.id]) return ANTWORT[t.id]();

  // nothing recognised: narrow, never empty
  const it = offeneSachen();
  return bau('Dazu finde ich keine eindeutige Zahl', [
    'Fragen Sie nach einem Artikel, einem Gericht, einem Lieferanten, einem Kühlgerät, einer Person, einem Tag oder einer Rechnungsnummer — oder nach einem Modul.',
    it.length ? `Offen ist gerade: ${it.slice(0, 3).map(i => '<b>' + esc(i.was) + '</b>').join(', ')}.` : '',
  ], [{ t:'Was ist offen?' }, { t:'Zahlen der Woche' }, { t:'Marge pro Gericht' },
      { t:'Wie kalt ist der Tiefkühler?' }]);
}

/* ── panel ─────────────────────────────────────────────────────────────── */
function chatRender() {
  const log = $('#chat-log');
  if (!log) return;
  log.innerHTML = CHAT.verlauf.map(m => m.r === 'u'
    ? `<div class="msg u">${esc(m.t)}</div>`
    : `<div class="msg b">${m.t}</div>`).join('') +
    (CHAT.denkt ? '<div class="msg b tipp"><i></i><i></i><i></i></div>' : '');
  log.scrollTop = log.scrollHeight;
}

function chatOeffnen(auf) {
  CHAT.offen = auf ?? !CHAT.offen;
  $('#chat').classList.toggle('on', CHAT.offen);
  $('#chatbtn').classList.toggle('weg', CHAT.offen);
  if (CHAT.offen) {
    if (!CHAT.verlauf.length) { CHAT.verlauf.push({ r:'b', t: ANTWORT.hilfe() }); }
    chatRender(); setTimeout(() => $('#chat-in').focus(), 60);
  }
}

let chatTimer;
function chatFragen(text) {
  const t = text.trim();
  if (!t) return;
  CHAT.verlauf.push({ r:'u', t });
  CHAT.denkt = true; chatRender();
  clearTimeout(chatTimer);
  // a short beat, so an answer reads as an answer and not as a page swap
  chatTimer = setTimeout(() => {
    CHAT.denkt = false;
    CHAT.verlauf.push({ r:'b', t: frage(t) });
    chatRender();
  }, 260);
}

document.addEventListener('click', e => {
  if (e.target.closest('#chatbtn')) return chatOeffnen(true);
  if (e.target.closest('#chat-zu')) return chatOeffnen(false);
  const ask = e.target.closest('#chat [data-ask]');
  if (ask) { chatFragen(ask.dataset.ask); return; }
  const send = e.target.closest('#chat-send');
  if (send) { const i = $('#chat-in'); chatFragen(i.value); i.value = ''; i.focus(); return; }
  // a jump out of the chat should show the screen it jumped to
  if (e.target.closest('#chat [data-go]')) chatOeffnen(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'chat-in') {
    chatFragen(e.target.value); e.target.value = '';
  }
  if (e.key === 'Escape') { flugWeg(true); if (CHAT.offen) chatOeffnen(false); }
});
/* ── actions ────────────────────────────────────────────────────────────────
   Each one mutates DB and re-renders. The cross-module consequences are the
   interesting part and are called out in the toast, because in a live demo
   nobody notices a margin moving two screens away unless you say so.
   ────────────────────────────────────────────────────────────────────────── */
const ACTIONS = {
  'preis-uebernehmen'(el) {
    const key = el.dataset.art, neu = +el.dataset.neu, a = DB.artikel[key];
    const vor = DB.gerichte.map(g => ({ id: g.id, m: marge(g) }));
    a.vorher = a.preis; a.preis = neu;
    const rr = DB.rechnungen.find(x => x.id === RECH_DOK) ||
               DB.rechnungen.find(x => x.zeilen.some(z => z.art === key));
    if (rr) rr.status = 'erledigt';
    const nach = DB.gerichte.map(g => marge(g));
    const worst = DB.gerichte.map((g, i) => ({ g, d: nach[i] - vor[i].m }))
      .sort((x, y) => x.d - y.d)[0];
    logge(`${a.name.split(',')[0]} auf ${chf(neu)} übernommen — Marge ${esc(worst.g.name)} ${pct(worst.d)}`);
    toast(`Preis übernommen. <b>${esc(worst.g.name)}</b> verliert ${Math.abs(worst.d).toFixed(1)} Punkte Marge — ` +
          `nachzusehen in Gerichten.`, 2);
  },
  'preis-nachfragen'() {
    toast('Nachfrage vorbereitet. Die Rechnung bleibt offen, bis der Lieferant antwortet.', 2);
    logge('Preisänderung beim Lieferanten nachgefragt');
  },
  'menge-kuerzen'(el) {
    const r = DB.rechnungen.find(x => x.id === el.dataset.inv);
    const diff = +el.dataset.diff;
    r.zeilen.forEach(z => { if (z.gel < z.best) z.best = z.gel; });
    r.status = 'erledigt';
    // the total follows the lines, like everywhere else — quoting the old
    // stored figure in the toast contradicted the document beside it
    const mwst = r.lief === 'Weinkeller Musterthal' ? 8.1 : 2.6;
    r.total = +(r.zeilen.reduce((s, z) => s + z.best * z.preis, 0) * (1 + mwst / 100)).toFixed(2);
    logge(`${r.id} um ${chf(diff)} gekürzt — nicht gelieferte Position entfernt`);
    toast(`Rechnung auf <b>${chf(r.total)}</b> gekürzt. ${chf(diff)} verlassen Ihr Konto nicht.`, 1);
  },
  'aktion-nehmen'(el) {
    const a = DB.aktionen.find(x => x.id === el.dataset.id);
    a.genommen = true;
    const art = DB.artikel[a.art];
    const spart = (art.preis - a.neu) / art.menge * a.monat;
    logge(`Aktion ${art.name.split(',')[0]} übernommen — ${chf(spart)} bei üblicher Menge`);
    toast(`Auf die Bestellliste. Bei Ihrer üblichen Menge sind das <b>${chf(spart)}</b>.`, 1);
  },
  'haccp-export'() {
    const n = DB.hygiene.filter(h => h.done).length;
    toast(`Nachweis ${esc(DB.monat)} erzeugt — ${DB.hygieneMonat} Einträge, jeder mit Name und Uhrzeit. ` +
          `(In der Demo wird keine Datei geschrieben.)`, 1);
    logge(`HACCP-Nachweis exportiert (${n} Kontrollen heute)`);
  },
  'tuer-offen'(el) {
    const g = DB.geraete.find(x => x.id === el.dataset.id);
    g.temp = +(g.max + 2.8).toFixed(1);
    // the curve has to show it too, or the widget contradicts the number
    g.verlauf = g.verlauf.slice(3).concat([g.max + 0.9, g.max + 1.8, g.temp]);
    DB.alarme.unshift({ geraet: g.name, wann: DB.today + ' ' + new Date().toLocaleTimeString('de-CH').slice(0, 5),
      wert: g.temp, an: DB.user, quittiert: '', grund: 'Tür offen (Demo)' });
    logge(`${g.name} aus dem Bereich gelaufen — Alarm an ${DB.user}`);
    toast(`<b>${esc(g.name)}</b> bei ${g.temp.toFixed(1)} °C. Meldung an ${esc(DB.user)} ` +
          `— und an die nächste Person, wenn niemand quittiert.`, 3);
  },
  'alarm-quittieren'(el) {
    const g = DB.geraete.find(x => x.id === el.dataset.id);
    g.temp = +((g.min + g.max) / 2).toFixed(1);
    g.verlauf = g.verlauf.slice(2).concat([+(g.max - 0.3).toFixed(2), g.temp]);
    const a = DB.alarme.find(x => x.geraet === g.name && !x.quittiert);
    if (a) a.quittiert = new Date().toLocaleTimeString('de-CH').slice(0, 5);
    logge(`Alarm ${g.name} quittiert — Gerät wieder im Bereich`);
    toast('Quittiert. Der Eintrag bleibt im Protokoll — dieselbe Aufzeichnung ist der HACCP-Nachweis.', 1);
  },
  'brief-senden'(el) {
    const b = DB.briefings.find(x => x.id === el.dataset.id);
    const namen = b.faellig.map(id => DB.leute.find(p => p.id === id));
    namen.forEach(p => { if (p.durch < p.total) p.durch++; });
    b.faellig = [];
    logge(`Briefing «${b.titel}» an ${namen.map(p => p.name).join(', ')} gesendet`);
    toast(`«${esc(b.titel)}» an ${esc(namen.map(p => p.name).join(' und '))} — ${b.min} Minuten am Handy.`, 1);
  },
  'karte-freigeben'() {
    const K = DB.karte;
    const n = K.ziele.filter(z => z.status === 'wartet').length;
    const z = karteGeaendert().length;
    K.ziele.forEach(x => { x.status = 'aktuell'; });
    // every channel has now been given the card as it stands
    K.eintraege.map(eintrag).forEach(e => { K.stand[e.id] = { preis: e.preis, allergene: e.allergene }; });
    logge(`Karte auf ${n} Gästekanälen freigegeben (${z} ${z === 1 ? 'Zeile' : 'Zeilen'})`);
    toast(`Freigegeben. ${n} Kanäle zeigen jetzt dieselbe Karte — und der Beitrag dazu wartet in Social Media.`, 1);
  },
  'post-freigeben'(el) {
    const p = DB.posts.find(x => x.id === el.dataset.id);
    p.status = 'freigegeben';
    logge(`Beitrag «${p.titel}» freigegeben (${KANAL(p.format).kurz}, ${p.datum} ${p.zeit})`);
    toast(`Freigegeben. Geht ${esc(p.datum)} ${esc(p.zeit)} auf ${esc(KANAL(p.format).name)} raus.`, 1);
  },
  'post-verwerfen'(el) {
    const p = DB.posts.find(x => x.id === el.dataset.id);
    DB.posts = DB.posts.filter(x => x.id !== p.id);
    logge(`Beitrag «${p.titel}» verworfen`);
    toast('Verworfen. Nichts wird ohne Ihre Freigabe publiziert.');
  },
  'antwort-ton'(el) {
    const b = DB.bewertungen.find(x => x.id === el.dataset.id);
    const i = b.varianten.findIndex(v => v.ton === b.ton);
    const v = b.varianten[(i + 1) % b.varianten.length];
    b.ton = v.ton; b.antwort = v.text; b.angepasst = false;
    logge(`Antwort auf ${b.quelle}-Bewertung neu formuliert (${v.ton})`);
    toast(`Neu formuliert, ${esc(v.ton)}. Ändern können Sie weiter jeden Satz.`, 1);
  },
  'antwort-senden'(el) {
    const b = DB.bewertungen.find(x => x.id === el.dataset.id);
    b.status = 'gesendet';
    DB.bewBeantwortet = Math.min(DB.bewMonat, DB.bewBeantwortet + 1);
    logge(`Antwort auf ${b.quelle}-Bewertung (${b.thema}) gesendet` +
          (b.angepasst ? ' — von Ihnen angepasst' : ''));
    toast(`Gesendet${b.angepasst ? ', mit Ihren Änderungen' : ''} — in der Sprache, in der der Gast ` +
          `geschrieben hat. Beantwortet: <b>${DB.bewBeantwortet} von ${DB.bewMonat}</b>.`, 1);
  },
  'antwort-ignorieren'(el) {
    const b = DB.bewertungen.find(x => x.id === el.dataset.id);
    b.status = 'ignoriert';
    logge(`Bewertung (${b.thema}) ignoriert`);
    toast('Ignoriert. Der Entwurf bleibt, falls Sie es sich anders überlegen.');
  },
};

/* Typing in a number field re-renders the whole view, so the field it was typed
   into is thrown away — the caret goes with it, and the fresh field carries the
   formatted value from DB. Typing «38» therefore produced «3.008» and needed a
   click between digits. Keep the typed text and the focus; formatting waits for
   the field to be left. */
const TIPPFELDER = ['data-count', 'data-tolp', 'data-tolm', 'data-tolart',
                   'data-karte', 'data-kartepreis',
                   'data-posttext', 'data-posttags', 'data-postalt', 'data-postdatum',
                   'data-antwort', 'data-rsuche'];

function renderTippend(el) {
  const attr = TIPPFELDER.find(a => el.hasAttribute(a));
  const sel = attr ? `[${attr}="${el.getAttribute(attr)}"]` : null;
  const pos = el.selectionStart, ende = el.selectionEnd;
  render();   // keeps the scroll position by itself now
  // Writing the text back into the new field is not enough: a number input
  // rejects a half-typed value, so «38.» arrives as «38» and the point is
  // lost. Put the ORIGINAL node back instead — it is never rewritten, so the
  // text, the caret and the field's own state survive untouched.
  const neu = sel && $(sel);
  if (neu && neu !== el) {
    neu.replaceWith(el);
    el.focus();
    if (pos !== null) { try { el.setSelectionRange(pos, ende); } catch { /* number inputs have no selection */ } }
  }
}

document.addEventListener('input', e => {
  const tp = e.target.closest('[data-tolp]');
  if (tp) { DB.toleranz.prozent = Math.max(0, +tp.value || 0); renderTippend(tp); return; }
  const tm = e.target.closest('[data-tolm]');
  if (tm) { DB.toleranz.menge = Math.max(0, +tm.value || 0); renderTippend(tm); return; }
  const ta = e.target.closest('[data-tolart]');
  if (ta) { const l = DB.lager.find(x => x.art === ta.dataset.tolart);
    l.tolProzent = Math.max(0, +ta.value || 0); renderTippend(ta); return; }
  const c = e.target.closest('[data-count]');
  if (c) { DB.zaehlungHeute().werte[c.dataset.count].gezaehlt = +c.value || 0;
           renderTippend(c); return; }
  const k = e.target.closest('[data-karte]');
  if (k) { const g = DB.gerichte.find(x => x.id === k.dataset.karte); g.karte = +k.value || g.karte;
           kanaelePruefen();   // the card is published — the channels are now behind
           renderTippend(k); return; }
  /* A released post that is edited goes back to being a draft: the thing that
     was approved is not the thing that would go out. */
  const pt = e.target.closest('[data-posttext]') || e.target.closest('[data-posttags]')
          || e.target.closest('[data-postalt]') || e.target.closest('[data-postdatum]');
  if (pt) {
    const d = pt.dataset;
    const p = DB.posts.find(x => x.id === (d.posttext || d.posttags || d.postalt || d.postdatum));
    if (d.posttext) p.text = pt.value;
    else if (d.posttags) p.tags = pt.value.split(/[\s,]+/).map(t => t.replace(/^#/, '')).filter(Boolean);
    else if (d.postdatum) p.datum = pt.value;
    else p.alt = pt.value;
    if (p.status !== 'entwurf') { p.status = 'entwurf';
      logge(`Beitrag «${p.titel}» geändert — zurück auf Entwurf`); }
    renderTippend(pt); return;
  }
  const rs = e.target.closest('[data-rsuche]');
  if (rs) { RECH_F.q = rs.value; RECH_DOK = null; renderTippend(rs); return; }
  const aw = e.target.closest('[data-antwort]');
  if (aw) { const b = DB.bewertungen.find(x => x.id === aw.dataset.antwort);
    b.antwort = aw.value;
    b.angepasst = !b.varianten.some(v => v.text === aw.value);
    renderTippend(aw); return; }
  const kp = e.target.closest('[data-kartepreis]');
  if (kp) { const e2 = DB.karte.eintraege.find(x => x.id === kp.dataset.kartepreis);
    const wert = +kp.value;
    // a dish keeps its price in Gerichte; only a card-only entry keeps its own
    if (e2.ref) { const g = DB.gerichte.find(x => x.id === e2.ref); g.karte = wert || g.karte; }
    else e2.preis = wert || e2.preis;
    kanaelePruefen();
    renderTippend(kp); }
});

// leaving a number field (blur or Enter) is when it may format itself
/* ── the picture field ──────────────────────────────────────────────────────
   FileReader, not an upload: the picture is read in the browser and kept in
   memory, so the demo still makes no network call. In the live system the file
   goes to Axyom's media store, because Instagram fetches the image from a URL
   rather than accepting bytes.
   ────────────────────────────────────────────────────────────────────────── */
const MAX_BILD = 8 * 1024 * 1024;
function bildLesen(p, datei) {
  if (!datei) return;
  if (!/^image\//.test(datei.type)) {
    toast('Das ist kein Bild. JPG oder PNG.', 2); return;
  }
  if (datei.size > MAX_BILD) {
    toast(`Das Bild ist ${(datei.size / 1048576).toFixed(1)} MB gross — mehr als 8 MB nimmt die Demo nicht.`, 2);
    return;
  }
  const leser = new FileReader();
  leser.onload = () => {
    p.bild = leser.result;
    p.bildname = `${datei.name} · ${(datei.size / 1024).toFixed(0)} KB`;
    if (p.status !== 'entwurf') { p.status = 'entwurf';
      logge(`Beitrag «${p.titel}» hat ein neues Bild — zurück auf Entwurf`); }
    else logge(`Bild für «${p.titel}» gewählt (${datei.name})`);
    toast(`Bild übernommen. Zugeschnitten wird für ${esc(KANAL(p.format).kurz)}.`, 1);
    render();
  };
  leser.onerror = () => toast('Das Bild liess sich nicht lesen.', 2);
  leser.readAsDataURL(datei);
}

document.addEventListener('change', e => {
  const la = e.target.closest('[data-lart]');
  if (la) { LAGER_ART = la.value; LAGER_TAG = null; render(); return; }
  const rfs = e.target.closest('[data-rf]');
  if (rfs) {
    RECH_F[rfs.dataset.rf] = rfs.value;
    // Monat und Schnellzeitraum meinen dasselbe Feld der Frage: eines gewinnt
    if (rfs.dataset.rf === 'monat' && rfs.value) RECH_F.zeit = '';
    if (rfs.dataset.rf === 'zeit' && rfs.value) RECH_F.monat = '';
    RECH_DOK = null; render(); return;
  }
  const bild = e.target.closest('[data-postbild]');
  if (bild) { bildLesen(DB.posts.find(x => x.id === bild.dataset.postbild), bild.files[0]); return; }
  if (TIPPFELDER.some(a => e.target.hasAttribute?.(a))) { render(); return; }
  const pw = e.target.closest('[data-postwann]');
  if (pw) { const p = DB.posts.find(x => x.id === pw.dataset.postwann);
    p.zeit = pw.value;
    logge(`Beitrag «${p.titel}» auf ${p.datum} ${p.zeit} gelegt`);
    toast(`Zeitfenster auf <b>${esc(p.datum)} ${esc(p.zeit)}</b> gelegt.`, 1);
    render(); return; }
  const s = e.target.closest('[data-shift]');
  if (s) {
    const d = DB.woche.find(x => x.tag === s.dataset.shift);
    d.besetzt = +s.value; d.stunden = d.besetzt * 8;
    logge(`${d.tag}: Besetzung auf ${d.besetzt} geändert`);
    render();
  }
});

/* ── dragging a picture in ─────────────────────────────────────────────────── */
['dragenter', 'dragover'].forEach(n => document.addEventListener(n, e => {
  const z = e.target.closest('[data-drop]');
  if (!z) return;
  e.preventDefault(); z.classList.add('drauf');
}));
document.addEventListener('dragleave', e => {
  const z = e.target.closest('[data-drop]');
  if (z) z.classList.remove('drauf');
});
document.addEventListener('drop', e => {
  const z = e.target.closest('[data-drop]');
  if (!z) return;
  e.preventDefault(); z.classList.remove('drauf');
  bildLesen(DB.posts.find(x => x.id === z.dataset.drop), e.dataTransfer.files[0]);
});

render();
</script>
</body>
</html>
