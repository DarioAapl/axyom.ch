<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is public but unlisted: noindex keeps it out of search results so
     it cannot compete with axyom.ch. Deliberately NOT blocked in robots.txt —
     a blocked crawler never reads this tag, and the URL can still get listed. -->
<meta name="robots" content="noindex, nofollow">
<title>Axyom — Demo</title>
<style>
:root{
  --ink:#1d1d1f; --dim:#6e6e73; --soft:rgba(0,0,0,.08); --line:rgba(0,0,0,.13);
  --acc:#00b2a0; --acci:#007a6e; --wash:rgba(0,178,160,.10);
  --dark:#0b0d12; --surf:#f5f5f7; --warn:#b25e00; --warnbg:rgba(178,94,0,.10);
  --ok:#007a6e; --okbg:rgba(0,178,160,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--surf);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}

/* ── rail ── */
#rail{width:210px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;
      padding:18px 12px;position:sticky;top:0;height:100vh}
#rail .brand{display:flex;align-items:baseline;gap:7px;padding:0 8px 18px}
#rail .brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
#rail .brand span{font-size:11px;color:rgba(255,255,255,.45)}
#rail nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
#rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
        color:rgba(255,255,255,.58);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer}
#rail a .ic{width:16px;height:16px;flex:none;opacity:.62}
#rail a:hover{color:#fff;background:rgba(255,255,255,.05)}
#rail a.on{background:rgba(0,178,160,.16);color:#fff;font-weight:650}
#rail a.on .ic{opacity:1;color:var(--acc)}
#rail a:hover .ic{opacity:.9}
#rail a .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--warn);color:#fff;
        border-radius:99px;padding:1px 6px}
#rail .outlets{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);
        font-size:11px;line-height:1.7;color:rgba(255,255,255,.4)}
#rail .outlets b{display:block;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:3px}

/* ── main ── */
main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
header{padding:20px 28px 16px;border-bottom:1px solid var(--soft);display:flex;
       align-items:flex-end;justify-content:space-between;gap:20px;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
header .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
header .demo{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
       color:var(--acci);background:var(--wash);padding:5px 9px;border-radius:6px;white-space:nowrap}
.body{padding:22px 28px 40px;flex:1}

/* ── bits ── */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
   text-align:left;padding:0 10px 9px;white-space:nowrap}
td{font-size:13px;padding:11px 10px;border-top:1px solid var(--soft);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(0,0,0,.02)}
th.r,td.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
     padding:3px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.t-ok{color:var(--ok);background:var(--okbg)}
.t-warn{color:var(--warn);background:var(--warnbg)}
.t-mute{color:var(--dim);background:rgba(0,0,0,.05)}
.card{background:#fff;border:1px solid var(--soft);border-radius:12px;padding:16px 18px}
.card.tint{background:var(--surf)}
.card.warn{background:rgba(178,94,0,.04);border-color:rgba(178,94,0,.22)}
.card.good{background:rgba(0,178,160,.05);border-color:rgba(0,178,160,.28)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi .n{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.kpi .d{font-size:11.5px;color:var(--dim);margin-top:4px}
.btn{font-size:12.5px;font-weight:650;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
     background:#fff;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--surf)}
.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.solid:hover{background:#000}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.acc:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
     margin:26px 0 11px}
.sec:first-child{margin-top:0}
.muted{color:var(--dim)}
.small{font-size:12px}
.bar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(0,0,0,.22);cursor:pointer;
       display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.check.on{background:var(--acc);border-color:var(--acc)}
.check svg{display:none}.check.on svg{display:block}
.link{color:var(--acci);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
       border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--wash);border-color:var(--acc)}

/* ── dashboard: a packing grid, not equal-height rows ─────────────────────
   align-items:start is the whole trick — without it every card stretches to
   the tallest sibling in its row and the short ones end up half empty.
   ────────────────────────────────────────────────────────────────────────── */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:start}
.dash .card{padding:12px 14px}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}
.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}
.w8{grid-column:span 8}.w12{grid-column:span 12}
.wl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;
    align-items:baseline;gap:8px}
.wl .r2{letter-spacing:0;text-transform:none;font-weight:600;font-size:10.5px}
.big{font-size:21px;font-weight:700;letter-spacing:-.022em;line-height:1.05}
.sm2{font-size:10.5px;color:var(--dim);margin-top:2px}
/* one row = label, chart, value. Five of these fit where one old card did. */
.mini{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.mini .nm{font-size:11.5px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
.mini .ch{flex:0 0 96px}
.mini .vl{font-size:11.5px;font-weight:650;flex:0 0 76px;text-align:right;white-space:nowrap;
          font-variant-numeric:tabular-nums}
/* long labels do not fit beside a bar in a third of the width, so the bar
   widgets put the name and the value on their own line and the bar beneath */
.mini2{padding:3px 0}
.mini2 .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.mini2 .nm2{font-size:11.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini2 .vl2{font-size:11.5px;font-weight:650;white-space:nowrap;flex:none;
            font-variant-numeric:tabular-nums}
/* grid does not pack, so each dashboard column is its own stack and the
   short widgets sit directly under one another instead of leaving a hole */
.col{display:flex;flex-direction:column;gap:10px;align-self:start}
.dec{padding:7px 9px;border-radius:7px;background:rgba(178,94,0,.05);
     border:1px solid rgba(178,94,0,.20);margin-bottom:5px;cursor:pointer}
.dec:last-child{margin-bottom:0}
.dec b{font-size:11.5px}
.dec .why{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.dec.calm{background:rgba(0,178,160,.05);border-color:rgba(0,178,160,.24)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;
      background:rgba(0,0,0,.045);color:var(--dim);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--wash);color:var(--acci)}
@media (max-width:1180px){ .dash{grid-template-columns:repeat(6,1fr)}
  .w3,.w4,.w5{grid-column:span 3}.w6,.w7,.w8{grid-column:span 6} }
@media (max-width:820px){ .dash{grid-template-columns:1fr}
  .w2,.w3,.w4,.w5,.w6,.w7,.w8,.w12{grid-column:span 1} }

/* ── Axyom fragen: the corner box ──────────────────────────────────────────
   A question is faster than knowing which module holds the answer, so the
   box sits over every screen and reads the same DB the screens read.
   ────────────────────────────────────────────────────────────────────────── */
#chatbtn{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:9px;
  background:var(--dark);color:#fff;border:none;border-radius:99px;padding:11px 17px 11px 14px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .16s,opacity .16s}
#chatbtn:hover{transform:translateY(-1px)}
#chatbtn b{font-weight:700;color:var(--acc)}
#chatbtn .pip{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
#chatbtn.weg{opacity:0;pointer-events:none;transform:translateY(8px)}

#chat{position:fixed;right:22px;bottom:22px;z-index:61;width:396px;max-height:min(660px,calc(100vh - 44px));
  background:#fff;border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;
  overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
#chat.on{display:flex}
#chat .top{display:flex;align-items:center;gap:9px;padding:13px 14px;background:var(--dark);color:#fff;flex:none}
#chat .top b{font-size:14px;font-weight:700;color:#fff}
#chat .top b span{color:var(--acc)}
#chat .top .s{font-size:11px;color:rgba(255,255,255,.5);margin-left:auto}
#chat-zu{background:none;border:none;color:rgba(255,255,255,.55);font-size:19px;line-height:1;
  cursor:pointer;padding:0 2px;font-family:inherit}
#chat-zu:hover{color:#fff}
#chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#chat .msg{max-width:100%;font-size:12.5px;line-height:1.5}
#chat .msg.u{align-self:flex-end;background:var(--ink);color:#fff;padding:8px 12px;border-radius:13px 13px 3px 13px;
  max-width:82%;font-weight:500}
#chat .msg.b{align-self:stretch;background:var(--surf);border:1px solid var(--soft);
  border-radius:13px 13px 13px 3px;padding:11px 13px}
#chat .qk{font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:6px}
#chat .qz{font-size:12px;line-height:1.55;color:var(--dim);padding:3.5px 0;border-top:1px solid var(--soft)}
#chat .qz:first-of-type{border-top:none;padding-top:0}
#chat .qz b{color:var(--ink);font-weight:650}
#chat .hl{color:var(--warn);font-weight:600}
#chat .mod{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--acci);background:var(--wash);padding:1px 5px;border-radius:4px;white-space:nowrap}
#chat .tipp{display:flex;gap:4px;align-self:flex-start;padding:12px 13px}
#chat .tipp i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:tp 1s infinite}
#chat .tipp i:nth-child(2){animation-delay:.14s}
#chat .tipp i:nth-child(3){animation-delay:.28s}
@keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:.9}}
#chat .foot{flex:none;display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--soft);background:#fff}
#chat-in{flex:1;min-width:0;border-radius:9px}
#chat-send{flex:none}
@media (max-width:820px){
  #chat{right:12px;left:12px;bottom:12px;width:auto;max-height:calc(100vh - 24px)}
  #chatbtn{right:12px;bottom:12px}
}

/* ── toast ── */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--dark);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;z-index:50;max-width:520px;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--acc)}
@media (max-width:820px){
  #app{flex-direction:column}
  #rail{width:100%;height:auto;position:static;flex-direction:row;align-items:center;
        overflow-x:auto;padding:10px}
  #rail nav{flex-direction:row}#rail .outlets{display:none}#rail .brand{padding:0 12px 0 4px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  header,.body{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand"><b>axyom</b><span>ops</span></div>
    <nav id="nav"></nav>
    <div class="outlets"><b>Betriebe</b>Gaststube<br>Bahnhof<br>Gartensaal</div>
  </aside>
  <main>
    <header>
      <div><h1 id="h-title"></h1><div class="sub" id="h-sub"></div></div>
      <div class="demo">Demo · Beispieldaten</div>
    </header>
    <div class="body" id="view"></div>
  </main>
</div>
<button id="chatbtn"><span class="pip"></span><b>axyom</b> fragen</button>
<div id="chat">
  <div class="top"><b>axyom <span>fragen</span></b>
    <span class="s">liest Ihre Daten</span>
    <button id="chat-zu" title="Schliessen (Esc)">&times;</button></div>
  <div id="chat-log"></div>
  <div class="foot">
    <input id="chat-in" placeholder="Fragen Sie etwas — z.B. Marge Kalbsbraten" autocomplete="off">
    <button class="btn acc" id="chat-send">Fragen</button></div>
</div>
<div id="toast"></div>
<script>
/* ──────────────────────────────────────────────────────────────────────────
   ONE dataset, twelve modules. Every screen reads from DB and writes back to
   it, which is the whole point of the demo: a price that changes in
   Rechnungen is a margin that changes in Gerichte, without anybody carrying
   it across. Numbers are invented but internally consistent — the dish costs
   really are the sum of their lines, and the report really is the sum of the
   week.
   ────────────────────────────────────────────────────────────────────────── */
const DB = {
  today: '18.03.',
  outlets: ['Gaststube', 'Bahnhof', 'Gartensaal'],
  user: 'Marco B.',

  // articles carry the price actually last paid, plus the price before it
  artikel: {
    butter:   { name: 'Butter, 10 kg',        lief: 'Molkerei Musterberg',   einheit: 'kg',  preis: 78.40, vorher: 78.40, menge: 10 },
    rahm:     { name: 'Rahm 35%, 5 l',        lief: 'Molkerei Musterberg',   einheit: 'l',   preis: 42.00, vorher: 42.00, menge: 5 },
    kalb:     { name: 'Kalbsbraten, 5 kg',    lief: 'Metzgerei Mustermann',  einheit: 'kg',  preis: 190.00, vorher: 190.00, menge: 5 },
    kartoffel:{ name: 'Kartoffeln, 25 kg',    lief: 'Muster Gemüse AG',      einheit: 'kg',  preis: 32.50, vorher: 32.50, menge: 25 },
    ruebli:   { name: 'Rüebli, 10 kg',        lief: 'Muster Gemüse AG',      einheit: 'kg',  preis: 18.90, vorher: 18.90, menge: 10 },
    egli:     { name: 'Eglifilet, 2 kg',      lief: 'Fischerei Mustersee',   einheit: 'kg',  preis: 96.00, vorher: 96.00, menge: 2 },
    pinot:    { name: 'Pinot Noir, 6 Fl.',    lief: 'Weinkeller Musterthal', einheit: 'Fl.', preis: 138.00, vorher: 138.00, menge: 6 },
    // the rest of what actually goes on a plate — without these the food cost
    // comes out at 3% and no cook in the room believes the margin
    eier:     { name: 'Eier, 30 Stk',         lief: 'Muster Gemüse AG',      einheit: 'Stk', preis: 13.50, vorher: 13.50, menge: 30 },
    gemuese:  { name: 'Marktgemüse, 10 kg',   lief: 'Muster Gemüse AG',      einheit: 'kg',  preis: 44.00, vorher: 44.00, menge: 10 },
    bratfett: { name: 'Bratbutter, 5 kg',     lief: 'Molkerei Musterberg',   einheit: 'kg',  preis: 62.00, vorher: 62.00, menge: 5 },
    speck:    { name: 'Speckwürfel, 2 kg',    lief: 'Metzgerei Mustermann',  einheit: 'kg',  preis: 38.00, vorher: 38.00, menge: 2 },
    fond:     { name: 'Fonds und Gewürze',    lief: 'Diverse',               einheit: 'Port.', preis: 0.85, vorher: 0.85, menge: 1 },
  },

  // invoices: lines reference articles, so matching is a real comparison
  rechnungen: [
    { id:'R-20418', lief:'Muster Gemüse AG',   datum:'14.03.', total:1284.60, status:'ok',
      zeilen:[ {art:'kartoffel', best:8, gel:8, preis:32.50}, {art:'ruebli', best:4, gel:4, preis:18.90} ] },
    { id:'8871-C',  lief:'Molkerei Musterberg',  datum:'14.03.', total:962.15, status:'preis',
      zeilen:[ {art:'butter', best:6, gel:6, preis:87.80}, {art:'rahm', best:10, gel:10, preis:42.00} ] },
    { id:'R-5512',  lief:'Metzgerei Mustermann', datum:'13.03.', total:1914.20, status:'preis',
      zeilen:[ {art:'kalb', best:9, gel:9, preis:212.80} ] },
    { id:'FZ-3390', lief:'Fischerei Mustersee',  datum:'13.03.', total:2110.00, status:'ok',
      zeilen:[ {art:'egli', best:12, gel:12, preis:96.00} ] },
    { id:'W-7742',  lief:'Weinkeller Musterthal', datum:'13.03.', total:3487.90, status:'menge',
      zeilen:[ {art:'pinot', best:20, gel:18, preis:138.00} ] },
  ],
  gelesen: 84, // invoices read this month

  // supplier offers, matched against what is actually bought. Urgency is not
  // stored — it is read off «bis» against today (see dringend() in core).
  aktionen: [
    { id:'a1', lief:'Muster Gemüse AG',      art:'ruebli',   neu:14.20, bis:'22.03.', monat:40, genommen:false },
    { id:'a2', lief:'Molkerei Musterberg',   art:'rahm',     neu:35.70, bis:'19.03.', monat:34, genommen:false },
    { id:'a3', lief:'Fischerei Mustersee',   art:'egli',     neu:81.60, bis:'20.03.', monat:18, genommen:false },
    { id:'a4', lief:'Weinkeller Musterthal', art:'pinot',    neu:117.30, bis:'31.03.', monat:24, genommen:false },
  ],
  irrelevant: 9,

  // dishes: recipes in grams/ml against article unit prices
  gerichte: [
    { id:'g1', name:'Kalbsbraten mit Rösti', karte:36.00, verkauft:64,
      rezept:[ {art:'kalb', m:0.18}, {art:'butter', m:0.03}, {art:'kartoffel', m:0.22},
               {art:'rahm', m:0.04}, {art:'gemuese', m:0.12}, {art:'bratfett', m:0.02}, {art:'fond', m:1} ] },
    { id:'g2', name:'Eglifilet, Müllerin',   karte:42.00, verkauft:38,
      rezept:[ {art:'egli', m:0.20}, {art:'butter', m:0.04}, {art:'kartoffel', m:0.18},
               {art:'gemuese', m:0.10}, {art:'bratfett', m:0.02}, {art:'fond', m:1} ] },
    { id:'g3', name:'Rüeblisuppe',           karte:12.50, verkauft:91,
      rezept:[ {art:'ruebli', m:0.20}, {art:'rahm', m:0.05}, {art:'butter', m:0.01},
               {art:'gemuese', m:0.04}, {art:'fond', m:1} ] },
    { id:'g4', name:'Rösti mit Spiegelei',   karte:24.00, verkauft:57,
      rezept:[ {art:'kartoffel', m:0.30}, {art:'butter', m:0.03}, {art:'eier', m:2},
               {art:'speck', m:0.04}, {art:'bratfett', m:0.02}, {art:'fond', m:1} ] },
  ],

  // stock: counted vs what the tills say was sold
  lager: [
    { art:'butter',   gezaehlt:14.2, erwartet:15.0, einheit:'kg' },
    { art:'rahm',     gezaehlt:22.0, erwartet:22.4, einheit:'l' },
    { art:'kalb',     gezaehlt:6.4,  erwartet:6.5,  einheit:'kg' },
    { art:'kartoffel',gezaehlt:41.0, erwartet:44.8, einheit:'kg' },
    { art:'egli',     gezaehlt:3.1,  erwartet:3.2,  einheit:'kg' },
  ],
  lagerStand:'heute 06:20',

  // hygiene: the checks a station owes today
  hygiene: [

/* ── synthetic histories, so the widgets have curves to draw ───────────────
   Deterministic on purpose: a demo that looks different on every reload is a
   demo you cannot rehearse. No Math.random anywhere.
   ────────────────────────────────────────────────────────────────────────── */
DB.geraete.forEach((g, gi) => {
  g.verlauf = Array.from({ length: 28 }, (_, i) => {
    const wobble = Math.sin((i + gi * 3) / 2.7) * 0.42 + Math.cos((i + gi) / 1.9) * 0.22;
    const span = Math.max(1, (g.max - g.min) / 6);
    return +(g.temp + wobble * span).toFixed(2);
  });
});

DB.geraete[2].verlauf = DB.geraete[2].verlauf.map((v, i) =>

/* How long an offer still runs, from the date it carries. It used to be a
   hand-set «dringend» flag in the fixture, which promptly contradicted the
   dates — an offer four days out was red while one two days out was not.
   Anything the data can say itself should not also be stored by hand. */
const JAHR = 2026;
const alsDatum = s => { const [t, m] = s.split('.').map(Number); return new Date(JAHR, m - 1, t); };
const tageBis = bis => Math.round((alsDatum(bis) - alsDatum(DB.today)) / 86400000);
const dringend = a => tageBis(a.bis) <= 3;

// unit price of an article, e.g. butter at 78.40 per 10 kg = 7.84 / kg
const einzel = key => DB.artikel[key].preis / DB.artikel[key].menge;
// what a dish costs to make, from the live article prices
const wareneinsatz = g => g.rezept.reduce((s, z) => s + einzel(z.art) * z.m, 0);
const marge = g => (g.karte - wareneinsatz(g)) / g.karte * 100;

// the week, computed once. Both Übersicht and Auswertungen read this, so the
// dashboard can never quote a different number than the report.
function zahlen() {
  const kalk   = DB.gerichte.reduce((s, g) => s + g.karte * g.verkauft, 0);
  const kalkWE = DB.gerichte.reduce((s, g) => s + wareneinsatz(g) * g.verkauft, 0);
  const speisen = kalk + DB.uebrigeSpeisen;
  const umsatz  = speisen + DB.getraenke;
  const einsatz = kalkWE + DB.uebrigeSpeisenWE + DB.getraenkeWE;
  const std     = DB.woche.reduce((s, d) => s + d.besetzt * 8, 0);
  const personal = std * DB.lohn;
  const gedecke = DB.woche.reduce((s, d) => s + d.gedecke, 0);
  const vj      = DB.woche.reduce((s, d) => s + d.vj, 0);
  const roh     = umsatz - einsatz;
  return { kalk, kalkWE, speisen, umsatz, einsatz, std, personal, gedecke, vj,
           roh, db: roh - personal };
}

/* ── chart primitives ──────────────────────────────────────────────────────
   Inline SVG, no library. Each one takes numbers and returns a string, so a
   widget is just a template hole — and the whole app stays one file with no
   build step and no network.
   ────────────────────────────────────────────────────────────────────────── */
const svg = (w, h, inner, extra = '') =>
  `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" ${extra}>${inner}</svg>`;

// bars, optionally with a ghost series behind (last year)
function chartBars(vals, ghost, h = 74, col = 'var(--acc)') {
  const w = 240, n = vals.length, gap = 3;
  const bw = (w - gap * (n - 1)) / n;
  const max = Math.max(...vals, ...(ghost || [0])) || 1;
  const bars = vals.map((v, i) => {
    const x = i * (bw + gap), bh = Math.max(1, v / max * (h - 2));
    const g = ghost ? Math.max(1, ghost[i] / max * (h - 2)) : 0;
    return (ghost ? `<rect x="${x + bw * .62}" y="${h - g}" width="${bw * .38}" height="${g}"
              rx="1.5" fill="rgba(0,0,0,.13)"/>` : '') +
      `<rect x="${x}" y="${h - bh}" width="${ghost ? bw * .58 : bw}" height="${bh}"
              rx="2" fill="${col}"/>`;
  }).join('');
  return svg(w, h, bars);
}

// A sparkline with its tolerance range.
//
// Two things went wrong the first time and both are worth remembering:
//   * the viewBox was 240 wide stretched into a ~660px box with
//     preserveAspectRatio="none", so every marker circle came out as a 2.75:1
//     ellipse. The viewBox is now wide enough that the stretch is negligible.
//   * the range was a filled block, which read as a highlighter smear behind
//     the line. It is now two hairlines, and the line itself carries a soft
//     area fill so the row has some weight without shouting.
let _lineId = 0;
function chartLine(vals, min, max, h = 22, col = 'var(--acc)') {
  const w = 600, id = 'g' + (++_lineId);
  const lo = Math.min(...vals, min) - .5, hi = Math.max(...vals, max) + .5;
  const y = v => +(h - (v - lo) / (hi - lo) * h).toFixed(2);
  const x = i => +(i / (vals.length - 1) * w).toFixed(1);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`);
  const area = `M0,${h} L` + pts.join(' L') + ` L${w},${h} Z`;
  // A circle cannot survive non-uniform scaling — it becomes an ellipse, which
  // is what made the first version look broken. A zero-length line with a round
  // cap and a non-scaling stroke draws a true dot at any aspect ratio.
  const marks = vals.map((v, i) => (v > max || v < min)
    ? `<line x1="${x(i)}" y1="${y(v)}" x2="${x(i)}" y2="${y(v)}" stroke="var(--warn)"
         stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"
      preserveAspectRatio="none" style="display:block;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".22"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.7"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${marks}</svg>`;
}

// a ring — share of something, e.g. checks done
function ring(part, total, size = 78, col = 'var(--acc)', label) {
  const r = size / 2 - 7, c = 2 * Math.PI * r, q = total ? part / total : 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(0,0,0,.09)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${(c*q).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
      style="font:700 ${size/4.2}px var(--font);fill:var(--ink)">${label ?? (part + '/' + total)}</text></svg>`;
}

// a stacked bar for the cost structure of a franc of revenue
function chartStack(parts, h = 26) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1;
  let x = 0;
  const segs = parts.map(p => {
    const w = p.v / total * 240;
    const s = `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0, w - 1.5).toFixed(1)}" height="${h}"
        rx="3" fill="${p.c}"/>`;
    x += w; return s;
  }).join('');
  // the legend has to stay on ONE line, or this tile grows taller than the
  // three beside it and the top row stops looking like a row
  return svg(240, h, segs) +
    `<div style="display:flex;gap:9px;margin-top:7px;white-space:nowrap">${parts.map(p =>
      `<span style="font-size:9.5px;color:var(--dim)"><span style="display:inline-block;width:7px;
        height:7px;border-radius:2px;background:${p.c};margin-right:4px"></span>${esc(p.n)} ${(p.v / total * 100).toFixed(0)}%</span>`
      ).join('')}</div>`;
}

// horizontal bars, for margins and review themes
function chartRows(rows, warnBelow) {
  const max = Math.max(...rows.map(r => r.v)) || 1;
  return rows.map(r => {
    const bad = warnBelow !== undefined && r.v < warnBelow;
    return `<div style="margin-bottom:9px">
      <div class="row" style="justify-content:space-between;margin-bottom:4px">
        <span class="small">${esc(r.n)}</span>
        <span class="small num" style="font-weight:650;color:${bad ? 'var(--warn)' : 'var(--ink)'}">${esc(r.l)}</span></div>
      <div class="bar"><i style="width:${(r.v / max * 100).toFixed(0)}%;
        background:${bad ? 'var(--warn)' : 'var(--acc)'}"></i></div></div>`;
  }).join('');
}

// a widget frame, so every tile looks the same
const W = (titel, inner, opts = {}) => `<div class="card ${opts.cls || ''}"
  ${opts.go ? `data-go="${opts.go}" style="cursor:pointer"` : ''}>
  <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:11px">
    <div class="l" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;
         text-transform:uppercase;color:var(--dim)">${esc(titel)}</div>
    ${opts.rechts || ''}</div>${inner}</div>`;
const VIEWS = {};

/* ── Rechnungen ─────────────────────────────────────────────────────────── */
VIEWS.rechnungen = () => {
  const stat = { ok:['t-ok','abgeglichen'], preis:['t-warn','Preisänderung'], menge:['t-mute','Menge offen'],
                 erledigt:['t-ok','geprüft'] };
  const rows = DB.rechnungen.map(r => {
    const [cls, label] = stat[r.status];
    return `<tr class="click" data-inv="${r.id}">
      <td><b>${esc(r.lief)}</b></td><td class="muted">${r.id}</td><td class="muted">${r.datum}</td>
      <td class="r num">${chf(r.total)}</td>
      <td class="r"><span class="tag ${cls}">${label}</span></td></tr>`;
  }).join('');

  let detail = '';
  if (OFFEN) {
    const r = DB.rechnungen.find(x => x.id === OFFEN);
    const zeilen = r.zeilen.map((z, i) => {
      const a = DB.artikel[z.art];
      const hoch = z.preis > a.vorher;
      const fehlt = z.gel < z.best;
      return `<tr>
        <td>${esc(a.name)}</td>
        <td class="r num">${z.best}</td>
        <td class="r num ${fehlt ? '' : 'muted'}" ${fehlt ? 'style="color:var(--warn);font-weight:650"' : ''}>${z.gel}</td>
        <td class="r num">${chf(z.preis)}</td>
        <td class="r">${hoch
          ? `<span class="tag t-warn">+${((z.preis / a.vorher - 1) * 100).toFixed(1)}%</span>`
          : fehlt ? `<span class="tag t-mute">${z.best - z.gel} nicht geliefert</span>`
                  : '<span class="tag t-ok">wie bestellt</span>'}</td></tr>`;
    }).join('');

    const preisZeile = r.zeilen.find(z => z.preis > DB.artikel[z.art].vorher);
    const mengeZeile = r.zeilen.find(z => z.gel < z.best);
    let aktion = '';
    if (preisZeile) {
      const a = DB.artikel[preisZeile.art];
      const betroffen = DB.gerichte.filter(g => g.rezept.some(z => z.art === preisZeile.art));
      aktion = `<div class="card warn" style="margin-top:14px">
        <div class="row" style="margin-bottom:8px">
          <span class="tag t-warn">Preisänderung</span>
          <b class="small">${esc(a.name)} · ${esc(a.lief)}</b></div>
        <div class="small muted" style="line-height:1.6">
          ${chf(a.vorher)} → <b style="color:var(--ink)">${chf(preisZeile.preis)}</b> seit Ihrer letzten
          Bestellung. Steckt in <b style="color:var(--ink)">${betroffen.length} Gerichten</b>
          auf der aktuellen Karte.</div>
        <div class="row" style="margin-top:11px">
          <button class="btn acc" data-act="preis-uebernehmen" data-art="${preisZeile.art}"
                  data-neu="${preisZeile.preis}">Preis übernehmen</button>
          <button class="btn" data-act="preis-nachfragen">Beim Lieferanten nachfragen</button></div></div>`;
    } else if (mengeZeile) {
      const a = DB.artikel[mengeZeile.art];
      const diff = (mengeZeile.best - mengeZeile.gel) * mengeZeile.preis;
      aktion = `<div class="card warn" style="margin-top:14px">
        <div class="row" style="margin-bottom:8px">
          <span class="tag t-mute">Menge offen</span>
          <b class="small">${esc(a.name)}</b></div>
        <div class="small muted" style="line-height:1.6">Bestellt ${mengeZeile.best}, geliefert
          ${mengeZeile.gel}. Die Rechnung verlangt <b style="color:var(--ink)">${chf(diff)}</b> zu viel.</div>
        <div class="row" style="margin-top:11px">
          <button class="btn acc" data-act="menge-kuerzen" data-inv="${r.id}"
                  data-diff="${diff}">Rechnung kürzen und freigeben</button></div></div>`;
    } else {
      aktion = `<div class="card good" style="margin-top:14px"><div class="small">
        Alle Positionen stimmen mit der Bestellung überein. Nichts zu tun.</div></div>`;
    }

    detail = `<div class="sec">${esc(r.lief)} · ${r.id}</div>
      <table><thead><tr><th>Position</th><th class="r">Bestellt</th><th class="r">Geliefert</th>
        <th class="r">Preis</th><th class="r">Abgleich</th></tr></thead><tbody>${zeilen}</tbody></table>
      ${aktion}`;
  }

  const offen = DB.rechnungen.filter(r => r.status !== 'ok' && r.status !== 'erledigt').length;
  return `<table><thead><tr><th>Lieferant</th><th>Nummer</th><th>Datum</th>
      <th class="r">Total</th><th class="r">Status</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:12px">Diesen Monat
      <b style="color:var(--ink)">${DB.gelesen} Rechnungen gelesen</b> ·
      ${offen} brauchen eine Entscheidung ·
      ${OFFEN ? 'unten die Positionen' : 'eine Zeile anklicken, um die Positionen zu sehen'}</div>
    ${detail}`;
};

/* ── Lager ──────────────────────────────────────────────────────────────── */
VIEWS.lager = () => {
  const rows = DB.lager.map(l => {
    const a = DB.artikel[l.art];
    const diff = l.gezaehlt - l.erwartet;
    const wert = diff * einzel(l.art);
    const auff = Math.abs(diff) / l.erwartet > 0.05;
    return `<tr>
      <td><b>${esc(a.name.split(',')[0])}</b></td>
      <td class="r num muted">${l.erwartet.toFixed(1)} ${l.einheit}</td>
      <td class="r num"><input style="width:74px;text-align:right" type="number" step="0.1"
            value="${l.gezaehlt}" data-count="${l.art}"></td>
      <td class="r num" style="${auff ? 'color:var(--warn);font-weight:650' : ''}">${diff > 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)}</td>
      <td class="r num muted">${chf(wert)}</td>
      <td class="r">${auff ? '<span class="tag t-warn">nachschauen</span>' : '<span class="tag t-ok">im Rahmen</span>'}</td></tr>`;
  }).join('');
  const verlust = DB.lager.reduce((s, l) => s + Math.min(0, (l.gezaehlt - l.erwartet) * einzel(l.art)), 0);
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Gezählt</div><div class="n">${DB.lagerStand}</div></div>
      <div class="card kpi"><div class="l">Differenz, Wert</div>
        <div class="n" style="color:${verlust < -20 ? 'var(--warn)' : 'var(--ink)'}">${chf(verlust)}</div>
        <div class="d">Gegen die Verkäufe gerechnet</div></div>
      <div class="card kpi"><div class="l">Auffällig</div>
        <div class="n">${DB.lager.filter(l => Math.abs(l.gezaehlt - l.erwartet) / l.erwartet > 0.05).length} von ${DB.lager.length}</div>
        <div class="d">Mehr als 5 % Abweichung</div></div></div>
    <table><thead><tr><th>Artikel</th><th class="r">Erwartet</th><th class="r">Gezählt</th>
      <th class="r">Differenz</th><th class="r">Wert</th><th class="r">Status</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:12px">Eine Zahl ändern — die Differenz, der Wert und
      die Kennzahl oben rechnen sofort mit.</div>`;
};

/* ── Aktionen ───────────────────────────────────────────────────────────── */
VIEWS.aktionen = () => {
  const rows = DB.aktionen.map(a => {
    const art = DB.artikel[a.art];
    const rabatt = (1 - a.neu / art.preis) * 100;
    const spart = (art.preis - a.neu) / art.menge * a.monat;
    const gerichte = DB.gerichte.filter(g => g.rezept.some(z => z.art === a.art)).length;
    return `<tr>
      <td><b>${esc(a.lief)}</b></td><td class="muted">${esc(art.name)}</td>
      <td class="r num muted" style="text-decoration:line-through">${chf(art.preis)}</td>
      <td class="r num"><b>${chf(a.neu)}</b></td>
      <td class="r"><span class="tag t-ok">−${rabatt.toFixed(0)}%</span></td>
      <td class="r ${dringend(a) ? '' : 'muted'}" style="${dringend(a) ? 'color:var(--warn);font-weight:650' : ''}">bis ${a.bis}
        <span style="font-weight:400;font-size:11.5px">· ${tageBis(a.bis)} Tag${tageBis(a.bis) === 1 ? '' : 'e'}</span></td>
      <td class="r num">${chf(spart)}</td>
      <td class="r">${a.genommen
        ? '<span class="tag t-ok">auf der Bestellliste</span>'
        : `<button class="btn acc" data-act="aktion-nehmen" data-id="${a.id}">Übernehmen</button>`}</td>
      </tr>`;
  }).join('');
  const total = DB.aktionen.reduce((s, a) => {
    const art = DB.artikel[a.art];
    return s + (art.preis - a.neu) / art.menge * a.monat;
  }, 0);
  const genommen = DB.aktionen.filter(a => a.genommen);
  const gespart = genommen.reduce((s, a) => {
    const art = DB.artikel[a.art];
    return s + (art.preis - a.neu) / art.menge * a.monat;
  }, 0);
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Gefunden</div><div class="n">${DB.aktionen.length + DB.irrelevant}</div>
        <div class="d">${DB.irrelevant} als irrelevant ausgeblendet</div></div>
      <div class="card kpi"><div class="l">Betreffen Ihren Einkauf</div><div class="n">${DB.aktionen.length}</div>
        <div class="d">Gegen Ihre Bestellhistorie geprüft</div></div>
      <div class="card kpi"><div class="l">Möglich diesen Monat</div><div class="n">${chf(total)}</div>
        <div class="d">Bei Ihren üblichen Mengen</div></div></div>
    <table><thead><tr><th>Lieferant</th><th>Artikel</th><th class="r">Liste</th><th class="r">Aktion</th>
      <th class="r">Rabatt</th><th class="r">Bis</th><th class="r">Spart</th><th class="r"></th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${genommen.length ? `<div class="card good" style="margin-top:16px">
      <div class="small"><b>${genommen.length} auf der Bestellliste</b> —
      ${esc(genommen.map(a => DB.artikel[a.art].name.split(',')[0]).join(', '))}.
      Das sind <b>${chf(gespart)}</b> bei den Mengen des letzten Monats.</div></div>` : ''}`;
};

/* ── Gerichte ───────────────────────────────────────────────────────────── */
VIEWS.gerichte = () => {
  const rows = DB.gerichte.map(g => {
    const w = wareneinsatz(g), m = marge(g);
    const bewegt = g.rezept.some(z => DB.artikel[z.art].preis !== DB.artikel[z.art].vorher);
    return `<tr>
      <td><b>${esc(g.name)}</b>${bewegt ? ' <span class="tag t-warn">Preis bewegt</span>' : ''}</td>
      <td class="r num muted">${chf(w)}</td>
      <td class="r num"><input style="width:82px;text-align:right" type="number" step="0.5"
          value="${g.karte.toFixed(2)}" data-karte="${g.id}"></td>
      <td class="r num"><b style="color:${m < 65 ? 'var(--warn)' : 'var(--ink)'}">${m.toFixed(1)}%</b></td>
      <td class="r num muted">${g.verkauft}</td>
      <td class="r num">${chf((g.karte - w) * g.verkauft)}</td></tr>`;
  }).join('');
  const roh = DB.gerichte.reduce((s, g) => s + (g.karte - wareneinsatz(g)) * g.verkauft, 0);
  const schnitt = DB.gerichte.reduce((s, g) => s + marge(g), 0) / DB.gerichte.length;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Marge im Schnitt</div><div class="n">${schnitt.toFixed(1)}%</div>
        <div class="d">Über die vier Gerichte</div></div>
      <div class="card kpi"><div class="l">Rohertrag, Woche</div><div class="n">${chf(roh)}</div>
        <div class="d">Verkäufe × Marge</div></div>
      <div class="card kpi"><div class="l">Kalkuliert mit</div><div class="n">${DB.gelesen} Rechnungen</div>
        <div class="d">Den Preisen, die Sie zuletzt bezahlt haben</div></div></div>
    <table><thead><tr><th>Gericht</th><th class="r">Wareneinsatz</th><th class="r">Kartenpreis</th>
      <th class="r">Marge</th><th class="r">Verkauft</th><th class="r">Rohertrag</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:12px">Der Wareneinsatz kommt aus den Artikelpreisen.
      Übernehmen Sie in <span class="link" data-go="rechnungen">Rechnungen</span> eine Preisänderung,
      ändern sich diese Zahlen hier mit.</div>`;
};
/* ── Hygiene ────────────────────────────────────────────────────────────── */
VIEWS.hygiene = () => {
  const rows = DB.hygiene.map(h => `<tr>
    <td style="width:34px"><div class="check ${h.done ? 'on' : ''}" data-check="${h.id}">${TICK}</div></td>
    <td><b>${esc(h.station)}</b></td><td class="muted">${esc(h.was)}</td>
    <td class="muted">${esc(h.wer) || '—'}</td>
    <td class="r muted">${h.zeit || (h.done ? '' : 'heute fällig')}</td>
    <td class="r">${h.done ? '<span class="tag t-ok">erledigt</span>' : '<span class="tag t-warn">offen</span>'}</td>
    </tr>`).join('');
  const offen = DB.hygiene.filter(h => !h.done);
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Heute</div>
        <div class="n">${DB.hygiene.length - offen.length} von ${DB.hygiene.length}</div>
        <div class="d">Abgehakt an der Station</div></div>
      <div class="card kpi"><div class="l">Diesen Monat</div><div class="n">${DB.hygieneMonat}</div>
        <div class="d">${DB.hygieneSpaet} verspätet</div></div>
      <div class="card kpi"><div class="l">Nachweis</div><div class="n">vollständig</div>
        <div class="d">Jeder Eintrag mit Name und Uhrzeit</div></div></div>
    <table><thead><tr><th></th><th>Station</th><th>Kontrolle</th><th>Von</th>
      <th class="r">Zeit</th><th class="r">Status</th></tr></thead><tbody>${rows}</tbody></table>
    ${offen.length ? `<div class="card warn" style="margin-top:16px">
        <div class="row" style="margin-bottom:7px"><span class="tag t-warn">noch offen</span>
          <b class="small">${esc(offen.map(o => o.station + ' · ' + o.was).join(' | '))}</b></div>
        <div class="small muted">Für die Schichtleitung jetzt sichtbar, nicht erst morgen früh.
          Ein Häkchen setzen — der Eintrag bekommt Ihren Namen und die Uhrzeit.</div></div>`
      : `<div class="card good" style="margin-top:16px"><div class="small">
          Alle Kontrollen von heute sind erledigt. Der Monat lässt sich als eine Datei ausgeben.</div>
          <div class="row" style="margin-top:11px">
          <button class="btn" data-act="haccp-export">Nachweis März exportieren</button></div></div>`}
    <div class="sec">Im Protokoll</div>
    <table><tbody>${DB.hygiene.filter(h => h.done).map(h => `<tr>
        <td><b>${esc(h.station)}</b> <span class="muted">· ${esc(h.was)}</span></td>
        <td class="r muted">${esc(h.wer)} · ${h.zeit}</td></tr>`).join('')}</tbody></table>`;
};

/* ── Temperatur ─────────────────────────────────────────────────────────── */
VIEWS.temperatur = () => {
  const rows = DB.geraete.map(g => {
    const bad = g.temp > g.max || g.temp < g.min;
    return `<tr>
      <td><b>${esc(g.name)}</b></td><td class="muted">${esc(g.wo)}</td>
      <td class="r num"><b style="color:${bad ? 'var(--warn)' : 'var(--ink)'}">${g.temp.toFixed(1)} °C</b></td>
      <td class="r num muted">${g.min} – ${g.max} °C</td>
      <td class="r">${bad ? '<span class="tag t-warn">Alarm</span>' : '<span class="tag t-ok">im Bereich</span>'}</td>
      <td class="r">${bad
        ? `<button class="btn" data-act="alarm-quittieren" data-id="${g.id}">Quittieren</button>`
        : `<button class="btn" data-act="tuer-offen" data-id="${g.id}">Tür offen lassen</button>`}</td>
      </tr>`;
  }).join('');
  const alarme = DB.alarme.map(a => `<tr>
    <td><b>${esc(a.geraet)}</b></td><td class="muted">${a.wann}</td>
    <td class="r num" style="color:var(--warn)">${a.wert.toFixed(1)} °C</td>
    <td class="muted">an ${esc(a.an)}</td>
    <td class="r muted">${a.quittiert ? 'quittiert ' + a.quittiert : '<span class="tag t-warn">offen</span>'}</td>
    <td class="muted">${esc(a.grund || '')}</td></tr>`).join('');
  const jetztBad = DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).length;
  return `<div class="grid g3" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Geräte</div><div class="n">${DB.geraete.length}</div>
        <div class="d">Ein Fühler pro Gerät</div></div>
      <div class="card kpi"><div class="l">Jetzt im Alarm</div>
        <div class="n" style="color:${jetztBad ? 'var(--warn)' : 'var(--ink)'}">${jetztBad}</div>
        <div class="d">Gemessen, ob jemand im Haus ist oder nicht</div></div>
      <div class="card kpi"><div class="l">Letzte 30 Tage</div><div class="n">${DB.alarme.length} Alarme</div>
        <div class="d">Dieselbe Aufzeichnung ist das HACCP-Protokoll</div></div></div>
    <table><thead><tr><th>Gerät</th><th>Wo</th><th class="r">Jetzt</th><th class="r">Bereich</th>
      <th class="r">Status</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:12px">«Tür offen lassen» simuliert, was nachts passiert:
      das Gerät läuft aus dem Bereich, der Alarm geht an die diensthabende Person und landet im Protokoll.</div>
    <div class="sec">Alarmprotokoll</div>
    <table><thead><tr><th>Gerät</th><th>Wann</th><th class="r">Wert</th><th>Meldung</th>
      <th class="r">Quittiert</th><th>Grund</th></tr></thead><tbody>${alarme}</tbody></table>`;
};

/* ── Dienstplan ─────────────────────────────────────────────────────────── */
VIEWS.dienstplan = () => {
  const max = Math.max(...DB.woche.map(d => Math.max(d.gedecke, d.vj)));
  const cols = DB.woche.map(d => {
    const pro = d.gedecke / d.besetzt;
    const knapp = pro > 26, viel = pro < 13;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:7px;flex:1">
      <div style="height:110px;display:flex;align-items:flex-end;gap:3px">
        <div style="width:22px;border-radius:5px 5px 0 0;height:${Math.round(d.gedecke / max * 110)}px;
             background:${knapp ? 'var(--warn)' : 'var(--acc)'}"></div>
        <div style="width:8px;border-radius:5px 5px 0 0;height:${Math.round(d.vj / max * 110)}px;
             background:rgba(0,0,0,.12)"></div></div>
      <div class="small" style="font-weight:650">${d.tag}</div>
      <div class="small muted num">${d.gedecke}</div>
      <select data-shift="${d.tag}" style="padding:4px 6px;font-size:11.5px">
        ${[2,3,4,5,6,7].map(n => `<option value="${n}" ${n === d.besetzt ? 'selected' : ''}>${n} auf Schicht</option>`).join('')}
      </select>
      <div class="small" style="color:${knapp ? 'var(--warn)' : viel ? 'var(--acci)' : 'var(--dim)'};font-weight:650">
        ${knapp ? 'knapp' : viel ? 'reichlich' : 'passt'}</div></div>`;
  }).join('');
  const std = DB.woche.reduce((s, d) => s + d.besetzt * 8, 0);
  const kosten = std * DB.lohn;
  const gedecke = DB.woche.reduce((s, d) => s + d.gedecke, 0);
  const vj = DB.woche.reduce((s, d) => s + d.vj, 0);
  return `<div class="grid g4" style="margin-bottom:20px">
      <div class="card kpi"><div class="l">Gedecke, gebucht</div><div class="n">${gedecke}</div>
        <div class="d">Vorjahreswoche ${vj} · ${pct((gedecke / vj - 1) * 100)}</div></div>
      <div class="card kpi"><div class="l">Stunden geplant</div><div class="n">${std}</div>
        <div class="d">Bei 8 Stunden pro Schicht</div></div>
      <div class="card kpi"><div class="l">Personalkosten</div><div class="n">${chf(kosten)}</div>
        <div class="d">Zu ${chf(DB.lohn)} pro Stunde</div></div>
      <div class="card kpi"><div class="l">Pro Gedeck</div><div class="n">${chf(kosten / gedecke)}</div>
        <div class="d">Personal je gebuchtem Gedeck</div></div></div>
    <div class="card"><div class="row" style="align-items:flex-end;gap:10px">${cols}</div>
      <div class="row" style="margin-top:14px;gap:16px" class="small">
        <span class="small muted"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;
          background:var(--acc);margin-right:5px"></span>diese Woche</span>
        <span class="small muted"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;
          background:rgba(0,0,0,.12);margin-right:5px"></span>Vorjahr</span></div></div>

/* ── Übersicht ──────────────────────────────────────────────────────────────
   The dashboard is not a twelfth screen with its own data. It asks every
   module what it is waiting for and lists the answers, which is the only
   honest way to build an overview: if a module goes quiet, the dashboard goes
   quiet with it. Every row jumps to the module that owns it.
   ────────────────────────────────────────────────────────────────────────── */
function offeneSachen() {
  const items = [];

  DB.rechnungen.filter(r => r.status === 'preis').forEach(r => {
    const z = r.zeilen.find(x => x.preis > DB.artikel[x.art].vorher);
    const a = DB.artikel[z.art];
    const auf = (z.preis / a.vorher - 1) * 100;
    items.push({ ernst: 2, wo: 'rechnungen', modul: 'Rechnungen',
      was: `${a.name.split(',')[0]} +${auf.toFixed(1)}% bei ${r.lief}`,
      warum: (n => `Steckt in ${n} Gericht${n > 1 ? 'en' : ''} — Preis übernehmen oder nachfragen`)(
        DB.gerichte.filter(g => g.rezept.some(x => x.art === z.art)).length) });
  });
  DB.rechnungen.filter(r => r.status === 'menge').forEach(r => {
    const z = r.zeilen.find(x => x.gel < x.best);
    items.push({ ernst: 2, wo: 'rechnungen', modul: 'Rechnungen',
      was: `${r.lief}: ${r.id} verlangt zu viel`,
      warum: `${z.best - z.gel} Position${z.best - z.gel > 1 ? 'en' : ''} nicht geliefert — ${chf((z.best - z.gel) * z.preis)}` });
  });

  DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).forEach(g => {
    items.push({ ernst: 3, wo: 'temperatur', modul: 'Temperatur',
      was: `${g.name} bei ${g.temp.toFixed(1)} °C`,
      warum: `Bereich ${g.min} – ${g.max} °C — Meldung ist raus, wartet auf Quittierung` });
  });

  const hOffen = DB.hygiene.filter(h => !h.done);
  if (hOffen.length) items.push({ ernst: 2, wo: 'hygiene', modul: 'Hygiene',
    was: `${hOffen.length} Kontrolle${hOffen.length > 1 ? 'n' : ''} noch offen`,
    warum: hOffen.map(h => h.station).join(', ') + ' — vor Serviceschluss sichtbar' });

  DB.aktionen.filter(a => dringend(a) && !a.genommen).forEach(a => {
    const art = DB.artikel[a.art];
    items.push({ ernst: 1, wo: 'aktionen', modul: 'Aktionen',
      was: `${art.name.split(',')[0]} −${((1 - a.neu / art.preis) * 100).toFixed(0)}% bis ${a.bis}`,
      warum: `Spart ${chf((art.preis - a.neu) / art.menge * a.monat)} bei Ihrer üblichen Menge` });
  });

  const wartet = DB.karte[0].ziele.filter(z => z.status === 'wartet');
  if (wartet.length) items.push({ ernst: 1, wo: 'inhalte', modul: 'Inhalte',
    was: `${DB.karte[0].name} wartet auf Freigabe`,
    warum: `${wartet.map(z => z.was).join(', ')} — nichts erreicht einen Gast vorher` });

  const drafts = DB.posts.filter(p => p.status === 'entwurf');
  if (drafts.length) items.push({ ernst: 1, wo: 'social', modul: 'Social Media',
    was: `${drafts.length} Beitr${drafts.length > 1 ? 'äge' : 'ag'} im Entwurf`,
    warum: drafts.map(p => p.wann).join(', ') + ' — geschrieben, wartet auf Sie' });

  const rOffen = DB.bewertungen.filter(b => b.status === 'entwurf');
  if (rOffen.length) items.push({ ernst: 1, wo: 'bewertungen', modul: 'Bewertungen',
    was: `${rOffen.length} Antwort${rOffen.length > 1 ? 'en' : ''} entworfen`,
    warum: rOffen.map(b => b.quelle + ' ' + b.sterne + '★').join(', ') + ' — durchlesen und senden' });

  const bOffen = DB.briefings.filter(b => b.faellig.length);
  if (bOffen.length) items.push({ ernst: 1, wo: 'schulung', modul: 'Schulung',
    was: `${bOffen.length} Briefing${bOffen.length > 1 ? 's' : ''} fällig`,
    warum: bOffen.map(b => b.titel).join(', ') + ' — ' + bOffen.reduce((s, b) => s + b.faellig.length, 0) + ' Personen' });

  const knapp = DB.woche.filter(d => d.gedecke / d.besetzt > 26);
  if (knapp.length) items.push({ ernst: 2, wo: 'dienstplan', modul: 'Dienstplan',
    was: `${knapp.map(d => d.tag).join(', ')} knapp besetzt`,
    warum: `Über 26 Gedecke pro Person — ${knapp.map(d => d.tag + ': ' + d.gedecke + ' auf ' + d.besetzt).join(' · ')}` });

  const lAuff = DB.lager.filter(l => Math.abs(l.gezaehlt - l.erwartet) / l.erwartet > 0.05);
  if (lAuff.length) items.push({ ernst: 1, wo: 'lager', modul: 'Lager',
    was: `${lAuff.length} Artikel weich${lAuff.length > 1 ? 'en' : 't'} ab`,
    warum: lAuff.map(l => DB.artikel[l.art].name.split(',')[0]).join(', ') +
           ` — zusammen ${chf(lAuff.reduce((s, l) => s + (l.gezaehlt - l.erwartet) * einzel(l.art), 0))}` });

  return items.sort((a, b) => b.ernst - a.ernst);
}

/* A widget is a label, a body, and nothing else. No stretching, no filler. */
const WG = (span, label, body, opts = {}) => `<div class="card ${span}"
  ${opts.go ? `data-go="${opts.go}" style="cursor:pointer"` : ''}>
  <div class="wl"><span>${esc(label)}</span>${opts.rechts ? `<span class="r2">${opts.rechts}</span>` : ''}</div>
  ${body}</div>`;

const mini = (nm, ch, vl, warn) => `<div class="mini"><div class="nm">${esc(nm)}</div>
  <div class="ch">${ch}</div>
  <div class="vl" style="${warn ? 'color:var(--warn)' : ''}">${vl}</div></div>`;

const mini2 = (nm, ch, vl, warn) => `<div class="mini2">
  <div class="top"><span class="nm2">${esc(nm)}</span>
    <span class="vl2" style="${warn ? 'color:var(--warn)' : ''}">${vl}</span></div>${ch}</div>`;

VIEWS.uebersicht = () => {
  const z = zahlen();
  const items = offeneSachen();
  const dring = items.filter(i => i.ernst >= 2);
  const spaeter = items.filter(i => i.ernst < 2);
  const tage = DB.woche.map(d => d.tag);
  const hDone = DB.hygiene.filter(h => h.done).length;

  /* four numbers, each with its own history under it */
  const tile = (label, big, sub, chart, rechts) =>
    WG('w3', label, `<div class="big">${big}</div><div class="sm2">${sub}</div>
       ${chart ? `<div style="margin-top:7px">${chart}</div>` : ''}`, { rechts });

  const kpis =
    tile('Umsatz, Woche', chf(z.umsatz), chf(z.umsatz / z.gedecke) + ' pro Gedeck',
         chartBars(DB.tagesUmsatz, DB.tagesUmsatzVJ, 30),
         tage.map(t => t[0]).join(' ')) +
    tile('Rohertrag', (z.roh / z.umsatz * 100).toFixed(1) + '%', chf(z.roh) + ' nach Ware',
         chartStack([{ n:'Ware', v:z.einsatz, c:'var(--warn)' },
                     { n:'Personal', v:z.personal, c:'var(--acci)' },
                     { n:'Rest', v:Math.max(0, z.db), c:'var(--acc)' }], 14)) +
    tile('Deckungsbeitrag', chf(z.db), 'Personal ' + (z.personal / z.umsatz * 100).toFixed(1) + '% vom Umsatz',
         // per day: the day's share of the gross margin, minus that day's shift cost
         chartBars(DB.woche.map((d, i) =>
           Math.max(0, Math.round(DB.tagesUmsatz[i] * (z.roh / z.umsatz) - d.besetzt * 8 * DB.lohn))),
           null, 30),
         tage.map(t => t[0]).join(' ')) +
    tile('Gedecke', String(z.gedecke), 'Vorjahr ' + z.vj + ' · ' + pct((z.gedecke / z.vj - 1) * 100),
         chartBars(DB.woche.map(d => d.gedecke), DB.woche.map(d => d.vj), 30),
         tage.map(t => t[0]).join(' '));

  /* decisions — the tall column, so it carries the most rows */
  const dec = WG('', dring.length ? dring.length + ' braucht eine Entscheidung' : 'Entscheidungen',
    (dring.length
      ? dring.map(i => `<div class="dec" data-go="${i.wo}">
          <div class="row" style="justify-content:space-between;gap:6px">
            <b>${esc(i.was)}</b>
            <span class="tag ${i.ernst === 3 ? 't-warn' : 't-mute'}">${i.ernst === 3 ? 'jetzt' : 'heute'}</span></div>
          <div class="why">${i.warum}</div></div>`).join('')
      : `<div class="dec calm"><b>Nichts offen</b>
          <div class="why">Alles, was entschieden werden musste, ist entschieden.</div></div>`)
    + (spaeter.length ? `<div class="chips" style="margin-top:7px">${spaeter.map(i =>
        `<span class="chip" data-go="${i.wo}">${esc(i.was)}</span>`).join('')}</div>` : ''));

  /* cold chain — one line per unit */
  const kuehl = WG('', 'Kühlkette, letzte Stunden',
    DB.geraete.map(g => {
      const bad = g.temp > g.max || g.temp < g.min;
      return `<div class="mini" style="gap:10px"><div class="nm" style="flex:0 0 86px">${esc(g.name)}</div>
        <div class="ch" style="flex:1 1 auto">${chartLine(g.verlauf, g.min, g.max, 24,
          bad ? 'var(--warn)' : 'var(--acc)')}</div>
        <div class="vl" style="${bad ? 'color:var(--warn)' : ''}">${g.temp.toFixed(1)} °C</div></div>`;
    }).join(''), { go:'temperatur',
      rechts: DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).length
        ? DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).length + ' im Alarm' : 'alle im Bereich' });

  /* hygiene — ring beside the open items, not above them */
  const hyg = WG('', 'Hygiene heute', `<div class="row" style="gap:12px;align-items:center">
      ${ring(hDone, DB.hygiene.length, 62, hDone === DB.hygiene.length ? 'var(--acc)' : 'var(--warn)')}
      <div style="min-width:0">
        ${DB.hygiene.filter(h => !h.done).map(h =>
          `<div style="font-size:10.5px;color:var(--warn);line-height:1.45">${esc(h.station)}</div>`).join('')
         || '<div style="font-size:11px;color:var(--acci)">lückenlos</div>'}
        <div class="sm2">${DB.hygieneMonat} Einträge im März</div></div></div>`,
    { go:'hygiene' });

  /* margins, themes, offers, shifts, stock — all one-liners */
  const margen = WG('', 'Marge pro Gericht', DB.gerichte.map(g => {
    const m = marge(g), max = Math.max(...DB.gerichte.map(marge));
    return mini2(g.name, `<div class="bar"><i style="width:${(m / max * 100).toFixed(0)}%;
      background:${m < 73 ? 'var(--warn)' : 'var(--acc)'}"></i></div>`, m.toFixed(1) + '%', m < 73);
  }).join(''), { go:'gerichte', rechts: 'Ø ' + (DB.gerichte.reduce((s, g) => s + marge(g), 0) / DB.gerichte.length).toFixed(1) + '%' });

  const themen = WG('', 'Bewertungen, 30 Tage', DB.themen.map(t => {
    const max = Math.max(...DB.themen.map(x => x.n));
    return mini2(t.thema, `<div class="bar"><i style="width:${(t.n / max * 100).toFixed(0)}%;
      background:${t.trend === 'down' ? 'var(--warn)' : 'var(--acc)'}"></i></div>`, t.n + '×');
  }).join(''), { go:'bewertungen',
    rechts: DB.schnitt.toFixed(1) + ' · ' + DB.bewBeantwortet + '/' + DB.bewMonat + ' beantwortet' });

  const offers = DB.aktionen.filter(a => !a.genommen);
  const spar = offers.reduce((s, a) => {
    const art = DB.artikel[a.art]; return s + (art.preis - a.neu) / art.menge * a.monat; }, 0);
  const akt = WG('', 'Aktionen', offers.length ? offers.map(a => {
      const art = DB.artikel[a.art];
      const v = (art.preis - a.neu) / art.menge * a.monat;
      const max = Math.max(...offers.map(x => {
        const y = DB.artikel[x.art]; return (y.preis - x.neu) / y.menge * x.monat; }));
      return mini2(art.name.split(',')[0] + ' · bis ' + a.bis,
        `<div class="bar"><i style="width:${(v / max * 100).toFixed(0)}%"></i></div>`, chf(v));
    }).join('') : '<div class="sm2">Alle übernommen.</div>',
    { go:'aktionen', rechts: chf(spar) + ' möglich' });

  const plan = WG('', 'Auslastung pro Schicht', `<div class="row" style="align-items:flex-end;gap:5px">
    ${DB.woche.map(d => {
      const pro = d.gedecke / d.besetzt, knapp = pro > 26;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="height:44px;display:flex;align-items:flex-end;width:100%">
          <div style="width:100%;height:${Math.round(Math.min(1, pro / 34) * 44)}px;border-radius:3px 3px 0 0;
            background:${knapp ? 'var(--warn)' : 'var(--acc)'}"></div></div>
        <span style="font-size:10px;font-weight:650">${d.tag}</span>
        <span style="font-size:9.5px;color:var(--dim)">${pro.toFixed(0)}</span></div>`;
    }).join('')}</div>`, { go:'dienstplan', rechts:'Gedecke pro Person · >26 knapp' });

  const lager = WG('', 'Lager gegen Verkauf', DB.lager.map(l => {
    const d = (l.gezaehlt - l.erwartet) * einzel(l.art);
    const max = Math.max(...DB.lager.map(x => Math.abs((x.gezaehlt - x.erwartet) * einzel(x.art)))) || 1;
    const auff = Math.abs(l.gezaehlt - l.erwartet) / l.erwartet > 0.05;
    return mini2(DB.artikel[l.art].name.split(',')[0],
      `<div class="bar"><i style="width:${(Math.abs(d) / max * 100).toFixed(0)}%;
        background:${auff ? 'var(--warn)' : 'var(--acc)'}"></i></div>`, chf(d), auff);
  }).join(''), { go:'lager', rechts:'gezählt ' + DB.lagerStand });

  const module = WG('w12', 'Module', `<div class="chips">${MODULES.filter(m => m.id !== 'uebersicht')
    .map(m => { const b = badge(m.id);
      return `<span class="chip" data-go="${m.id}" style="${b ? 'background:var(--warnbg);color:var(--warn)' : ''}">
        ${esc(m.name)}${b ? ' · ' + b : ''}</span>`; }).join('')}</div>`);

  return `<div class="dash">${kpis}
    <div class="col w4">${dec}${akt}</div>
    <div class="col w4">${kuehl}${hyg}${plan}</div>
    <div class="col w4">${margen}${themen}${lager}</div>
    ${module}</div>`;
};
/* ── Axyom fragen ───────────────────────────────────────────────────────────
   A question box in the corner, so nobody has to know which module holds the
   answer. It reads the same DB every screen reads, so the answer moves when
   the data moves: take the veal price over in Rechnungen and ask for the
   Kalbsbraten margin here, and the new number comes back.

   How it resolves a question, and what that costs:
     * the NOUNS are built out of the data itself — every article, dish,
       supplier, device, person, weekday, review theme and invoice number is
       indexed from DB at question time, so a new article is askable the
       moment it exists, in any phrasing.
     * the MODULE names carry most of the topic vocabulary (they are the words
       the house already uses), and BEGRIFFE below adds only the field
       semantics no module is named after — marge, umsatz, preis. That much is
       a written lexicon, and it is the honest limit of a demo with no model
       behind it: the live product sends the question to the model.
     * it therefore never answers "nothing". An unrecognised question falls
       back to what is open right now, with links — narrow the answer, never
       empty it.
   ────────────────────────────────────────────────────────────────────────── */
const CHAT = { offen: false, verlauf: [], denkt: false };

const cnorm = s => String(s).toLowerCase()
  .replace(/[äáà]/g, 'a').replace(/[öó]/g, 'o').replace(/[üú]/g, 'u')
  .replace(/[éèê]/g, 'e').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();

const TAGE = { Mo:'Montag', Di:'Dienstag', Mi:'Mittwoch', Do:'Donnerstag',
               Fr:'Freitag', Sa:'Samstag', So:'Sonntag' };

/* every noun in the house, read out of DB — not a list anybody maintains */
function chatIndex() {
  const ix = [], add = (kind, ref, ...l) =>
    ix.push({ kind, ref, keys: [...new Set(l.filter(Boolean).map(cnorm))] });
  Object.entries(DB.artikel).forEach(([k, a]) => add('artikel', k, k, a.name.split(',')[0], a.name));
  DB.gerichte.forEach(g => add('gericht', g, g.name, g.name.split(' ')[0]));
  DB.geraete.forEach(g => add('geraet', g, g.name, g.name.replace(/\s*\d+$/, '')));
  DB.rechnungen.forEach(r => add('rechnung', r, r.id));
  [...new Set([...Object.values(DB.artikel).map(a => a.lief), ...DB.rechnungen.map(r => r.lief)])]
    .forEach(l => add('lieferant', l, l, l.split(' ')[0]));
  DB.leute.forEach(p => add('person', p, p.name, p.name.split(' ').pop()));
  DB.woche.forEach(d => add('tag', d, d.tag, TAGE[d.tag]));
  DB.themen.forEach(t => add('thema', t, t.thema));
  MODULES.forEach(m => add('modul', m, m.name, m.titel));
  DB.outlets.forEach(o => add('betrieb', o, o));
  return ix;
}

/* the words the data uses that no module is named after */
const BEGRIFFE = [
  ['auswertungen', 'umsatz ertrag rohertrag deckungsbeitrag zahlen gedeck gedecke wareneinsatz personal personalkosten lohn woche monat rendite ergebnis'],
  ['gerichte',     'marge margen kalkuliert kalkulation teller speise speisen karte verdient'],
  ['preise',       'preis preise kostet kosten teurer teuerer preisanderung preiserhohung aufschlag gestiegen erhoht'],
  ['aktionen',     'sparen spare angebot angebote rabatt guenstiger billiger'],
  ['uebersicht',   'offen offene heute anstehen ansteht entscheiden entscheidung dringend wichtig tun'],
  ['verlust',      'verliere verlieren verlust geld leck'],
  ['log',          'geandert passiert protokoll gemacht'],
  ['hilfe',        'kannst koennen hilfe helfen fragen wer bist du hallo hoi guten'],
];

/* Which kind of thing a topic word is asking about. «Marge Kalbsbraten» and
   «Preis Kalbsbraten» name the same stem and want different answers — the dish
   and the article — so the topic decides which noun wins the tie. */
const KIND_VON = { gerichte:'gericht', preise:'artikel', aktionen:'artikel', lager:'artikel',
                   temperatur:'geraet', rechnungen:'rechnung', dienstplan:'tag',
                   schulung:'person', bewertungen:'thema' };

function entName(kind, ref) {
  if (kind === 'artikel')  return DB.artikel[ref].name;
  if (kind === 'tag')      return TAGE[ref.tag];
  if (kind === 'thema')    return ref.thema;
  if (kind === 'rechnung') return ref.id;
  if (kind === 'modul')    return ref.name;
  return ref.name || String(ref);
}

function matchEnt(q, ix, bias) {
  const qt = q.split(' ').filter(Boolean);
  const hits = new Map();   // one score per thing, its best key wins
  const take = (e, s) => {
    if (!s) return;
    s += (bias && e.kind === bias) ? 6 : 0;
    const key = e.kind + '|' + entName(e.kind, e.ref);
    if (!hits.has(key) || hits.get(key).s < s) hits.set(key, { kind: e.kind, ref: e.ref, s });
  };
  ix.forEach(e => e.keys.forEach(k => {
    const kw = k.split(' ');
    if (k.length >= 4 && q.includes(k)) return take(e, k.length + 3);
    if ((' ' + q + ' ').includes(' ' + k + ' ')) return take(e, k.length + 1);
    // «kalbsbrate», «kuhlraume» — a stem long enough to be unambiguous
    qt.forEach(t => { if (t.length >= 5) kw.forEach(w => {
      if (w.length >= 5 && (w.startsWith(t) || t.startsWith(w))) take(e, Math.min(t.length, w.length));
    }); });
  }));
  const all = [...hits.values()].sort((a, b) => b.s - a.s);
  if (!all.length) return null;
  // «Rösti» is in two dishes. Ask which one instead of quietly picking one.
  const gleich = all.filter(x => x.s === all[0].s && x.kind === all[0].kind);
  return { ...all[0], ties: gleich.length > 1 ? gleich : [] };
}

function matchThema(q) {
  let best = null;
  BEGRIFFE.forEach(([id, words]) => words.split(' ').forEach(w => {
    const s = (' ' + q + ' ').includes(' ' + w + ' ') ? w.length + 2
            : (w.length >= 5 && q.includes(w)) ? w.length : 0;
    if (s && (!best || s > best.s)) best = { id, s };
  }));
  return best;
}

/* ── answer formatting ─────────────────────────────────────────────────── */
const cK = t => `<div class="qk">${t}</div>`;
const cZ = t => `<div class="qz">${t}</div>`;
const cC = arr => arr.length ? `<div class="chips" style="margin-top:9px">${arr.map(c => c.go
    ? `<span class="chip" data-go="${c.go}">${esc(c.t)} &rsaquo;</span>`
    : `<span class="chip" data-ask="${esc(c.t)}">${esc(c.t)}</span>`).join('')}</div>` : '';
const bau = (kopf, zeilen, chips = []) => cK(kopf) + zeilen.filter(Boolean).map(cZ).join('') + cC(chips);
const kurz = n => DB.artikel[n] ? DB.artikel[n].name.split(',')[0] : n;

/* ── answers about one thing ───────────────────────────────────────────── */
function aArtikel(k) {
  const a = DB.artikel[k], ep = einzel(k);
  const inG = DB.gerichte.filter(g => g.rezept.some(z => z.art === k));
  const off = DB.rechnungen.find(r => r.status === 'preis' && r.zeilen.some(z => z.art === k && z.preis > a.preis));
  const ak = DB.aktionen.find(x => x.art === k && !x.genommen);
  const l = DB.lager.find(x => x.art === k);
  const z = [`${chf(a.preis)} pro ${a.menge} ${a.einheit} — <b>${chf(ep)} pro ${esc(a.einheit)}</b>`];
  if (a.preis !== a.vorher)
    z.push(`${pct((a.preis / a.vorher - 1) * 100)} gegenüber ${chf(a.vorher)}, von Ihnen übernommen`);
  if (off) { const zl = off.zeilen.find(x => x.art === k);
    z.push(`<span class="hl">${esc(off.lief)} verlangt in ${esc(off.id)} ${chf(zl.preis)} — ${pct((zl.preis / a.preis - 1) * 100)}, noch nicht entschieden</span>`); }
  if (inG.length) z.push(`Steckt in ${inG.length} Gericht${inG.length > 1 ? 'en' : ''}: ` +
    inG.map(g => `${esc(g.name)} (${marge(g).toFixed(1)}%)`).join(', '));
  if (ak) z.push(`Aktion bis ${esc(ak.bis)}: ${chf(ak.neu)} — spart ${chf((a.preis - ak.neu) / a.menge * ak.monat)} bei Ihrer üblichen Menge`);
  if (l) { const d = (l.gezaehlt - l.erwartet) * ep;
    z.push(`Lager: ${l.gezaehlt} ${esc(l.einheit)} gezählt, ${l.erwartet} erwartet — ${chf(d)}`); }
  return bau(`${esc(a.name)} · ${esc(a.lief)}`, z,
    [off ? { t:'Rechnungen', go:'rechnungen' } : null, inG.length ? { t:'Gerichte', go:'gerichte' } : null,
     ak ? { t:'Aktionen', go:'aktionen' } : null].filter(Boolean));
}

function aGericht(g) {
  const we = wareneinsatz(g), m = marge(g);
  const lines = g.rezept.map(z => ({ n: kurz(z.art), v: einzel(z.art) * z.m }))
    .sort((a, b) => b.v - a.v);
  const teuer = DB.artikel[g.rezept.map(z => ({ z, v: einzel(z.art) * z.m }))
    .sort((a, b) => b.v - a.v)[0].z.art];
  return bau(`${esc(g.name)} · ${chf(g.karte)} auf der Karte`, [
    `Wareneinsatz <b>${chf(we)}</b>, Marge <b>${m.toFixed(1)}%</b>${m < 73 ? ' — unter Ihren anderen Gerichten' : ''}`,
    `Grösster Posten: ${esc(teuer.name.split(',')[0])} mit ${chf(lines[0].v)} (${(lines[0].v / we * 100).toFixed(0)}% der Ware)`,
    lines.slice(1, 4).map(l => `${esc(l.n)} ${chf(l.v)}`).join(' · '),
    `${g.verkauft}× diese Woche verkauft — ${chf((g.karte - we) * g.verkauft)} Rohertrag`,
  ], [{ t:'Gerichte', go:'gerichte' }, { t:'Marge pro Gericht' }]);
}

function aGeraet(g) {
  const bad = g.temp > g.max || g.temp < g.min;
  const hi = Math.max(...g.verlauf), lo = Math.min(...g.verlauf);
  const al = DB.alarme.filter(a => a.geraet === g.name);
  return bau(`${esc(g.name)} · ${esc(g.wo)}`, [
    `Jetzt <b${bad ? ' class="hl"' : ''}>${g.temp.toFixed(1)} °C</b>, erlaubt sind ${g.min} bis ${g.max} °C`,
    `Letzte Stunden: ${lo.toFixed(1)} bis ${hi.toFixed(1)} °C`,
    al.length ? al.map(a => `${esc(a.wann)}: ${a.wert.toFixed(1)} °C an ${esc(a.an)}` +
        (a.quittiert ? `, quittiert ${esc(a.quittiert)}` : ', <span class="hl">nicht quittiert</span>') +
        (a.grund ? ` (${esc(a.grund)})` : '')).join('<br>')
      : 'Kein Alarm in diesem Monat.',
  ], [{ t:'Kühlkette', go:'temperatur' }]);
}

function aLieferant(name) {
  const rs = DB.rechnungen.filter(r => r.lief === name);
  const arts = Object.entries(DB.artikel).filter(([, a]) => a.lief === name);
  const offen = rs.filter(r => r.status !== 'ok' && r.status !== 'erledigt');
  const ak = DB.aktionen.filter(a => a.lief === name && !a.genommen);
  return bau(esc(name), [
    `${rs.length} Rechnung${rs.length > 1 ? 'en' : ''} im März, zusammen <b>${chf(rs.reduce((s, r) => s + r.total, 0))}</b>`,
    offen.length ? `<span class="hl">${offen.map(r => r.id + ' — ' +
        (r.status === 'preis' ? 'Preis geändert' : 'Menge stimmt nicht')).join(', ')}</span>` : 'Nichts offen.',
    `Sie kaufen dort: ${arts.map(([, a]) => esc(a.name.split(',')[0])).join(', ')}`,
    ak.length ? `Aktion: ${ak.map(a => kurz(a.art) + ' auf ' + chf(a.neu) + ' bis ' + a.bis).join(', ')}` : '',
  ], [{ t:'Rechnungen', go:'rechnungen' }, ak.length ? { t:'Aktionen', go:'aktionen' } : null].filter(Boolean));
}

function aRechnung(r) {
  const z = r.zeilen.map(l => {
    const a = DB.artikel[l.art];
    const hoch = l.preis > a.vorher, fehlt = l.gel < l.best;
    return `${esc(a.name.split(',')[0])}: ${l.gel} × ${chf(l.preis)}` +
      (hoch ? ` <span class="hl">(${pct((l.preis / a.vorher - 1) * 100)})</span>` : '') +
      (fehlt ? ` <span class="hl">(${l.best} bestellt, ${l.gel} gekommen)</span>` : '');
  });
  const st = { ok:'geprüft, nichts zu tun', preis:'Preis abweichend', menge:'Menge abweichend',
               erledigt:'von Ihnen erledigt' }[r.status];
  return bau(`${esc(r.id)} · ${esc(r.lief)} · ${esc(r.datum)}`,
    [`Total <b>${chf(r.total)}</b> — ${st}`, ...z],
    [{ t:'Rechnungen', go:'rechnungen' }]);
}

function aPerson(p) {
  const b = DB.briefings.filter(x => x.faellig.includes(p.id));
  const dienst = DB.hygiene.filter(h => h.wer === p.name);
  return bau(`${esc(p.name)} · ${esc(p.rolle)}`, [
    `${p.durch} von ${p.total} Modulen durch` + (p.durch < p.total
      ? ` — ${p.total - p.durch} offen` : ' — vollständig'),
    b.length ? `<span class="hl">Fällig: ${b.map(x => esc(x.titel) + ' (' + x.min + ' Min.)').join(', ')}</span>` : 'Kein Briefing fällig.',
    dienst.length ? `Heute abgehakt: ${dienst.map(h => esc(h.was) + ' um ' + h.zeit).join(', ')}` : '',
  ], [{ t:'Schulung', go:'schulung' }]);
}

function aTag(d) {
  const i = DB.woche.indexOf(d), pro = d.gedecke / d.besetzt;
  return bau(`${esc(TAGE[d.tag])}`, [
    `<b>${d.gedecke} Gedecke</b> gebucht, Vorjahr ${d.vj} (${pct((d.gedecke / d.vj - 1) * 100)})`,
    `${d.besetzt} Personen, ${d.stunden} Stunden — ${chf(d.stunden * DB.lohn)} Schichtkosten`,
    `${pro.toFixed(0)} Gedecke pro Person` + (pro > 26 ? ' — <span class="hl">knapp</span>' : ' — tragbar'),
    `Umsatz geplant ${chf(DB.tagesUmsatz[i])}`,
  ], [{ t:'Dienstplan', go:'dienstplan' }]);
}

function aThema(t) {
  const bs = DB.bewertungen.filter(b => b.thema === t.thema);
  return bau(esc(t.thema), [
    `${t.n}× in 30 Tagen genannt, Tendenz ${t.trend === 'up' ? 'steigend' : 'fallend'}`,
    bs.length ? bs.map(b => `${esc(b.quelle)} ${b.sterne}★, ${esc(b.wann)}: «${esc(b.text)}»` +
      ` — Antwort ${b.status}`).join('<br>') : 'Keine einzelne Bewertung dazu im Ausschnitt.',
  ], [{ t:'Bewertungen', go:'bewertungen' }]);
}

/* ── answers about a topic ─────────────────────────────────────────────── */
const ANTWORT = {
  uebersicht() {
    const it = offeneSachen();
    if (!it.length) return bau('Nichts offen', ['Alles, was entschieden werden musste, ist entschieden.']);
    return bau(`${it.length} Sache${it.length > 1 ? 'n' : ''} offen`,
      it.map(i => `<b>${esc(i.was)}</b> <span class="mod">${esc(i.modul)}</span><br>${i.warum}`),
      [...new Set(it.map(i => i.wo))].slice(0, 4).map(w =>
        ({ t: MODULES.find(m => m.id === w).name, go: w })));
  },
  auswertungen() {
