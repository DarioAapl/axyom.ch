/* ── the resolver ──────────────────────────────────────────────────────── */
function frage(text) {
  const q = cnorm(text);
  if (!q) return ANTWORT.hilfe();
  const t = matchThema(q);
  const e = matchEnt(q, chatIndex(), t && KIND_VON[t.id]);
  if (e && e.ties.length && (!t || e.s >= t.s))
    return bau('Das gibt es zweimal', ['Welches meinen Sie?'],
      e.ties.map(x => ({ t: entName(x.kind, x.ref) })));

  // a noun beats a topic word unless the topic word is the more specific hit
  if (e && (!t || e.s >= t.s)) {
    if (e.kind === 'artikel')   return aArtikel(e.ref);
    if (e.kind === 'gericht')   return aGericht(e.ref);
    if (e.kind === 'geraet')    return aGeraet(e.ref);
    if (e.kind === 'lieferant') return aLieferant(e.ref);
    if (e.kind === 'rechnung')  return aRechnung(e.ref);
    if (e.kind === 'person')    return aPerson(e.ref);
    if (e.kind === 'tag')       return aTag(e.ref);
    if (e.kind === 'thema')     return aThema(e.ref);
    if (e.kind === 'betrieb')   return bau(esc(e.ref), [
      'Der Ausschnitt in dieser Demo ist über alle drei Betriebe gerechnet.',
      'Karte: ' + (DB.karte[0].betriebe.includes(e.ref) ? esc(DB.karte[0].name) + ' läuft dort.' : 'nichts Neues dort.'),
    ], [{ t:'Übersicht', go:'uebersicht' }]);
    if (e.kind === 'modul' && ANTWORT[e.ref.id]) return ANTWORT[e.ref.id]();
    if (e.kind === 'modul') return ANTWORT.uebersicht();
  }
  if (t && ANTWORT[t.id]) return ANTWORT[t.id]();

  // nothing recognised: narrow, never empty
  const it = offeneSachen();
  return bau('Dazu finde ich keine eindeutige Zahl', [
    'Fragen Sie nach einem Artikel, einem Gericht, einem Lieferanten, einem Kühlgerät, einer Person, einem Tag oder einer Rechnungsnummer — oder nach einem Modul.',
    it.length ? `Offen ist gerade: ${it.slice(0, 3).map(i => '<b>' + esc(i.was) + '</b>').join(', ')}.` : '',
  ], [{ t:'Was ist offen?' }, { t:'Zahlen der Woche' }, { t:'Marge pro Gericht' },
      { t:'Wie kalt ist der Tiefkühler?' }]);
}

/* ── panel ─────────────────────────────────────────────────────────────── */
function chatRender() {
  const log = $('#chat-log');
  if (!log) return;
  log.innerHTML = CHAT.verlauf.map(m => m.r === 'u'
    ? `<div class="msg u">${esc(m.t)}</div>`
    : `<div class="msg b">${m.t}</div>`).join('') +
    (CHAT.denkt ? '<div class="msg b tipp"><i></i><i></i><i></i></div>' : '');
  log.scrollTop = log.scrollHeight;
}

function chatOeffnen(auf) {
  CHAT.offen = auf ?? !CHAT.offen;
  $('#chat').classList.toggle('on', CHAT.offen);
  $('#chatbtn').classList.toggle('weg', CHAT.offen);
  if (CHAT.offen) {
    if (!CHAT.verlauf.length) { CHAT.verlauf.push({ r:'b', t: ANTWORT.hilfe() }); }
    chatRender(); setTimeout(() => $('#chat-in').focus(), 60);
  }
}

let chatTimer;
function chatFragen(text) {
  const t = text.trim();
  if (!t) return;
  CHAT.verlauf.push({ r:'u', t });
  CHAT.denkt = true; chatRender();
  clearTimeout(chatTimer);
  // a short beat, so an answer reads as an answer and not as a page swap
  chatTimer = setTimeout(() => {
    CHAT.denkt = false;
    CHAT.verlauf.push({ r:'b', t: frage(t) });
    chatRender();
  }, 260);
}

document.addEventListener('click', e => {
  if (e.target.closest('#chatbtn')) return chatOeffnen(true);
  if (e.target.closest('#chat-zu')) return chatOeffnen(false);
  const ask = e.target.closest('#chat [data-ask]');
  if (ask) { chatFragen(ask.dataset.ask); return; }
  const send = e.target.closest('#chat-send');
  if (send) { const i = $('#chat-in'); chatFragen(i.value); i.value = ''; i.focus(); return; }
  // a jump out of the chat should show the screen it jumped to
  if (e.target.closest('#chat [data-go]')) chatOeffnen(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'chat-in') {
    chatFragen(e.target.value); e.target.value = '';
  }
  if (e.key === 'Escape' && CHAT.offen) chatOeffnen(false);
});
/* ── actions ────────────────────────────────────────────────────────────────
   Each one mutates DB and re-renders. The cross-module consequences are the
   interesting part and are called out in the toast, because in a live demo
   nobody notices a margin moving two screens away unless you say so.
   ────────────────────────────────────────────────────────────────────────── */
const ACTIONS = {
  'preis-uebernehmen'(el) {
    const key = el.dataset.art, neu = +el.dataset.neu, a = DB.artikel[key];
    const vor = DB.gerichte.map(g => ({ id: g.id, m: marge(g) }));
    a.vorher = a.preis; a.preis = neu;
    DB.rechnungen.find(r => r.id === OFFEN).status = 'erledigt';
    const nach = DB.gerichte.map(g => marge(g));
    const worst = DB.gerichte.map((g, i) => ({ g, d: nach[i] - vor[i].m }))
      .sort((x, y) => x.d - y.d)[0];
    logge(`${a.name.split(',')[0]} auf ${chf(neu)} übernommen — Marge ${esc(worst.g.name)} ${pct(worst.d)}`);
    toast(`Preis übernommen. <b>${esc(worst.g.name)}</b> verliert ${Math.abs(worst.d).toFixed(1)} Punkte Marge — ` +
          `nachzusehen in Gerichten.`);
  },
  'preis-nachfragen'() {
    toast('Nachfrage vorbereitet. Die Rechnung bleibt offen, bis der Lieferant antwortet.');
    logge('Preisänderung beim Lieferanten nachgefragt');
  },
  'menge-kuerzen'(el) {
    const r = DB.rechnungen.find(x => x.id === el.dataset.inv);
    const diff = +el.dataset.diff;
    r.total -= diff; r.status = 'erledigt';
    r.zeilen.forEach(z => { if (z.gel < z.best) z.best = z.gel; });
    logge(`${r.id} um ${chf(diff)} gekürzt — nicht gelieferte Position entfernt`);
    toast(`Rechnung auf <b>${chf(r.total)}</b> gekürzt. ${chf(diff)} verlassen Ihr Konto nicht.`);
  },
  'aktion-nehmen'(el) {
    const a = DB.aktionen.find(x => x.id === el.dataset.id);
    a.genommen = true;
    const art = DB.artikel[a.art];
    const spart = (art.preis - a.neu) / art.menge * a.monat;
    logge(`Aktion ${art.name.split(',')[0]} übernommen — ${chf(spart)} bei üblicher Menge`);
    toast(`Auf die Bestellliste. Bei Ihrer üblichen Menge sind das <b>${chf(spart)}</b>.`);
  },
  'haccp-export'() {
    const n = DB.hygiene.filter(h => h.done).length;
    toast(`Nachweis März erzeugt — ${DB.hygieneMonat} Einträge, jeder mit Name und Uhrzeit. ` +
          `(In der Demo wird keine Datei geschrieben.)`);
    logge(`HACCP-Nachweis exportiert (${n} Kontrollen heute)`);
  },
  'tuer-offen'(el) {
    const g = DB.geraete.find(x => x.id === el.dataset.id);
    g.temp = +(g.max + 2.8).toFixed(1);
    // the curve has to show it too, or the widget contradicts the number
    g.verlauf = g.verlauf.slice(3).concat([g.max + 0.9, g.max + 1.8, g.temp]);
    DB.alarme.unshift({ geraet: g.name, wann: DB.today + ' ' + new Date().toLocaleTimeString('de-CH').slice(0, 5),
      wert: g.temp, an: DB.user, quittiert: '', grund: 'Tür offen (Demo)' });
    logge(`${g.name} aus dem Bereich gelaufen — Alarm an ${DB.user}`);
    toast(`<b>${esc(g.name)}</b> bei ${g.temp.toFixed(1)} °C. Meldung an ${esc(DB.user)} ` +
          `— und an die nächste Person, wenn niemand quittiert.`);
  },
  'alarm-quittieren'(el) {
    const g = DB.geraete.find(x => x.id === el.dataset.id);
    g.temp = +((g.min + g.max) / 2).toFixed(1);
    g.verlauf = g.verlauf.slice(2).concat([+(g.max - 0.3).toFixed(2), g.temp]);
    const a = DB.alarme.find(x => x.geraet === g.name && !x.quittiert);
    if (a) a.quittiert = new Date().toLocaleTimeString('de-CH').slice(0, 5);
    logge(`Alarm ${g.name} quittiert — Gerät wieder im Bereich`);
    toast('Quittiert. Der Eintrag bleibt im Protokoll — dieselbe Aufzeichnung ist der HACCP-Nachweis.');
  },
  'brief-senden'(el) {
    const b = DB.briefings.find(x => x.id === el.dataset.id);
    const namen = b.faellig.map(id => DB.leute.find(p => p.id === id));
    namen.forEach(p => { if (p.durch < p.total) p.durch++; });
    b.faellig = [];
    logge(`Briefing «${b.titel}» an ${namen.map(p => p.name).join(', ')} gesendet`);
    toast(`«${esc(b.titel)}» an ${esc(namen.map(p => p.name).join(' und '))} — ${b.min} Minuten am Handy.`);
  },
  'karte-freigeben'() {
    const k = DB.karte[0];
    const n = k.ziele.filter(z => z.status === 'wartet').length;
    k.ziele.forEach(z => { if (z.status === 'wartet') z.status = 'publiziert'; });
    logge(`${esc(k.name)} auf ${n} Gästekanälen freigegeben`);
    toast(`Freigegeben. ${n} Kanäle sind jetzt gleich — und der Beitrag dazu wartet in Social Media.`);
  },
  'post-freigeben'(el) {
    const p = DB.posts.find(x => x.id === el.dataset.id);
    p.status = 'freigegeben';
    logge(`Beitrag «${p.titel}» freigegeben (${p.kanal}, ${p.wann})`);
    toast(`Freigegeben. Geht ${esc(p.wann)} auf ${esc(p.kanal)} raus.`);
  },
  'post-verwerfen'(el) {
    const p = DB.posts.find(x => x.id === el.dataset.id);
    DB.posts = DB.posts.filter(x => x.id !== p.id);
    logge(`Beitrag «${p.titel}» verworfen`);
    toast('Verworfen. Nichts wird ohne Ihre Freigabe publiziert.');
  },
  'antwort-senden'(el) {
    const b = DB.bewertungen.find(x => x.id === el.dataset.id);
    b.status = 'gesendet';
    DB.bewBeantwortet = Math.min(DB.bewMonat, DB.bewBeantwortet + 1);
    logge(`Antwort auf ${b.quelle}-Bewertung (${b.thema}) gesendet`);
    toast(`Gesendet — in der Sprache, in der der Gast geschrieben hat. ` +
          `Beantwortet: <b>${DB.bewBeantwortet} von ${DB.bewMonat}</b>.`);
  },
  'antwort-ignorieren'(el) {
    const b = DB.bewertungen.find(x => x.id === el.dataset.id);
    b.status = 'ignoriert';
    logge(`Bewertung (${b.thema}) ignoriert`);
    toast('Ignoriert. Der Entwurf bleibt, falls Sie es sich anders überlegen.');
  },
};

/* ── one delegated listener for the whole app ───────────────────────────── */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { AKTIV = go.dataset.go; OFFEN = null; render(); return; }

  const inv = e.target.closest('[data-inv]');
  if (inv && !e.target.closest('[data-act]')) {
    OFFEN = OFFEN === inv.dataset.inv ? null : inv.dataset.inv; render(); return;
  }

  const chk = e.target.closest('[data-check]');
  if (chk) {
    const h = DB.hygiene.find(x => x.id === chk.dataset.check);
    h.done = !h.done;
    if (h.done) {
      h.wer = DB.user; h.zeit = new Date().toLocaleTimeString('de-CH').slice(0, 5);
      DB.hygieneMonat++;
      logge(`${h.station} · ${h.was} abgehakt`);
      toast(`Abgehakt — mit <b>${esc(DB.user)}</b> und ${h.zeit} im Protokoll. ` +
            `Das ist der Nachweis, nichts wird zweimal aufgeschrieben.`);
    } else { h.wer = ''; h.zeit = ''; }
    render(); return;
  }

  const act = e.target.closest('[data-act]');
  if (act && ACTIONS[act.dataset.act]) { ACTIONS[act.dataset.act](act); render(); }
});

document.addEventListener('input', e => {
  const c = e.target.closest('[data-count]');
  if (c) { DB.lager.find(l => l.art === c.dataset.count).gezaehlt = +c.value || 0;
           const v = $('#view'); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const k = e.target.closest('[data-karte]');
  if (k) { const g = DB.gerichte.find(x => x.id === k.dataset.karte); g.karte = +k.value || g.karte;
           const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const kp = e.target.closest('[data-kartepreis]');
  if (kp) { DB.karte[0].preis = +kp.value || DB.karte[0].preis;
            const y = window.scrollY; render(); window.scrollTo(0, y); }
});

document.addEventListener('change', e => {
  const s = e.target.closest('[data-shift]');
  if (s) {
    const d = DB.woche.find(x => x.tag === s.dataset.shift);
    d.besetzt = +s.value; d.stunden = d.besetzt * 8;
    logge(`${d.tag}: Besetzung auf ${d.besetzt} geändert`);
    render();
  }
});

render();
</script>
</body>
</html>
