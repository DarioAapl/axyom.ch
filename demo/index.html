<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is public but unlisted: noindex keeps it out of search results so
     it cannot compete with axyom.ch. Deliberately NOT blocked in robots.txt —
     a blocked crawler never reads this tag, and the URL can still get listed. -->
<meta name="robots" content="noindex, nofollow">
<title>Axyom — Demo</title>
<style>
:root{
  --ink:#1d1d1f; --dim:#6e6e73; --soft:rgba(0,0,0,.08); --line:rgba(0,0,0,.13);
  --acc:#00b2a0; --acci:#007a6e; --wash:rgba(0,178,160,.10);
  --dark:#0b0d12; --surf:#f5f5f7; --warn:#b25e00; --warnbg:rgba(178,94,0,.10);
  --ok:#007a6e; --okbg:rgba(0,178,160,.12);
  /* Three levels, the ones the data already carries: ernst 3 = jetzt (rot),
     2 = heute (gelb), 1 = kann warten (grün). Amber alone had to mean both
     «a fridge is running warm» and «a post is waiting for approval». */
  --bad:#c02a17; --badbg:rgba(192,42,23,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--surf);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}

/* ── rail ── */
#rail{width:210px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;
      padding:18px 12px;position:sticky;top:0;height:100vh}
/* the real mark, inlined: the demo makes no network call, so it cannot fetch
   a logo file — and an SVG stays sharp on a projector */
#rail .brand{display:flex;align-items:flex-end;gap:8px;padding:2px 8px 16px}
#rail .brand .logo{width:106px;height:auto;flex:none;display:block}
/* the X reaches below the wordmark's baseline, so «ops» is lifted to sit on
   the letters rather than on the spike */
#rail .brand span{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.04em;
  position:relative;bottom:11px}
#rail nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
#rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
        color:rgba(255,255,255,.58);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer}
#rail a .ic{width:16px;height:16px;flex:none;opacity:.62}
#rail a:hover{color:#fff;background:rgba(255,255,255,.05)}
#rail a.on{background:rgba(0,178,160,.16);color:#fff;font-weight:650}
#rail a.on .ic{opacity:1;color:var(--acc)}
#rail a:hover .ic{opacity:.9}
#rail a .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--warn);color:#fff;
        border-radius:99px;padding:1px 6px}
#rail a .badge.s3{background:var(--bad)}
#rail a .badge.s2{background:var(--warn)}
#rail a .badge.s1{background:var(--acc);color:#04211e}
#rail .outlets{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);
        font-size:11px;line-height:1.7;color:rgba(255,255,255,.4)}
#rail .outlets b{display:block;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:3px}

/* ── main ── */
main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
header{padding:20px 28px 16px;border-bottom:1px solid var(--soft);display:flex;
       align-items:flex-end;justify-content:space-between;gap:20px;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
header .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
#hilfe-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;flex:none;
  line-height:1;padding:0;position:relative;top:1px}
#hilfe-btn:hover{border-color:var(--acc);color:var(--acci);background:var(--wash)}
.hilfeliste{margin:0;padding-left:19px}
.hilfeliste li{font-size:11.5px;line-height:1.55;padding:4px 0 4px 2px;color:rgba(255,255,255,.88)}
.hilfeliste li::marker{font-weight:700;color:var(--acc)}
header .demo{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
       color:var(--acci);background:var(--wash);padding:5px 9px;border-radius:6px;white-space:nowrap}
.body{padding:22px 28px 40px;flex:1}

/* ── bits ── */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
   text-align:left;padding:0 10px 9px;white-space:nowrap}
td{font-size:13px;padding:11px 10px;border-top:1px solid var(--soft);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(0,0,0,.02)}
th.r,td.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
     padding:3px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.t-ok{color:var(--ok);background:var(--okbg)}
.t-warn{color:var(--warn);background:var(--warnbg)}
.t-mute{color:var(--dim);background:rgba(0,0,0,.05)}
.t-bad{color:var(--bad);background:var(--badbg)}
.card{background:#fff;border:1px solid var(--soft);border-radius:12px;padding:16px 18px}
.card.tint{background:var(--surf)}
.card.warn{background:rgba(178,94,0,.04);border-color:rgba(178,94,0,.22)}
.card.good{background:rgba(0,178,160,.05);border-color:rgba(0,178,160,.28)}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi .n{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.kpi .d{font-size:11.5px;color:var(--dim);margin-top:4px}
.btn{font-size:12.5px;font-weight:650;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
     background:#fff;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--surf)}
.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.solid:hover{background:#000}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.acc:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
/* a trigger for the presentation, not a function of the product — it must not
   look like the buttons that actually do something */
.btn.demo{border-style:dashed;color:var(--dim);font-weight:600}
.btn.demo:hover{color:var(--ink)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
     margin:26px 0 11px}
.sec:first-child{margin-top:0}
/* a heading that carries tabs and a sentence has to be allowed to wrap, or it
   pushes a phone sideways */
.sec > span{min-width:0}
.muted{color:var(--dim)}
.small{font-size:12px}
.bar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(0,0,0,.22);cursor:pointer;
       display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.check.on{background:var(--acc);border-color:var(--acc)}
.check svg{display:none}.check.on svg{display:block}
.link{color:var(--acci);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ── the filter bar (Rechnungen) ───────────────────────────────────────────
   Six dropdowns and a free-text field, all combinable, with the result line
   adding up whatever is selected.
   ────────────────────────────────────────────────────────────────────────── */
.rfilterbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;
  padding:14px 16px;background:var(--surf);border:1px solid var(--soft);border-radius:12px;
  margin-bottom:14px}
.rfilter{display:flex;flex-direction:column;gap:5px;min-width:0}
.rfilter > span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim)}
.rfilter select,.rfilter input{font-size:12.5px;padding:7px 9px;max-width:100%}
/* a filter that is doing something says so */
.rfilter.an > span{color:var(--acci)}
.rfilter.an select,.rfilter.an input{border-color:var(--acc);background:var(--okbg);
  color:var(--acci);font-weight:650;box-shadow:0 0 0 2px rgba(0,178,160,.10)}
.rerg{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;font-size:12.5px;
  padding:0 2px 14px}
.rerg b{font-size:15px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card.kontext{margin-bottom:14px;background:var(--wash);border-color:rgba(0,178,160,.28)}
.kzahlen{display:flex;flex-wrap:wrap;gap:10px 34px}
.kschritte{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(0,178,160,.22)}
.ks{display:flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--soft);
  border-radius:8px;padding:6px 10px}
.ksd{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.ksp{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ksv{font-size:10.5px;font-weight:650;color:var(--dim)}
.ksv.hoch{color:var(--warn)}
.ksv.tief{color:var(--acci)}
@media (max-width:820px){ .rfilter{flex:1 1 140px} }

/* ── an invoice as the document it is ──────────────────────────────────────
   A customer asks «und wie sieht das aus, wenn es reinkommt?» — this is the
   answer: the supplier's paper, beside what Axyom read out of it.
   ────────────────────────────────────────────────────────────────────────── */
/* the opened row and its document read as one thing */
tr.gewaehlt td{background:var(--wash);border-bottom-color:transparent}
tr.gewaehlt td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
tr.detailzeile > td{padding:0 0 18px;background:var(--wash);
  box-shadow:inset 3px 0 0 var(--acc)}
.detailkopf{display:flex;align-items:baseline;gap:10px;padding:2px 16px 12px;font-size:12.5px}
/* die Rechnung hinter «Erwartet» */
.lrechnung{padding:0 16px}
.lz{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-top:1px solid rgba(0,0,0,.06)}
.lz:first-child{border-top:none}
.lz .ln{flex:0 0 250px;font-size:12.5px}
.lz .lv{flex:0 0 110px;text-align:right;font-size:13px;font-weight:650;
  font-variant-numeric:tabular-nums}
.lz .lh{flex:1;min-width:0;font-size:11px;color:var(--dim)}
.lz.summe{border-top:1px solid rgba(0,0,0,.18)}
.lz.summe .ln,.lz.summe .lv{font-weight:800}
@media (max-width:820px){ .lz{flex-wrap:wrap} .lz .ln{flex:1 1 60%} .lz .lh{flex:1 1 100%} }
.detailkopf .dpfeil{color:var(--acc);font-weight:700}
.detailkopf .muted{font-size:11.5px}
.dokzeile{display:flex;gap:16px;align-items:flex-start;padding:0 16px;min-width:0}
.rdoc{flex:1 1 560px;min-width:0;background:#fffefb;border:1px solid var(--line);border-radius:6px;
  padding:26px 28px;font-size:12px;line-height:1.55;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.rdpruef{flex:0 1 300px;min-width:0}
.rdkopf{display:flex;justify-content:space-between;gap:24px;padding-bottom:18px;
  border-bottom:1px solid rgba(0,0,0,.1)}
.rdkopf b{font-size:13px}
.rdmeta{text-align:right;flex:none}
.rdmeta div{display:flex;gap:12px;justify-content:flex-end;font-size:11.5px}
.rdmeta span{color:var(--dim)}
.rdan{margin:18px 0 22px;font-size:12px}
.rdtab{width:100%;border-collapse:collapse}
.rdtab th{font-size:10px;letter-spacing:.04em;padding:0 8px 7px;border-bottom:1px solid rgba(0,0,0,.12)}
.rdtab td{font-size:12px;padding:8px;border-bottom:1px solid rgba(0,0,0,.06)}
.rdtab tr.rdwarn td{background:rgba(178,94,0,.06)}
.rdklein{font-size:10px;color:var(--warn);font-weight:600;margin-top:2px}
tr.gewaehlt td{background:var(--wash)}
.rdsumme{margin-top:16px;margin-left:auto;width:250px}
.rdsumme div{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.rdsumme .tot{border-top:1px solid rgba(0,0,0,.2);margin-top:5px;padding-top:7px;font-size:13.5px}
.rdsumme .tot b{font-weight:800}
.rdfuss{margin-top:22px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);font-size:10.5px;
  color:var(--dim)}
.rdpruef .pz{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.5;padding:4px 0}
.rdpruef .pj{color:var(--acci);font-weight:700;flex:none}
@media (max-width:1100px){ .dokzeile{flex-direction:column} .rdpruef{flex:1 1 auto;width:100%} }

/* ── the weekly report ─────────────────────────────────────────────────────
   Four stacked blocks of numbers answered «what happened» and nothing else.
   The page now runs in the order the questions come: what is left, where the
   franc went, how it was earned, how that compares, what comes next, what to
   do. Every figure appears once.
   ────────────────────────────────────────────────────────────────────────── */
.wkopf{display:flex;gap:12px;align-items:stretch;margin-bottom:22px}
.wkopf .bleibt{flex:0 0 340px}
.wkopf .hin{flex:1;min-width:0}
.gross{font-size:34px;font-weight:700;letter-spacing:-.028em;line-height:1.05;margin-top:6px}
.rappen{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.5}
.wbar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:4px 0 12px}
.wbar i{display:block}
.wleg{display:flex;flex-wrap:wrap;gap:8px 20px}
.wleg > div{display:flex;align-items:baseline;gap:7px;font-size:12px}
.wleg .pt{width:9px;height:9px;border-radius:3px;flex:none;align-self:center}
.wleg b{font-variant-numeric:tabular-nums}
.bm{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:5px;white-space:nowrap}
.bm.gut{color:var(--acci);background:var(--okbg)}
.bm.ok{color:var(--dim);background:rgba(0,0,0,.05)}
.bm.hoch{color:var(--warn);background:var(--warnbg)}
.wf{border:1px solid var(--soft);border-radius:12px;overflow:hidden}
.wf .z{display:flex;align-items:baseline;gap:14px;padding:10px 16px;border-top:1px solid var(--soft)}
.wf .z:first-child{border-top:none}
.wf .z .nm{flex:1;min-width:0;font-size:13px}
.wf .z .wert{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right;
  flex:0 0 132px}
.wf .z .hint{font-size:11.5px;color:var(--dim);flex:0 0 240px;text-align:right;
  display:flex;gap:7px;justify-content:flex-end;align-items:center}
.wf .z.sub{background:var(--surf)}
.wf .z.sub .nm{padding-left:20px;font-size:12px;color:var(--dim)}
.wf .z.sub .wert{font-weight:500;color:var(--dim)}
.wf .z.summe{background:var(--wash)}
.wf .z.summe .nm{font-weight:700}
.wf .z.summe .wert{font-weight:800}
.wf .z.ab .wert{color:var(--warn)}
@media (max-width:900px){ .wkopf{flex-direction:column} .wkopf .bleibt{flex:1 1 auto}
  .wf .z{flex-wrap:wrap} .wf .z .hint{flex:1 1 100%;justify-content:flex-start;text-align:left} }

/* ── tabs, and the month calendar (Social Media) ───────────────────────────
   Two views over the same posts. A post is edited where it was clicked, so
   the calendar never becomes a second list that has to be kept in step.
   ────────────────────────────────────────────────────────────────────────── */
/* one line, cut with an ellipsis — nowrap text in a table cell otherwise sets
   the cell's min-content to the whole sentence and pushes the page sideways */
.zeile1{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a seven-column report table cannot fit a phone: it scrolls inside its own
   box rather than pushing the page sideways */
/* the trend belongs beside the numbers, not stretched across the page: a
   six-point line over 1174px reads as a flat ribbon */
.verlaufkopf{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
.verlaufkopf .vstats{flex:1;min-width:0}
.verlaufkopf .vchart{flex:0 1 340px;min-width:250px;display:flex;flex-direction:column;
  justify-content:center}
.vstatrow{display:flex;gap:34px;flex-wrap:wrap}
.vstat .vk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.vstat .vl2{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  margin-top:4px}
.vstat .vn{font-size:11.5px;font-weight:650;margin-top:2px}
/* the two cards stop fitting side by side well before the phone breakpoint:
   at 900px the row overflowed by 38px */
@media (max-width:1040px){ .verlaufkopf{flex-direction:column} .verlaufkopf .vchart{flex:1 1 auto} }
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* min-content, not a fixed width: a two-column table then still fills the box
   while a seven-column one scrolls instead of squeezing into unreadable columns */
.scrollx table{min-width:min-content}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{font-size:12.5px;font-weight:650;padding:7px 14px;border-radius:9px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-family:inherit;color:var(--dim)}
.tab:hover{background:var(--surf)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kkopf,.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kkopf{margin-bottom:6px}
.kkopf div{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);padding-left:2px}
/* grid tracks size to min-content by default, and a nowrap chip like
   «11:00 Instagram» made every day column 109px wide — seven of those do not
   fit a 900px window. min-width:0 lets the chip ellipsise instead. */
.kgrid > *{min-width:0}
.ktag{border:1px solid var(--soft);border-radius:9px;background:#fff;padding:6px;min-height:78px;
  overflow:hidden}
.ktag.leer{background:transparent;border-color:transparent}
.ktag.heute{border-color:var(--acc);background:rgba(0,178,160,.04)}
.knr{font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:5px;display:flex;
  align-items:baseline;gap:5px}
.kheute{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acci)}
.kpost{display:block;width:100%;text-align:left;font-family:inherit;font-size:10px;font-weight:600;
  line-height:1.3;padding:4px 6px;border-radius:6px;margin-bottom:3px;cursor:pointer;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpost .kzeit{font-variant-numeric:tabular-nums;opacity:.75}
.kpost.entwurf{background:var(--warnbg);color:var(--warn)}
.kpost.freigegeben{background:var(--okbg);color:var(--acci)}
.kpost.publiziert{background:rgba(0,0,0,.045);color:var(--dim)}
.kpost:hover{filter:brightness(.97)}
.kpost.gewaehlt{border-color:currentColor}
/* eine Zählung im Kalender */
.ktag.gezaehlt{border-color:var(--line)}
.zpost{display:block;width:100%;text-align:left;font-family:inherit;font-size:10.5px;font-weight:650;
  line-height:1.3;padding:5px 7px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.zpost.ok{background:var(--okbg);color:var(--acci)}
.zpost.auff{background:var(--warnbg);color:var(--warn)}
.zpost.gewaehlt{border-color:currentColor}
.zpost:hover{filter:brightness(.97)}
.klegende{display:flex;gap:16px;align-items:center;margin-top:11px;font-size:10.5px;color:var(--dim);
  flex-wrap:wrap}
.klegende i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;
  vertical-align:-1px}
.klegende i.entwurf{background:var(--warn)}
.klegende i.freigegeben{background:var(--acc)}
.klegende i.publiziert{background:rgba(0,0,0,.18)}
@media (max-width:820px){ .kkopf{display:none}
  .kgrid{grid-template-columns:1fr} .ktag.leer{display:none} .ktag{min-height:0} }

/* ── the traffic light (Übersicht) ─────────────────────────────────────────
   Three lamps over the same severity the rest of the app uses: a lamp is lit
   and carries a count only when something is actually waiting at that level,
   so a dark lamp means nothing to do rather than «no data».
   ────────────────────────────────────────────────────────────────────────── */
/* the master indicator: one band across the top of the Übersicht */
.ampel{display:flex;align-items:center;gap:6px;background:var(--dark);border-radius:12px;
  padding:10px 14px;color:#fff}
/* a translucent 19px circle on a dark band is invisible in a demo: this one
   has to be findable by someone who has never seen the screen */
.ampel .frage{height:23px;border-radius:99px;border:1px solid rgba(255,255,255,.34);
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.82);font-family:inherit;font-size:11px;
  font-weight:650;line-height:1;padding:0 10px;cursor:pointer;flex:none;align-self:center;
  margin-left:4px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ampel .frage b{font-size:12px;font-weight:700;color:var(--acc)}
.ampel .frage:hover{border-color:var(--acc);color:#fff;background:rgba(0,178,160,.18)}
@media (max-width:700px){ .ampel .frage span{display:none} .ampel .frage{padding:0 7px} }
.ampel .trenn{width:1px;align-self:stretch;background:rgba(255,255,255,.12);margin:0 12px}
/* the flying hint */
.flug{position:fixed;z-index:70;background:var(--dark);color:#fff;border-radius:12px;
  padding:12px 14px;box-shadow:0 14px 38px rgba(0,0,0,.32);font-size:11.5px;line-height:1.55;
  opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s}
.flug.gross{padding:14px 16px}
.flug .fk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--acc);margin-bottom:9px}
.flug .fu{font-size:10px;color:rgba(255,255,255,.38);margin-top:10px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.1)}
.flug.da{opacity:1;transform:translateY(0)}
.flug.weg{opacity:0;transition:opacity 1.4s ease-in}
.flug.schnell{opacity:0;transform:translateY(-4px);transition:opacity .13s,transform .13s}
.flug b{color:#fff;font-weight:650}
.flug .fz{display:flex;gap:9px;align-items:flex-start;padding:3px 0}
.flug .fp{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
.ampel .jetzt{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.ampel .jetzt .was{min-width:0}
.ampel .jetzt b{font-size:13px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ampel .jetzt .why{font-size:10.5px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ampel .hin{margin-left:auto;flex:none;font-size:11.5px;font-weight:650;color:var(--acc);cursor:pointer;
  white-space:nowrap}
.ampel .hin:hover{filter:brightness(1.15)}
/* the band must be able to shrink: flex-basis:100% with shrink:0 made it wider
   than the phone it was sitting on, which pushed the whole page sideways */
.dash > *{min-width:0}
.ampel{min-width:0}
@media (max-width:900px){ .ampel{flex-wrap:wrap} .ampel .trenn{display:none}
  .ampel .jetzt{flex:1 1 100%;min-width:0;margin-top:8px} }
@media (max-width:560px){ .lampe .txt{display:none} .lampe{margin-right:10px}
  .ampel .hin{font-size:11px} }
/* lamp label beside the glass, not under it: three rows of text would make
   this tile taller than the column it has to fit into */
.lampe{display:flex;align-items:center;gap:7px;border:none;background:none;
  font-family:inherit;padding:0;margin-right:14px}
.lampe.an{cursor:pointer}
.lampe .glas{width:30px;height:30px;flex:none;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);color:transparent}
.lampe .txt{font-size:8.5px;text-align:left;line-height:1.2;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.3);white-space:nowrap}
.lampe.an .txt{color:rgba(255,255,255,.78)}
.lampe.an .glas{border-color:transparent;color:#fff}
.lampe.an.r .glas{background:var(--bad);box-shadow:0 0 0 3px rgba(192,42,23,.24)}
.lampe.an.y .glas{background:#cf7c1f;box-shadow:0 0 0 3px rgba(207,124,31,.22)}
.lampe.an.g .glas{background:var(--acc);color:#04211e;box-shadow:0 0 0 3px rgba(0,178,160,.22)}
.lampe.an:hover .glas{filter:brightness(1.1)}

/* ── post previews (Social Media) ──────────────────────────────────────────
   A draft is judged by how it will look, so each one is drawn in the shape of
   its channel — square for a feed post, 9:16 for a story, 16:9 for Facebook —
   with the caption, the hashtags and the alt text that go with it.
   ────────────────────────────────────────────────────────────────────────── */
.posts{display:flex;flex-direction:column;gap:14px}
.post{display:grid;grid-template-columns:226px 1fr;gap:20px;align-items:start}
.pv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pv .pvkopf{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surf);
  border-bottom:1px solid var(--soft);font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim)}
.pv .pvbild{background:linear-gradient(135deg,#cfe9e3,#8ed2c5 55%,#d8e9ae)}
.pv.ig .pvbild{aspect-ratio:1/1}
/* a story canvas is 9:16 — centred in the card rather than hugging one edge */
.pv.story .pvbild{aspect-ratio:9/16;max-height:260px;margin:9px auto;border-radius:10px}
.pv.fb .pvbild{aspect-ratio:16/9}
.pv .pvtext{padding:9px 11px;font-size:11.5px;line-height:1.5}
.pv .pvtags{color:var(--acci);font-size:11px;margin-top:6px;word-break:break-word}
.pv .pvalt{padding:0 11px 9px;font-size:9.5px;color:var(--dim);line-height:1.4}
.pv.story .pvbild{position:relative;display:flex;align-items:flex-end}
.pvoverlay{padding:10px 11px;color:#fff;font-size:11.5px;font-weight:650;line-height:1.4;
  text-shadow:0 1px 8px rgba(0,0,0,.45)}
.pvoverlay b{font-weight:800}
.pfeld{margin-bottom:10px}
.pfeld > label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pfeld textarea{width:100%;resize:vertical;line-height:1.55;min-height:62px}
.pfeld input[type=text]{width:100%}
/* the picture field: a real file picker and a real drop target. The file is
   read in the browser and never leaves it — the demo makes no network call. */
.bildzeile{display:flex;gap:10px;align-items:stretch}
.dropzone{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;
  border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;
  color:var(--dim);cursor:pointer;background:#fff}
.dropzone:hover{border-color:var(--acc);color:var(--acci)}
.dropzone.drauf{border-color:var(--acc);background:var(--wash);color:var(--acci)}
.dropzone b{color:var(--ink);font-weight:650}
.dropzone .klein{font-size:10px}
.pvbild.hat{background-size:cover;background-position:center}
.anlass{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--acci);
  background:var(--wash);border-radius:6px;padding:4px 8px}
.woche7{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:20px}
.woche7 .t7{border:1px solid var(--soft);border-radius:9px;padding:8px 9px;min-height:72px;background:#fff}
.woche7 .t7 .d7{font-size:10px;font-weight:700;color:var(--dim);margin-bottom:5px}
.woche7 .t7 .p7{font-size:10.5px;line-height:1.35;padding:4px 6px;border-radius:6px;
  background:var(--warnbg);color:var(--warn);font-weight:600;margin-bottom:4px}
.woche7 .t7 .p7.frei{background:var(--okbg);color:var(--acci)}
@media (max-width:900px){ .post{grid-template-columns:1fr} .woche7{grid-template-columns:repeat(3,1fr)} }

/* ── channel previews (Inhalte) ────────────────────────────────────────────
   A status table can only claim that the channels disagree. These render what
   each channel currently shows, so one that has not been released proves it
   with the old price on screen.
   ────────────────────────────────────────────────────────────────────────── */
.kanaele{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kanal{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.kanal.alt{border-color:rgba(178,94,0,.35)}
.kanal .kopf{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--surf);
  border-bottom:1px solid var(--soft);font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim)}
.kanal .kopf .tag{margin-left:auto}
.kanal .inhalt{padding:11px 12px;display:flex;flex-direction:column;flex:1}
.kanal .stale{color:var(--warn);font-size:10.5px;font-weight:600;margin-top:auto;
  padding-top:9px;border-top:1px solid var(--soft)}
.mock-url{display:flex;align-items:center;gap:5px;background:var(--surf);border-radius:6px;
  padding:4px 7px;font-size:9.5px;color:var(--dim);margin-bottom:10px}
.mock-url i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.16);flex:none}
.mock-h{font-size:13px;font-weight:700;letter-spacing:-.01em}
.mock-p{font-size:11px;color:var(--dim);line-height:1.5;margin-top:3px}
.mock-preis{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mock-zeile{display:flex;align-items:baseline;gap:6px;margin-top:7px}
.mock-fuell{flex:1;border-bottom:1px dotted rgba(0,0,0,.28);transform:translateY(-3px)}
.mock-paper{background:#fffdf6;border:1px solid rgba(0,0,0,.08);border-radius:4px;padding:11px 12px;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mock-paper .kl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.mock-bild{height:56px;border-radius:8px;margin-bottom:9px;
  background:linear-gradient(135deg,#cfe9e3,#8ed2c5 55%,#d8e9ae)}
.mock-mail{border-left:3px solid var(--acc);padding-left:10px}
.mock-res{border:1px solid var(--soft);border-radius:8px;padding:9px 10px}
.mock-res .dat{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--acci);margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
       border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--wash);border-color:var(--acc)}

/* ── dashboard: a packing grid, not equal-height rows ─────────────────────
   align-items:start is the whole trick — without it every card stretches to
   the tallest sibling in its row and the short ones end up half empty.
   ────────────────────────────────────────────────────────────────────────── */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:start}
.dash .card{padding:12px 14px}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}
.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}
.w8{grid-column:span 8}.w12{grid-column:span 12}
.wl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;
    align-items:baseline;gap:8px}
.wl .r2{letter-spacing:0;text-transform:none;font-weight:600;font-size:10.5px}
.big{font-size:21px;font-weight:700;letter-spacing:-.022em;line-height:1.05}
.sm2{font-size:10.5px;color:var(--dim);margin-top:2px}
/* one row = label, chart, value. Five of these fit where one old card did. */
.mini{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.mini .nm{font-size:11.5px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
.mini .ch{flex:0 0 96px}
.mini .vl{font-size:11.5px;font-weight:650;flex:0 0 76px;text-align:right;white-space:nowrap;
          font-variant-numeric:tabular-nums}
/* long labels do not fit beside a bar in a third of the width, so the bar
   widgets put the name and the value on their own line and the bar beneath */
.mini2{padding:3px 0}
.mini2 .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.mini2 .nm2{font-size:11.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini2 .vl2{font-size:11.5px;font-weight:650;white-space:nowrap;flex:none;
            font-variant-numeric:tabular-nums}
/* grid does not pack, so each dashboard column is its own stack and the
   short widgets sit directly under one another instead of leaving a hole */
.col{display:flex;flex-direction:column;gap:10px;align-self:start}
.dec{padding:6px 9px;border-radius:7px;background:rgba(178,94,0,.05);
     border:1px solid rgba(178,94,0,.20);margin-bottom:4px;cursor:pointer}
.dec:last-child{margin-bottom:0}
.dec b{font-size:11.5px}
.dec .why{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.dec.calm{background:rgba(0,178,160,.05);border-color:rgba(0,178,160,.24)}
.dec.jetzt{background:var(--badbg);border-color:rgba(192,42,23,.30)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;
      background:rgba(0,0,0,.045);color:var(--dim);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--wash);color:var(--acci)}
.chip.s1{background:var(--okbg);color:var(--acci)}
.chip.s2{background:var(--warnbg);color:var(--warn)}
.chip.s3{background:var(--badbg);color:var(--bad)}
@media (max-width:1180px){ .dash{grid-template-columns:repeat(6,1fr)}
  .w3,.w4,.w5{grid-column:span 3}.w6,.w7,.w8{grid-column:span 6} }
@media (max-width:820px){ .dash{grid-template-columns:1fr}
  .w2,.w3,.w4,.w5,.w6,.w7,.w8,.w12{grid-column:span 1} }

/* ── Axyom fragen: the corner box ──────────────────────────────────────────
   A question is faster than knowing which module holds the answer, so the
   box sits over every screen and reads the same DB the screens read.
   ────────────────────────────────────────────────────────────────────────── */
#chatbtn{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:9px;
  background:var(--dark);color:#fff;border:none;border-radius:99px;padding:11px 17px 11px 14px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .16s,opacity .16s}
#chatbtn:hover{transform:translateY(-1px)}
#chatbtn .logo{width:62px;height:28px;flex:none}
#chatbtn .pip{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
#chatbtn.weg{opacity:0;pointer-events:none;transform:translateY(8px)}

#chat{position:fixed;right:22px;bottom:22px;z-index:61;width:396px;max-height:min(660px,calc(100vh - 44px));
  background:#fff;border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;
  overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
#chat.on{display:flex}
#chat .top{display:flex;align-items:center;gap:9px;padding:13px 14px;background:var(--dark);color:#fff;flex:none}
#chat .top .logo{width:66px;height:30px;flex:none}
#chat .top b{font-size:14px;font-weight:700;color:var(--acc);margin-left:-2px}
#chat .top .s{font-size:11px;color:rgba(255,255,255,.5);margin-left:auto}
#chat-zu{background:none;border:none;color:rgba(255,255,255,.55);font-size:19px;line-height:1;
  cursor:pointer;padding:0 2px;font-family:inherit}
#chat-zu:hover{color:#fff}
#chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#chat .msg{max-width:100%;font-size:12.5px;line-height:1.5}
#chat .msg.u{align-self:flex-end;background:var(--ink);color:#fff;padding:8px 12px;border-radius:13px 13px 3px 13px;
  max-width:82%;font-weight:500}
#chat .msg.b{align-self:stretch;background:var(--surf);border:1px solid var(--soft);
  border-radius:13px 13px 13px 3px;padding:11px 13px}
#chat .qk{font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:6px}
#chat .qz{font-size:12px;line-height:1.55;color:var(--dim);padding:3.5px 0;border-top:1px solid var(--soft)}
#chat .qz:first-of-type{border-top:none;padding-top:0}
#chat .qz b{color:var(--ink);font-weight:650}
#chat .hl{color:var(--warn);font-weight:600}
#chat .bad{color:var(--bad);font-weight:650}
#chat .mod{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--acci);background:var(--wash);padding:1px 5px;border-radius:4px;white-space:nowrap}
#chat .tipp{display:flex;gap:4px;align-self:flex-start;padding:12px 13px}
#chat .tipp i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:tp 1s infinite}
#chat .tipp i:nth-child(2){animation-delay:.14s}
#chat .tipp i:nth-child(3){animation-delay:.28s}
@keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:.9}}
#chat .foot{flex:none;display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--soft);background:#fff}
#chat-in{flex:1;min-width:0;border-radius:9px}
#chat-send{flex:none}
@media (max-width:820px){
  #chat{right:12px;left:12px;bottom:12px;width:auto;max-height:calc(100vh - 24px)}
  #chatbtn{right:12px;bottom:12px}
}

/* ── toast ── */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--dark);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;z-index:50;max-width:520px;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--acc)}
/* the colour says how bad it is before the sentence is read */
#toast{border-left:4px solid transparent}
#toast.s3{border-left-color:var(--bad)}
#toast.s3 b{color:#ff8a75}
#toast.s2{border-left-color:#e08a2e}
#toast.s2 b{color:#ffc079}
#toast.s1{border-left-color:var(--acc)}
/* four KPI cards stop fitting long before the phone breakpoint: at 900px
   «CHF 18'294.80» pushed the row past the viewport */
@media (max-width:1040px){ .g4{grid-template-columns:repeat(2,1fr)} }
@media (max-width:820px){
  #app{flex-direction:column}
  #rail{width:100%;height:auto;position:static;flex-direction:row;align-items:center;
        overflow-x:auto;padding:10px}
  #rail nav{flex-direction:row}#rail .outlets{display:none}#rail .brand{padding:0 12px 0 4px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  header,.body{padding-left:16px;padding-right:16px}
}
</style>
</head>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   ONE dataset, twelve modules. Every screen reads from DB and writes back to
   it, which is the whole point of the demo: a price that changes in
   Rechnungen is a margin that changes in Gerichte, without anybody carrying
   it across. Numbers are invented but internally consistent — the dish costs
   really are the sum of their lines, and the report really is the sum of the
   week.
   ────────────────────────────────────────────────────────────────────────── */
const DB = {
  /* The house opened on 1 July 2026 and today is Wednesday 23 September 2026 —
     twelve closed weeks behind it. Fixed on purpose: a demo you cannot rehearse
     is a demo that surprises you in front of a customer. */
  today: '23.09.',
  heuteTag: 'Mi',
  jahr: 2026,
  eroeffnet: '01.07.2026',
  monat: 'September',
  monate: [{ nr: 7, name: 'Juli' }, { nr: 8, name: 'August' }, { nr: 9, name: 'September' }],
  outlets: ['Gaststube', 'Bahnhof', 'Gartensaal'],
  user: 'Marco B.',

  // articles carry the price actually last paid, plus the price before it
  artikel: {
    butter:   { name: 'Butter, 10 kg',        lief: 'Molkerei Musterberg',   einheit: 'kg',  preis: 78.40, vorher: 78.40, menge: 10 },
    rahm:     { name: 'Rahm 35%, 5 l',        lief: 'Molkerei Musterberg',   einheit: 'l',   preis: 42.00, vorher: 42.00, menge: 5 },
    kalb:     { name: 'Kalbsbraten, 5 kg',    lief: 'Metzgerei Mustermann',  einheit: 'kg',  preis: 190.00, vorher: 190.00, menge: 5 },
    kartoffel:{ name: 'Kartoffeln, 25 kg',    lief: 'Muster Gemüse AG',      einheit: 'kg',  preis: 32.50, vorher: 32.50, menge: 25 },
    ruebli:   { name: 'Rüebli, 10 kg',        lief: 'Muster Gemüse AG',      einheit: 'kg',  preis: 18.90, vorher: 18.90, menge: 10 },
    egli:     { name: 'Eglifilet, 2 kg',      lief: 'Fischerei Mustersee',   einheit: 'kg',  preis: 96.00, vorher: 96.00, menge: 2 },
    pinot:    { name: 'Pinot Noir, 6 Fl.',    lief: 'Weinkeller Musterthal', einheit: 'Fl.', preis: 138.00, vorher: 138.00, menge: 6 },
    // the rest of what actually goes on a plate — without these the food cost
    // comes out at 3% and no cook in the room believes the margin
    eier:     { name: 'Eier, 30 Stk',         lief: 'Muster Gemüse AG',      einheit: 'Stk', preis: 13.50, vorher: 13.50, menge: 30 },
    gemuese:  { name: 'Marktgemüse, 10 kg',   lief: 'Muster Gemüse AG',      einheit: 'kg',  preis: 44.00, vorher: 44.00, menge: 10 },
    bratfett: { name: 'Bratbutter, 5 kg',     lief: 'Molkerei Musterberg',   einheit: 'kg',  preis: 62.00, vorher: 62.00, menge: 5 },
    speck:    { name: 'Speckwürfel, 2 kg',    lief: 'Metzgerei Mustermann',  einheit: 'kg',  preis: 38.00, vorher: 38.00, menge: 2 },
    fond:     { name: 'Fonds und Gewürze',    lief: 'Diverse',               einheit: 'Port.', preis: 0.85, vorher: 0.85, menge: 1 },
  },

  // invoices: lines reference articles, so matching is a real comparison
  rechnungen: [
    { id:'R-24418', lief:'Muster Gemüse AG',   datum:'22.09.', total:1284.60, status:'ok',
      zeilen:[ {art:'kartoffel', best:3, gel:3, preis:32.50}, {art:'ruebli', best:4, gel:4, preis:18.90} ] },
    { id:'8871-C',  lief:'Molkerei Musterberg',  datum:'22.09.', total:962.15, status:'preis',
      zeilen:[ {art:'butter', best:2, gel:2, preis:87.80}, {art:'rahm', best:4, gel:4, preis:42.00} ] },
    { id:'R-5512',  lief:'Metzgerei Mustermann', datum:'21.09.', total:1914.20, status:'preis',
      zeilen:[ {art:'kalb', best:4, gel:4, preis:212.80} ] },
    { id:'FZ-3390', lief:'Fischerei Mustersee',  datum:'21.09.', total:2110.00, status:'ok',
      zeilen:[ {art:'egli', best:6, gel:6, preis:96.00} ] },
    { id:'W-7742',  lief:'Weinkeller Musterthal', datum:'21.09.', total:3487.90, status:'menge',
      zeilen:[ {art:'pinot', best:20, gel:18, preis:138.00} ] },
  ],
  gelesen: 0,    // wird unten aus dem Archiv gerechnet, nicht behauptet

  // supplier offers, matched against what is actually bought. Urgency is not
  // stored — it is read off «bis» against today (see dringend() in core).
  aktionen: [
    { id:'a1', lief:'Muster Gemüse AG',      art:'ruebli',   neu:14.20, bis:'27.09.', monat:40, genommen:false },
    { id:'a2', lief:'Molkerei Musterberg',   art:'rahm',     neu:35.70, bis:'24.09.', monat:34, genommen:false },
    { id:'a3', lief:'Fischerei Mustersee',   art:'egli',     neu:81.60, bis:'25.09.', monat:18, genommen:false },
    { id:'a4', lief:'Weinkeller Musterthal', art:'pinot',    neu:117.30, bis:'06.10.', monat:24, genommen:false },
  ],
  irrelevant: 9,

  // dishes: recipes in grams/ml against article unit prices
  gerichte: [
    { id:'g1', name:'Kalbsbraten mit Rösti', karte:36.00, verkauft:64,
      rezept:[ {art:'kalb', m:0.18}, {art:'butter', m:0.03}, {art:'kartoffel', m:0.22},
               {art:'rahm', m:0.04}, {art:'gemuese', m:0.12}, {art:'bratfett', m:0.02}, {art:'fond', m:1} ] },
    { id:'g2', name:'Eglifilet, Müllerin',   karte:42.00, verkauft:38,
      rezept:[ {art:'egli', m:0.20}, {art:'butter', m:0.04}, {art:'kartoffel', m:0.18},
               {art:'gemuese', m:0.10}, {art:'bratfett', m:0.02}, {art:'fond', m:1} ] },
    { id:'g3', name:'Rüeblisuppe',           karte:12.50, verkauft:91,
      rezept:[ {art:'ruebli', m:0.20}, {art:'rahm', m:0.05}, {art:'butter', m:0.01},
               {art:'gemuese', m:0.04}, {art:'fond', m:1} ] },
    { id:'g4', name:'Rösti mit Spiegelei',   karte:24.00, verkauft:57,
      rezept:[ {art:'kartoffel', m:0.30}, {art:'butter', m:0.03}, {art:'eier', m:2},
               {art:'speck', m:0.04}, {art:'bratfett', m:0.02}, {art:'fond', m:1} ] },
  ],

  /* Die Toleranz gehört dem Haus, nicht der Software: eine Küche, die Fisch
     filetiert, hat beim Fisch einen anderen Abschnitt als bei Kartoffeln.
     «prozent» und «menge» gelten für alle, «tolProzent»/«tolMenge» je Artikel
     überschreiben sie. */
  toleranz: { prozent: 4, menge: 0.5 },
  lager: [
    { art:'butter',    einheit:'kg' },
    { art:'rahm',      einheit:'l'  },
    { art:'kalb',      einheit:'kg' },
    { art:'kartoffel', einheit:'kg' },
    { art:'egli',      einheit:'kg', tolProzent: 8 },   // filetieren kostet Abschnitt
  ],
  lagerStand:'heute 06:20',

  // hygiene: the checks a station owes today
  hygiene: [
    { id:'h1', station:'Küche · Kühlraum', was:'Temperaturen, 06:00', wer:'Marco B.', zeit:'06:12', done:true },
    { id:'h2', station:'Wareneingang',     was:'Lieferkontrolle · Fischerei', wer:'Anna R.', zeit:'08:05', done:true },
    { id:'h3', station:'Küche',            was:'Flächen nach der Vorbereitung', wer:'Luca K.', zeit:'17:52', done:true },
    { id:'h4', station:'Küche · Fritteuse',was:'Öltest',       wer:'', zeit:'', done:false },
    { id:'h5', station:'Bar',              was:'Eismaschine, wöchentlich', wer:'', zeit:'', done:false },
  ],
  hygieneMonat: 214, hygieneSpaet: 3,   // September bis heute
  hygieneSeit: 668,                     // seit der Eröffnung (Juli 228, August 226, September 214)

  // cold chain: a reading history per unit so a curve can be drawn
  geraete: [
    { id:'k1', name:'Kühlraum 1',     wo:'Küche', min:0,   max:5,   temp:2.4 },
    { id:'k2', name:'Kühlraum 2',     wo:'Küche', min:0,   max:5,   temp:3.1 },
    { id:'k3', name:'Tiefkühler',     wo:'Küche', min:-22, max:-18, temp:-19.4 },
    { id:'k4', name:'Barkühlschrank', wo:'Bar',   min:2,   max:7,   temp:4.6 },
    { id:'k5', name:'Fischkühler',    wo:'Küche', min:0,   max:2,   temp:1.1 },
  ],
  // One open alarm on purpose: the demo should show what a live problem looks
  // like before anybody presses anything. The freezer's March incident stays
  // as the closed case — that pair is the story: one handled, one waiting.
  /* Every alarm since the house opened: five in three months, four of them
     handled within minutes. That ratio is the argument — not that nothing ever
     goes wrong, but that it never went unnoticed. */
  alarme: [
    { geraet:'Barkühlschrank', wann:'23.09. 18:20', wert:9.1,   an:'Anna R.',  quittiert:'',      grund:'Tür stand offen' },
    { geraet:'Tiefkühler',     wann:'11.09. 02:14', wert:-16.2, an:'Marco B.', quittiert:'02:21', grund:'Tür stand offen' },
    { geraet:'Kühlraum 2',     wann:'28.08. 14:40', wert:6.8,   an:'Luca K.',  quittiert:'14:46', grund:'Lieferung stand im Weg' },
    { geraet:'Barkühlschrank', wann:'09.08. 23:05', wert:8.4,   an:'Anna R.',  quittiert:'23:11', grund:'Tür stand offen' },
    { geraet:'Fischkühler',    wann:'18.07. 05:30', wert:3.6,   an:'Marco B.', quittiert:'05:38', grund:'Thermostat verstellt' },
  ],
  alarmeSeit: 5,

  /* Closed weeks, as they were counted — half a year of them, so «Verlauf»
     can be filtered instead of being six points. Generated, not typed, but
     deterministic: no Math.random anywhere, so the demo is the same on every
     laptop. The current week is NOT in here; it is computed live from the
     modules further down, which is why the series can never disagree with the
     table above it. */
  wochen: [],

  /* Next week, from the bookings that already exist. «anteil» is how much of a
     week is usually booked by the Wednesday before — 0.76 here — which is what
     turns a booking count into an expectation instead of a guess. It is
     labelled as an expectation everywhere it appears. */
  naechste: {
    ab:'28.09.', anteil:0.76,

/* ── what each article cost, and since when ────────────────────────────────
   The archive would be worthless if every invoice carried today's price: a
   customer filters by «Butter» to see what it did over three months. These are
   the price steps the notes on the invoices talk about — CHF 74.20 until the
   4th of August, CHF 78.40 after it — so the documents, the notes and the price
   history cannot contradict each other.
   ────────────────────────────────────────────────────────────────────────── */
const TAGNR = d => { const [t, m] = String(d).split('.').map(Number); return m * 31 + t; };
DB.preisschritte = {
  butter:    [{ ab:'01.07.', preis:74.20 }, { ab:'04.08.', preis:78.40 }],
  rahm:      [{ ab:'01.07.', preis:39.50 }, { ab:'21.07.', preis:42.00 }],
  kartoffel: [{ ab:'01.07.', preis:29.80 }, { ab:'14.07.', preis:32.50 }],
  speck:     [{ ab:'01.07.', preis:38.00 }, { ab:'19.08.', preis:34.20 }, { ab:'02.09.', preis:38.00 }],
  gemuese:   [{ ab:'01.07.', preis:41.50 }, { ab:'25.08.', preis:44.00 }],
  egli:      [{ ab:'01.07.', preis:91.00 }, { ab:'08.09.', preis:96.00 }],
};
// der Preis, der an einem Datum galt — sonst der heutige Artikelpreis
DB.preisAm = (art, datum) => {
  const schritte = DB.preisschritte[art];
  if (!schritte) return DB.artikel[art].preis;
  const gueltig = schritte.filter(x => TAGNR(x.ab) <= TAGNR(datum));
  return (gueltig.length ? gueltig[gueltig.length - 1] : schritte[0]).preis;
};

/* ── every week since the house opened ─────────────────────────────────────
   Twelve closed weeks, 1 July to 20 September 2026. The shape is the one a new
   restaurant actually has, and it is written out rather than computed, because
   this is the column a restaurateur reads first:

     KW 27  opening, five days, curiosity and half the tables
     KW 28  the dip after the opening — the curious have been
     KW 29–31  July finds its level, tourists and terrace
     KW 32–33  Betriebsferien of the neighbourhood, quiet
     KW 34–36  August back up, the terrace still full
     KW 37–38  September, regulars return, the best two weeks so far

   Personnel is worst at the start and in the quiet weeks: the rota cannot
   shrink as fast as the guests disappear, and a new house is overstaffed while
   it learns. No Math.random — the same numbers on every laptop.
   ────────────────────────────────────────────────────────────────────────── */
DB.wochen = (() => {

    { kw:'KW 30', ab:'20.07.', gedecke:437, proGedeck:58.60, wareQ:0.272, persQ:0.441 },
    { kw:'KW 31', ab:'27.07.', gedecke:459, proGedeck:59.10, wareQ:0.268, persQ:0.434 },
    { kw:'KW 32', ab:'03.08.', gedecke:388, proGedeck:58.20, wareQ:0.274, persQ:0.468, note:'Betriebsferien im Quartier' },
    { kw:'KW 33', ab:'10.08.', gedecke:371, proGedeck:57.90, wareQ:0.277, persQ:0.474 },
    { kw:'KW 34', ab:'17.08.', gedecke:468, proGedeck:59.40, wareQ:0.265, persQ:0.438 },
    { kw:'KW 35', ab:'24.08.', gedecke:502, proGedeck:60.20, wareQ:0.259, persQ:0.428 },

  return w.map(x => { const umsatz = Math.round(x.gedecke * x.proGedeck);
    return { kw:x.kw, ab:x.ab, gedecke:x.gedecke, umsatz, note:x.note,
             einsatz: Math.round(umsatz * x.wareQ), personal: Math.round(umsatz * x.persQ) }; });
})();

/* ── the invoice archive ───────────────────────────────────────────────────
   Every invoice since the house opened, so a customer can page back through
   July instead of being told that it works.

   It is built from the week's food cost, not invented per invoice: each week's
   Wareneinsatz is split across the suppliers by their share of the purchasing,
   and each supplier's share across the days it actually delivers — produce and
   dairy twice a week, meat once, fish for the weekend, wine every other week.
   The LINES are generated first and the total is their sum plus VAT, so the
   document adds up to the figure in the list; a demo invoice whose lines do not
   match its total is the first thing an accountant notices.

   Swiss VAT: food 2.6%, wine 8.1%. Six invoices carry the decision that was
   taken back then, which is what makes the archive worth opening.
   ────────────────────────────────────────────────────────────────────────── */
DB.archiv = (() => {
  const LIEF = [
    { lief:'Muster Gemüse AG',      kurz:'R',  tage:[1, 4], anteil:0.20, mwst:2.6 },
    { lief:'Molkerei Musterberg',   kurz:'MB', tage:[1, 4], anteil:0.16, mwst:2.6 },
    { lief:'Metzgerei Mustermann',  kurz:'MM', tage:[2],    anteil:0.26, mwst:2.6 },
    { lief:'Fischerei Mustersee',   kurz:'FZ', tage:[4],    anteil:0.16, mwst:2.6 },
    { lief:'Weinkeller Musterthal', kurz:'W',  tage:[3],    anteil:0.22, mwst:8.1, jedeZweite:true },
  ];
  const tagName = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const out = [];
  const nr = {};
  DB.wochen.forEach((w, wi) => {
    const [t, m] = w.ab.split('.').map(Number);
    LIEF.forEach(L => {
      if (L.jedeZweite && wi % 2) return;
      // was dieser Lieferant in dieser Woche liefert, auf seine Tage verteilt
      const wochenNetto = w.einsatz * L.anteil * (L.jedeZweite ? 2 : 1);
      const arts = Object.entries(DB.artikel).filter(([, a]) => a.lief === L.lief);
      L.tage.forEach((td, ti) => {
        const netto = wochenNetto * (L.tage.length === 2 ? (ti ? 0.45 : 0.55) : 1);
        const d = new Date(DB.jahr, m - 1, t + td);
        const datum = String(d.getDate()).padStart(2, '0') + '.' +
                      String(d.getMonth() + 1).padStart(2, '0') + '.';
        /* Zeilen zuerst: der Betrag ist deren Summe, nicht umgekehrt. */
        const gewicht = [0.46, 0.32, 0.22];
        const zeilen = arts.slice(0, 3).map(([k, a], i) => {
          const preis = DB.preisAm(k, datum);        // der Preis, der damals galt
          const menge = Math.max(1, Math.round(netto * (gewicht[i] || 0.2) / preis));
          return { art: k, name: a.name, menge, preis, summe: +(menge * preis).toFixed(2) };
        });
        const summe = zeilen.reduce((s, z) => s + z.summe, 0);
        nr[L.kurz] = (nr[L.kurz] || 1000) + 1;
        out.push({ id: L.kurz + '-' + nr[L.kurz], lief: L.lief, datum, jahr: DB.jahr,
                   wochentag: tagName[td],
                   zeilen, netto: +summe.toFixed(2), mwst: L.mwst,
                   total: +(summe * (1 + L.mwst / 100)).toFixed(2),
                   kw: w.kw, status: 'abgeglichen' });
      });
    });
  });
  /* The note has to sit on an invoice from the supplier who sells that article —
     a decision about Rahm on a produce invoice is the kind of detail that makes
     a customer stop trusting the screen. */
  const markiere = (lief, n, notiz) => {
    const r = out.filter(x => x.lief === lief)[n];
    if (r) { r.status = 'erledigt'; r.notiz = notiz; }
  };
  markiere('Muster Gemüse AG',      4,  'Preis Kartoffeln von CHF 29.80 auf CHF 32.50 übernommen');
  markiere('Muster Gemüse AG',      11, 'Zwei Kisten Rüebli nicht geliefert — Rechnung um CHF 37.80 gekürzt');
  markiere('Molkerei Musterberg',   6,  'Preis Rahm von CHF 39.50 auf CHF 42.00 übernommen');
  markiere('Fischerei Mustersee',   3,  'Eine Position Eglifilet doppelt verrechnet — CHF 96.00 gekürzt');
  markiere('Molkerei Musterberg',   10, 'Preis Butter von CHF 74.20 auf CHF 78.40 übernommen');
  markiere('Metzgerei Mustermann',  7,  'Speckwürfel zum Aktionspreis bezogen — CHF 18.60 gespart');
  return out.sort((a, b) => (+b.datum.slice(3, 5) - +a.datum.slice(3, 5))
                         || (+b.datum.slice(0, 2) - +a.datum.slice(0, 2)));
})();

/* ── every count since the house opened ───────────────────────────────────
   Counting once and seeing a difference tells you that something is missing.
   Counting every Monday and seeing WHEN it appeared tells you where to look — a
   door, a shift, a delivery. So the demo carries the whole series: twelve Monday
   counts plus this morning, expected against counted, per article.

   Most weeks are weighing tolerance. Four are not, and they are the point:
     17.08.  Rahm −1.9 l · 24.08.  Kalbsbraten −1.8 kg
     07.09.  Butter −2.4 kg · 14.09.  Eglifilet −0.9 kg
   Deterministic, no Math.random: the same story on every laptop.
   ────────────────────────────────────────────────────────────────────────── */
DB.zaehlungen = (() => {
  const montage = ['06.07.','13.07.','20.07.','27.07.','03.08.','10.08.','17.08.','24.08.',
                   '31.08.','07.09.','14.09.','21.09.'];
  const basis  = { butter:15.0, rahm:22.4, kalb:6.5, kartoffel:44.8, egli:3.2 };
  const normal = { butter:-0.2, rahm:-0.3, kalb:-0.1, kartoffel:-0.9, egli:-0.1 };
  const vorfall = { '17.08.':{ rahm:-1.9 }, '24.08.':{ kalb:-1.8 },
                    '07.09.':{ butter:-2.4 }, '14.09.':{ egli:-0.9 } };
  const reihe = montage.map((datum, i) => {
    const werte = {};
    Object.keys(basis).forEach(k => {
      const erwartet = +(basis[k] * (1 + Math.sin((i + 2) / 4.1) * 0.06)).toFixed(1);
      const delta = (vorfall[datum] && vorfall[datum][k] !== undefined) ? vorfall[datum][k]
        : +(normal[k] * (1 + (i % 3) * 0.25)).toFixed(1);
      werte[k] = { erwartet, gezaehlt: +(erwartet + delta).toFixed(1) };
    });
    return { datum, zeit:'06:15', werte };
  });
  reihe.push({ datum: DB.today, zeit:'06:20', heute:true, werte: {
    butter:{ erwartet:15.0, gezaehlt:14.2 }, rahm:{ erwartet:22.4, gezaehlt:22.0 },
    kalb:{ erwartet:6.5, gezaehlt:6.4 }, kartoffel:{ erwartet:44.8, gezaehlt:41.0 },
    egli:{ erwartet:3.2, gezaehlt:3.1 } } });
  return reihe;
})();

DB.zaehlungHeute = () => DB.zaehlungen[DB.zaehlungen.length - 1];
DB.zDiff = (z, art) => { const w = z.werte[art]; return w ? +(w.gezaehlt - w.erwartet).toFixed(1) : 0; };
DB.zWert = (z, art) => DB.zDiff(z, art) * (DB.artikel[art].bezahlt / DB.artikel[art].menge);
/* Auffällig heisst: über der Toleranz in Prozent UND in Menge. Beides, weil
   Prozent allein bei kleinen Beständen schon bei der Waagenrundung ausschlägt
   und eine Menge allein bei grossen Beständen nie. Die Werte sind einstellbar —
   das Haus weiss besser als die Software, was bei ihm Abschnitt ist. */
DB.tol = art => { const l = DB.lager.find(x => x.art === art) || {};
  return { prozent: l.tolProzent ?? DB.toleranz.prozent,
           menge:   l.tolMenge   ?? DB.toleranz.menge,
           eigen:   l.tolProzent !== undefined || l.tolMenge !== undefined }; };
DB.zAuff = (z, art) => { const w = z.werte[art];
  if (!w) return false;
  const t = DB.tol(art);
  const d = Math.abs(w.gezaehlt - w.erwartet);
  return d > t.menge && d / Math.max(1, w.erwartet) * 100 > t.prozent; };
// der Tag als Ganzes: Summe der Fehlmengen in Franken
DB.zTagWert = z => DB.lager.reduce((s, l) => s + Math.min(0, DB.zWert(z, l.art)), 0);

/* ── what was last actually paid ───────────────────────────────────────────
   Two prices per article, because they answer different questions:

     preis    the price the calculation uses. Changing it is a decision — you
              do not re-price a menu off a single delivery, and a queried
              invoice may yet be credited.
     bezahlt  the price on the most recent invoice. A fact, not a decision: the
              invoice is due whatever you decide, so this is set the moment the
              invoice is read.

   Where the two differ, the demo says so instead of pretending the rise did not
   happen until somebody clicks a button.
   ────────────────────────────────────────────────────────────────────────── */
(() => {
  const alle = [...DB.archiv.map(r => ({ datum: r.datum, zeilen: r.zeilen })),
                ...DB.rechnungen.map(r => ({ datum: r.datum,
                  zeilen: r.zeilen.map(z => ({ art: z.art, preis: z.preis })) }))];
  Object.keys(DB.artikel).forEach(k => {
    const treffer = alle.filter(r => r.zeilen.some(z => z.art === k))
      .sort((a, b) => TAGNR(b.datum) - TAGNR(a.datum))[0];
    const a = DB.artikel[k];
    a.bezahlt = treffer ? treffer.zeilen.find(z => z.art === k).preis : a.preis;
    a.bezahltAm = treffer ? treffer.datum : null;
  });
})();

/* Claims that can be counted have to be counted: «96 Rechnungen diesen Monat»
   would be a number nobody can find in the archive. */
DB.gelesen = DB.archiv.filter(r => +r.datum.slice(3, 5) === 9).length + DB.rechnungen.length;
DB.gelesenSeit = DB.archiv.length + DB.rechnungen.length;

/* ── synthetic histories, so the widgets have curves to draw ───────────────
   Deterministic on purpose: a demo that looks different on every reload is a
   demo you cannot rehearse. No Math.random anywhere.
   ────────────────────────────────────────────────────────────────────────── */
DB.geraete.forEach((g, gi) => {
  g.verlauf = Array.from({ length: 28 }, (_, i) => {
    const wobble = Math.sin((i + gi * 3) / 2.7) * 0.42 + Math.cos((i + gi) / 1.9) * 0.22;
    const span = Math.max(1, (g.max - g.min) / 6);
    return +(g.temp + wobble * span).toFixed(2);
  });
});
// the night the freezer was left open, still visible in its curve
DB.geraete[2].verlauf = DB.geraete[2].verlauf.map((v, i) =>
  i > 9 && i < 15 ? +(v + (i - 9) * 1.15).toFixed(2) : v);

/* The bar fridge is out of range RIGHT NOW: the door stood open through the
   evening service and it is still climbing. Generating its history around the
   warm value would draw a flat warm line, which reads as a broken sensor —
   the curve has to leave the range where the incident started. The current
   reading is the last one on the curve, so the number and the line can never
   disagree. */
const _bar = DB.geraete[3];
_bar.verlauf = _bar.verlauf.map((v, i) => i < 22 ? v : +(v + (i - 21) * 0.78).toFixed(2));
_bar.temp = _bar.verlauf[_bar.verlauf.length - 1];
// the protocol records the reading that raised the alarm, not the one it has
// climbed to since — 18:20 is when it left the range
DB.alarme[0].wert = _bar.verlauf.find(v => v > _bar.max);

// revenue per day, tracking the covers with a plausible spread
DB.tagesUmsatz = DB.woche.map((d, i) => Math.round(d.gedecke * [58, 55, 61, 63, 66, 68, 60][i]));
DB.tagesUmsatzVJ = DB.woche.map((d, i) => Math.round(d.vj * [57, 56, 59, 60, 64, 65, 59][i]));

// rating, last six months
DB.schnittVerlauf = [4.3, 4.4, 4.4, 4.5, 4.5, 4.6];
// invoices read per week, last eight weeks
DB.rechnungenVerlauf = [16, 19, 17, 22, 18, 21, 20, 24];
/* ── helpers ───────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const chf = n => (n < 0 ? '−' : '') + 'CHF ' + Math.abs(n).toLocaleString('de-CH',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(1) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TICK = '<svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="#fff" ' +
  'stroke-width="2.6" stroke-linecap="round"><path d="M4 10.5l4 4 8-9"/></svg>';

/* A card entry, resolved: an entry with «ref» is a dish, and its price is the
   one Gerichte works with — read through, never copied. */
function eintrag(e) {
  const g = e.ref && DB.gerichte.find(x => x.id === e.ref);
  return { id: e.id, name: g ? g.name : e.name, preis: g ? g.karte : e.preis,
           allergene: e.allergene, neu: !!e.neu, gericht: g || null };
}
// a channel is behind as soon as one line differs from what it was given
const karteGeaendert = () => DB.karte.eintraege.filter(e => {
  const a = eintrag(e), b = DB.karte.stand[e.id];
  return !b || a.preis !== b.preis || a.allergene !== b.allergene;
});
// called wherever a price can change — here or in Gerichte
function kanaelePruefen() {
  if (karteGeaendert().length) DB.karte.ziele.forEach(z => { z.status = 'wartet'; });
}

/* How long an offer still runs, from the date it carries. It used to be a
   hand-set «dringend» flag in the fixture, which promptly contradicted the
   dates — an offer four days out was red while one two days out was not.
   Anything the data can say itself should not also be stored by hand. */
const JAHR = 2026;
const alsDatum = s => { const [t, m] = s.split('.').map(Number); return new Date(JAHR, m - 1, t); };
const tageBis = bis => Math.round((alsDatum(bis) - alsDatum(DB.today)) / 86400000);
const dringend = a => tageBis(a.bis) <= 3;

// unit price of an article, e.g. butter at 78.40 per 10 kg = 7.84 / kg
const einzel = key => DB.artikel[key].preis / DB.artikel[key].menge;
// the same at the price last actually invoiced — a fact, not a decision
const einzelBezahlt = key => DB.artikel[key].bezahlt / DB.artikel[key].menge;
// what a dish costs to make: with the calculation prices, and with the paid ones
const wareneinsatz = g => g.rezept.reduce((s, z) => s + einzel(z.art) * z.m, 0);
const wareneinsatzBezahlt = g => g.rezept.reduce((s, z) => s + einzelBezahlt(z.art) * z.m, 0);
const marge = g => (g.karte - wareneinsatz(g)) / g.karte * 100;
const margeBezahlt = g => (g.karte - wareneinsatzBezahlt(g)) / g.karte * 100;
// welche Artikel eines Gerichts teurer eingekauft wurden, als kalkuliert wird
const offenePreise = g => g.rezept.filter(z => DB.artikel[z.art].bezahlt !== DB.artikel[z.art].preis)
  .map(z => z.art);
/* Two ways to say the same thing, and restaurateurs use the second one out
   loud: «Faktor 3» is a 200% Aufschlag on the Wareneinsatz and a 66.7% Marge
   vom Preis. The Marge can never pass 100%, the Aufschlag has no ceiling —
   which is exactly why both belong on the screen. */
const aufschlag = g => { const w = wareneinsatz(g); return w > 0 ? (g.karte / w - 1) * 100 : NaN; };

// the week, computed once. Both Übersicht and Auswertungen read this, so the
// dashboard can never quote a different number than the report.
function zahlen() {
  const kalk   = DB.gerichte.reduce((s, g) => s + g.karte * g.verkauft, 0);
  /* The week is costed at the prices actually INVOICED, not at the ones the
     calculation still uses. What was paid is a fact as soon as the invoice is
     read; adopting it as the calculation basis is a separate decision, and the
     report must not wait for that decision to tell the truth. */
  const kalkWE = DB.gerichte.reduce((s, g) => s + wareneinsatzBezahlt(g) * g.verkauft, 0);
  const kalkWEplan = DB.gerichte.reduce((s, g) => s + wareneinsatz(g) * g.verkauft, 0);
  const speisen = kalk + DB.uebrigeSpeisen;
  const umsatz  = speisen + DB.getraenke;
  const einsatz = kalkWE + DB.uebrigeSpeisenWE + DB.getraenkeWE;
  const std     = DB.woche.reduce((s, d) => s + d.besetzt * 8, 0);
  const personal = std * DB.lohn;
  const gedecke = DB.woche.reduce((s, d) => s + d.gedecke, 0);
  const vj      = DB.woche.reduce((s, d) => s + d.vj, 0);
  const roh     = umsatz - einsatz;
  return { kalk, kalkWE, kalkWEplan, speisen, umsatz, einsatz, std, personal, gedecke, vj,
           roh, db: roh - personal };
}

let toastTimer;
// stufe: 3 something is wrong now, 2 something needs attention, 1 done and fine

/* How urgent a module's open count is: 3 = now, 2 = today, 1 = can wait.
   The same three levels offeneSachen() uses, so a red badge in the rail and a
   red row on the dashboard always mean the same thing. */
function stufe(id) {

}

// an open hygiene check or an unacknowledged alarm is worth a badge

  if (id === 'rechnungen') { const n = DB.rechnungen.filter(r => r.status !== 'ok').length; return n || 0; }
  if (id === 'temperatur') { return DB.geraete.filter(g => g.temp > g.max || g.temp < g.min).length || 0; }
  if (id === 'social')     { return DB.posts.filter(p => p.status === 'entwurf').length || 0; }
  if (id === 'inhalte')    { return DB.karte.ziele.filter(z => z.status === 'wartet').length || 0; }
  return 0;
}

/* ── chart primitives ──────────────────────────────────────────────────────
   Inline SVG, no library. Each one takes numbers and returns a string, so a
   widget is just a template hole — and the whole app stays one file with no
   build step and no network.
   ────────────────────────────────────────────────────────────────────────── */
const svg = (w, h, inner, extra = '') =>
  `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" ${extra}>${inner}</svg>`;

// bars, optionally with a ghost series behind (last year)
function chartBars(vals, ghost, h = 74, col = 'var(--acc)') {
  const w = 240, n = vals.length, gap = 3;
  const bw = (w - gap * (n - 1)) / n;
  const max = Math.max(...vals, ...(ghost || [0])) || 1;
  const bars = vals.map((v, i) => {
    const x = i * (bw + gap), bh = Math.max(1, v / max * (h - 2));
    const g = ghost ? Math.max(1, ghost[i] / max * (h - 2)) : 0;
    return (ghost ? `<rect x="${x + bw * .62}" y="${h - g}" width="${bw * .38}" height="${g}"
              rx="1.5" fill="rgba(0,0,0,.13)"/>` : '') +
      `<rect x="${x}" y="${h - bh}" width="${ghost ? bw * .58 : bw}" height="${bh}"
              rx="2" fill="${col}"/>`;
  }).join('');
  return svg(w, h, bars);
}

// A sparkline with its tolerance range.
//
// Two things went wrong the first time and both are worth remembering:
//   * the viewBox was 240 wide stretched into a ~660px box with
//     preserveAspectRatio="none", so every marker circle came out as a 2.75:1
//     ellipse. The viewBox is now wide enough that the stretch is negligible.
//   * the range was a filled block, which read as a highlighter smear behind
//     the line. It is now two hairlines, and the line itself carries a soft
//     area fill so the row has some weight without shouting.
let _lineId = 0;
function chartLine(vals, min, max, h = 22, col = 'var(--acc)') {
  const w = 600, id = 'g' + (++_lineId);
  const lo = Math.min(...vals, min) - .5, hi = Math.max(...vals, max) + .5;
  const y = v => +(h - (v - lo) / (hi - lo) * h).toFixed(2);
  const x = i => +(i / (vals.length - 1) * w).toFixed(1);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`);
  const area = `M0,${h} L` + pts.join(' L') + ` L${w},${h} Z`;
  // A circle cannot survive non-uniform scaling — it becomes an ellipse, which
  // is what made the first version look broken. A zero-length line with a round
  // cap and a non-scaling stroke draws a true dot at any aspect ratio.
  const marks = vals.map((v, i) => (v > max || v < min)
    ? `<line x1="${x(i)}" y1="${y(v)}" x2="${x(i)}" y2="${y(v)}" stroke="var(--bad)"
         stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"
      preserveAspectRatio="none" style="display:block;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".22"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.7"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${marks}</svg>`;
}

// a ring — share of something, e.g. checks done
function ring(part, total, size = 78, col = 'var(--acc)', label) {
  const r = size / 2 - 7, c = 2 * Math.PI * r, q = total ? part / total : 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(0,0,0,.09)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${(c*q).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
      style="font:700 ${size/4.2}px var(--font);fill:var(--ink)">${label ?? (part + '/' + total)}</text></svg>`;
}

// a stacked bar for the cost structure of a franc of revenue
function chartStack(parts, h = 26) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1;
  let x = 0;
  const segs = parts.map(p => {
    const w = p.v / total * 240;
    const s = `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0, w - 1.5).toFixed(1)}" height="${h}"
        rx="3" fill="${p.c}"/>`;
    x += w; return s;
  }).join('');
  // the legend has to stay on ONE line, or this tile grows taller than the
  // three beside it and the top row stops looking like a row
  return svg(240, h, segs) +
    `<div style="display:flex;gap:9px;margin-top:7px;white-space:nowrap">${parts.map(p =>
      `<span style="font-size:9.5px;color:var(--dim)"><span style="display:inline-block;width:7px;
        height:7px;border-radius:2px;background:${p.c};margin-right:4px"></span>${esc(p.n)} ${(p.v / total * 100).toFixed(0)}%</span>`
      ).join('')}</div>`;
}

// horizontal bars, for margins and review themes
function chartRows(rows, warnBelow) {
  const max = Math.max(...rows.map(r => r.v)) || 1;
  return rows.map(r => {
    const bad = warnBelow !== undefined && r.v < warnBelow;
    return `<div style="margin-bottom:9px">
      <div class="row" style="justify-content:space-between;margin-bottom:4px">
        <span class="small">${esc(r.n)}</span>
        <span class="small num" style="font-weight:650;color:${bad ? 'var(--warn)' : 'var(--ink)'}">${esc(r.l)}</span></div>
      <div class="bar"><i style="width:${(r.v / max * 100).toFixed(0)}%;
        background:${bad ? 'var(--warn)' : 'var(--acc)'}"></i></div></div>`;
  }).join('');
}

/* ── a hint that flies in and leaves again ─────────────────────────────────
   For the small explanations that are not worth a panel. It is appended to
   <body>, not to the view, so a re-render cannot wipe it mid-read, and it
   fades out by itself — nothing to close, nothing that stays in the way.
   ────────────────────────────────────────────────────────────────────────── */
let flugTimer;
/* Two ways to leave. The clock running out fades slowly — nice to look at, and
   nobody asked for it to go. A click on the question mark, anywhere else, or
   Escape is a decision: that one goes at once, or the demo feels sticky. */
function flugWeg(sofort = false) {
  clearTimeout(flugTimer);
  document.querySelectorAll('.flug').forEach(f => {
    f.classList.add(sofort ? 'schnell' : 'weg');
    f.addEventListener('transitionend', () => f.remove(), { once: true });
  });
}

function flugHinweis(anker, html, dauer = 6000, cls = '') {
  document.querySelectorAll('.flug').forEach(f => f.remove());
  clearTimeout(flugTimer);
  const f = document.createElement('div');
  f.className = 'flug ' + cls;
  f.innerHTML = html;
  document.body.appendChild(f);
  const a = anker.getBoundingClientRect();
  // keep it on screen: prefer below the anchor, flip up if there is no room
  const platzUnten = window.innerHeight - a.bottom;
  // a list of five points in a 320px column is a tall thin wall of text
  const breite = Math.min(cls.includes('gross') ? 430 : 320, window.innerWidth - 24);
  f.style.width = breite + 'px';
  f.style.left = Math.max(12, Math.min(a.left - 12, window.innerWidth - breite - 12)) + 'px';
  if (platzUnten > f.offsetHeight + 20) f.style.top = (a.bottom + 10) + 'px';
  else f.style.top = Math.max(12, a.top - f.offsetHeight - 10) + 'px';
  requestAnimationFrame(() => f.classList.add('da'));
  // reading should not be interrupted: the clock stops while the pointer is on it
  const starten = () => { clearTimeout(flugTimer); flugTimer = setTimeout(flugWeg, dauer); };
  f.addEventListener('mouseenter', () => clearTimeout(flugTimer));
  f.addEventListener('mouseleave', starten);
  starten();
  return f;
}

/* The module explanation: same flying hint, longer on screen because there is
   more to read — six seconds per list would be a race. */
function hilfeZeigen(anker) {
  const punkte = HILFE[AKTIV];
  if (!punkte) return;
  const m = MODULES.find(x => x.id === AKTIV);

    `<div class="fk">${esc(m.name)} — was dieser Bereich macht</div>
     <ol class="hilfeliste">${punkte.map(t => `<li>${t}</li>`).join('')}</ol>
     <div class="fu">Verschwindet von selbst · Maus darauf hält ihn</div>`,
    7000 + punkte.length * 2600, 'gross');
}

const ADRESSEN = {

// three states, three words. «abgeglichen», «geprüft» und «entschieden» für
// dasselbe waren ein Grund, warum die Liste unklar war.
const RSTATUS = {
  ok:        ['t-ok',   'geprüft'],

/* every invoice, current and archived, in one shape */
function alleRechnungen() {
  const aktuell = DB.rechnungen.map(r => {
    // the lines decide the total, here as in the archive: a list that disagrees
    // with the document it opens is worse than no document at all
    const zeilen = r.zeilen.map(z => ({ art: z.art, name: DB.artikel[z.art].name, menge: z.best,
      geliefert: z.gel, preis: z.preis, summe: +(z.best * z.preis).toFixed(2) }));
    const netto = +zeilen.reduce((s, z) => s + z.summe, 0).toFixed(2);
    const mwst = r.lief === 'Weinkeller Musterthal' ? 8.1 : 2.6;   // Alkohol: Normalsatz
    return { id: r.id, lief: r.lief, datum: r.datum, jahr: DB.jahr, status: r.status, mwst,
             quelle: 'aktuell',
             roh: r, zeilen, netto, total: +(netto * (1 + mwst / 100)).toFixed(2) };
  });
  const archiv = DB.archiv.map(r => ({ ...r, quelle: 'archiv' }));
  return [...aktuell, ...archiv];
}

/* ── filters ────────────────────────────────────────────────────────────────
   A search box was not the ask. These are filters that answer the questions a
   restaurateur has about three months of invoices:

     Lieferant  — what did this supplier bill me, and how often
     Artikel    — every delivery that contained it, AND what it cost over time
     Zeitraum   — month, this week, last 30 days
     Status     — the ones that needed a decision, the ones that got one
     Betrag     — the big ones
     Sortierung — newest, largest, by supplier

   They combine, the result line adds them up, and selecting a supplier or an
   article opens a panel about it: a price path straight out of the documents,
   not a second number kept somewhere else.
   ────────────────────────────────────────────────────────────────────────── */
/* A set filter lights up: on a bar with eight controls you otherwise cannot see
   why the list is short. «aktiv» is «anything but the default». */
const RFELD = (name, wert, attr, optionen, standard = '') => `<label
  class="rfilter ${String(wert) !== String(standard) ? 'an' : ''}">
  <span>${esc(name)}</span>
  <select data-rf="${attr}">${optionen.map(([v, t]) =>
    `<option value="${esc(v)}" ${String(v) === String(wert) ? 'selected' : ''}>${esc(t)}</option>`
  ).join('')}</select></label>`;

function rechFilterbar(alle) {
  const lief = [...new Set(alle.map(r => r.lief))].sort();
  const arts = Object.entries(DB.artikel).filter(([k]) => alle.some(r => r.zeilen.some(z => z.art === k)));
  return `<div class="rfilterbar">
    ${RFELD('Lieferant', RECH_F.lief, 'lief', [['', 'Alle Lieferanten'], ...lief.map(l => [l, l])])}
    ${RFELD('Artikel', RECH_F.art, 'art', [['', 'Alle Artikel'],
      ...arts.map(([k, a]) => [k, a.name.split(',')[0]])])}
    ${RFELD('Jahr', RECH_F.jahr, 'jahr', [['', 'Alle Jahre'],
      ...[...new Set(alle.map(r => r.jahr))].sort((a, b) => b - a).map(j => [String(j), String(j)])])}
    ${(() => {
      /* all twelve months, so the selector is the one a real year needs — the
         ones without invoices carry a 0 and cannot be chosen. */
      const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                      'September','Oktober','November','Dezember'];
      const zahl = nr => alle.filter(r => +r.datum.slice(3, 5) === nr
        && (!RECH_F.jahr || String(r.jahr) === RECH_F.jahr)).length;
      const opt = MONATE.map((n, i) => { const c = zahl(i + 1);
        return `<option value="${i + 1}" ${String(i + 1) === String(RECH_F.monat) ? 'selected' : ''}
          ${c ? '' : 'disabled'}>${n}${c ? ` (${c})` : ' —'}</option>`; }).join('');
      return `<label class="rfilter ${RECH_F.monat ? 'an' : ''}"><span>Monat</span>
        <select data-rf="monat"><option value="" ${RECH_F.monat ? '' : 'selected'}
          >Alle Monate</option>${opt}</select></label>`;
    })()}
    ${RFELD('Zeitraum', RECH_F.zeit, 'zeit', [['', 'Ganzer Zeitraum'], ['woche', 'Diese Woche'],
      ['30', 'Letzte 30 Tage']])}
    ${RFELD('Status', RECH_F.status, 'status', [['', 'Alle'], ['offen', 'Braucht eine Entscheidung'],
      ['preis', 'Preis geändert'], ['menge', 'Menge stimmt nicht'], ['erledigt', 'Entschieden'],
      ['ok', 'Geprüft, nichts zu tun']])}
    ${RFELD('Betrag', RECH_F.betrag, 'betrag', [['', 'Beliebig'], ['0-500', 'bis CHF 500'],
      ['500-1500', 'CHF 500 – 1500'], ['1500-', 'über CHF 1500']])}
    ${RFELD('Sortierung', RECH_F.sort, 'sort', [['datum', 'Neueste zuerst'], ['alt', 'Älteste zuerst'],
      ['betrag', 'Grösste zuerst'], ['lief', 'Nach Lieferant']], 'datum')}
    <label class="rfilter ${RECH_F.q.trim() ? 'an' : ''}" style="flex:1 1 200px">
      <span>Freitext</span>
      <input data-rsuche="1" id="rsuche" type="text" value="${esc(RECH_F.q)}"
        placeholder="Nummer, Notiz, Betrag …"></label>
